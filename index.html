<head>

<body>

<div class="ribbon">

    <div class="airport">
        <div class="live">● LIVE</div>
        PRAGUE AIRPORT
        <div>LKPR / PRG</div>
    </div>

    <div class="aircraft-info">
        <div class="airline"></div>
        <div class="details"></div>
        <div class="status"></div>
    </div>

    <div class="visual">
        <div class="visual-main"></div>
        <div class="visual-sub"></div>
    </div>

</div>


<script>

const API =
"https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft";

const airportLat = 50.1008;
const airportLon = 14.2600;


/* =========================
   AIRLINES
========================= */

const airlines = {

    TVS:"SMARTWINGS",
    RYR:"RYANAIR",
    UAE:"EMIRATES",
    PGT:"PEGASUS AIRLINES",
    AUA:"AUSTRIAN AIRLINES",
    DLH:"LUFTHANSA",
    KLM:"KLM",
    BAW:"BRITISH AIRWAYS",
    EZY:"EASYJET",
    WZZ:"WIZZ AIR",
    QTR:"QATAR AIRWAYS",
    THY:"TURKISH AIRLINES",
    AFR:"AIR FRANCE",
    SWR:"SWISS",
    LOT:"LOT POLISH AIRLINES",
    SAS:"SAS",
    FIN:"FINNAIR",
    IBE:"IBERIA",
    TAP:"TAP AIR PORTUGAL",
    ITY:"ITA AIRWAYS",
    EIN:"AER LINGUS",
    VLG:"VUELING",
    EWG:"EUROWINGS",
    AEE:"AEGEAN AIRLINES",
    BTI:"AIRBALTIC",
    BEL:"BRUSSELS AIRLINES",
    TRA:"TRANSAVIA",
    EXS:"JET2",
    TUI:"TUI",
    ETD:"ETIHAD AIRWAYS",
    ELY:"EL AL",
    MSR:"EGYPTAIR",
    RAM:"ROYAL AIR MAROC"

};


/* =========================
   RUNWAYS

   Actual landing thresholds.
========================= */

const runwayEnds = [

    {
        name:"06",
        heading:60,
        lat:50.101836,
        lon:14.226300
    },

    {
        name:"24",
        heading:240,
        lat:50.115950,
        lon:14.273367
    },

    {
        name:"12",
        heading:122,
        lat:50.108011,
        lon:14.245367
    },

    {
        name:"30",
        heading:302,
        lat:50.090467,
        lon:14.281672
    }

];


/*
   Whole runway lines for
   runway occupancy detection.
*/

const runwayLines = [

    {
        name:"06/24",

        a:{
            lat:50.101836,
            lon:14.226300
        },

        b:{
            lat:50.115950,
            lon:14.273367
        },

        directions:[
            {name:"06",heading:60},
            {name:"24",heading:240}
        ]
    },

    {
        name:"12/30",

        a:{
            lat:50.108011,
            lon:14.245367
        },

        b:{
            lat:50.090467,
            lon:14.281672
        },

        directions:[
            {name:"12",heading:122},
            {name:"30",heading:302}
        ]
    }

];


/* =========================
   MEMORY / STATES
========================= */

const history =
    new Map();

/*
   Aircraft that have landed.
   They are prevented from becoming
   false departures for 5 minutes.
*/

const recentlyLanded =
    new Map();

let landingLock = null;

let departureLockId = null;


/* =========================
   HELPERS
========================= */

function aircraftId(ac){

    return (
        ac.hex ||
        ac.r ||
        ac.flight ||
        null
    );
}


function isGround(ac){

    return (
        ac.alt_baro === "ground" ||
        ac.alt_geom === "ground"
    );
}


function altitude(ac){

    if(isGround(ac))
        return 0;

    let value =
        Number(ac.alt_baro);

    if(!Number.isFinite(value))
        value =
            Number(ac.alt_geom);

    return Number.isFinite(value)
        ? value
        : null;
}


function groundSpeed(ac){

    const value =
        Number(ac.gs);

    return Number.isFinite(value)
        ? value
        : 0;
}


function verticalRate(ac){

    let value =
        Number(ac.baro_rate);

    if(!Number.isFinite(value))
        value =
            Number(ac.geom_rate);

    return Number.isFinite(value)
        ? value
        : 0;
}


function headingDifference(a,b){

    let d =
        Math.abs(a-b);

    if(d>180)
        d=360-d;

    return d;
}


function distanceKm(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371;

    const dLat =
        (lat2-lat1) *
        Math.PI/180;

    const dLon =
        (lon2-lon1) *
        Math.PI/180;

    const a =
        Math.sin(dLat/2)**2 +

        Math.cos(
            lat1*Math.PI/180
        ) *

        Math.cos(
            lat2*Math.PI/180
        ) *

        Math.sin(dLon/2)**2;

    return R*2*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}


function airlineName(callsign){

    if(!callsign)
        return "";

    const clean =
        callsign
        .trim()
        .toUpperCase();

    return (
        airlines[
            clean.substring(0,3)
        ] || ""
    );
}


function headline(ac){

    const callsign =
        ac.flight &&
        ac.flight.trim()

        ? ac.flight.trim()

        : "AIRCRAFT";

    const company =
        airlineName(callsign);

    return company

        ? company +
          "  •  " +
          callsign

        : callsign;
}


function detailText(ac){

    return [
        ac.t || "",
        ac.r || ""
    ]
    .filter(Boolean)
    .join("  •  ");
}


function clearDisplay(){

    document
    .querySelector(".airline")
    .textContent="";

    document
    .querySelector(".details")
    .textContent="";

    document
    .querySelector(".status")
    .textContent="";

    document
    .querySelector(".visual-main")
    .textContent="";

    document
    .querySelector(".visual-sub")
    .textContent="";
}


function displayAircraft(
    ac,
    statusText,
    visualMain="",
    visualSub=""
){

    document
    .querySelector(".airline")
    .textContent =
        headline(ac);

    document
    .querySelector(".details")
    .textContent =
        detailText(ac);

    document
    .querySelector(".status")
    .textContent =
        statusText;

    document
    .querySelector(".visual-main")
    .textContent =
        visualMain;

    document
    .querySelector(".visual-sub")
    .textContent =
        visualSub;
}


/* =========================
   CLEAN LANDED BLACKLIST
========================= */

function cleanRecentlyLanded(){

    const now =
        Date.now();

    for(
        const [id,expiry]
        of recentlyLanded
    ){

        if(now>=expiry)
            recentlyLanded.delete(id);
    }
}


/* =========================
   DISTANCE TO COMPLETE
   RUNWAY LINE
========================= */

function distanceToRunway(
    lat,
    lon,
    runway
){

    const refLat =
        (
            lat +
            runway.a.lat +
            runway.b.lat
        ) / 3;

    const kmLat =
        111.32;

    const kmLon =
        111.32 *
        Math.cos(
            refLat *
            Math.PI/180
        );

    const px =
        lon*kmLon;

    const py =
        lat*kmLat;

    const ax =
        runway.a.lon*kmLon;

    const ay =
        runway.a.lat*kmLat;

    const bx =
        runway.b.lon*kmLon;

    const by =
        runway.b.lat*kmLat;

    const abx =
        bx-ax;

    const aby =
        by-ay;

    const apx =
        px-ax;

    const apy =
        py-ay;

    const lengthSquared =
        abx*abx +
        aby*aby;

    let t =
        (
            apx*abx +
            apy*aby
        ) /
        lengthSquared;

    t =
        Math.max(
            0,
            Math.min(1,t)
        );

    const closestX =
        ax+t*abx;

    const closestY =
        ay+t*aby;

    const dx =
        px-closestX;

    const dy =
        py-closestY;

    return Math.sqrt(
        dx*dx +
        dy*dy
    );
}


/* =========================
   RUNWAY DIRECTION
========================= */

function runwayDirection(
    track,
    runway
){

    let best=null;
    let bestDifference=999;

    for(
        const direction
        of runway.directions
    ){

        const d =
            headingDifference(
                track,
                direction.heading
            );

        if(d<bestDifference){

            bestDifference=d;
            best=direction;
        }
    }

    return {
        runway:best,
        difference:bestDifference
    };
}


/* =========================
   HARD PRIORITY 1

   GROUND AIRCRAFT ON RUNWAY
   FOR DEPARTURE
========================= */

function detectDepartureOnRunway(ac){

    const id =
        aircraftId(ac);

    if(!id)
        return null;

    if(!isGround(ac))
        return null;

    /*
       CRITICAL FIX:
       recently-landed aircraft
       cannot become departures.
    */

    if(
        recentlyLanded.has(id)
    )
        return null;


    const lat =
        Number(ac.lat);

    const lon =
        Number(ac.lon);

    const track =
        Number(ac.track);

    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        !Number.isFinite(track)
    )
        return null;


    let best=null;


    for(
        const runway
        of runwayLines
    ){

        const runwayDistance =
            distanceToRunway(
                lat,
                lon,
                runway
            );


        /*
           Approximately 140 m
           either side of centreline.
        */

        if(runwayDistance>0.14)
            continue;


        const direction =
            runwayDirection(
                track,
                runway
            );


        /*
           Must actually point
           along the runway.
        */

        if(
            direction.difference>18
        )
            continue;


        let score =
            10000

            -
            runwayDistance*10000

            -
            direction.difference*40

            +
            Math.min(
                groundSpeed(ac)*4,
                700
            );


        if(
            !best ||
            score>best.score
        ){

            best={
                ac,
                runway:
                    direction.runway,
                score
            };
        }
    }


    return best;
}


/* =========================
   ARRIVAL RUNWAY MATCH

   Uses actual landing-end
   threshold distance.
========================= */

function detectArrival(ac){

    if(isGround(ac))
        return null;


    const id =
        aircraftId(ac);

    if(!id)
        return null;


    if(
        departureLockId &&
        id===departureLockId
    )
        return null;


    const lat =
        Number(ac.lat);

    const lon =
        Number(ac.lon);

    const track =
        Number(ac.track);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        !Number.isFinite(track)
    )
        return null;


    const alt =
        altitude(ac);


    if(
        alt!==null &&
        alt>7000
    )
        return null;


    if(
        verticalRate(ac)>500
    )
        return null;


    /*
       Find the runway whose
       heading matches aircraft track.
    */

    let bestRunway=null;
    let bestDifference=999;


    for(
        const runway
        of runwayEnds
    ){

        const d =
            headingDifference(
                track,
                runway.heading
            );

        if(d<bestDifference){

            bestDifference=d;
            bestRunway=runway;
        }
    }


    if(
        !bestRunway ||
        bestDifference>40
    )
        return null;


    /*
       IMPORTANT:
       distance to actual threshold,
       not airport centre.
    */

    const thresholdDistance =
        distanceKm(
            lat,
            lon,
            bestRunway.lat,
            bestRunway.lon
        );


    if(thresholdDistance>25)
        return null;


    /*
       Use movement history to
       prefer genuine approaching
       aircraft.
    */

    const old =
        history.get(id);

    let approaching=false;


    if(old){

        approaching =
            thresholdDistance <
            old.thresholdDistance -
            0.02;
    }


    let score =
        1000

        -
        thresholdDistance*25

        -
        bestDifference*5;


    if(approaching)
        score+=600;


    if(
        verticalRate(ac)<-200
    )
        score+=300;


    return {
        ac,
        runway:bestRunway,
        distance:thresholdDistance,
        score
    };
}


/* =========================
   NEW AIRBORNE DEPARTURE
   FALLBACK
========================= */

function detectNewAirborneDeparture(ac){

    if(isGround(ac))
        return null;


    const id =
        aircraftId(ac);

    if(!id)
        return null;


    if(
        recentlyLanded.has(id)
    )
        return null;


    const alt =
        altitude(ac);


    if(
        alt===null ||
        alt>=2500
    )
        return null;


    const airportDistance =
        distanceKm(
            Number(ac.lat),
            Number(ac.lon),
            airportLat,
            airportLon
        );


    if(airportDistance>7)
        return null;


    if(
        verticalRate(ac)<200
    )
        return null;


    let score =
        1000

        -
        alt/5

        -
        airportDistance*30;


    const old =
        history.get(id);


    /*
       Extremely strong evidence:
       ADS-B Exchange showed it
       on ground on previous update.
    */

    if(
        old &&
        old.ground
    )
        score+=10000;


    return {
        ac,
        score
    };
}


/* =========================
   SAVE STATE
========================= */

function saveHistory(aircraft){

    for(const ac of aircraft){

        const id =
            aircraftId(ac);

        if(!id)
            continue;


        /*
           Also save distance to
           the currently best runway
           threshold for arrival logic.
        */

        let thresholdDistance =
            999;


        const track =
            Number(ac.track);


        if(
            Number.isFinite(track) &&
            !isGround(ac)
        ){

            let bestRunway=null;
            let bestDifference=999;


            for(
                const runway
                of runwayEnds
            ){

                const d =
                    headingDifference(
                        track,
                        runway.heading
                    );

                if(d<bestDifference){

                    bestDifference=d;
                    bestRunway=runway;
                }
            }


            if(bestRunway){

                thresholdDistance =
                    distanceKm(
                        Number(ac.lat),
                        Number(ac.lon),
                        bestRunway.lat,
                        bestRunway.lon
                    );
            }
        }


        history.set(
            id,
            {
                ground:
                    isGround(ac),

                speed:
                    groundSpeed(ac),

                altitude:
                    altitude(ac),

                thresholdDistance,

                time:
                    Date.now()
            }
        );
    }


    const cutoff =
        Date.now() -
        10*60*1000;


    for(
        const [id,item]
        of history
    ){

        if(item.time<cutoff)
            history.delete(id);
    }
}


/* =========================
   MAIN
========================= */

async function update(){

    cleanRecentlyLanded();


    /*
       LANDING LOCK
       Holds exact aircraft identity
       for 10 seconds.
    */

    if(landingLock){

        if(
            Date.now() <
            landingLock.until
        ){

            displayAircraft(
                landingLock.ac,

                "LANDED  •  PRAGUE",

                "LANDED",

                "RWY "+
                landingLock.runway.name
            );

            return;
        }


        landingLock=null;
        clearDisplay();
    }


    try{

        const response =
            await fetch(
                API+
                "?t="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok)
            throw new Error(
                "HTTP "+
                response.status
            );


        const data =
            await response.json();


        const aircraft =
            (data.ac || [])
            .filter(
                ac =>
                Number.isFinite(
                    Number(ac.lat)
                )
                &&
                Number.isFinite(
                    Number(ac.lon)
                )
            );


        /*
           Build arrivals early
           because we need them for
           short-final detection.
        */

        const arrivals=[];


        for(const ac of aircraft){

            const candidate =
                detectArrival(ac);

            if(candidate)
                arrivals.push(candidate);
        }


        arrivals.sort(
            (a,b)=>
            b.score-a.score
        );


        /*
           =========================
           HARD PRIORITY 1

           AIRCRAFT ON RUNWAY
           FOR DEPARTURE

           THIS BEATS NORMAL ARRIVALS.
           =========================
        */

        let runwayDeparture=null;


        for(const ac of aircraft){

            const candidate =
                detectDepartureOnRunway(ac);

            if(!candidate)
                continue;


            if(
                !runwayDeparture ||
                candidate.score >
                runwayDeparture.score
            ){

                runwayDeparture=
                    candidate;
            }
        }


        if(runwayDeparture){

            const ac =
                runwayDeparture.ac;

            const id =
                aircraftId(ac);

            departureLockId =
                id;


            const gs =
                groundSpeed(ac);


            if(gs>=45){

                displayAircraft(
                    ac,

                    "TAKEOFF ROLL  •  RWY "+
                    runwayDeparture.runway.name+
                    "  •  "+
                    Math.round(gs)+
                    " KT",

                    "TAKEOFF",

                    "RWY "+
                    runwayDeparture.runway.name
                );

            }

            else{

                displayAircraft(
                    ac,

                    "LINED UP  •  RWY "+
                    runwayDeparture.runway.name+
                    "  •  READY FOR DEPARTURE",

                    "LINED UP",

                    "RWY "+
                    runwayDeparture.runway.name
                );
            }


            saveHistory(aircraft);

            return;
        }


        /*
           =========================
           HARD PRIORITY 2

           ACTIVE LOCKED DEPARTURE
           BELOW 3000 FT
           =========================
        */

        if(departureLockId){

            const locked =
                aircraft.find(
                    ac =>
                    aircraftId(ac)===
                    departureLockId
                );


            if(locked){

                const alt =
                    altitude(locked);


                if(
                    !isGround(locked) &&
                    alt!==null &&
                    alt<3000
                ){

                    const text =
                        alt<1000

                        ? "DEPARTED"

                        : "CLIMBING";


                    displayAircraft(
                        locked,

                        text+
                        "  •  "+
                        Math.round(alt)
                        .toLocaleString()+
                        " FT",

                        text,

                        Math.round(
                            groundSpeed(locked)
                        )+
                        " KT"
                    );


                    saveHistory(aircraft);

                    return;
                }


                if(
                    alt!==null &&
                    alt>=3000
                ){

                    departureLockId=null;
                }
            }

            else{

                departureLockId=null;
            }
        }


        /*
           =========================
           HARD PRIORITY 3

           SHORT FINAL <= 3 KM
           =========================
        */

        const shortFinal =
            arrivals.find(
                item =>
                item.distance<=3
            );


        if(shortFinal){

            const ac =
                shortFinal.ac;


            /*
               Touchdown threshold.
            */

            if(
                shortFinal.distance<=0.8
            ){

                const id =
                    aircraftId(ac);


                /*
                   CRITICAL FIX:
                   mark this exact aircraft
                   as recently landed NOW.
                */

                recentlyLanded.set(
                    id,
                    Date.now()+
                    5*60*1000
                );


                if(
                    departureLockId===id
                )
                    departureLockId=null;


                landingLock={
                    ac,
                    runway:
                        shortFinal.runway,
                    until:
                        Date.now()+10000
                };


                displayAircraft(
                    ac,

                    "LANDED  •  PRAGUE",

                    "LANDED",

                    "RWY "+
                    shortFinal.runway.name
                );


                saveHistory(aircraft);

                return;
            }


            displayAircraft(
                ac,

                "ON FINAL  •  RWY "+
                shortFinal.runway.name+
                "  •  "+
                shortFinal.distance
                .toFixed(1)+
                " KM",

                "LANDING",

                "RWY "+
                shortFinal.runway.name
            );


            saveHistory(aircraft);

            return;
        }


        /*
           =========================
           HARD PRIORITY 4

           NEW AIRBORNE DEPARTURE
           BACKUP
           =========================
        */

        let newDeparture=null;


        for(const ac of aircraft){

            const candidate =
                detectNewAirborneDeparture(ac);

            if(!candidate)
                continue;


            if(
                !newDeparture ||
                candidate.score >
                newDeparture.score
            ){

                newDeparture=
                    candidate;
            }
        }


        if(newDeparture){

            const ac =
                newDeparture.ac;

            departureLockId =
                aircraftId(ac);


            const alt =
                altitude(ac);


            displayAircraft(
                ac,

                (
                    alt<1000
                    ? "DEPARTED"
                    : "CLIMBING"
                )+
                "  •  "+
                Math.round(alt)
                .toLocaleString()+
                " FT",

                "DEPARTURE",

                Math.round(
                    groundSpeed(ac)
                )+
                " KT"
            );


            saveHistory(aircraft);

            return;
        }


        /*
           =========================
           HARD PRIORITY 5

           NORMAL ARRIVAL
           =========================
        */

        if(arrivals.length){

            const chosen =
                arrivals[0];


            let text =
                "INBOUND";


            if(
                chosen.distance<=8
            )
                text =
                    "APPROACHING";


            displayAircraft(
                chosen.ac,

                text+
                "  •  RWY "+
                chosen.runway.name+
                "  •  "+
                chosen.distance
                .toFixed(1)+
                " KM",

                text,

                "RWY "+
                chosen.runway.name
            );


            saveHistory(aircraft);

            return;
        }


        /*
           NOTHING RELEVANT
        */
