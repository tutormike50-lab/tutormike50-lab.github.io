<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:transparent;overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

.ribbon{
    position:absolute;bottom:0;left:0;width:100%;height:105px;
    background:rgb(0,55,110);color:white;
    display:flex;align-items:center;box-sizing:border-box;
}

.airport{
    width:23%;padding-left:25px;
    box-sizing:border-box;font-size:22px;font-weight:bold;
}

.live{
    color:#ff3333;font-size:16px;margin-bottom:5px;
}

.aircraft-info{
    width:52%;padding-left:25px;
    border-left:2px solid rgba(255,255,255,.25);
    box-sizing:border-box;
}

.airline{font-size:25px;font-weight:bold}
.details{font-size:19px;margin-top:6px;opacity:.9}

.status{
    font-size:20px;
    margin-top:5px;
    color:#8fd3ff;
    font-weight:bold;
}

.visual{
    width:25%;padding-right:20px;
    text-align:center;box-sizing:border-box;
}

.visual-main{
    font-size:28px;font-weight:bold;
}

.visual-sub{
    font-size:14px;margin-top:7px;opacity:.85;
}
</style>
</head>

<body>

<div class="ribbon">

    <div class="airport">
        <div class="live">● LIVE</div>
        PRAGUE AIRPORT
        <div>LKPR / PRG</div>
    </div>

    <div class="aircraft-info">
        <div class="airline"></div>
        <div class="details"></div>
        <div class="status"></div>
    </div>

    <div class="visual">
        <div class="visual-main"></div>
        <div class="visual-sub"></div>
    </div>

</div>

<script>

const API =
"https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft";


/* AIRLINES */

const airlines={
    TVS:"SMARTWINGS",RYR:"RYANAIR",UAE:"EMIRATES",
    PGT:"PEGASUS AIRLINES",AUA:"AUSTRIAN AIRLINES",
    DLH:"LUFTHANSA",KLM:"KLM",BAW:"BRITISH AIRWAYS",
    EZY:"EASYJET",WZZ:"WIZZ AIR",QTR:"QATAR AIRWAYS",
    THY:"TURKISH AIRLINES",AFR:"AIR FRANCE",
    SWR:"SWISS",LOT:"LOT POLISH AIRLINES",
    SAS:"SAS",FIN:"FINNAIR",IBE:"IBERIA",
    TAP:"TAP AIR PORTUGAL",ITY:"ITA AIRWAYS",
    EIN:"AER LINGUS",VLG:"VUELING",EWG:"EUROWINGS",
    AEE:"AEGEAN AIRLINES",BTI:"AIRBALTIC",
    BEL:"BRUSSELS AIRLINES",TRA:"TRANSAVIA",
    EXS:"JET2",TUI:"TUI",ETD:"ETIHAD AIRWAYS",
    ELY:"EL AL",MSR:"EGYPTAIR"
};


/* RUNWAYS */

const runways=[

    {
        name:"06",heading:60,
        threshold:{lat:50.1018361,lon:14.2263000},
        farEnd:{lat:50.1159500,lon:14.2733667}
    },

    {
        name:"24",heading:240,
        threshold:{lat:50.1159500,lon:14.2733667},
        farEnd:{lat:50.1018361,lon:14.2263000}
    },

    {
        name:"12",heading:122,
        threshold:{lat:50.1080111,lon:14.2453667},
        farEnd:{lat:50.0904667,lon:14.2816722}
    },

    {
        name:"30",heading:302,
        threshold:{lat:50.0904667,lon:14.2816722},
        farEnd:{lat:50.1080111,lon:14.2453667}
    }

];

const physicalRunways=[
    {
        name:"06/24",
        a:runways[0].threshold,
        b:runways[0].farEnd
    },
    {
        name:"12/30",
        a:runways[2].threshold,
        b:runways[2].farEnd
    }
];


/* FILTER HELICOPTERS / SMALL GA */

const helicopterTypes=new Set([
    "A109","A119","A139","A149","A169","A189",
    "AS32","AS50","AS55","AS65",
    "B06","B105","B212","B222","B412","B429",
    "EC20","EC25","EC30","EC35","EC45","EC55",
    "H125","H130","H135","H145","H155","H160",
    "R22","R44","R66",
    "S55","S58","S61","S64","S76","S92"
]);

const smallAircraftPrefixes=[
    "C15","C17","C18","C19","C20","C21",
    "C22","C23","C24","C25",
    "PA18","PA20","PA22","PA24","PA28","PA32",
    "PA34","PA38","PA44",
    "DA20","DA40","DA42",
    "SR20","SR22","DR40","P28","M20",
    "BE23","BE24","BE33","BE35","BE36","DV20"
];

function unwantedAircraft(ac){

    const type=(ac.t||"").trim().toUpperCase();
    const category=(ac.category||"").trim().toUpperCase();

    if(category==="A7") return true;
    if(helicopterTypes.has(type)) return true;

    for(const prefix of smallAircraftPrefixes){
        if(type.startsWith(prefix)) return true;
    }

    return false;
}


/* MEMORY */

const history=new Map();
const arrivalMemory=new Map();
const landedBlacklist=new Map();

let departureLock=null;
let landedDisplay=null;


/* HELPERS */

function aircraftId(ac){
    return ac.hex || ac.r || (ac.flight||"").trim() || null;
}

function onGround(ac){
    return ac.alt_baro==="ground" || ac.alt_geom==="ground";
}

function altitude(ac){

    if(onGround(ac)) return 0;

    let value=Number(ac.alt_baro);

    if(!Number.isFinite(value))
        value=Number(ac.alt_geom);

    return Number.isFinite(value) ? value : null;
}

function groundSpeed(ac){
    const value=Number(ac.gs);
    return Number.isFinite(value) ? value : 0;
}

function verticalRate(ac){

    let value=Number(ac.baro_rate);

    if(!Number.isFinite(value))
        value=Number(ac.geom_rate);

    return Number.isFinite(value) ? value : 0;
}

function headingDifference(a,b){

    let d=Math.abs(a-b);

    if(d>180) d=360-d;

    return d;
}

function distanceKm(lat1,lon1,lat2,lon2){

    const R=6371;

    const dLat=(lat2-lat1)*Math.PI/180;
    const dLon=(lon2-lon1)*Math.PI/180;

    const a=
        Math.sin(dLat/2)**2+
        Math.cos(lat1*Math.PI/180)*
        Math.cos(lat2*Math.PI/180)*
        Math.sin(dLon/2)**2;

    return R*2*Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );
}


/* DISPLAY */

function airlineName(callsign){

    if(!callsign) return "";

    return airlines[
        callsign.trim().toUpperCase().substring(0,3)
    ] || "";
}

function headline(ac){

    const callsign=(ac.flight||"").trim() || "AIRCRAFT";
    const company=airlineName(callsign);

    return company
        ? company+"  •  "+callsign
        : callsign;
}

function aircraftDetails(ac){

    return [
        ac.t||"",
        ac.r||""
    ]
    .filter(Boolean)
    .join("  •  ");
}


/*
    Viewer sees ONLY one of:

    APPROACHING
    LANDED
    TAKE OFF
*/

function showState(ac,state){

    document.querySelector(".airline").textContent=
        headline(ac);

    document.querySelector(".details").textContent=
        aircraftDetails(ac);

    document.querySelector(".status").textContent=
        state;

    document.querySelector(".visual-main").textContent=
        state;

    document.querySelector(".visual-sub").textContent="";
}


function clear(){

    document.querySelector(".airline").textContent="";
    document.querySelector(".details").textContent="";
    document.querySelector(".status").textContent="";
    document.querySelector(".visual-main").textContent="";
    document.querySelector(".visual-sub").textContent="";
}


/* DISTANCE TO PHYSICAL RUNWAY */

function distanceToRunway(lat,lon,runway){

    const ref=
        (lat+runway.a.lat+runway.b.lat)/3;

    const ky=111.32;

    const kx=
        111.32*
        Math.cos(ref*Math.PI/180);

    const px=lon*kx;
    const py=lat*ky;

    const ax=runway.a.lon*kx;
    const ay=runway.a.lat*ky;

    const bx=runway.b.lon*kx;
    const by=runway.b.lat*ky;

    const vx=bx-ax;
    const vy=by-ay;

    const wx=px-ax;
    const wy=py-ay;

    const lengthSquared=
        vx*vx+vy*vy;

    let t=
        (wx*vx+wy*vy)/
        lengthSquared;

    t=Math.max(0,Math.min(1,t));

    const cx=ax+t*vx;
    const cy=ay+t*vy;

    const dx=px-cx;
    const dy=py-cy;

    return Math.sqrt(
        dx*dx+
        dy*dy
    );
}


/* GROUND AIRCRAFT ON RUNWAY */

function detectGroundRunwayAircraft(ac){

    const ident=aircraftId(ac);

    if(!ident || !onGround(ac))
        return null;

    if(landedBlacklist.has(ident))
        return null;

    if(arrivalMemory.has(ident))
        return null;

    const lat=Number(ac.lat);
    const lon=Number(ac.lon);

    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    )
        return null;

    let best=null;

    for(const runway of physicalRunways){

        const d=
            distanceToRunway(
                lat,
                lon,
                runway
            );

        if(d>0.18)
            continue;

        const score=
            10000-
            d*10000+
            Math.min(
                groundSpeed(ac)*5,
                800
            );

        if(
            !best ||
            score>best.score
        ){

            best={
                ac,
                physicalRunway:runway.name,
                score
            };
        }
    }

    return best;
}


/* BEST RUNWAY */

function bestRunway(track){

    let best=null;
    let difference=999;

    for(const runway of runways){

        const d=
            headingDifference(
                track,
                runway.heading
            );

        if(d<difference){

            difference=d;
            best=runway;
        }
    }

    return {
        runway:best,
        difference
    };
}


/* ARRIVAL — 3 KM ONLY */

function detectArrival(ac){

    if(onGround(ac))
        return null;

    const ident=aircraftId(ac);

    if(!ident)
        return null;

    if(departureLock===ident)
        return null;

    const lat=Number(ac.lat);
    const lon=Number(ac.lon);
    const track=Number(ac.track);

    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        !Number.isFinite(track)
    )
        return null;

    if(verticalRate(ac)>600)
        return null;

    const match=bestRunway(track);

    if(
        !match.runway ||
        match.difference>40
    )
        return null;

    const runway=match.runway;

    const distance=
        distanceKm(
            lat,
            lon,
            runway.threshold.lat,
            runway.threshold.lon
        );

    if(distance>3)
        return null;

    arrivalMemory.set(
        ident,
        {
            runway,
            lastSeen:Date.now()
        }
    );

    return {
        ac,
        runway,
        distance,
        score:
            10000-
            distance*1000-
            match.difference*20
    };
}


/* TOUCHDOWN */

function detectTouchdown(aircraft){

    for(const ac of aircraft){

        const ident=aircraftId(ac);

        if(!ident || !onGround(ac))
            continue;

        const memory=
            arrivalMemory.get(ident);

        if(!memory)
            continue;

        let onAnyRunway=false;

        for(const runway of physicalRunways){

            const d=
                distanceToRunway(
                    Number(ac.lat),
                    Number(ac.lon),
                    runway
                );

            if(d<=0.20){

                onAnyRunway=true;
                break;
            }
        }

        if(onAnyRunway){

            return {
                ac,
                runway:memory.runway
            };
        }
    }

    return null;
}


/* AIRBORNE DEPARTURE */

function detectAirborneDeparture(ac){

    if(onGround(ac))
        return null;

    const ident=aircraftId(ac);

    if(!ident)
        return null;

    if(
        landedBlacklist.has(ident) ||
        arrivalMemory.has(ident)
    )
        return null;

    const alt=altitude(ac);

    if(
        alt===null ||
        alt>=3000
    )
        return null;

    if(verticalRate(ac)<100)
        return null;

    const old=
        history.get(ident);

    let score=
        5000-alt;

    if(
        old &&
        old.ground
    )
        score+=30000;

    return {
        ac,
        score
    };
}


/* HISTORY */

function saveHistory(aircraft){

    for(const ac of aircraft){

        const ident=aircraftId(ac);

        if(!ident)
            continue;

        history.set(
            ident,
            {
                ground:onGround(ac),
                speed:groundSpeed(ac),
                altitude:altitude(ac),
                time:Date.now()
            }
        );
    }
}


/* CLEANUP */

function cleanup(){

    const now=Date.now();

    for(const [ident,expiry] of landedBlacklist){

        if(now>=expiry)
            landedBlacklist.delete(ident);
    }

    for(const [ident,item] of arrivalMemory){

        if(now-item.lastSeen>60000)
            arrivalMemory.delete(ident);
    }

    for(const [ident,item] of history){

        if(now-item.time>600000)
            history.delete(ident);
    }
}


/* MAIN */

async function update(){

    cleanup();

    try{

        const response=
            await fetch(
                API+"?t="+Date.now(),
                {cache:"no-store"}
            );

        if(!response.ok)
            throw new Error(
                "HTTP "+response.status
            );

        const data=
            await response.json();

        const aircraft=
            (data.ac||[])
            .filter(
                ac =>
                Number.isFinite(Number(ac.lat)) &&
                Number.isFinite(Number(ac.lon))
            )
            .filter(
                ac =>
                !unwantedAircraft(ac)
            );


        /*
           1 — TOUCHDOWN
        */

        const touchdown=
            detectTouchdown(aircraft);

        if(touchdown){

            const ident=
                aircraftId(touchdown.ac);

            landedBlacklist.set(
                ident,
                Date.now()+5*60*1000
            );

            arrivalMemory.delete(ident);

            if(departureLock===ident)
                departureLock=null;

            landedDisplay={
                ac:touchdown.ac,
                until:Date.now()+10000
            };

            showState(
                touchdown.ac,
                "LANDED"
            );

            saveHistory(aircraft);

            return;
        }


        /*
           2 — ANY AIRCRAFT ON RUNWAY

           Viewer simply sees TAKE OFF.
        */

        let runwayAircraft=null;

        for(const ac of aircraft){

            const candidate=
                detectGroundRunwayAircraft(ac);

            if(!candidate)
                continue;

            if(
                !runwayAircraft ||
                candidate.score>
                runwayAircraft.score
            )
                runwayAircraft=candidate;
        }


        if(runwayAircraft){

            const ac=
                runwayAircraft.ac;

            departureLock=
                aircraftId(ac);

            showState(
                ac,
                "TAKE OFF"
            );

            saveHistory(aircraft);

            return;
        }


        /*
           3 — ACTIVE DEPARTURE

           Still simply TAKE OFF.
        */

        if(departureLock){

            const ac=
                aircraft.find(
                    item =>
                    aircraftId(item)===
                    departureLock
                );

            if(ac){

                const alt=
                    altitude(ac);

                if(
                    !onGround(ac) &&
                    alt!==null &&
                    alt<3000
                ){

                    showState(
                        ac,
                        "TAKE OFF"
                    );

                    saveHistory(aircraft);

                    return;
                }

                if(
                    alt!==null &&
                    alt>=3000
                )
                    departureLock=null;

            }else{

                departureLock=null;
            }
        }


        /*
           4 — LANDED HOLD
        */

        if(landedDisplay){

            if(
                Date.now()<
                landedDisplay.until
            ){

                showState(
                    landedDisplay.ac,
                    "LANDED"
                );

                saveHistory(aircraft);

                return;
            }

            landedDisplay=null;
        }


        /*
           5 — APPROACHING
           ONLY WITHIN 3 KM
        */

        const arrivals=[];

        for(const ac of aircraft){

            const candidate=
                detectArrival(ac);

            if(candidate)
                arrivals.push(candidate);
        }

        arrivals.sort(
            (a,b)=>
            b.score-a.score
        );

        if(arrivals.length){

            showState(
                arrivals[0].ac,
                "APPROACHING"
            );

            saveHistory(aircraft);

            return;
        }


        /*
           6 — DEPARTURE BACKUP
        */

        let airborneDeparture=null;

        for(const ac of aircraft){

            const candidate=
                detectAirborneDeparture(ac);

            if(!candidate)
                continue;

            if(
                !airborneDeparture ||
                candidate.score>
                airborneDeparture.score
            )
                airborneDeparture=candidate;
        }

        if(airborneDeparture){

            const ac=
                airborneDeparture.ac;

            departureLock=
                aircraftId(ac);

            showState(
                ac,
                "TAKE OFF"
            );

            saveHistory(aircraft);

            return;
        }


        clear();
        saveHistory(aircraft);

    }

    catch(error){

        console.error(error);
        clear();
    }
}


update();

setInterval(update,3000);

</script>

</body>
</html>
