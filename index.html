<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>

/* =========================================================
   BASIC PAGE
========================================================= */

:root{
    --ribbon-height:110px;
    --ticker-height:27px;

    --blue-dark:#002e5b;
    --blue-mid:#005b9f;
    --blue-light:#0b7ac3;

    --silver:#d7dde2;
    --yellow:#ffd84d;
    --red:#ff4949;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    background:transparent;

    overflow:hidden;

    font-family:
        "Arial Narrow",
        "Roboto Condensed",
        "Helvetica Neue Condensed",
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   PERMANENT RIBBON
========================================================= */

.ribbon{
    position:absolute;
    left:0;
    bottom:0;

    width:100%;
    height:var(--ribbon-height);

    background:
        linear-gradient(
            90deg,
            #002f5e 0%,
            #005c9d 43%,
            #004a85 70%,
            #002d59 100%
        );

    border-top:
        2px solid rgba(126,201,255,.85);

    box-shadow:
        0 2px 8px rgba(0,0,0,.30);

    color:white;
    z-index:50;
    box-sizing:border-box;
}


/* =========================================================
   MAIN RIBBON AREA
========================================================= */

.ribbon-main{
    height:
        calc(
            var(--ribbon-height)
            -
            var(--ticker-height)
        );

    display:flex;
    align-items:center;
    box-sizing:border-box;
}


/* =========================================================
   PRG IDENTITY
========================================================= */

.airport{
    width:19%;
    height:74%;

    display:flex;
    align-items:center;
    justify-content:center;

    border-right:
        1px solid rgba(255,255,255,.28);

    box-sizing:border-box;
}

.airport-mark{
    display:flex;
    align-items:center;
    gap:11px;
}

.prg-wrap{
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.live{
    font-size:11px;
    font-weight:900;
    color:#ff5a5a;
    letter-spacing:1.2px;
    margin-bottom:1px;
}

.prg{
    font-family:
        "Arial Narrow",
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size:36px;
    font-weight:800;
    letter-spacing:3px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #d7dce0 33%,
            #89949c 60%,
            #f1f4f6 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 1px 0 rgba(255,255,255,.35),
        0 2px 4px rgba(0,0,0,.55);
}


/* =========================================================
   SILVER CONTROL TOWER
========================================================= */

.tower-icon{
    position:relative;
    width:29px;
    height:49px;
    flex-shrink:0;

    filter:
        drop-shadow(
            0 2px 3px rgba(0,0,0,.45)
        );
}

.tower-stem{
    position:absolute;
    left:10px;
    bottom:0;

    width:9px;
    height:31px;

    background:
        linear-gradient(
            90deg,
            #717b84,
            #eeeeee,
            #7d8790
        );

    clip-path:
        polygon(
            25% 0,
            75% 0,
            100% 100%,
            0 100%
        );
}

.tower-top{
    position:absolute;
    left:3px;
    top:7px;

    width:23px;
    height:13px;

    background:
        linear-gradient(
            180deg,
            #f5f5f5,
            #89949c
        );

    clip-path:
        polygon(
            10% 0,
            90% 0,
            100% 45%,
            82% 100%,
            18% 100%,
            0 45%
        );
}

.tower-top:before{
    content:"";

    position:absolute;
    left:2px;
    right:2px;
    top:4px;

    height:4px;
    background:#204c69;
    opacity:.78;
}

.tower-light{
    position:absolute;
    left:13px;
    top:0;

    width:2px;
    height:8px;
    background:#cbd1d6;
}

.tower-light:before{
    content:"";

    position:absolute;
    left:-2px;
    top:-2px;

    width:6px;
    height:6px;

    border-radius:50%;
    background:#ff3b3b;

    box-shadow:
        0 0 7px rgba(255,50,50,.9);

    animation:
        towerBlink 1.7s infinite;
}

@keyframes towerBlink{

    0%,
    45%,
    100%{
        opacity:.18;
    }

    50%,
    60%{
        opacity:1;
    }
}


/* =========================================================
   CENTRE BROADCAST IDENTITY
========================================================= */

.broadcast-centre{
    width:56%;
    padding-left:28px;
    box-sizing:border-box;
}

.broadcast-title{
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
    color:white;
}

.broadcast-sub{
    margin-top:4px;
    font-size:13px;
    letter-spacing:1.5px;

    color:
        rgba(215,235,250,.76);
}


/* =========================================================
   RIGHT SIDE
========================================================= */

.broadcast-right{
    width:25%;
    height:68%;

    display:flex;
    align-items:center;
    justify-content:center;

    border-left:
        1px solid rgba(255,255,255,.20);
}

.tracking-chip{
    padding:7px 14px;

    border:
        1px solid rgba(160,215,255,.50);

    border-radius:4px;

    background:
        rgba(0,28,55,.30);

    font-size:12px;
    font-weight:900;
    letter-spacing:1.5px;
    color:#bce5ff;
}


/* =========================================================
   TICKER
========================================================= */

.ticker{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    height:var(--ticker-height);
    overflow:hidden;

    background:
        rgba(0,18,37,.82);

    border-top:
        1px solid rgba(255,255,255,.16);

    box-sizing:border-box;

    display:flex;
    align-items:center;
}

.ticker-label{
    position:relative;
    z-index:5;

    height:100%;

    display:flex;
    align-items:center;

    padding:0 11px;
    flex-shrink:0;

    background:#061e37;

    border-right:
        1px solid rgba(255,255,255,.20);

    font-size:11px;
    font-weight:900;
    letter-spacing:1.2px;
    color:#9edaff;
}

.ticker-window{
    position:relative;
    overflow:hidden;
    flex:1;
    height:100%;
}

.ticker-track{
    position:absolute;
    top:0;
    left:100%;

    height:100%;

    display:flex;
    align-items:center;

    white-space:nowrap;
    min-width:max-content;

    animation:
        tickerMove 25s linear infinite;
}
@keyframes tickerMove{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-200vw);
    }
}
.ticker-item{
    display:inline-block;
    margin-right:48px;

    font-size:13px;
    font-weight:700;
    letter-spacing:.4px;
    color:#e6eef4;
}

.ticker-item.yellow{
    color:var(--yellow);
    font-weight:900;
}

.ticker-item.red{
    color:#ff6060;
    font-weight:900;
}

.ticker-item.silver{
    color:#d4dce2;
}


/* =========================================================
   AIRCRAFT POP-UP BOX
========================================================= */

.aircraft-popup{
    position:absolute;

    left:18px;
    bottom:var(--ribbon-height);

    width:490px;
    height:168px;

    display:flex;
    box-sizing:border-box;
    padding:12px;

    color:white;

    background:
        linear-gradient(
            135deg,
            rgba(5,26,47,.99),
            rgba(0,71,125,.98)
        );

    border:
        1px solid rgba(185,220,244,.72);

    border-bottom:
        3px solid #55baff;

    border-radius:
        12px 12px 0 0;

    box-shadow:
        0 -7px 24px rgba(0,0,0,.40);

    z-index:45;

    transform:
        translateY(115%);

    opacity:0;
    pointer-events:none;

    transition:
        transform .48s cubic-bezier(.22,.80,.25,1),
        opacity .25s ease;
}

.aircraft-popup.show{
    transform:translateY(0);
    opacity:1;
}


/* =========================================================
   POPUP PHOTO
========================================================= */

.popup-photo-wrap{
    position:relative;

    width:188px;
    height:140px;

    flex-shrink:0;

    border-radius:8px;
    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #0c2236,
            #173d58
        );

    border:
        1px solid rgba(255,255,255,.30);
}

.popup-photo{
    width:100%;
    height:100%;

    object-fit:cover;
    display:none;
}

.popup-photo.show{
    display:block;
}

.popup-logo{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
        linear-gradient(
            135deg,
            #09233d,
            #12517d
        );
}

.popup-logo img{
    max-width:110px;
    max-height:70px;
    object-fit:contain;

    filter:
        drop-shadow(
            0 3px 4px rgba(0,0,0,.35)
        );
}

.popup-logo-code{
    margin-top:7px;

    font-size:25px;
    font-weight:900;
    letter-spacing:2px;

    color:#dce8f0;
}

.photo-credit{
    position:absolute;
    left:4px;
    right:4px;
    bottom:3px;

    padding:2px 4px;

    font-size:9px;
    color:white;

    background:
        rgba(0,0,0,.55);

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    display:none;
}


/* =========================================================
   POPUP INFORMATION
========================================================= */

.popup-info{
    flex:1;
    min-width:0;

    padding-left:18px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.popup-direction{
    display:none;

    font-size:13px;
    font-weight:900;
    letter-spacing:2.5px;

    color:#ffd65a;
    margin-bottom:5px;
}

.popup-direction.departure{
    color:#ff8b55;
}

.popup-alert{
    font-size:30px;
    font-weight:900;
    letter-spacing:1.5px;
    line-height:1;

    color:white;

    text-shadow:
        0 2px 5px rgba(0,0,0,.35);

    margin-bottom:8px;
}

.popup-flight{
    font-size:19px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.popup-details{
    margin-top:6px;

    font-size:14px;

    color:
        rgba(225,238,247,.80);

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================================================
   SMALL EDGE ACCENTS
========================================================= */

.aircraft-popup.arrival{
    border-bottom-color:#ffd74f;
}

.aircraft-popup.departure{
    border-bottom-color:#ff8550;
}

.aircraft-popup.landed{
    border-bottom-color:#75e88c;
}

</style>

</head>

<body>


<!-- ======================================================

====================================================== -->

<div

<!-- ======================================================

<div class="ribbon">

            <div class="airport-mark">

                <div class="tower-icon">
                    <div class="tower-light"></div>

            </div>

            </div>

        </div>

            ></div>

        </div>

</div>


<script>

/* =========================================================
   AIRPORT CONFIGURATION
========================================================= */

const AIRPORT={

    name:"Prague",

    code:"PRG",

    icao:"LKPR",

    lat:50.1008,

    lon:14.2600,

    runwayEnds:[

        {
            name:"06",
            heading:60,
            lat:50.1018361,
            lon:14.2263000
        },

        {
            name:"24",
            heading:240,
            lat:50.1159500,
            lon:14.2733667
        },

        {
            name:"12",
            heading:122,
            lat:50.1080111,
            lon:14.2453667
        },

        {
            name:"30",
            heading:302,
            lat:50.0904667,
            lon:14.2816722
        }

    ]

};


/* =========================================================
   API ADDRESSES
========================================================= */

const AIRCRAFT_API=
"https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft";

const PHOTO_API=
"https://mikeaircraft-9hkn.vercel.app/api/photo";


/* =========================================================
   AIRPORT DISPLAY
========================================================= */

document
.getElementById("airportCode")
.textContent=
    AIRPORT.code;


document
.getElementById("broadcastSub")
.textContent=
    AIRPORT.name.toUpperCase()
    +
    " • ADS-B LIVE";


/* =========================================================
   AIRLINES
========================================================= */

const airlines={

    TVS:"SMARTWINGS",
    RYR:"RYANAIR",
    UAE:"EMIRATES",
    PGT:"PEGASUS AIRLINES",
    AUA:"AUSTRIAN AIRLINES",
    DLH:"LUFTHANSA",
    KLM:"KLM",
    BAW:"BRITISH AIRWAYS",
    EZY:"EASYJET",
    WZZ:"WIZZ AIR",
    QTR:"QATAR AIRWAYS",
    THY:"TURKISH AIRLINES",
    AFR:"AIR FRANCE",
    SWR:"SWISS",
    LOT:"LOT POLISH AIRLINES",
    SAS:"SAS",
    FIN:"FINNAIR",
    IBE:"IBERIA",
    TAP:"TAP AIR PORTUGAL",
    ITY:"ITA AIRWAYS",
    EIN:"AER LINGUS",
    VLG:"VUELING",
    EWG:"EUROWINGS",
    AEE:"AEGEAN AIRLINES",
    BTI:"AIRBALTIC",
    BEL:"BRUSSELS AIRLINES",
    TRA:"TRANSAVIA",
    EXS:"JET2",
    TUI:"TUI",
    ETD:"ETIHAD AIRWAYS",
    ELY:"EL AL",
    MSR:"EGYPTAIR",
    CFG:"CONDOR"

};


/* =========================================================
   LOGO FALLBACK
========================================================= */

const logoSlugs={

    RYR:"ryanair",
    UAE:"emirates",
    AUA:"austrianairlines",
    DLH:"lufthansa",
    KLM:"klm",
    BAW:"britishairways",
    EZY:"easyjet",
    WZZ:"wizzair",
    QTR:"qatarairways",
    THY:"turkishairlines",
    AFR:"airfrance",
    SWR:"swiss",
    LOT:"lotpolishairlines",
    SAS:"sas",
    FIN:"finnair",
    IBE:"iberia",
    TAP:"tapairportugal",
    EIN:"aerlingus",
    EWG:"eurowings",
    AEE:"aegeanairlines",
    CFG:"condor"

};


/* =========================================================
   RUNWAYS
========================================================= */

const runwayEnds=
    AIRPORT.runwayEnds;


const physicalRunways=[

    {
        name:
            runwayEnds[0].name+
            "/"+
            runwayEnds[1].name,

        a:
            runwayEnds[0],

        b:
            runwayEnds[1]
    },

    {
        name:
            runwayEnds[2].name+
            "/"+
            runwayEnds[3].name,

        a:
            runwayEnds[2],

        b:
            runwayEnds[3]
    }

];


/* =========================================================
   FILTERS
========================================================= */

const helicopterTypes=
new Set([

    "A109","A119","A139","A149","A169","A189",
    "AS32","AS50","AS55","AS65",
    "B06","B105","B212","B222","B412","B429",
    "EC20","EC25","EC30","EC35","EC45","EC55",
    "H125","H130","H135","H145","H155","H160",
    "R22","R44","R66",
    "S55","S58","S61","S64","S76","S92"

]);


const smallAircraftPrefixes=[

    "C15","C17","C18","C19","C20","C21",
    "C22","C23","C24","C25",

    "PA18","PA20","PA22","PA24","PA28","PA32",
    "PA34","PA38","PA44",

    "DA20","DA40","DA42",

    "SR20","SR22",

    "DR40","P28","M20",

    "BE23","BE24","BE33","BE35","BE36",

    "DV20"

];


const groundCallsignPrefixes=[

    "FOLLOW",
    "POZAR",
    "TXLU",
    "UDRZBA",
    "TWR",
    "GND",
    "EMER"

];


function unwantedAircraft(ac){

    const type=
        (ac.t||"")
        .trim()
        .toUpperCase();


    const reg=
        (ac.r||"")
        .trim()
        .toUpperCase();


    const flight=
        (ac.flight||"")
        .trim()
        .toUpperCase();


    const category=
        (ac.category||"")
        .trim()
        .toUpperCase();


    if(
        category==="C0"
        ||
        category==="C1"
        ||
        category==="C2"
    )
        return true;


    if(category==="A7")
        return true;


    if(helicopterTypes.has(type))
        return true;


    if(
        type==="TWR"
        ||
        type==="GND"
        ||
        type==="EMER"
        ||
        reg==="TWR"
        ||
        reg==="GND"
        ||
        reg==="EMER"
    )
        return true;


    for(const prefix of groundCallsignPrefixes){

        if(flight.startsWith(prefix))
            return true;
    }


    for(const prefix of smallAircraftPrefixes){

        if(type.startsWith(prefix))
            return true;
    }


    return false;
}


/* =========================================================
   TRACKING MEMORY
========================================================= */

const aircraftMemory=
    new Map();


const landedBlacklist=
    new Map();


let activeDeparture=null;

let landedDisplay=null;


/* =========================================================
   POPUP MEMORY
========================================================= */

let popupTimer=null;

let currentPopupKey=null;

let currentPopupAircraft=null;

const photoCache=
    new Map();


/* =========================================================
   TICKER MEMORY
========================================================= */

let tickerEvents=[];

const tickerKeys=
    new Set();

function removeTicker(key){

    tickerEvents=
        tickerEvents.filter(
            item =>
            item.key!==key
        );


    tickerKeys.delete(key);


    rebuildTicker();
}
function addTicker(
    key,
    text,
    level="silver"
){

    const aircraftKey=
        key.split(":").slice(1).join(":");


    tickerEvents=
        tickerEvents.filter(
            item => {

                const existingAircraft=
                    item.key
                    .split(":")
                    .slice(1)
                    .join(":");

                return existingAircraft
                    !==
                    aircraftKey;
            }
        );


    tickerEvents.unshift({

        key,

        text,

        level,

        time:
            Date.now()

    });


    if(tickerEvents.length>8){

        tickerEvents=
            tickerEvents.slice(0,8);
    }


    tickerKeys.clear();

    for(const item of tickerEvents){

        tickerKeys.add(
            item.key
        );
    }


    rebuildTicker();
}

function rebuildTicker(){

    const track=
        document
        .getElementById(
            "tickerTrack"
        );


    const defaults=[

        {
            text:
                AIRPORT.code+
                " LIVE AIR TRAFFIC",

            level:"silver"
        },

        {
            text:
                "ADS-B TRACKING ACTIVE",

            level:"silver"
        }

    ];


    const events=
        tickerEvents.length
        ?
        tickerEvents
        :
        defaults;


   track.innerHTML=
    events
    .map(item=>

        '<span class="ticker-item '+
        item.level+
        '">'+
        item.text+
        '</span>'

    )
    .join("");

        +

        events
        .map(item=>

            '<span class="ticker-item '+
            item.level+
            '">'+
            item.text+
            '</span>'

        )
        .join("");


    track.style.animation="none";

    void track.offsetWidth;

    track.style.animation="";
}


rebuildTicker();


/* =========================================================
   BASIC HELPERS
========================================================= */

function aircraftId(ac){

    return (
        ac.hex
        ||
        ac.r
        ||
        (ac.flight||"").trim()
        ||
        null
    );
}


function airlinePrefix(ac){

    const flight=
        (ac.flight||"")
        .trim()
        .toUpperCase();


    return flight.length>=3
        ?
        flight.substring(0,3)
        :
        "";
}


function airlineName(ac){

    const prefix=
        airlinePrefix(ac);


    return airlines[prefix]
        ||
        "";
}


function callsign(ac){

    return (
        (ac.flight||"")
        .trim()
        ||
        ac.r
        ||
        "AIRCRAFT"
    );
}


function onGround(ac){

    return (
        ac.alt_baro==="ground"
        ||
        ac.alt_geom==="ground"
    );
}


function altitude(ac){

    if(onGround(ac))
        return 0;


    let value=
        Number(ac.alt_baro);


    if(!Number.isFinite(value)){

        value=
            Number(ac.alt_geom);
    }


    return Number.isFinite(value)
        ?
        value
        :
        null;
}


function groundSpeed(ac){

    const value=
        Number(ac.gs);


    return Number.isFinite(value)
        ?
        value
        :
        0;
}


function verticalRate(ac){

    let value=
        Number(ac.baro_rate);


    if(!Number.isFinite(value)){

        value=
            Number(ac.geom_rate);
    }


    return Number.isFinite(value)
        ?
        value
        :
        0;
}


function positionAge(ac){

    const value=
        Number(ac.seen_pos);


    return Number.isFinite(value)
        ?
        value
        :
        999;
}


function freshPosition(ac){

    return (
        positionAge(ac)
        <=
        5
    );
}


/* =========================================================
   DISTANCE
========================================================= */

function distanceKm(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371;


    const dLat=
        (lat2-lat1)
        *
        Math.PI/180;


    const dLon=
        (lon2-lon1)
        *
        Math.PI/180;


    const a=

        Math.sin(dLat/2)**2

        +

        Math.cos(
            lat1*Math.PI/180
        )

        *

        Math.cos(
            lat2*Math.PI/180
        )

        *

        Math.sin(dLon/2)**2;


    return R*2*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}


/* =========================================================
   RUNWAY GEOMETRY
========================================================= */

function distanceToRunway(
    lat,
    lon,
    runway
){

    const ref=
        (
            lat+
            runway.a.lat+
            runway.b.lat
        )/3;


    const ky=
        111.32;


    const kx=
        111.32*
        Math.cos(
            ref*
            Math.PI/180
        );


    const px=
        lon*kx;

    const py=
        lat*ky;


    const ax=
        runway.a.lon*kx;

    const ay=
        runway.a.lat*ky;


    const bx=
        runway.b.lon*kx;

    const by=
        runway.b.lat*ky;


    const vx=
        bx-ax;

    const vy=
        by-ay;


    const wx=
        px-ax;

    const wy=
        py-ay;


    const lengthSquared=
        vx*vx+
        vy*vy;


    let t=
        (
            wx*vx+
            wy*vy
        )
        /
        lengthSquared;


    t=
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const cx=
        ax+t*vx;

    const cy=
        ay+t*vy;


    return Math.sqrt(
        (px-cx)**2+
        (py-cy)**2
    );
}


function nearestRunwayDistance(ac){

    const lat=
        Number(ac.lat);

    const lon=
        Number(ac.lon);


    if(
        !Number.isFinite(lat)
        ||
        !Number.isFinite(lon)
    )
        return 999;


    let best=
        999;


    for(const runway of physicalRunways){

        const d=
            distanceToRunway(
                lat,
                lon,
                runway
            );


        if(d<best)
            best=d;
    }


    return best;
}


function nearRunway(ac){

    return (
        nearestRunwayDistance(ac)
        <=
        0.22
    );
}


function nearestThreshold(ac){

    const lat=
        Number(ac.lat);

    const lon=
        Number(ac.lon);


    if(
        !Number.isFinite(lat)
        ||
        !Number.isFinite(lon)
    )
        return null;


    let best=null;

    let bestDistance=
        999;


    for(const end of runwayEnds){

        const d=
            distanceKm(
                lat,
                lon,
                end.lat,
                end.lon
            );


        if(d<bestDistance){

            bestDistance=d;

            best=end;
        }
    }


    return {

        runway:
            best,

        distance:
            bestDistance

    };
}
   /* =========================================================
   MEMORY
========================================================= */

function getMemory(id){

    if(!aircraftMemory.has(id)){

        aircraftMemory.set(
            id,
            {
                samples:[],
                arrivalCandidate:false,
                arrivalLastSeen:0,
                wasNearRunwayGround:false,
                lastNearRunwayGround:0,
                lastSeen:Date.now()
            }
        );
    }

    return aircraftMemory.get(id);
}


function addSample(ac){

    const id=
        aircraftId(ac);

    if(!id)
        return;


    const memory=
        getMemory(id);


    const lat=
        Number(ac.lat);

    const lon=
        Number(ac.lon);


    const airportDistance=

        Number.isFinite(lat)
        &&
        Number.isFinite(lon)

        ?

        distanceKm(
            lat,
            lon,
            AIRPORT.lat,
            AIRPORT.lon
        )

        :

        999;


    const threshold=
        nearestThreshold(ac);


    const sample={

        time:
            Date.now(),

        ground:
            onGround(ac),

        speed:
            groundSpeed(ac),

        altitude:
            altitude(ac),

        vertical:
            verticalRate(ac),

        positionAge:
            positionAge(ac),

        airportDistance,

        thresholdDistance:
            threshold
            ?
            threshold.distance
            :
            999,

        nearRunway:
            nearRunway(ac)

    };


    memory.samples.push(sample);


    const cutoff=
        Date.now()-
        180000;


    memory.samples=
        memory.samples
        .filter(
            s=>
            s.time>=cutoff
        );


    memory.lastSeen=
        Date.now();


    if(
        sample.ground
        &&
        sample.nearRunway
        &&
        sample.positionAge<=8
    ){

        memory.wasNearRunwayGround=
            true;

        memory.lastNearRunwayGround=
            Date.now();
    }
}


/* =========================================================
   ARRIVAL MEMORY
========================================================= */

function updateArrivalCandidate(ac){

    if(onGround(ac))
        return;


    const id=
        aircraftId(ac);


    if(!id)
        return;


    const memory=
        getMemory(id);


    const samples=
        memory.samples;


    if(samples.length<2)
        return;


    const latest=
        samples[
            samples.length-1
        ];


    if(latest.vertical>900)
        return;


    if(latest.airportDistance>20)
        return;


    const alt=
        latest.altitude;


    const descentEvidence=

        latest.vertical<200

        ||

        (
            alt!==null
            &&
            alt<5000
        );


    if(!descentEvidence)
        return;


    const recent=
        samples
        .filter(
            s=>
            !s.ground
            &&
            s.positionAge<=5
        )
        .slice(-6);


    if(recent.length<2)
        return;


    let closerCount=0;

    let descendingCount=0;


    for(
        let i=1;
        i<recent.length;
        i++
    ){

        if(
            recent[i].airportDistance
            <
            recent[i-1].airportDistance
            +
            0.10
        )
            closerCount++;


        if(
            recent[i].altitude!==null
            &&
            recent[i-1].altitude!==null
            &&
            recent[i].altitude
            <=
            recent[i-1].altitude+75
        )
            descendingCount++;
    }


    if(
        closerCount>=1
        &&
        descendingCount>=1
    ){

        memory.arrivalCandidate=
            true;

        memory.arrivalLastSeen=
            Date.now();
    }


    if(
        memory.arrivalCandidate
        &&
        latest.airportDistance<=8
    ){

        memory.arrivalLastSeen=
            Date.now();
    }
}


/* =========================================================
   TOUCHDOWN
========================================================= */

function detectTouchdown(
    aircraft
){

    for(const ac of aircraft){

        const id=
            aircraftId(ac);


        if(
            !id
            ||
            !onGround(ac)
        )
            continue;


        const memory=
            getMemory(id);


        if(
            !memory.arrivalCandidate
        )
            continue;


        if(
            positionAge(ac)>15
        )
            continue;


        if(
            !nearRunway(ac)
        )
            continue;


        return ac;
    }


    return null;
}


/* =========================================================
   TAKEOFF ROLL
========================================================= */

function departureAcceleration(ac){

    const id=
        aircraftId(ac);


    if(
        !id
        ||
        !onGround(ac)
    )
        return false;


    if(
        landedBlacklist.has(id)
    )
        return false;


    if(
        !freshPosition(ac)
    )
        return false;


    if(
        !nearRunway(ac)
    )
        return false;


    const memory=
        getMemory(id);


    const freshGround=
        memory.samples
        .filter(
            s=>
            s.ground
            &&
            s.positionAge<=5
            &&
            s.nearRunway
        )
        .slice(-8);


    if(freshGround.length<2)
        return false;


    const latest=
        freshGround[
            freshGround.length-1
        ];


    if(latest.speed>=40)
        return true;


    const first=
        freshGround[0];


    const gain=
        latest.speed-
        first.speed;


    let increases=0;


    for(
        let i=1;
        i<freshGround.length;
        i++
    ){

        if(
            freshGround[i].speed
            >
            freshGround[i-1].speed+1
        )
            increases++;
    }


    if(
        latest.speed>=22
        &&
        gain>=8
        &&
        increases>=2
    )
        return true;


    return false;
}


/* =========================================================
   AIRBORNE DEPARTURE FALLBACK
========================================================= */

function airborneDeparture(ac){

    if(onGround(ac))
        return false;


    const id=
        aircraftId(ac);


    if(!id)
        return false;


    if(
        landedBlacklist.has(id)
    )
        return false;


    const memory=
        getMemory(id);


    const alt=
        altitude(ac);


    const climb=
        verticalRate(ac);


    const lat=
        Number(ac.lat);

    const lon=
        Number(ac.lon);


    if(
        !Number.isFinite(lat)
        ||
        !Number.isFinite(lon)
    )
        return false;


    const d=
        distanceKm(
            lat,
            lon,
            AIRPORT.lat,
            AIRPORT.lon
        );


    if(
        alt===null
        ||
        alt>4500
        ||
        d>8
    )
        return false;


    if(climb<500)
        return false;


    if(
        memory.wasNearRunwayGround
        &&
        Date.now()-
        memory.lastNearRunwayGround
        <
        120000
    )
        return true;


    const recentGround=
        memory.samples
        .slice(-12)
        .some(
            s=>
            s.ground
            &&
            Date.now()-s.time<120000
        );


    return recentGround;
}


/* =========================================================
   ARRIVAL DISPLAY CANDIDATE
========================================================= */

function displayArrivalCandidate(ac){

    if(onGround(ac))
        return null;


    const id=
        aircraftId(ac);


    if(!id)
        return null;


    const memory=
        getMemory(id);


    if(!memory.arrivalCandidate)
        return null;


    const nearest=
        nearestThreshold(ac);


    if(!nearest)
        return null;


    if(nearest.distance>3)
        return null;


    if(
        verticalRate(ac)>900
    )
        return null;


    return {

        ac,

        distance:
            nearest.distance

    };
}

async function loadAircraftPhoto(
    ac,
    popupKey
){

    const hex=
        (ac.hex||"")
        .trim()
        .toUpperCase();


    if(!hex){

        showLogoFallback(ac);

        return;
    }


    showLogoFallback(ac);


    if(
        photoCache.has(hex)
    ){

        const cached=
            photoCache.get(hex);


        if(cached)
            applyPhoto(
                cached,
                popupKey
            );


        return;
    }


    try{

        const response=
            await fetch(
                PHOTO_API+
                "?hex="+
                encodeURIComponent(hex),
                {
                    cache:"force-cache"
                }
            );


        if(!response.ok){

            photoCache.set(
                hex,
                null
            );

            return;
        }


        const data=
            await response.json();
       document.querySelector(".tracking-chip").textContent =
    "LIVE TRACKING • " + (data.ac || []).length + " AIRCRAFT";


        if(
            data.status===200
            &&
            data.data
            &&
            data.data.length
            &&
            data.data[0].image
        ){

            const photoData=
                data.data[0];


            photoCache.set(
                hex,
                photoData
            );


            applyPhoto(
                photoData,
                popupKey
            );

        }

        else{

            photoCache.set(
                hex,
                null
            );
        }

    }

    catch(error){

        console.log(
            "Photo lookup failed",
            error
        );
    }
}


function applyPhoto(
    photoData,
    popupKey
){

    if(
        currentPopupKey!==popupKey
    )
        return;


    const photo=
        document.getElementById(
            "popupPhoto"
        );


    const logo=
        document.getElementById(
            "popupLogo"
        );


    const credit=
        document.getElementById(
            "photoCredit"
        );


    photo.onload=
        function(){

            if(
                currentPopupKey!==popupKey
            )
                return;


            logo.style.display=
                "none";


            photo.classList.add(
                "show"
            );


            if(
                photoData.photographer
            ){

                credit.textContent=
                    "Photo: "
                    +
                    photoData.photographer
                    +
                    " / Airport-Data.com";


                credit.style.display=
                    "block";
            }
        };


    photo.src=
        photoData.image;
}


/* =========================================================
   POPUP TEXT
========================================================= */

function popupFlightText(ac){

    const company=
        airlineName(ac);


    const call=
        callsign(ac);


    if(company){

        return (
            company
            +
            " • "
            +
            call
        );
    }


    return call;
}


function popupDetailText(ac){

    const parts=[];


    if(ac.desc){

        parts.push(
            ac.desc
        );

    }

    else if(ac.t){

        parts.push(
            ac.t
        );
    }


    if(ac.r){

        parts.push(
            ac.r
        );
    }


    return parts.join(
        " • "
    );
}


/* =========================================================
   POPUP
========================================================= */

function showPopup(
    ac,
    direction,
    alert,
    popupKey,
    duration=22000
){

    if(
        currentPopupKey===popupKey
    )
        return;


    currentPopupKey=
        popupKey;


    currentPopupAircraft=
        aircraftId(ac);


    const popup=
        document.getElementById(
            "aircraftPopup"
        );


    const directionEl=
        document.getElementById(
            "popupDirection"
        );


    const alertEl=
        document.getElementById(
            "popupAlert"
        );


    const flightEl=
        document.getElementById(
            "popupFlight"
        );


    const detailsEl=
        document.getElementById(
            "popupDetails"
        );


    popup.className=
        "aircraft-popup";


    if(direction==="DEPARTURE"){

        popup.classList.add(
            "departure"
        );

        directionEl.className=
            "popup-direction departure";

    }

    else{

        popup.classList.add(
            "arrival"
        );

        directionEl.className=
            "popup-direction";
    }


    directionEl.textContent=
        direction;


    alertEl.textContent=
        alert;


    flightEl.textContent=
        popupFlightText(ac);


    detailsEl.textContent=
        popupDetailText(ac);


    loadAircraftPhoto(
        ac,
        popupKey
    );


    popup.classList.remove(
        "show"
    );


    void popup.offsetWidth;


    popup.classList.add(
        "show"
    );


    if(popupTimer){

        clearTimeout(
            popupTimer
        );
    }


    popupTimer=
        setTimeout(
            hidePopup,
            duration
        );
}


function hidePopup(){

    const popup=
        document.getElementById(
            "aircraftPopup"
        );


    popup.classList.remove(
        "show"
    );


    popupTimer=null;
}


/* =========================================================
   EVENT PRESENTATION
========================================================= */

function announceArrival(
    ac,
    distance
){

    const id=
        aircraftId(ac);


    const popupKey=
        "POPUP:ARRIVAL:"+
        id;


    showPopup(
        ac,
        "ARRIVAL",
        "ARRIVAL",
        popupKey,
        22000
    );


    addTicker(
        "EXPECTED_ARRIVAL:"+
        id,

        "EXPECTED ARRIVAL • "
        +
        popupFlightText(ac),

        distance<=1.5
        ?
        "red"
        :
        "yellow"
    );
}


function announceLanded(ac){

    const id=
        aircraftId(ac);
   removeTicker(
    "EXPECTED_ARRIVAL:"+id
);


    const popupKey=
        "POPUP:ARRIVAL:"+
        id;


    showPopup(
        ac,
        "ARRIVAL",
        "ARRIVAL",
        popupKey,

    );

}


function announceDeparture(ac){

    const id=
        aircraftId(ac);


    const departed=
        !onGround(ac);
   if(departed){

    removeTicker(
        "EXPECTED_DEPARTURE:"+id
    );
}


    const popupKey=
        "POPUP:DEPARTURE:"+
        id;


    showPopup(
        ac,
        "DEPARTURE",
        "DEPARTURE",
        popupKey,
        20000
    );


    addTicker(
        (
            departed
            ?
            "DEPARTED:"
            :

        )

        (
            departed
            ?
            "DEPARTED • "
            :
            "EXPECTED DEPARTURE • "
        )
        +
        popupFlightText(ac),

        departed
        ?
        "silver"
        :
        "yellow"
    );
}
   /* =========================================================
   CLEANUP
========================================================= */

function cleanup(){

    const now=
        Date.now();


    for(
        const [id,expiry]
        of landedBlacklist
    ){

        if(now>=expiry){

            landedBlacklist.delete(
                id
            );
        }
    }


    for(
        const [id,memory]
        of aircraftMemory
    ){

        if(
            memory.arrivalCandidate
            &&
            now-
            memory.arrivalLastSeen
            >
            8*60*1000
        ){

            memory.arrivalCandidate=
                false;
        }


        if(
            now-
            memory.lastSeen
            >
            15*60*1000
        ){

            aircraftMemory.delete(
                id
            );
        }
    }


    tickerEvents=
        tickerEvents
        .filter(
            item=>
            now-item.time
            <
            40*60*1000
        );


    tickerKeys.clear();


    for(
        const item
        of tickerEvents
    ){

        tickerKeys.add(
            item.key
        );
    }
}


/* =========================================================
   MAIN TRACKING LOOP
========================================================= */

async function update(){

    cleanup();


    try{

        const response=
            await fetch(
                AIRCRAFT_API+
                "?t="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP "+
                response.status
            );
        }


        const data=
            await response.json();


        const aircraft=
            (data.ac||[])

            .filter(
                ac=>
                Number.isFinite(
                    Number(ac.lat)
                )
                &&
                Number.isFinite(
                    Number(ac.lon)
                )
            )

            .filter(
                ac=>
                !unwantedAircraft(ac)
            );


        /* ==================================================
           UPDATE MEMORY
        ================================================== */

        for(const ac of aircraft){

            addSample(ac);

            updateArrivalCandidate(ac);
        }


        /* ==================================================
           TOUCHDOWN
        ================================================== */

        const touchdown=
            detectTouchdown(
                aircraft
            );


        if(touchdown){

            const id=
                aircraftId(
                    touchdown
                );


            landedBlacklist.set(
                id,
                Date.now()+
                5*60*1000
            );


            const memory=
                getMemory(id);


            memory.arrivalCandidate=
                false;


            if(
                activeDeparture===id
            ){

                activeDeparture=
                    null;
            }


            landedDisplay={

                ac:
                    touchdown,

                until:
                    Date.now()+
                    12000
            };


            announceLanded(
                touchdown
            );


            return;
        }


        /* ==================================================
           ARRIVALS
        ================================================== */

        const arrivals=[];


        for(const ac of aircraft){

            const candidate=
                displayArrivalCandidate(
                    ac
                );


            if(candidate){

                arrivals.push(
                    candidate
                );
            }
        }


        arrivals.sort(
            (a,b)=>
            a.distance-
            b.distance
        );


        const imminentArrival=

            arrivals.length
            &&
            arrivals[0].distance<=1.5

            ?

            arrivals[0]

            :

            null;


        if(imminentArrival){

            announceArrival(
                imminentArrival.ac,
                imminentArrival.distance
            );


            return;
        }


        /* ==================================================
           TAKEOFF ROLL
        ================================================== */

        let bestGroundDeparture=
            null;


        for(const ac of aircraft){

            if(
                !departureAcceleration(ac)
            )
                continue;


            const id=
                aircraftId(ac);


            const memory=
                getMemory(id);


            const latest=
                memory.samples[
                    memory.samples.length-1
                ];


            const score=
                latest.speed;


            if(
                !bestGroundDeparture
                ||
                score>
                bestGroundDeparture.score
            ){

                bestGroundDeparture={

                    ac,

                    id,

                    score
                };
            }
        }


        if(bestGroundDeparture){

            activeDeparture=
                bestGroundDeparture.id;


            announceDeparture(
                bestGroundDeparture.ac
            );


            return;
        }


        /* ==================================================
           ACTIVE DEPARTURE
           RELEASE AT 2000 FT
        ================================================== */

        if(activeDeparture){

            const ac=
                aircraft.find(
                    item=>
                    aircraftId(item)
                    ===
                    activeDeparture
                );


            if(ac){

                const alt=
                    altitude(ac);


                if(onGround(ac)){

                    announceDeparture(
                        ac
                    );


                    return;
                }


                if(
                    alt!==null
                    &&
                    alt<2000
                ){

                    announceDeparture(
                        ac
                    );


                    return;
                }


                if(
                    alt!==null
                    &&
                    alt>=2000
                ){

                    activeDeparture=
                        null;
                }
            }

            else{

                const memory=
                    aircraftMemory.get(
                        activeDeparture
                    );


                if(
                    !memory
                    ||
                    Date.now()-
                    memory.lastSeen
                    >=
                    90000
                ){

                    activeDeparture=
                        null;
                }
            }
        }


        /* ==================================================
           AIRBORNE DEPARTURE FALLBACK
        ================================================== */

        let airborneDep=
            null;


        for(const ac of aircraft){

            if(
                !airborneDeparture(ac)
            )
                continue;


            const alt=
                altitude(ac);


            const score=
                (
                    verticalRate(ac)
                    *2
                )
                -
                (
                    alt||0
                );


            if(
                !airborneDep
                ||
                score>
                airborneDep.score
            ){

                airborneDep={

                    ac,

                    id:
                        aircraftId(ac),

                    score
                };
            }
        }


        if(airborneDep){

            activeDeparture=
                airborneDep.id;


            announceDeparture(
                airborneDep.ac
            );


            return;
        }


        /* ==================================================
           LANDED HOLD
        ================================================== */

        if(landedDisplay){

            if(
                Date.now()
                <
                landedDisplay.until
            ){

                return;
            }


            landedDisplay=
                null;
        }


        /* ==================================================
           NORMAL ARRIVAL
        ================================================== */

        if(arrivals.length){

            announceArrival(
                arrivals[0].ac,
                arrivals[0].distance
            );


            return;
        }

    }

    catch(error){

        console.error(
            error
        );
    }
}


/* =========================================================
   START
========================================================= */

update();


setInterval(
    update,
    3000
);

</script>
