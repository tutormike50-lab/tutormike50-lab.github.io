<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
:root{
    --ribbon:116px;
    --rail:31px;
    --yellow:#ffd451;
    --orange:#ff8b52;
}

*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    color:#fff;
    font-family:"Arial Narrow","Roboto Condensed",
                "Helvetica Neue Condensed",Arial,sans-serif;
}

/* =====================================================
   MAIN BROADCAST RIBBON
===================================================== */

.ribbon{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:var(--ribbon);
    z-index:50;

    background:
        linear-gradient(
            90deg,
            #03192e 0%,
            #004f8d 35%,
            #0066a9 55%,
            #003b6b 80%,
            #03192e 100%
        );

    border-top:1px solid rgba(184,226,255,.9);

    box-shadow:
        0 -1px 0 rgba(255,255,255,.14),
        0 3px 12px rgba(0,0,0,.32);
}

.main{
    height:calc(var(--ribbon) - var(--rail));
    display:flex;
    align-items:center;
}

/* =====================================================
   PRG AIRPORT IDENT
===================================================== */

.ident{
    width:26%;
    height:100%;
    display:flex;
    align-items:center;
    padding:0 18px;

    border-right:1px solid rgba(255,255,255,.20);

    background:
        linear-gradient(
            100deg,
            rgba(0,0,0,.24),
            transparent
        );
}

.badge{
    display:flex;
    align-items:center;
    gap:14px;
}

/* CONTROL TOWER */

.tower{
    position:relative;
    width:48px;
    height:66px;

    filter:
        drop-shadow(
            0 4px 5px rgba(0,0,0,.45)
        );
}

.tower:before{
    content:"";

    position:absolute;
    left:20px;
    bottom:0;

    width:12px;
    height:43px;

    background:
        linear-gradient(
            90deg,
            #64717c 0%,
            #f2f6f8 46%,
            #7b8790 100%
        );

    clip-path:
        polygon(
            30% 0,
            70% 0,
            100% 100%,
            0 100%
        );
}

.tower:after{
    content:"";

    position:absolute;
    left:7px;
    top:13px;

    width:36px;
    height:18px;

    background:
        linear-gradient(
            180deg,
            #fff 0%,
            #a6b0b7 100%
        );

    clip-path:
        polygon(
            13% 0,
            87% 0,
            100% 42%,
            82% 100%,
            18% 100%,
            0 42%
        );

    box-shadow:
        inset 0 5px 0 #154568;
}

.beacon{
    position:absolute;
    left:23px;
    top:1px;

    width:3px;
    height:13px;

    background:#d7dde1;
}

.beacon:after{
    content:"";

    position:absolute;
    left:-3px;
    top:-2px;

    width:9px;
    height:9px;

    border-radius:50%;

    background:#ff4747;

    box-shadow:
        0 0 9px #ff4747;

    animation:
        blink 1.65s infinite;
}

@keyframes blink{

    0%,43%,100%{
        opacity:.18;
    }

    48%,60%{
        opacity:1;
    }
}

.identText{
    line-height:.88;
}

.code{
    font-size:46px;
    font-weight:900;

    letter-spacing:4px;

    background:
        linear-gradient(
            180deg,
            #fff 0%,
            #e2e6e9 34%,
            #8b969e 62%,
            #fafafa 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 3px 7px rgba(0,0,0,.55);
}

.airportName{
    margin-top:7px;

    font-size:10px;
    font-weight:900;

    letter-spacing:2.1px;

    color:#d4e3ed;
}

.live{
    margin-top:5px;

    font-size:10px;
    font-weight:900;

    letter-spacing:1.4px;

    color:#ff5e5e;
}

/* =====================================================
   CENTRE
===================================================== */

.center{
    width:49%;
    padding:0 28px;
}

.headline{
    font-size:24px;
    font-weight:900;

    letter-spacing:2.5px;
}

.sub{
    margin-top:6px;

    font-size:12px;
    font-weight:800;

    letter-spacing:1.3px;

    color:#b9d7e9;
}

/* =====================================================
   ADS-B STATUS
===================================================== */

.system{
    width:25%;

    display:flex;
    justify-content:center;
}

.chip{
    min-width:170px;

    text-align:center;

    padding:9px 14px;

    border:
        1px solid
        rgba(168,219,251,.55);

    border-radius:5px;

    background:
        rgba(0,20,39,.34);

    font-size:12px;
    font-weight:900;

    letter-spacing:1.2px;

    color:#c6eaff;
}

/* =====================================================
   CONTINUOUS LIVE TRAFFIC TICKER
   Presentation only — engine data is unchanged.
===================================================== */

.rail{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:var(--rail);
    display:flex;
    align-items:center;
    overflow:hidden;
    background:rgba(2,15,28,.96);
    border-top:1px solid rgba(255,255,255,.14);
}

.railTag{
    position:relative;
    z-index:3;
    height:100%;
    min-width:128px;
    padding:0 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    background:#071e34;
    border-right:1px solid rgba(255,255,255,.18);
    box-shadow:8px 0 14px rgba(2,15,28,.86);
    font-size:11px;
    font-weight:900;
    letter-spacing:1.25px;
    color:#a9dcff;
}

.railViewport{
    position:relative;
    flex:1;
    min-width:0;
    height:100%;
    overflow:hidden;
}

.railTrack{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    display:flex;
    align-items:center;
    width:max-content;
    white-space:nowrap;
    will-change:transform;
    animation:tickerFlow var(--ticker-duration,34s) linear infinite;
}

.railTrack:hover{
    animation-play-state:running;
}

.tickerGroup{
    display:flex;
    align-items:center;
    height:100%;
    flex:0 0 auto;
}

.tickerItem{
    display:inline-flex;
    align-items:center;
    height:100%;
    padding:0 22px;
    border-right:1px solid rgba(255,255,255,.13);
    font-size:13px;
    font-weight:800;
    letter-spacing:.45px;
    color:#fff;
}

.tickerState{
    margin-right:9px;
    color:var(--yellow);
    font-weight:900;
    letter-spacing:.8px;
}

.tickerState.done{
    color:#dbe4ea;
}

.tickerSep{
    margin:0 8px;
    color:rgba(255,255,255,.45);
}

.tickerSecondary{
    color:var(--yellow);
}

.tickerIdle{
    color:#b9d7e9;
}

@keyframes tickerFlow{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
}

/* =====================================================
   AIRCRAFT ALERT PANEL — BROADCAST CARD
   Presentation only. Tracking engine is unchanged.
===================================================== */

.popup{
    position:absolute;
    left:24px;
    bottom:var(--ribbon);

    width:650px;
    height:188px;

    display:flex;
    align-items:stretch;

    padding:0;
    overflow:hidden;

    background:
        linear-gradient(135deg,
            rgba(2,22,51,.985) 0%,
            rgba(2,34,73,.985) 55%,
            rgba(1,17,42,.99) 100%);

    border:2px solid #39a8ff;
    border-radius:18px 18px 0 0;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.08) inset,
        0 0 22px rgba(20,137,255,.42),
        0 -12px 34px rgba(0,0,0,.36);

    z-index:45;

    transform:translateY(112%);
    opacity:0;

    transition:
        transform .46s cubic-bezier(.22,.8,.25,1),
        opacity .22s ease;

    pointer-events:none;
}

.popup.show{
    transform:translateY(0);
    opacity:1;
}

/* keep a single blue broadcast language for both states */
.popup.departure,
.popup.arrival{
    border-color:#39a8ff;
}

/* =====================================================
   DYNAMIC AIRCRAFT GRAPHIC
   Side-profile aircraft: climb on departure, stable
   approach attitude on arrival. Presentation only.
===================================================== */

.planeStage{
    position:relative;
    width:235px;
    flex:0 0 235px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    border-right:1px solid rgba(255,255,255,.18);
    background:
        radial-gradient(circle at 48% 48%,rgba(39,142,255,.19),transparent 54%),
        linear-gradient(135deg,rgba(8,56,111,.26),rgba(1,15,36,.12));
}

.planeStage:before{
    content:"";
    position:absolute;
    left:24px;
    top:30px;
    bottom:30px;
    width:3px;
    border-radius:3px;
    background:#2f9dff;
    box-shadow:0 0 12px rgba(47,157,255,.72);
}

.flightPlane{
    position:relative;
    width:176px;
    height:96px;
    margin-left:24px;
    color:#fff;
    filter:
        drop-shadow(0 4px 4px rgba(0,0,0,.36))
        drop-shadow(0 0 9px rgba(255,255,255,.18));
    transform-origin:52% 58%;
}

.flightPlane svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
}

.flightPlane .fuselage,
.flightPlane .tail,
.flightPlane .wing,
.flightPlane .engine,
.flightPlane .gear{
    fill:currentColor;
}

.flightPlane .windowLine{
    fill:none;
    stroke:rgba(3,31,64,.72);
    stroke-width:1.7;
    stroke-linecap:round;
}

.flightPlane .gear{
    opacity:0;
}

/* trajectory glow sits behind the aircraft */
.flightPlane:after{
    content:"";
    position:absolute;
    z-index:-1;
    right:112px;
    top:56%;
    width:112px;
    height:5px;
    border-radius:100%;
    transform-origin:right center;
    opacity:.92;
}

/* departure: aircraft pitches up and climbs gently */
.flightPlane.departure{
    /* Upright side-profile, nose to the right, with a small fixed
       climb angle. No ADS-B heading rotation is used. */
    transform:rotate(-7deg) translate(0,3px);
}

.flightPlane.departure:after{
    background:linear-gradient(90deg,transparent,#168cff,#8cd4ff);
    box-shadow:0 0 13px #168cff;
    transform:rotate(4deg);
}

.popup.show .flightPlane.departure{
    animation:planeTakeoff 2.4s ease-in-out infinite alternate;
}

/* arrival: aircraft remains believable/near-level, gear down,
   while the whole silhouette follows a shallow descending path */
.flightPlane.arrival{
    /* Upright side-profile, nose to the right, with a small fixed
       descent angle. No ADS-B heading rotation is used. */
    transform:rotate(3deg) translate(0,-2px);
}

.flightPlane.arrival .gear{
    opacity:1;
}

.flightPlane.arrival:after{
    background:linear-gradient(90deg,transparent,#f0c52e,#ffe98e);
    box-shadow:0 0 11px rgba(240,197,46,.9);
    transform:rotate(-7deg);
}

.popup.show .flightPlane.arrival{
    animation:planeApproach 2.4s ease-in-out infinite alternate;
}

@keyframes planeTakeoff{
    from{transform:translate(-5px,5px) rotate(-7deg)}
    to{transform:translate(8px,-7px) rotate(-7deg)}
}

@keyframes planeApproach{
    from{transform:translate(-7px,-6px) rotate(3deg)}
    to{transform:translate(8px,5px) rotate(3deg)}
}

/* =====================================================
   POPUP TYPOGRAPHY
===================================================== */

.popupInfo{
    flex:1;
    min-width:0;
    position:relative;
    padding:30px 30px 22px 32px;
}

.state{
    position:absolute;
    top:18px;
    right:26px;

    font-size:14px;
    font-weight:900;
    letter-spacing:1.8px;

    color:#ffd451;
}

.state:after{
    content:"";
    display:inline-block;
    width:8px;
    height:8px;
    margin-left:9px;
    border-radius:50%;
    background:#39a8ff;
    box-shadow:0 0 8px rgba(57,168,255,.8);
}

.flight{
    margin-top:30px;
    padding-right:80px;

    font-size:34px;
    line-height:1;
    font-weight:900;
    letter-spacing:1px;

    color:#fff;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.airlineLine{
    margin-top:14px;
    font-size:18px;
    font-weight:900;
    letter-spacing:.8px;
    color:#ffd451;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.details{
    margin-top:10px;
    font-size:16px;
    font-weight:800;
    color:#fff;
    letter-spacing:.35px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.details .secondary{
    color:#ffd451;
}

.warning{
    color:#ff5757 !important;
}

.popupProgress{
    position:absolute;
    left:32px;
    right:30px;
    bottom:20px;
    height:4px;
    border-radius:4px;
    overflow:hidden;
    background:rgba(255,255,255,.17);
}

.popupProgress span{
    display:block;
    width:100%;
    height:100%;
    transform-origin:left center;
    background:linear-gradient(90deg,#168cff,#75c6ff);
}

.popup.show .popupProgress span{
    animation:popupCountdown 15s linear forwards;
}

@keyframes popupCountdown{
    from{transform:scaleX(1)}
    to{transform:scaleX(0)}
}

/* =====================================================
   AIRPORT SELECTOR — operator control
   Auto-hides so it will not sit over the live stream.
===================================================== */
.airportSwitcher{
    position:fixed;
    top:14px;
    right:14px;
    z-index:200;
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 8px;
    border:1px solid rgba(200,230,250,.65);
    border-radius:8px;
    background:rgba(3,22,40,.92);
    box-shadow:0 4px 14px rgba(0,0,0,.30);
    opacity:1;
    transition:opacity .35s ease;
}
.airportSwitcher.hidden{
    opacity:0;
    pointer-events:none;
}
.airportSwitcher button,
.airportSwitcher select{
    height:32px;
    border:1px solid rgba(180,220,245,.45);
    border-radius:5px;
    background:#082943;
    color:white;
    font-family:inherit;
    font-size:12px;
    font-weight:900;
    letter-spacing:.7px;
}
.airportSwitcher button{padding:0 11px;cursor:pointer}
.airportSwitcher select{padding:0 8px;cursor:pointer}
.airportSwitcher .hint{
    font-size:10px;
    color:#9fcce7;
    letter-spacing:.8px;
    font-weight:800;
}

</style>
</head>

/*

   Other airports use our own Vercel server-side proxy, so the browser

   browser CORS / blocking problems.

const NEARBY_API=
"https://mikeaircraft-9hkn.vercel.app/api/nearby";

async function fetchAircraftData(){

    let url;

    if(AIRPORT.code==="PRG"){
        url=PRG_API+"?t="+Date.now();
    }
    else{
        const params=new URLSearchParams({
            lat:String(AIRPORT.lat),
            lon:String(AIRPORT.lon),
            radius:"20",
            t:String(Date.now())
        });

        url=NEARBY_API+"?"+params.toString();
    }

    const response=await fetch(url,{cache:"no-store"});

    if(!response.ok)
        throw new Error("HTTP "+response.status);

    const data=await response.json();

    if(!Array.isArray(data.ac))
        throw new Error("No aircraft array");

    return data;
}

function unwantedAircraft(ac){

    const type=

    const flight=

    const category=
        (ac.category||"")

    if(
        rejectedCategories.has(
            category
        )
    )
        return true;


    if(
        helicopters.has(type)
    )
        return true;


    if(
        type==="TWR"
        ||
        type==="GND"
        ||
        type==="EMER"
    )
        return true;


    if(
        reg==="TWR"
        ||
        reg==="GND"
        ||
        reg==="EMER"
    )
        return true;


    for(
        const prefix
        of groundCallsignPrefixes
    ){

        if(
            flight.startsWith(prefix)
        )
            return true;
    }


    for(
        const prefix
        of smallAircraftPrefixes
    ){

        if(
            type.startsWith(prefix)
        )
            return true;
    }


    return false;
}

/* =====================================================

function aircraftId(ac){

    return (
        ac.hex
        ||
        ac.r
        ||
        (ac.flight||"").trim()
        ||
        null
    );
}


function onGround(ac){

    return (
        ac.alt_baro==="ground"
        ||
        ac.alt_geom==="ground"
    );
}


function altitude(ac){

    if(onGround(ac))
        return 0;


    let value=
        Number(ac.alt_baro);


    if(!Number.isFinite(value)){

        value=
            Number(ac.alt_geom);
    }


    return Number.isFinite(value)
        ?
        value
        :
        null;
}


function groundSpeed(ac){

    const value=
        Number(ac.gs);


    return Number.isFinite(value)
        ?
        value
        :
        0;
}


function verticalRate(ac){

    let value=
        Number(ac.baro_rate);


    if(!Number.isFinite(value)){

        value=
            Number(ac.geom_rate);
    }


    return Number.isFinite(value)
        ?
        value
        :
        0;
}


function positionAge(ac){

    const value=
        Number(ac.seen_pos);


    return Number.isFinite(value)
        ?
        value
        :
        999;
}


function freshPosition(ac){

    return (
        positionAge(ac)<=5
    );
}


/* =====================================================
   DISTANCE
===================================================== */

function distanceKm(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371;


    const dLat=
        (lat2-lat1)
        *
        Math.PI/180;


    const dLon=
        (lon2-lon1)
        *
        Math.PI/180;


    const a=

        Math.sin(dLat/2)**2

        +

        Math.cos(
            lat1*Math.PI/180
        )

        *

        Math.cos(
            lat2*Math.PI/180
        )

        *

        Math.sin(dLon/2)**2;


    return R*2*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}


function airportDistance(ac){

    const lat=
        Number(ac.lat);


    const lon=
        Number(ac.lon);


    if(
        !Number.isFinite(lat)
        ||
        !Number.isFinite(lon)
    )
        return 999;


    return distanceKm(
        lat,
        lon,
        AIRPORT.lat,
        AIRPORT.lon
    );
}


/* =====================================================
   RUNWAY GEOMETRY
===================================================== */

function distanceToRunway(
    lat,
    lon,
    runway
){

    const ref=
        (
            lat+
            runway.a.lat+
            runway.b.lat
        )/3;


    const ky=
        111.32;


    const kx=
        111.32*
        Math.cos(
            ref*
            Math.PI/180
        );


    const px=lon*kx;
    const py=lat*ky;

    const ax=runway.a.lon*kx;
    const ay=runway.a.lat*ky;

    const bx=runway.b.lon*kx;
    const by=runway.b.lat*ky;

    const vx=bx-ax;
    const vy=by-ay;

    const wx=px-ax;
    const wy=py-ay;

    const lengthSquared=
        vx*vx+
        vy*vy;


    let t=
        (
            wx*vx+
            wy*vy
        )
        /
        lengthSquared;


    t=
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const cx=
        ax+t*vx;


    const cy=
        ay+t*vy;


    return Math.sqrt(
        (px-cx)**2+
        (py-cy)**2
    );
}


function runwayDistance(ac){

    const lat=
        Number(ac.lat);


    const lon=
        Number(ac.lon);


    if(
        !Number.isFinite(lat)
        ||
        !Number.isFinite(lon)
    )
        return 999;


    return Math.min(
        ...runways.map(
            runway=>
            distanceToRunway(
                lat,
                lon,
                runway
            )
        )
    );
}


function nearRunway(
    ac,
    limit=.22
){

    return (
        runwayDistance(ac)
        <=
        limit
    );
}


function nearestThreshold(ac){

    const lat=
        Number(ac.lat);


    const lon=
        Number(ac.lon);


    if(
        !Number.isFinite(lat)
        ||
        !Number.isFinite(lon)
    )
        return null;


    let best=null;

    let bestDistance=999;


    for(
        const end
        of runwayEnds
    ){

        const d=
            distanceKm(
                lat,
                lon,
                end.lat,
                end.lon
            );


        if(
            d<
            bestDistance
        ){

            bestDistance=d;

            best=end;
        }
    }


    return {

        runway:best,

        distance:
            bestDistance

    };
}


/* =====================================================
   AIRCRAFT MEMORY
===================================================== */

function getMemory(id){

    if(
        !memory.has(id)
    ){

        memory.set(
            id,
            {
                samples:[],
                arrivalCandidate:false,
                arrivalLastSeen:0,
                wasNearRunwayGround:false,
                lastNearRunwayGround:0,
                lastSeen:Date.now()
            }
        );
    }


    return memory.get(id);
}


function addSample(ac){

    const id=
        aircraftId(ac);


    if(!id)
        return;


    const memoryItem=
        getMemory(id);


    const threshold=
        nearestThreshold(ac);


    const sample={

        time:
            Date.now(),

        ground:
            onGround(ac),

        speed:
            groundSpeed(ac),

        altitude:
            altitude(ac),

        vertical:
            verticalRate(ac),

        positionAge:
            positionAge(ac),

        airportDistance:
            airportDistance(ac),

        thresholdDistance:
            threshold
            ?
            threshold.distance
            :
            999,

        nearRunway:
            nearRunway(ac)

    };


    memoryItem.samples.push(
        sample
    );


    memoryItem.samples=
        memoryItem.samples
        .filter(
            item=>
            item.time
            >=
            Date.now()-180000
        );


    memoryItem.lastSeen=
        Date.now();


    if(
        sample.ground
        &&
        sample.nearRunway
        &&
        sample.positionAge<=8
    ){

        memoryItem
        .wasNearRunwayGround=
            true;


        memoryItem
        .lastNearRunwayGround=
            Date.now();
    }
}


/* =====================================================
   ARRIVAL MEMORY
===================================================== */

function updateArrivalMemory(ac){

    if(onGround(ac))
        return;


    const id=
        aircraftId(ac);


    if(!id)
        return;


    const memoryItem=
        getMemory(id);


    const samples=
        memoryItem.samples;


    if(samples.length<2)
        return;


    const latest=
        samples[
            samples.length-1
        ];


    if(
        latest.vertical>900
        ||
        latest.airportDistance>20
    )
        return;


    if(
        !(
            latest.vertical<200

            ||

            (
                latest.altitude!==null
                &&
                latest.altitude<5000
            )
        )
    )
        return;


    const recent=
        samples
        .filter(
            item=>
            !item.ground
            &&
            item.positionAge<=5
        )
        .slice(-6);


    if(recent.length<2)
        return;


    let closing=0;

    let descending=0;


    for(
        let i=1;
        i<recent.length;
        i++
    ){

        if(
            recent[i]
            .airportDistance
            <
            recent[i-1]
            .airportDistance
            +
            .10
        )
            closing++;


        if(
            recent[i].altitude!==null
            &&
            recent[i-1].altitude!==null
            &&
            recent[i].altitude
            <=
            recent[i-1].altitude+75
        )
            descending++;
    }


    if(
        closing>=1
        &&
        descending>=1
    ){

        memoryItem
        .arrivalCandidate=
            true;


        memoryItem
        .arrivalLastSeen=
            Date.now();
    }


    if(
        memoryItem.arrivalCandidate
        &&
        latest.airportDistance<=8
    ){

        memoryItem
        .arrivalLastSeen=
            Date.now();
    }
}


/* =====================================================
   NEXT ARRIVAL

   Within 12 km
   Below 4500 ft
   Fresh position
   Closing on airport
   Not strongly climbing
===================================================== */

function expectedArrival(ac){

    if(
        onGround(ac)
        ||
        !freshPosition(ac)
    )
        return null;


    const alt=
        altitude(ac);


    const distance=
        airportDistance(ac);


    const id=
        aircraftId(ac);


    if(!id)
        return null;


    const memoryItem=
        getMemory(id);


    const samples=
        memoryItem.samples;


    if(
        alt===null
        ||
        alt>4500
        ||
        distance>12
        ||
        verticalRate(ac)>500
        ||
        samples.length<2
    )
        return null;


    const recent=
        samples.slice(-4);


    let closer=0;


    for(
        let i=1;
        i<recent.length;
        i++
    ){

        if(
            recent[i]
            .airportDistance
            <
            recent[i-1]
            .airportDistance
            +
            .08
        )
            closer++;
    }


    if(closer<1)
        return null;


    return {

        ac,

        distance,

        score:
            distance+
            (alt/4500)*2

    };
}

function expectedDeparture(ac){

/* =====================================================
   TOUCHDOWN
===================================================== */

function detectTouchdown(
    aircraft
){

    for(
        const ac
        of aircraft
    ){

        const id=
            aircraftId(ac);


        if(
            !id
            ||
            !onGround(ac)
        )
            continue;


        const memoryItem=
            getMemory(id);


        if(
            memoryItem.arrivalCandidate
            &&
            positionAge(ac)<=15
            &&
            nearRunway(ac)
        )
            return ac;
    }


    return null;
}


/* =====================================================
   TAKEOFF ROLL
===================================================== */

function departureRoll(ac){

    const id=
        aircraftId(ac);


    if(
        !id
        ||
        !onGround(ac)
        ||
        landedBlacklist.has(id)
        ||
        !freshPosition(ac)
        ||
        !nearRunway(ac)
    )
        return false;


    const groundSamples=
        getMemory(id)
        .samples
        .filter(
            item=>
            item.ground
            &&
            item.positionAge<=5
            &&
            item.nearRunway
        )
        .slice(-8);


    if(
        groundSamples.length<2
    )
        return false;


    const latest=
        groundSamples[
            groundSamples.length-1
        ];


    if(
        latest.speed>=40
    )
        return true;


    const gain=
        latest.speed-
        groundSamples[0].speed;


    let increases=0;


    for(
        let i=1;
        i<groundSamples.length;
        i++
    ){

        if(
            groundSamples[i].speed
            >
            groundSamples[i-1].speed+1
        )
            increases++;
    }


    return (
        latest.speed>=22
        &&
        gain>=8
        &&
        increases>=2
    );
}


/* =====================================================
   AIRBORNE DEPARTURE FALLBACK
===================================================== */

function airborneDeparture(ac){

    if(onGround(ac))
        return false;


    const id=
        aircraftId(ac);


    if(
        !id
        ||
        landedBlacklist.has(id)
    )
        return false;


    const memoryItem=
        getMemory(id);


    const alt=
        altitude(ac);


    const distance=
        airportDistance(ac);


    if(
        alt===null
        ||
        alt>4500
        ||
        distance>8
        ||
        verticalRate(ac)<500
    )
        return false;


    if(
        memoryItem
        .wasNearRunwayGround
        &&
        Date.now()
        -
        memoryItem
        .lastNearRunwayGround
        <
        120000
    )
        return true;


    return (
        memoryItem.samples
        .slice(-12)
        .some(
            sample=>
            sample.ground
            &&
            Date.now()-sample.time
            <
            120000
        )
    );
}


/* =====================================================
   FINAL ARRIVAL
===================================================== */

function finalArrival(ac){

    if(onGround(ac))
        return null;


    const id=
        aircraftId(ac);


    if(!id)
        return null;


    if(
        !getMemory(id)
        .arrivalCandidate
    )
        return null;


    const threshold=
        nearestThreshold(ac);


    if(
        !threshold
        ||
        threshold.distance>3
        ||
        verticalRate(ac)>900
    )
        return null;


    return {

        ac,

        distance:
            threshold.distance

    };
}

        (ac.flight||"")
        .trim()
        .toUpperCase();


    return flight.length>=3
        ?
        flight.slice(0,3)
        :
        "";
}


function airlineName(ac){

    return (
        airlines[
            airlinePrefix(ac)
        ]
        ||
        ""
    );
}


function callsign(ac){

    return (
        (ac.flight||"").trim()
        ||
        ac.r
        ||
        "AIRCRAFT"
    );
}


function aircraftTitle(ac){

    const company=
        airlineName(ac);


    return company
        ?
        company+
        " • "+
        callsign(ac)
        :
        callsign(ac);
}


function aircraftDetail(ac){

    return [

        ac.desc||ac.t||"",

        ac.r||""

    ]
    .filter(Boolean)
    .join(" • ");
}


function liveAircraftDetail(ac){

    const parts=[];


    if(
        ac.desc
        ||
        ac.t
    ){

        parts.push(
            ac.desc||ac.t
        );
    }


    if(ac.r){

        parts.push(
            ac.r
        );
    }


    const alt=
        altitude(ac);


    if(
        alt!==null
        &&
        !onGround(ac)
    ){

        parts.push(
            Math.round(alt)
            +
            " FT"
        );
    }


    if(
        groundSpeed(ac)>0
    ){

        parts.push(
            Math.round(
                groundSpeed(ac)
            )
            +
            " KT"
        );
    }


    return parts.join(
        " • "
    );
}


/* =====================================================
   OPTIONAL ROUTE / DESTINATION LOOKUP

   Cached by callsign. Failure simply leaves route blank.
===================================================== */

function routeCallsign(ac){

    return (ac.flight||"")
        .trim()
        .toUpperCase();
}


function airportCode(value){

    if(!value)
        return "";

    if(typeof value==="string")
        return value.trim().toUpperCase();

    if(typeof value==="object"){

        return (
            value.iata
            || value.iata_code
            || value.icao
            || value.icao_code
            || value.code
            || value.ident
            || ""
        ).toString().trim().toUpperCase();
    }

    return "";
}


function parseRouteRow(data,callsign){

    let rows=[];

    if(Array.isArray(data))
        rows=data;
    else if(data && Array.isArray(data.routes))
        rows=data.routes;
    else if(data && Array.isArray(data.planes))
        rows=data.planes;
    else if(data && typeof data==="object")
        rows=[data];

    let row=
        rows.find(item=>{
            if(!item || typeof item!=="object")
                return false;

            const cs=(
                item.callsign
                || item.flight
                || item.call
                || ""
            ).toString().trim().toUpperCase();

            return !cs || cs===callsign;
        })
        || rows[0]
        || null;

    if(!row)
        return null;

    if(Array.isArray(row)){

        const codes=row
            .filter(value=>typeof value==="string")
            .map(value=>value.trim().toUpperCase())
            .filter(value=>/^[A-Z]{3,4}$/.test(value));

        if(codes.length>=2)
            return {from:codes[codes.length-2],to:codes[codes.length-1]};

        return null;
    }

    const from=airportCode(
        row.from
        || row.origin
        || row.orig
        || row.departure
        || row.departure_airport
        || row.airport_from
    );

    const to=airportCode(
        row.to
        || row.destination
        || row.dest
        || row.arrival
        || row.arrival_airport
        || row.airport_to
    );

    if(from || to)
        return {from,to};

    const route=(row.route||row.airports||"").toString().toUpperCase();
    const codes=route.match(/\b[A-Z]{3,4}\b/g)||[];

    if(codes.length>=2)
        return {from:codes[0],to:codes[codes.length-1]};

    return null;
}


async function ensureRoute(ac){

    const cs=routeCallsign(ac);

    if(!cs)
        return null;

    const cached=routeCache.get(cs);

    if(cached && Date.now()-cached.time<6*60*60*1000)
        return cached.route;

    /* Mark as pending immediately so the 3-second engine
       cannot hammer the route service. */
    routeCache.set(cs,{time:Date.now(),route:null,pending:true});

    try{

        const response=await fetch(
            ROUTE_API,
            {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({
                    planes:[{
                        callsign:cs,
                        lat:Number(ac.lat),
                        lng:Number(ac.lon)
                    }]
                })
            }
        );

        if(!response.ok)
            throw new Error("Route HTTP "+response.status);

        const data=await response.json();
        const route=parseRouteRow(data,cs);

        routeCache.set(cs,{time:Date.now(),route,pending:false});
        return route;
    }
    catch(error){

        console.warn("Route lookup unavailable",cs,error);
        routeCache.set(cs,{time:Date.now(),route:null,pending:false});
        return null;
    }
}


function cachedRoute(ac){

    const item=routeCache.get(routeCallsign(ac));
    return item ? item.route : null;
}


function routeLabel(ac,state){

    const route=cachedRoute(ac);

    if(!route)
        return "";

    if(state==="ARRIVAL" || state==="ARRIVED"){
        if(route.from && route.from!==AIRPORT.code && route.from!==AIRPORT.icao)
            return "FROM • "+route.from;
    }

    if(state==="DEPARTURE" || state==="DEPARTED"){
        if(route.to && route.to!==AIRPORT.code && route.to!==AIRPORT.icao)
            return "DESTINATION • "+route.to;
    }

    return "";
}


/* =====================================================
   AIRCRAFT DIRECTION GRAPHIC
   Presentation only — tracking engine unchanged.
===================================================== */

function routePairLabel(ac,state){

    const route=cachedRoute(ac);

    if(state==="ARRIVAL" || state==="ARRIVED"){
        if(route && route.from && route.from!==AIRPORT.code && route.from!==AIRPORT.icao)
            return route.from+" → "+AIRPORT.code;

        return "→ "+AIRPORT.code;
    }

    if(state==="DEPARTURE" || state==="DEPARTED"){
        if(route && route.to && route.to!==AIRPORT.code && route.to!==AIRPORT.icao)
            return AIRPORT.code+" → "+route.to;

        return AIRPORT.code+" →";
    }

    return AIRPORT.code;
}

function setPlaneGraphic(ac,state){

    const plane=document.getElementById("flightPlane");

    plane.className=
        "flightPlane "+
        (state==="DEPARTURE" ? "departure" : "arrival");
}

/* =====================================================
   BIG ARRIVAL / DEPARTURE POPUP

   Shown once per aircraft for exactly 15 seconds.
   It cannot reopen for the same aircraft.
===================================================== */

function showPopup(
    ac,
    state
){

    const now=Date.now();
    const id=aircraftId(ac);

    if(!id)
        return;

    /* Once this aircraft has had its popup, it cannot
       open the popup again during this movement. */
    if(popupShown.has(id))
        return;

    /* Normally do not interrupt a popup already on screen.
       Exception: a real departure is very short-lived, so let it
       replace an arrival popup rather than missing the takeoff. */
    if(now<popupBusyUntil){
        const departurePreemptsArrival=
            state==="DEPARTURE"
            &&
            popupDirection==="ARRIVAL";

        if(!departurePreemptsArrival)
            return;
    }

    popupShown.set(id,now);

    popupBusyUntil=now+15000;
    popupDirection=state;
    popupAircraft=id;

    const popup=document.getElementById("popup");

    popup.className=
        "popup "+
        (state==="DEPARTURE" ? "departure" : "arrival");

    document.getElementById("popupState").textContent=state;
    document.getElementById("popupFlight").textContent=callsign(ac);
    document.getElementById("popupAirline").textContent=airlineName(ac) || "COMMERCIAL AIRCRAFT";
    document.getElementById("popupDetails").textContent=liveAircraftDetail(ac);

    setPlaneGraphic(ac,state);

    popup.classList.remove("show");
    void popup.offsetWidth;
    popup.classList.add("show");

    clearTimeout(popupTimer);

    popupTimer=setTimeout(()=>{

        popup.classList.remove("show");
        popupDirection=null;
        popupAircraft=null;

    },15000);
}

/* =====================================================
   LATEST MOVEMENT
===================================================== */

function movement(
    ac,
    state
){

    lastMovement={

        state,

        ac,

        time:
            Date.now()

    };
}


/* =====================================================
   CONTINUOUS LIVE TRAFFIC TICKER
   Uses existing engine outputs only. No tracking logic
   is changed. Items remain eligible for 60 seconds.
===================================================== */

function railAllowed(ac,tag){

    const id=aircraftId(ac);

    if(!id)
        return false;

    const key=tag+":"+id;
    const now=Date.now();

    if(!railShown.has(key))
        railShown.set(key,now);

    return now-railShown.get(key)<60000;
}

function railItems(){

    const items=[];

    if(nextArrival && railAllowed(nextArrival.ac,"NEXT ARRIVAL")){
        ensureRoute(nextArrival.ac);
        items.push({
            tag:"NEXT ARRIVAL",
            state:"EXPECTED",
            ac:nextArrival.ac,
            routeState:"ARRIVAL",
            extra:nextArrival.distance.toFixed(1)+" KM"
        });
    }

    if(nextDeparture && railAllowed(nextDeparture.ac,"NEXT DEPARTURE")){
        ensureRoute(nextDeparture.ac);
        items.push({
            tag:"NEXT DEPARTURE",
            state:"EXPECTED",
            ac:nextDeparture.ac,
            routeState:"DEPARTURE",
            extra:Math.round(groundSpeed(nextDeparture.ac))+" KT"
        });
    }

    if(
        lastMovement
        && Date.now()-lastMovement.time<60000
        && railAllowed(lastMovement.ac,lastMovement.state)
    ){
        ensureRoute(lastMovement.ac);
        items.push({
            tag:"LATEST",
            state:lastMovement.state,
            ac:lastMovement.ac,
            routeState:lastMovement.state,
            done:true
        });
    }

    return items;
}

function tickerItemHTML(item){

    if(!item || !item.ac)
        return "";

    const route=routeLabel(
        item.ac,
        item.routeState||item.state
    );

    const secondary=[];

    if(route)
        secondary.push(route);

    if(item.extra)
        secondary.push(item.extra);

    const detail=aircraftDetail(item.ac);

    return (
        '<span class="tickerItem">'+
        '<span class="tickerState '+(item.done?'done':'')+'">'+
        item.state+
        '</span>'+
        aircraftTitle(item.ac)+
        (detail ? '<span class="tickerSep">•</span>'+detail : '')+
        (secondary.length ? '<span class="tickerSep">•</span><span class="tickerSecondary">'+secondary.join(' • ')+'</span>' : '')+
        '</span>'
    );
}

let lastTickerSignature="";

function renderRail(){

    const track=document.getElementById("railTrack");
    const tag=document.getElementById("railTag");

    if(!track || !tag)
        return;

    const items=railItems();

    tag.textContent="LIVE TRAFFIC";

    let groupHTML="";

    if(items.length){
        groupHTML=items.map(tickerItemHTML).join("");
    }
    else{
        groupHTML=
            '<span class="tickerItem tickerIdle">'+
            AIRPORT.displayName+
            ' • LIVE ADS-B MONITORING'+
            '</span>';
    }

    /* Repeat enough content that the crawl never leaves a blank screen.
       Two identical halves allow a seamless -50% animation loop. */
    const repeated=Array(4).fill(groupHTML).join("");
    const signature=groupHTML;

    if(signature!==lastTickerSignature){
        track.innerHTML=
            '<div class="tickerGroup">'+repeated+'</div>'+ 
            '<div class="tickerGroup" aria-hidden="true">'+repeated+'</div>';

        /* Busy airports naturally create longer strings. Keep the motion
           readable rather than accelerating the text. */
        const chars=Math.max(80,repeated.replace(/<[^>]*>/g,"").length);
        const seconds=Math.min(70,Math.max(28,chars*.12));
        track.style.setProperty("--ticker-duration",seconds+"s");

        /* restart at a clean seam whenever the underlying live data changes */
        track.style.animation="none";
        void track.offsetWidth;
        track.style.animation="tickerFlow var(--ticker-duration,34s) linear infinite";

        lastTickerSignature=signature;
    }
}

setInterval(renderRail,3000);
renderRail();


/* =====================================================
   CLEANUP
===================================================== */

function cleanup(){

    const now=
        Date.now();


    for(
        const [id,expiry]
        of landedBlacklist
    ){

        if(
            now>=expiry
        ){

            landedBlacklist.delete(
                id
            );
        }
    }


    for(
        const [id,memoryItem]
        of memory
    ){

        if(
            memoryItem.arrivalCandidate
            &&
            now-
            memoryItem.arrivalLastSeen
            >
            8*60*1000
        ){

            memoryItem
            .arrivalCandidate=
                false;
        }


        if(
            now-
            memoryItem.lastSeen
            >
            15*60*1000
        ){

            memory.delete(
                id
            );
        }
    }


    for(const [id,time] of popupShown){

        if(now-time>30*60*1000)
            popupShown.delete(id);
    }


    for(const [key,time] of railShown){

        if(now-time>10*60*1000)
            railShown.delete(key);
    }


    for(const [key,item] of routeCache){

        if(now-item.time>6*60*60*1000)
            routeCache.delete(key);
    }


    if(
        lastMovement
        &&
        now-
        lastMovement.time
        >
        60000
    ){

        lastMovement=
            null;
    }
}


/* =====================================================
   MAIN LIVE ENGINE
===================================================== */

async function update(){

    cleanup();


    try{

        const data=
            await fetchAircraftData();


        /* Show total feed count so we know
           immediately that ADS-B is alive */

        document
        .getElementById(
            "chip"
        )
        .textContent=

            "ADS-B • "
            +
            (data.ac||[]).length
            +
            " AIRCRAFT";


        /* Valid positions + commercial filtering */

        const aircraft=
            (data.ac||[])

            .filter(
                ac=>
                Number.isFinite(
                    Number(ac.lat)
                )
                &&
                Number.isFinite(
                    Number(ac.lon)
                )
            )

            .filter(
                ac=>
                !unwantedAircraft(ac)
            );


        /* Update movement history */

        for(
            const ac
            of aircraft
        ){

            addSample(ac);

            updateArrivalMemory(ac);
        }


        /* =============================================
           NEXT ARRIVAL
        ============================================= */

        const expectedArrivals=[];


        for(
            const ac
            of aircraft
        ){

            const candidate=
                expectedArrival(ac);


            if(candidate){

                expectedArrivals.push(
                    candidate
                );
            }
        }


        expectedArrivals.sort(
            (a,b)=>
            a.score-b.score
        );


        nextArrival=
            expectedArrivals[0]
            ||
            null;


        /* =============================================
           NEXT DEPARTURE
        ============================================= */

        const expectedDepartures=[];


        for(
            const ac
            of aircraft
        ){

            const candidate=
                expectedDeparture(ac);


            if(candidate){

                expectedDepartures.push(
                    candidate
                );
            }
        }


        expectedDepartures.sort(
            (a,b)=>
            a.score-b.score
        );


        nextDeparture=
            expectedDepartures[0]
            ||
            null;


        /* =============================================
           TOUCHDOWN
        ============================================= */

        const touchdown=
            detectTouchdown(
                aircraft
            );


        if(touchdown){

            const id=
                aircraftId(
                    touchdown
                );


            landedBlacklist.set(
                id,
                Date.now()
                +
                5*60*1000
            );


            getMemory(id)
            .arrivalCandidate=
                false;


            if(
                activeDeparture===id
            ){

                activeDeparture=
                    null;
            }


            movement(
                touchdown,
                "ARRIVED"
            );


            return;
        }


        /* =============================================
           DEPARTURE CONTINUITY FIRST

           Once a departure has been acquired, keep following it
           until 2000 ft. This prevents a nearby arrival from
           stealing focus halfway through the takeoff.
        ============================================= */

        if(activeDeparture){

            const ac=
                aircraft.find(
                    item=>
                    aircraftId(item)
                    ===
                    activeDeparture
                );


            if(ac){

                const alt=
                    altitude(ac);


                if(
                    !onGround(ac)
                ){

                    movement(
                        ac,
                        "DEPARTED"
                    );


                    showPopup(
                        ac,
                        "DEPARTURE"
                    );


                    if(
                        alt!==null
                        &&
                        alt>=2000
                    ){

                        activeDeparture=
                            null;
                    }

                    else{

                        return;
                    }

                }

                else{

                    /* Aircraft is still on the runway/takeoff roll.
                       Keep ownership of it instead of allowing an
                       arrival to take over the camera event. */
                    return;
                }

            }

            else{

                activeDeparture=
                    null;
            }
        }


        /* =============================================
           TAKEOFF ROLL

           A takeoff roll is a short event, so it is checked before
           final arrivals. This removes the old arrival-first bias.
        ============================================= */

        let bestDeparture=
            null;


        for(
            const ac
            of aircraft
        ){

            if(
                !departureRoll(ac)
            )
                continue;


            const score=
                groundSpeed(ac);


            if(
                !bestDeparture
                ||
                score>
                bestDeparture.score
            ){

                bestDeparture={

                    ac,

                    id:
                        aircraftId(ac),

                    score

                };
            }
        }


        if(bestDeparture){

            activeDeparture=
                bestDeparture.id;


            showPopup(
                bestDeparture.ac,
                "DEPARTURE"
            );


            return;
        }


        /* =============================================
           AIRBORNE DEPARTURE FALLBACK

           Catch an aircraft that became airborne between ADS-B
           updates. This also runs before final-arrival selection.
        ============================================= */

        let airborne=
            null;


        for(
            const ac
            of aircraft
        ){

            if(
                !airborneDeparture(ac)
            )
                continue;


            const score=

                verticalRate(ac)*2

                -

                (
                    altitude(ac)
                    ||
                    0
                );


            if(
                !airborne
                ||
                score>
                airborne.score
            ){

                airborne={

                    ac,

                    id:
                        aircraftId(ac),

                    score

                };
            }
        }


        if(airborne){

            activeDeparture=
                airborne.id;


            movement(
                airborne.ac,
                "DEPARTED"
            );


            showPopup(
                airborne.ac,
                "DEPARTURE"
            );


            return;
        }


        /* =============================================
           FINAL ARRIVAL

           Arrivals still work exactly as before, but no longer get
           automatic first refusal over a genuine departure.
        ============================================= */

        const finals=[];


        for(
            const ac
            of aircraft
        ){

            const candidate=
                finalArrival(ac);


            if(candidate){

                finals.push(
                    candidate
                );
            }
        }


        finals.sort(
            (a,b)=>
            a.distance-b.distance
        );


        if(finals.length){

            showPopup(
                finals[0].ac,
                "ARRIVAL"
            );


            if(
                finals[0]
                .distance
                <=
                1.5
            ){

                return;
            }
        }

    }

    catch(error){

        console.error(
            error
        );


        document
        .getElementById(
            "chip"
        )
        .textContent=
            "TRACKING ERROR";
    }
}


/* =====================================================
   START
===================================================== */

update();


setInterval(
    update,
    3000
);

</script>
