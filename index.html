<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.ribbon {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 105px;
    background: rgb(0, 55, 110);
    color: white;
    display: flex;
    align-items: center;
    box-sizing: border-box;
}

.airport {
    width: 23%;
    padding-left: 25px;
    font-size: 22px;
    font-weight: bold;
    box-sizing: border-box;
}

.live {
    color: #ff3333;
    font-size: 16px;
    margin-bottom: 5px;
}

.aircraft-info {
    width: 52%;
    padding-left: 25px;
    border-left: 2px solid rgba(255,255,255,0.25);
    box-sizing: border-box;
}

.airline {
    font-size: 25px;
    font-weight: bold;
}

.details {
    font-size: 19px;
    margin-top: 6px;
    opacity: 0.9;
}

.status {
    font-size: 16px;
    margin-top: 5px;
    color: #8fd3ff;
}

/* ============================
   LIVE AIRCRAFT APPROACH GRAPHIC
   ============================ */

.approach-box {
    position: relative;
    width: 25%;
    height: 105px;
    overflow: hidden;
}

/* Larger side-view aircraft */

.plane {
    position: absolute;
    width: 76px;
    height: 36px;
    left: 10%;
    top: 10px;

    transition:
        left 4.5s linear,
        top 4.5s linear,
        transform 0.8s ease;

    transform-origin: center center;

    filter:
        drop-shadow(0 2px 2px rgba(0,0,0,0.35));
}

.plane svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
}

.plane-shape {
    fill: white;
}

/* Mirror the aircraft for opposite runway direction */

.plane.reverse svg {
    transform: scaleX(-1);
}

/* Runway hidden until touchdown */

.runway {
    position: absolute;
    bottom: 17px;
    left: 18%;
    width: 64%;
    height: 5px;

    background: rgba(255,255,255,0.9);

    opacity: 0;

    transition: opacity 0.8s ease;
}

.runway::before,
.runway::after {
    content: "";
    position: absolute;
    top: -4px;
    width: 3px;
    height: 13px;
    background: white;
}

.runway::before {
    left: 0;
}

.runway::after {
    right: 0;
}

.runway.visible {
    opacity: 1;
}

.runway-label {
    position: absolute;
    bottom: 1px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
}
</style>
</head>

<body>

<div class="ribbon">

    <div class="airport">
        <div class="live">● LIVE</div>
        PRAGUE AIRPORT
        <div>LKPR / PRG</div>
    </div>

    <div class="aircraft-info">
        <div class="airline">LOADING AIRCRAFT...</div>
        <div class="details">WAITING FOR LIVE DATA</div>
        <div class="status">CONNECTING...</div>
    </div>

    <div class="approach-box">

        <div id="plane" class="plane">

            <!--
                Simple side-view aircraft silhouette.
                It points RIGHT by default.
            -->

            <svg viewBox="0 0 160 70"
                 xmlns="http://www.w3.org/2000/svg">

                <!-- fuselage -->
                <path class="plane-shape"
                    d="
                    M8 34
                    C20 29 43 27 92 27
                    L124 26
                    L145 17
                    L153 19
                    L138 31
                    C148 32 154 35 156 38
                    C152 41 145 42 135 42
                    L96 42
                    L60 58
                    L49 58
                    L66 42
                    L31 41
                    L18 49
                    L10 49
                    L16 40
                    C11 39 8 37 8 34
                    Z
                    " />

                <!-- tail -->
                <path class="plane-shape"
                    d="
                    M24 30
                    L15 12
                    L23 12
                    L41 29
                    Z
                    " />

            </svg>
        </div>

        <div id="runway" class="runway"></div>

        <div id="runwayLabel"
             class="runway-label"></div>

    </div>

</div>

<script>
const airportLat = 50.1008;
const airportLon = 14.2600;

const previousDistances = new Map();

let currentAircraftId = null;

/*
   PRAGUE RUNWAY THRESHOLDS
*/

const runways = [
    {
        runway: "06",
        heading: 60,
        lat: 50.101836,
        lon: 14.226300
    },
    {
        runway: "24",
        heading: 240,
        lat: 50.115950,
        lon: 14.273367
    },
    {
        runway: "12",
        heading: 122,
        lat: 50.108011,
        lon: 14.245367
    },
    {
        runway: "30",
        heading: 302,
        lat: 50.090467,
        lon: 14.281672
    }
];

function distanceKm(lat1, lon1, lat2, lon2) {

    const R = 6371;

    const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

    const dLon =
        (lon2 - lon1) *
        Math.PI / 180;

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(
            lat1 * Math.PI / 180
        ) *

        Math.cos(
            lat2 * Math.PI / 180
        ) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    return R * 2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );
}

function bearingTo(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const phi1 =
        lat1 * Math.PI / 180;

    const phi2 =
        lat2 * Math.PI / 180;

    const deltaLon =
        (lon2 - lon1) *
        Math.PI / 180;

    const y =
        Math.sin(deltaLon) *
        Math.cos(phi2);

    const x =
        Math.cos(phi1) *
        Math.sin(phi2) -

        Math.sin(phi1) *
        Math.cos(phi2) *
        Math.cos(deltaLon);

    let bearing =
        Math.atan2(y, x) *
        180 / Math.PI;

    return (
        bearing + 360
    ) % 360;
}

function headingDifference(a, b) {

    let difference =
        Math.abs(a - b);

    if (difference > 180) {
        difference =
            360 - difference;
    }

    return difference;
}

function aircraftId(ac) {

    return (
        ac.hex ||
        ac.r ||
        ac.flight ||
        null
    );
}

function numericAltitude(ac) {

    if (
        ac.alt_baro === "ground" ||
        ac.alt_baro === null ||
        ac.alt_baro === undefined
    ) {
        return null;
    }

    const value =
        Number(ac.alt_baro);

    return Number.isFinite(value)
        ? value
        : null;
}

function closestRunway(track) {

    let best = null;
    let bestDifference = 999;

    runways.forEach(rwy => {

        const difference =
            headingDifference(
                track,
                rwy.heading
            );

        if (
            difference <
            bestDifference
        ) {
            bestDifference =
                difference;

            best =
                rwy;
        }
    });

    return {
        runway: best,
        difference:
            bestDifference
    };
}

function scoreAircraft(ac) {

    let score = 0;

    const id =
        aircraftId(ac);

    const lat =
        Number(ac.lat);

    const lon =
        Number(ac.lon);

    const airportDistance =
        distanceKm(
            lat,
            lon,
            airportLat,
            airportLon
        );

    const altitude =
        numericAltitude(ac);

    const verticalRate =
        Number(ac.baro_rate);

    const track =
        Number(ac.track);

    const previousDistance =
        id
            ? previousDistances.get(id)
            : undefined;

    /*
       IGNORE DISTANT AIRCRAFT
    */

    if (
        airportDistance > 15
    ) {
        return -9999;
    }

    /*
       AIRCRAFT POINTING
       TOWARD PRAGUE
    */

    if (
        Number.isFinite(track)
    ) {

        const airportBearing =
            bearingTo(
                lat,
                lon,
                airportLat,
                airportLon
            );

        const towardDifference =
            headingDifference(
                track,
                airportBearing
            );

        if (
            towardDifference < 20
        ) {
            score += 180;
        }

        else if (
            towardDifference < 35
        ) {
            score += 120;
        }

        else if (
            towardDifference < 50
        ) {
            score += 50;
        }

        else {
            score -= 180;
        }

        /*
           RUNWAY ALIGNMENT
        */

        const runwayMatch =
            closestRunway(track);

        if (
            runwayMatch.difference < 15
        ) {
            score += 130;
        }

        else if (
            runwayMatch.difference < 30
        ) {
            score += 70;
        }

        else if (
            runwayMatch.difference > 50
        ) {
            score -= 60;
        }
    }

    /*
       MOVEMENT TOWARD AIRPORT
    */

    if (
        previousDistance !== undefined
    ) {

        const change =
            previousDistance -
            airportDistance;

        if (
            change > 0.15
        ) {
            score += 180;
        }

        else if (
            change > 0.03
        ) {
            score += 100;
        }

        else if (
            change < -0.15
        ) {
            score -= 220;
        }

        else if (
            change < -0.03
        ) {
            score -= 120;
        }
    }

    /*
       DISTANCE
    */

    if (
        airportDistance < 3
    ) {
        score += 80;
    }

    else if (
        airportDistance < 6
    ) {
        score += 60;
    }

    else if (
        airportDistance < 10
    ) {
        score += 35;
    }

    else {
        score += 10;
    }

    /*
       ALTITUDE
    */

    if (
        altitude !== null
    ) {

        if (
            altitude < 1500
        ) {
            score += 70;
        }

        else if (
            altitude < 3000
        ) {
            score += 50;
        }

        else if (
            altitude < 5000
        ) {
            score += 20;
        }

        else if (
            altitude > 7000
        ) {
            score -= 100;
        }
    }

    /*
       DESCENT / CLIMB
    */

    if (
        Number.isFinite(
            verticalRate
        )
    ) {

        if (
            verticalRate < -500
        ) {
            score += 80;
        }

        else if (
            verticalRate < -100
        ) {
            score += 50;
        }

        else if (
            verticalRate > 700
        ) {
            score -= 140;
        }

        else if (
            verticalRate > 250
        ) {
            score -= 80;
        }
    }

    if (ac.flight) score += 15;
    if (ac.r) score += 10;
    if (ac.t) score += 10;

    /*
       PREVENT CONSTANT
       AIRCRAFT SWITCHING
    */

    if (
        id &&
        id ===
        currentAircraftId
    ) {
        score += 35;
    }

    return score;
}

/*
   SIDE-VIEW AIRCRAFT GRAPHIC
*/

function updateApproachGraphic(
    runway,
    distance,
    landed
) {

    const plane =
        document.getElementById(
            "plane"
        );

    const runwayGraphic =
        document.getElementById(
            "runway"
        );

    const runwayLabel =
        document.getElementById(
            "runwayLabel"
        );

    /*
       NO SELECTED RUNWAY
    */

    if (!runway) {

        plane.style.display =
            "none";

        runwayGraphic.classList
            .remove("visible");

        runwayLabel.textContent =
            "";

        return;
    }

    plane.style.display =
        "block";

    runwayLabel.textContent =
        "RWY " +
        runway.runway;

    /*
       06 / 12:
       LEFT → RIGHT

       24 / 30:
       RIGHT → LEFT
    */

    const leftToRight =
        runway.runway === "06" ||
        runway.runway === "12";

    if (leftToRight) {

        plane.classList
            .remove("reverse");
    }

    else {

        plane.classList
            .add("reverse");
    }

    /*
       15 km = start
       0 km = touchdown
    */

    const maxDistance =
        15;

    const clamped =
        Math.max(
            0,
            Math.min(
                maxDistance,
                distance
            )
        );

    const progress =
        1 -
        (
            clamped /
            maxDistance
        );

    /*
       HORIZONTAL POSITION
    */

    let x;

    if (leftToRight) {

        x =
            4 +
            progress * 58;
    }

    else {

        x =
            68 -
            progress * 58;
    }

    /*
       VERTICAL DESCENT

       Far away:
       high in ribbon

       Close:
       lower toward runway
    */

    let y =
        4 +
        progress * 48;

    /*
       Nose-down angle
    */

    if (!landed) {

        if (leftToRight) {

            plane.style.transform =
                "rotate(7deg)";
        }

        else {

            plane.style.transform =
                "rotate(-7deg)";
        }
    }

    /*
       TOUCHDOWN
    */

    if (landed) {

        y = 49;

        plane.style.transform =
            "rotate(0deg)";

        runwayGraphic.classList
            .add("visible");
    }

    else {

        runwayGraphic.classList
            .remove("visible");
    }

    plane.style.left =
        x + "%";

    plane.style.top =
        y + "px";
}

async function updateAircraft() {

    const airline =
        document.querySelector(
            ".airline"
        );

    const details =
        document.querySelector(
            ".details"
        );

    const status =
        document.querySelector(
            ".status"
        );

    try {

        const response =
            await fetch(
                "https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft"
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }

        const wrapper =
            await response.json();

        const data =
            wrapper.upstreamText
                ? JSON.parse(
                    wrapper.upstreamText
                )
                : wrapper;

        if (
            !data.ac ||
            data.ac.length === 0
        ) {

            airline.textContent =
                "NO AIRCRAFT NEARBY";

            details.textContent =
                "";

            status.textContent =
                "WAITING FOR TRAFFIC";

            updateApproachGraphic(
                null,
                0,
                false
            );

            return;
        }

        const candidates =
            data.ac.filter(ac => {

                const lat =
                    Number(ac.lat);

                const lon =
                    Number(ac.lon);

                if (
                    !Number.isFinite(lat) ||
                    !Number.isFinite(lon)
                ) {
                    return false;
                }

                const distance =
                    distanceKm(
                        lat,
                        lon,
                        airportLat,
                        airportLon
                    );

                return (
                    distance <= 15 &&
                    (
                        ac.flight ||
                        ac.r ||
                        ac.t
                    )
                );
            });

        if (
            candidates.length === 0
        ) {

            airline.textContent =
                "NO PRAGUE ARRIVAL";

            details.textContent =
                "";

            status.textContent =
                "WAITING FOR NEXT ARRIVAL";

            currentAircraftId =
                null;

            updateApproachGraphic(
                null,
                0,
                false
            );

            return;
        }

        candidates.sort(
            (a, b) =>
                scoreAircraft(b) -
                scoreAircraft(a)
        );

        const aircraft =
            candidates[0];

        const aircraftScore =
            scoreAircraft(
                aircraft
            );

        if (
            aircraftScore < 100
        ) {

            airline.textContent =
                "NO PRAGUE ARRIVAL";

            details.textContent =
                "";

            status.textContent =
                "WAITING FOR NEXT ARRIVAL";

            currentAircraftId =
                null;

            candidates.forEach(ac => {

                const id =
                    aircraftId(ac);

                if (!id) return;

                previousDistances.set(
                    id,
                    distanceKm(
                        Number(ac.lat),
                        Number(ac.lon),
                        airportLat,
                        airportLon
                    )
                );
            });

            updateApproachGraphic(
                null,
                0,
                false
            );

            return;
        }

        currentAircraftId =
            aircraftId(
                aircraft
            );

        candidates.forEach(ac => {

            const id =
                aircraftId(ac);

            if (!id) return;

            previousDistances.set(
                id,
                distanceKm(
                    Number(ac.lat),
                    Number(ac.lon),
                    airportLat,
                    airportLon
                )
            );
        });

        const callsign =
            aircraft.flight &&
            aircraft.flight.trim()

                ? aircraft.flight.trim()

                : "UNKNOWN FLIGHT";

        const registration =
            aircraft.r ||
            "REG UNKNOWN";

        const type =
            aircraft.t ||
            "TYPE UNKNOWN";

        const track =
            Number(
                aircraft.track
            );

        const altitude =
            numericAltitude(
                aircraft
            );

        let selectedRunway =
            null;

        if (
            Number.isFinite(track)
        ) {

            const match =
                closestRunway(
                    track
                );

            if (
                match.difference <= 35
            ) {

                selectedRunway =
                    match.runway;
            }
        }

        /*
           DISTANCE TO AIRPORT
           FALLBACK
        */

        let displayDistance =
            distanceKm(
                Number(
                    aircraft.lat
                ),
                Number(
                    aircraft.lon
                ),
                airportLat,
                airportLon
            );

        /*
           DISTANCE TO ACTUAL
           RUNWAY THRESHOLD
        */

        if (
            selectedRunway
        ) {

            displayDistance =
                distanceKm(
                    Number(
                        aircraft.lat
                    ),
                    Number(
                        aircraft.lon
                    ),
                    selectedRunway.lat,
                    selectedRunway.lon
                );
        }

        /*
           LANDED DETECTION
        */

        const onGround =
            aircraft.alt_baro ===
            "ground";

        const reachedRunway =
            selectedRunway &&
            displayDistance <= 0.6;

        const landed =
            onGround ||
            reachedRunway;

        let arrivalStatus =
            "INBOUND";

        if (
            displayDistance <= 8
        ) {

            arrivalStatus =
                "APPROACHING";
        }

        if (
            displayDistance <= 4 &&
            (
                altitude === null ||
                altitude < 2500
            )
        ) {

            arrivalStatus =
                "ON FINAL";
        }

        if (landed) {

            arrivalStatus =
                "LANDED";
        }

        airline.textContent =
            callsign;

        details.textContent =
            type +
            "  •  " +
            registration;

        if (
            arrivalStatus ===
            "LANDED"
        ) {

            status.textContent =
                "LANDED  •  PRAGUE";
        }

        else {

            status.textContent =
                arrivalStatus +

                (
                    selectedRunway
                        ? " RWY " +
                          selectedRunway.runway
                        : ""
                ) +

                "  •  " +

                displayDistance
                    .toFixed(1) +

                " KM";
        }

        updateApproachGraphic(
            selectedRunway,
            displayDistance,
            landed
        );
    }

    catch (error) {

        airline.textContent =
            "AIRCRAFT DATA";

        details.textContent =
            "CONNECTION ERROR";

        status.textContent =
            "RETRYING...";

        updateApproachGraphic(
            null,
            0,
            false
        );

        console.error(error);
    }
}

updateAircraft();

setInterval(
    updateAircraft,
    5000
);
</script>

</body>
</html>
