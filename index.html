<body>

<div class="ribbon">

    <div class="airport">
        <div class="live">● LIVE</div>
        PRAGUE AIRPORT
        <div>LKPR / PRG</div>
    </div>

    <div class="aircraft-info">
        <div class="airline"></div>
        <div class="details"></div>
        <div class="status"></div>
    </div>

    <div class="visual">
        <div class="visual-main"></div>
        <div class="visual-sub"></div>
    </div>

</div>


<script>

const API =
"https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft";


/* ===============================
   AIRLINES
================================ */

const airlines = {
    TVS:"SMARTWINGS",
    RYR:"RYANAIR",
    UAE:"EMIRATES",
    PGT:"PEGASUS AIRLINES",
    AUA:"AUSTRIAN AIRLINES",
    DLH:"LUFTHANSA",
    KLM:"KLM",
    BAW:"BRITISH AIRWAYS",
    EZY:"EASYJET",
    WZZ:"WIZZ AIR",
    QTR:"QATAR AIRWAYS",
    THY:"TURKISH AIRLINES",
    AFR:"AIR FRANCE",
    SWR:"SWISS",
    LOT:"LOT POLISH AIRLINES",
    SAS:"SAS",
    FIN:"FINNAIR",
    IBE:"IBERIA",
    TAP:"TAP AIR PORTUGAL",
    ITY:"ITA AIRWAYS",
    EIN:"AER LINGUS",
    VLG:"VUELING",
    EWG:"EUROWINGS",
    AEE:"AEGEAN AIRLINES",
    BTI:"AIRBALTIC",
    BEL:"BRUSSELS AIRLINES",
    TRA:"TRANSAVIA",
    EXS:"JET2",
    TUI:"TUI",
    ETD:"ETIHAD AIRWAYS",
    ELY:"EL AL",
    MSR:"EGYPTAIR"
};


/* ===============================
   PRAGUE RUNWAYS

   Every direction has:
   - landing/departure threshold
   - far end of runway
   - heading
================================ */

const runways = [

    {
        name:"06",
        heading:60,

        threshold:{
            lat:50.1018361,
            lon:14.2263000
        },

        farEnd:{
            lat:50.1159500,
            lon:14.2733667
        }
    },

    {
        name:"24",
        heading:240,

        threshold:{
            lat:50.1159500,
            lon:14.2733667
        },

        farEnd:{
            lat:50.1018361,
            lon:14.2263000
        }
    },

    {
        name:"12",
        heading:122,

        threshold:{
            lat:50.1080111,
            lon:14.2453667
        },

        farEnd:{
            lat:50.0904667,
            lon:14.2816722
        }
    },

    {
        name:"30",
        heading:302,

        threshold:{
            lat:50.0904667,
            lon:14.2816722
        },

        farEnd:{
            lat:50.1080111,
            lon:14.2453667
        }
    }

];


/* ===============================
   MEMORY
================================ */

const history = new Map();

/*
   Aircraft positively identified
   as arrivals.
*/

const arrivalMemory = new Map();

/*
   Aircraft that have recently landed
   are forbidden from becoming departures.
*/

const landedBlacklist = new Map();

let departureLock = null;
let landedDisplay = null;


/* ===============================
   BASIC HELPERS
================================ */

function aircraftId(ac){

    return (
        ac.hex ||
        ac.r ||
        (ac.flight || "").trim() ||
        null
    );
}


function onGround(ac){

    return (
        ac.alt_baro === "ground" ||
        ac.alt_geom === "ground"
    );
}


function altitude(ac){

    if(onGround(ac))
        return 0;

    let value =
        Number(ac.alt_baro);

    if(!Number.isFinite(value))
        value =
            Number(ac.alt_geom);

    return Number.isFinite(value)
        ? value
        : null;
}


function speed(ac){

    const value =
        Number(ac.gs);

    return Number.isFinite(value)
        ? value
        : 0;
}


function verticalRate(ac){

    let value =
        Number(ac.baro_rate);

    if(!Number.isFinite(value))
        value =
            Number(ac.geom_rate);

    return Number.isFinite(value)
        ? value
        : 0;
}


function headingDifference(a,b){

    let d =
        Math.abs(a-b);

    if(d>180)
        d=360-d;

    return d;
}


function distanceKm(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371;

    const dLat =
        (lat2-lat1) *
        Math.PI/180;

    const dLon =
        (lon2-lon1) *
        Math.PI/180;

    const a =
        Math.sin(dLat/2)**2 +

        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *

        Math.sin(dLon/2)**2;

    return R*2*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}


/* ===============================
   AIRLINE DISPLAY
================================ */

function airlineName(callsign){

    if(!callsign)
        return "";

    const clean =
        callsign
        .trim()
        .toUpperCase();

    return (
        airlines[
            clean.substring(0,3)
        ] || ""
    );
}


function headline(ac){

    const callsign =
        ac.flight &&
        ac.flight.trim()

        ? ac.flight.trim()

        : "AIRCRAFT";

    const company =
        airlineName(callsign);

    return company

        ? company +
          "  •  " +
          callsign

        : callsign;
}


function aircraftDetails(ac){

    return [
        ac.t || "",
        ac.r || ""
    ]
    .filter(Boolean)
    .join("  •  ");
}


/* ===============================
   SCREEN
================================ */

function show(
    ac,
    status,
    big="",
    small=""
){

    document
    .querySelector(".airline")
    .textContent =
        headline(ac);

    document
    .querySelector(".details")
    .textContent =
        aircraftDetails(ac);

    document
    .querySelector(".status")
    .textContent =
        status;

    document
    .querySelector(".visual-main")
    .textContent =
        big;

    document
    .querySelector(".visual-sub")
    .textContent =
        small;
}


function clear(){

    document
    .querySelector(".airline")
    .textContent="";

    document
    .querySelector(".details")
    .textContent="";

    document
    .querySelector(".status")
    .textContent="";

    document
    .querySelector(".visual-main")
    .textContent="";

    document
    .querySelector(".visual-sub")
    .textContent="";
}


/* ===============================
   RUNWAY GEOMETRY

   Returns:
   along = distance from threshold
           in runway direction

   cross = distance sideways
           from runway centreline

   along < 0 means BEFORE threshold.

   along > 0 means INSIDE runway.
================================ */

function runwayPosition(
    lat,
    lon,
    runway
){

    const refLat =
        (
            lat +
            runway.threshold.lat +
            runway.farEnd.lat
        ) / 3;

    const kmLat =
        111.32;

    const kmLon =
        111.32 *
        Math.cos(
            refLat *
            Math.PI/180
        );


    const px =
        lon*kmLon;

    const py =
        lat*kmLat;


    const ax =
        runway.threshold.lon *
        kmLon;

    const ay =
        runway.threshold.lat *
        kmLat;


    const bx =
        runway.farEnd.lon *
        kmLon;

    const by =
        runway.farEnd.lat *
        kmLat;


    const vx =
        bx-ax;

    const vy =
        by-ay;


    const length =
        Math.sqrt(
            vx*vx +
            vy*vy
        );


    const ux =
        vx/length;

    const uy =
        vy/length;


    const dx =
        px-ax;

    const dy =
        py-ay;


    const along =
        dx*ux +
        dy*uy;


    const cross =
        Math.abs(
            dx*uy -
            dy*ux
        );


    return {
        along,
        cross,
        length
    };
}


/* ===============================
   BEST RUNWAY BY HEADING
================================ */

function bestRunway(track){

    let best=null;
    let difference=999;

    for(
        const runway
        of runways
    ){

        const d =
            headingDifference(
                track,
                runway.heading
            );

        if(d<difference){

            difference=d;
            best=runway;
        }
    }

    return {
        runway:best,
        difference
    };
}


/* ===============================
   ARRIVAL DETECTION
================================ */

function detectArrival(ac){

    if(onGround(ac))
        return null;


    const ident =
        aircraftId(ac);

    if(!ident)
        return null;


    if(
        departureLock === ident
    )
        return null;


    const lat =
        Number(ac.lat);

    const lon =
        Number(ac.lon);

    const track =
        Number(ac.track);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        !Number.isFinite(track)
    )
        return null;


    const alt =
        altitude(ac);


    if(
        alt!==null &&
        alt>7000
    )
        return null;


    if(
        verticalRate(ac)>600
    )
        return null;


    const match =
        bestRunway(track);


    if(
        !match.runway ||
        match.difference>40
    )
        return null;


    const runway =
        match.runway;


    const distance =
        distanceKm(
            lat,
            lon,
            runway.threshold.lat,
            runway.threshold.lon
        );


    if(distance>25)
        return null;


    /*
       Remember convincing arrival
       once within 8 km.
    */

    if(distance<=8){

        arrivalMemory.set(
            ident,
            {
                runway,
                lastSeen:Date.now()
            }
        );
    }


    const old =
        history.get(ident);


    let approaching=false;


    if(
        old &&
        Number.isFinite(
            old.thresholdDistance
        )
    ){

        approaching =
            distance <
            old.thresholdDistance;
    }


    let score =
        1000
        -
        distance*30
        -
        match.difference*5;


    if(approaching)
        score+=600;


    if(verticalRate(ac)<-150)
        score+=300;


    return {
        ac,
        runway,
        distance,
        score
    };
}


/* ===============================
   TRUE TOUCHDOWN

   Important:

   Aircraft must:
   1. already be known as arrival
   2. now report GROUND
   3. physically be AFTER threshold
   4. physically be INSIDE runway

   If ground appears before threshold,
   we DO NOT call it landed.
================================ */

function detectTouchdown(aircraft){

    for(const ac of aircraft){

        const ident =
            aircraftId(ac);


        if(
            !ident ||
            !onGround(ac)
        )
            continue;


        const memory =
            arrivalMemory.get(ident);


        if(!memory)
            continue;


        const runway =
            memory.runway;


        const position =
            runwayPosition(
                Number(ac.lat),
                Number(ac.lon),
                runway
            );


        /*
           Must be physically inside
           runway after threshold.

           cross <= 120 metres
           allows ADS-B error.
        */

        if(
            position.along >= 0 &&
            position.along <=
                position.length + 0.20 &&
            position.cross <= 0.12
        ){

            return {
                ac,
                runway,
                position
            };
        }
    }


    return null;
}


/* ===============================
   DEPARTURE AT THRESHOLD

   This is the big departure change.

   We don't look along the whole runway
   anymore.

   We specifically look around the
   departure threshold zone.

   That's the same physical point
   used for landing in that direction.
================================ */

function detectDepartureAtThreshold(ac){

    const ident =
        aircraftId(ac);


    if(
        !ident ||
        !onGround(ac)
    )
        return null;


    /*
       Recently landed aircraft
       are completely forbidden.
    */

    if(
        landedBlacklist.has(ident)
    )
        return null;


    /*
       Aircraft remembered as an
       approaching arrival is also
       forbidden.
    */

    if(
        arrivalMemory.has(ident)
    )
        return null;


    const lat =
        Number(ac.lat);

    const lon =
        Number(ac.lon);

    const track =
        Number(ac.track);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        !Number.isFinite(track)
    )
        return null;


    let best=null;


    for(
        const runway
        of runways
    ){

        const position =
            runwayPosition(
                lat,
                lon,
                runway
            );


        /*
           Departure threshold zone:

           allow approximately
           150 m before threshold
           to 650 m into runway.
        */

        if(
            position.along < -0.15 ||
            position.along > 0.65
        )
            continue;


        /*
           Must be close to runway
           centreline.
        */

        if(
            position.cross > 0.11
        )
            continue;


        const directionDifference =
            headingDifference(
                track,
                runway.heading
            );


        if(
            directionDifference>18
        )
            continue;


        let score =
            10000

            -
            Math.abs(
                position.along
            )*500

            -
            position.cross*10000

            -
            directionDifference*50

            +
            Math.min(
                speed(ac)*5,
                800
            );


        if(
            !best ||
            score>best.score
        ){

            best={
                ac,
                runway,
                position,
                score
            };
        }
    }


    return best;
}


/* ===============================
   AIRBORNE DEPARTURE BACKUP
================================ */

function detectAirborneDeparture(ac){

    if(onGround(ac))
        return null;


    const ident =
        aircraftId(ac);


    if(!ident)
        return null;


    if(
        landedBlacklist.has(ident) ||
        arrivalMemory.has(ident)
    )
        return null;


    const alt =
        altitude(ac);


    if(
        alt===null ||
        alt>=2500
    )
        return null;


    if(
        verticalRate(ac)<150
    )
        return null;


    /*
       Strong evidence if aircraft
       was ground on previous update.
    */

    const old =
        history.get(ident);


    let score =
        5000 -
        alt;


    if(
        old &&
        old.ground
    )
        score+=20000;


    return {
        ac,
        score
    };
}


/* ===============================
   SAVE HISTORY
================================ */

function saveHistory(aircraft){

    for(const ac of aircraft){

        const ident =
            aircraftId(ac);


        if(!ident)
            continue;


        let thresholdDistance =
            999;


        const remembered =
            arrivalMemory.get(ident);


        if(
            remembered &&
            !onGround(ac)
        ){

            thresholdDistance =
                distanceKm(
                    Number(ac.lat),
                    Number(ac.lon),
                    remembered.runway.threshold.lat,
                    remembered.runway.threshold.lon
                );
        }


        history.set(
            ident,
            {
                ground:
                    onGround(ac),

                speed:
                    speed(ac),

                altitude:
                    altitude(ac),

                thresholdDistance,

                time:
                    Date.now()
            }
        );
    }
}


/* ===============================
   CLEAN OLD MEMORY
================================ */

function cleanup(){

    const now =
        Date.now();


    for(
        const [ident,expiry]
        of landedBlacklist
    ){

        if(now>=expiry)
            landedBlacklist.delete(
                ident
            );
    }


    for(
        const [ident,item]
        of arrivalMemory
    ){

        if(
            now-item.lastSeen >
            60000
        ){

            arrivalMemory.delete(
                ident
            );
        }
    }


    for(
        const [ident,item]
        of history
    ){

        if(
            now-item.time >
            10*60*1000
        ){

            history.delete(
                ident
            );
        }
    }
}


/* ===============================
   MAIN ENGINE
================================ */

async function update(){

    cleanup();


    try{

        const response =
            await fetch(
                API +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok)
            throw new Error(
                "HTTP "+
                response.status
            );


        const data =
            await response.json();


        const aircraft =
            (data.ac || [])
            .filter(
                ac =>
                Number.isFinite(
                    Number(ac.lat)
                )
                &&
                Number.isFinite(
                    Number(ac.lon)
                )
            );


        /*
           =================================
           1. TRUE TOUCHDOWN
           =================================
        */

        const touchdown =
            detectTouchdown(
                aircraft
            );


        if(touchdown){

            const ident =
                aircraftId(
                    touchdown.ac
                );


            landedBlacklist.set(
                ident,
                Date.now() +
                5*60*1000
            );


            arrivalMemory.delete(
                ident
            );


            if(
                departureLock ===
                ident
            ){

                departureLock=null;
            }


            landedDisplay={
                ac:
                    touchdown.ac,

                runway:
                    touchdown.runway,

                until:
                    Date.now() +
                    10000
            };


            show(
                touchdown.ac,

                "LANDED  •  RWY "+
                touchdown.runway.name,

                "LANDED",

                "PRAGUE"
            );


            saveHistory(
                aircraft
            );

            return;
        }


        /*
           =================================
           2. DEPARTURE AT THRESHOLD

           HIGHEST MOVEMENT PRIORITY.
           =================================
        */

        let departureCandidate=null;


        for(
            const ac
            of aircraft
        ){

            const candidate =
                detectDepartureAtThreshold(
                    ac
                );


            if(!candidate)
                continue;


            if(
                !departureCandidate ||
                candidate.score >
                departureCandidate.score
            ){

                departureCandidate =
                    candidate;
            }
        }


        if(
            departureCandidate
        ){

            const ac =
                departureCandidate.ac;


            const ident =
                aircraftId(ac);


            departureLock =
                ident;


            const gs =
                speed(ac);


            const old =
                history.get(ident);


            const accelerating =
                old &&
                gs >
                old.speed + 3;


            /*
               Lined up first.
            */

            if(
                gs < 40 &&
                !accelerating
            ){

                show(
                    ac,

                    "LINED UP  •  RWY "+
                    departureCandidate.runway.name+
                    "  •  READY FOR DEPARTURE",

                    "LINED UP",

                    "RWY "+
                    departureCandidate.runway.name
                );
            }

            else{

                show(
                    ac,

                    "TAKEOFF ROLL  •  RWY "+
                    departureCandidate.runway.name+
                    "  •  "+
                    Math.round(gs)+
                    " KT",

                    "TAKEOFF",

                    "RWY "+
                    departureCandidate.runway.name
                );
            }


            saveHistory(
                aircraft
            );

            return;
        }


        /*
           =================================
           3. ACTIVE DEPARTURE
           =================================
        */

        if(departureLock){

            const ac =
                aircraft.find(
                    item =>
                    aircraftId(item) ===
                    departureLock
                );


            if(ac){

                const alt =
                    altitude(ac);


                if(
                    !onGround(ac) &&
                    alt!==null &&
                    alt<3000
                ){

                    show(
                        ac,

                        (
                            alt<1000
                            ? "DEPARTED"
                            : "CLIMBING"
                        ) +

                        "  •  " +

                        Math.round(alt)
                        .toLocaleString() +

                        " FT",

                        alt<1000
                        ? "DEPARTED"
                        : "CLIMBING",

                        Math.round(
                            speed(ac)
                        )+
                        " KT"
                    );


                    saveHistory(
                        aircraft
                    );

                    return;
                }


                if(
                    alt!==null &&
                    alt>=3000
                ){

                    departureLock=null;
                }
            }

            else{

                departureLock=null;
            }
        }


        /*
           =================================
           4. LANDED MESSAGE HOLD

           Departure above is allowed
           to interrupt this if necessary.
           =================================
        */

        if(landedDisplay){

            if(
                Date.now() <
                landedDisplay.until
            ){

                show(
                    landedDisplay.ac,

                    "LANDED  •  RWY "+
                    landedDisplay.runway.name,

                    "LANDED",

                    "PRAGUE"
                );


                saveHistory(
                    aircraft
                );

                return;
            }

            else{

                landedDisplay=null;
            }
        }


        /*
           =================================
           BUILD ARRIVALS
           =================================
        */

        const arrivals=[];


        for(
            const ac
            of aircraft
        ){

            const candidate =
                detectArrival(ac);


            if(candidate)
                arrivals.push(
                    candidate
                );
        }


        arrivals.sort(
            (a,b)=>
            b.score-a.score
        );


        /*
           =================================
           5. SHORT FINAL
           =================================
        */

        const shortFinal =
            arrivals.find(
                item =>
                item.distance<=3
            );


        if(shortFinal){

            show(
                shortFinal.ac,

                "ON FINAL  •  RWY "+
                shortFinal.runway.name+
                "  •  "+
                shortFinal.distance
                .toFixed(1)+
                " KM",

                "LANDING",

                "RWY "+
                shortFinal.runway.name
            );


            saveHistory(
                aircraft
            );

            return;
        }


        /*
           =================================
           6. NEW AIRBORNE DEPARTURE
              FALLBACK
           =================================
        */

        let airborneDeparture=null;


        for(
            const ac
            of aircraft
        ){

            const candidate =
                detectAirborneDeparture(
                    ac
                );


            if(!candidate)
                continue;


            if(
                !airborneDeparture ||
                candidate.score >
                airborneDeparture.score
            ){

                airborneDeparture =
                    candidate;
            }
        }


        if(airborneDeparture){

            const ac =
                airborneDeparture.ac;


            departureLock =
                aircraftId(ac);


            const alt =
                altitude(ac);


            show(
                ac,

                (
                    alt<1000
                    ? "DEPARTED"
                    : "CLIMBING"
                ) +

                "  •  " +

                Math.round(alt)
                .toLocaleString() +

                " FT",

                "DEPARTURE",

                Math.round(
                    speed(ac)
                )+
                " KT"
            );


            saveHistory(
                aircraft
            );

            return;
        }


        /*
           =================================
           7. NORMAL ARRIVAL
           =================================
        */

        if(arrivals.length){

            const chosen =
                arrivals[0];


            const text =
                chosen.distance<=8
                ? "APPROACHING"
                : "INBOUND";


            show(
                chosen.ac,

                text+
                "  •  RWY "+
                chosen.runway.name+
                "  •  "+
                chosen.distance
                .toFixed(1)+
                " KM",

                text,

                "RWY "+
                chosen.runway.name
            );


            saveHistory(
                aircraft
            );

            return;
        }


        /*
           NOTHING
        */

        clear();


        saveHistory(
            aircraft
        );

    }

    catch(error){

        console.error(
            error
        );

        clear();
    }
}


/* ===============================
   START
================================ */

update();

setInterval(
    update,
    3000
);

</script>

</body>
</html>
