<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.ribbon {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 105px;
    background: rgb(0, 55, 110);
    color: white;
    display: flex;
    align-items: center;
    box-sizing: border-box;
}

.airport {
    width: 23%;
    padding-left: 25px;
    font-size: 22px;
    font-weight: bold;
    box-sizing: border-box;
}

.live {
    color: #ff3333;
    font-size: 16px;
    margin-bottom: 5px;
}

.aircraft-info {
    width: 52%;
    padding-left: 25px;
    border-left: 2px solid rgba(255,255,255,0.25);
    box-sizing: border-box;
}

.airline {
    font-size: 25px;
    font-weight: bold;
}

.details {
    font-size: 19px;
    margin-top: 6px;
    opacity: 0.9;
}

.status {
    font-size: 16px;
    margin-top: 5px;
    color: #8fd3ff;
}

.approach-box {
    position: relative;
    width: 25%;
    height: 105px;
    overflow: hidden;
}

.plane {
    position: absolute;
    width: 76px;
    height: 36px;
    left: 10%;
    top: 10px;
    transition:
        left 4.5s linear,
        top 4.5s linear,
        transform 0.8s ease;
    transform-origin: center center;
}

.plane svg {
    width: 100%;
    height: 100%;
    display: block;
}

.plane-shape {
    fill: white;
}

.plane.reverse svg {
    transform: scaleX(-1);
}

.runway {
    position: absolute;
    bottom: 17px;
    left: 18%;
    width: 64%;
    height: 5px;
    background: rgba(255,255,255,0.9);
    opacity: 0;
}

.runway.visible {
    opacity: 1;
}

.runway-label {
    position: absolute;
    bottom: 1px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
}
</style>

</head>

<body>

<div class="ribbon">

    <div class="airport">
        <div class="live">● LIVE</div>
        PRAGUE AIRPORT
        <div>LKPR / PRG</div>
    </div>

    <div class="aircraft-info">
        <div class="airline"></div>
        <div class="details"></div>
        <div class="status"></div>
    </div>

    <div class="approach-box">

        <div id="plane" class="plane" style="display:none;">
            <svg viewBox="0 0 160 70"
                 xmlns="http://www.w3.org/2000/svg">

                <path
                    class="plane-shape"
                    d="
                    M8 34
                    C20 29 43 27 92 27
                    L124 26
                    L145 17
                    L153 19
                    L138 31
                    C148 32 154 35 156 38
                    C152 41 145 42 135 42
                    L96 42
                    L60 58
                    L49 58
                    L66 42
                    L31 41
                    L18 49
                    L10 49
                    L16 40
                    C11 39 8 37 8 34
                    Z
                    "
                />

            </svg>
        </div>

        <div id="runway" class="runway"></div>
        <div id="runwayLabel" class="runway-label"></div>

    </div>

</div>


<script>

/* ==============================
   AIRPORT
   ============================== */

const airportLat = 50.1008;
const airportLon = 14.2600;


/* ==============================
   MEMORY
   ============================== */

const previousDistances = new Map();
const completedAircraft = new Map();

let landingLock = null;

/*
   This stores the aircraft we
   have identified as taking off.
*/

let departureLockId = null;


/* ==============================
   RUNWAYS
   ============================== */

const runways = [

    {
        runway: "06",
        heading: 60,
        lat: 50.101836,
        lon: 14.226300
    },

    {
        runway: "24",
        heading: 240,
        lat: 50.115950,
        lon: 14.273367
    },

    {
        runway: "12",
        heading: 122,
        lat: 50.108011,
        lon: 14.245367
    },

    {
        runway: "30",
        heading: 302,
        lat: 50.090467,
        lon: 14.281672
    }

];


/* ==============================
   BASIC FUNCTIONS
   ============================== */

function distanceKm(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371;

    const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

    const dLon =
        (lon2 - lon1) *
        Math.PI / 180;

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    return R * 2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );
}


function headingDifference(a, b) {

    let difference =
        Math.abs(a - b);

    if (difference > 180) {
        difference =
            360 - difference;
    }

    return difference;
}


function aircraftId(ac) {

    return (
        ac.hex ||
        ac.r ||
        ac.flight ||
        null
    );
}


function numericAltitude(ac) {

    if (
        ac.alt_baro === "ground" ||
        ac.alt_baro === null ||
        ac.alt_baro === undefined
    ) {
        return null;
    }

    const value =
        Number(ac.alt_baro);

    return Number.isFinite(value)
        ? value
        : null;
}


function groundSpeed(ac) {

    const value =
        Number(ac.gs);

    return Number.isFinite(value)
        ? value
        : 0;
}


function closestRunway(track) {

    let best = null;
    let bestDifference = 999;

    runways.forEach(rwy => {

        const difference =
            headingDifference(
                track,
                rwy.heading
            );

        if (
            difference <
            bestDifference
        ) {

            bestDifference =
                difference;

            best =
                rwy;
        }
    });

    return {
        runway: best,
        difference: bestDifference
    };
}


/* ==============================
   DISPLAY
   ============================== */

function clearDisplay() {

    document.querySelector(
        ".airline"
    ).textContent = "";

    document.querySelector(
        ".details"
    ).textContent = "";

    document.querySelector(
        ".status"
    ).textContent = "";

    updateApproachGraphic(
        null,
        0,
        false
    );
}


function cleanCompletedAircraft() {

    const now = Date.now();

    for (
        const [id, expiry]
        of completedAircraft
    ) {

        if (now >= expiry) {

            completedAircraft.delete(
                id
            );
        }
    }
}


/* ==============================
   ARRIVAL DETECTOR
   ============================== */

function scoreArrival(ac) {

    let score = 0;

    const id =
        aircraftId(ac);

    const lat =
        Number(ac.lat);

    const lon =
        Number(ac.lon);

    const altitude =
        numericAltitude(ac);

    const verticalRate =
        Number(ac.baro_rate);

    const track =
        Number(ac.track);

    const distance =
        distanceKm(
            lat,
            lon,
            airportLat,
            airportLon
        );


    /*
       GROUND AIRCRAFT CANNOT
       BE ARRIVALS.
    */

    if (
        ac.alt_baro === "ground"
    ) {
        return -9999;
    }


    if (
        id &&
        completedAircraft.has(id)
    ) {
        return -9999;
    }


    if (distance > 25) {
        return -9999;
    }


    if (
        altitude !== null &&
        altitude > 7000
    ) {
        return -9999;
    }


    /*
       CLIMBING = NOT ARRIVING
    */

    if (
        Number.isFinite(verticalRate) &&
        verticalRate > 250
    ) {
        return -9999;
    }


    /*
       MUST MATCH A RUNWAY
       REASONABLY WELL.
    */

    if (
        Number.isFinite(track)
    ) {

        const match =
            closestRunway(track);

        if (
            match.difference > 45
        ) {
            return -9999;
        }


        if (
            match.difference < 15
        ) {
            score += 160;
        }
        else if (
            match.difference < 30
        ) {
            score += 90;
        }
    }


    /*
       MUST GENERALLY BE
       GETTING CLOSER.
    */

    const previousDistance =
        id
            ? previousDistances.get(id)
            : undefined;


    if (
        previousDistance !== undefined
    ) {

        const movement =
            previousDistance -
            distance;


        if (movement < -0.08) {
            return -9999;
        }


        if (movement > 0.15) {
            score += 200;
        }
        else if (movement > 0.03) {
            score += 100;
        }
    }


    if (distance < 3) {
        score += 100;
    }
    else if (distance < 6) {
        score += 70;
    }
    else if (distance < 10) {
        score += 50;
    }
    else if (distance < 15) {
        score += 30;
    }


    if (
        Number.isFinite(verticalRate)
    ) {

        if (verticalRate < -500) {
            score += 100;
        }
        else if (verticalRate < -100) {
            score += 60;
        }
    }


    if (ac.flight) score += 15;
    if (ac.r) score += 10;
    if (ac.t) score += 10;


    return score;
}


/* ==============================
   TAKEOFF ROLL DETECTOR
   ============================== */

function scoreTakeoffRoll(ac) {

    let score = 0;


    /*
       THIS DETECTOR IS
       SPECIFICALLY FOR AIRCRAFT
       STILL REPORTING GROUND.
    */

    if (
        ac.alt_baro !== "ground"
    ) {
        return -9999;
    }


    const lat =
        Number(ac.lat);

    const lon =
        Number(ac.lon);

    const track =
        Number(ac.track);

    const speed =
        groundSpeed(ac);


    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    ) {
        return -9999;
    }


    const airportDistance =
        distanceKm(
            lat,
            lon,
            airportLat,
            airportLon
        );


    /*
       MUST BE ON / VERY CLOSE
       TO THE AIRPORT.
    */

    if (
        airportDistance > 3.5
    ) {
        return -9999;
    }


    /*
       TAXIING AIRCRAFT SHOULD
       NOT TRIGGER THE RIBBON.

       70 knots is deliberately
       conservative enough to
       catch the takeoff roll.
    */

    if (speed < 70) {
        return -9999;
    }


    score += 150;


    /*
       FASTER = MUCH MORE LIKELY
       TO BE TAKING OFF.
    */

    if (speed >= 100) {
        score += 150;
    }

    if (speed >= 130) {
        score += 100;
    }


    /*
       MUST BE ALIGNED WITH
       A RUNWAY.
    */

    if (
        Number.isFinite(track)
    ) {

        const match =
            closestRunway(track);


        if (
            match.difference > 25
        ) {
            return -9999;
        }


        if (
            match.difference < 10
        ) {
            score += 200;
        }
        else {
            score += 100;
        }
    }

    else {

        return -9999;
    }


    if (ac.flight) score += 20;
    if (ac.r) score += 10;
    if (ac.t) score += 10;


    return score;
}


/* ==============================
   AIRBORNE DEPARTURE DETECTOR
   ============================== */

function scoreAirborneDeparture(ac) {

    let score = 0;

    const id =
        aircraftId(ac);

    const lat =
        Number(ac.lat);

    const lon =
        Number(ac.lon);

    const altitude =
        numericAltitude(ac);

    const verticalRate =
        Number(ac.baro_rate);

    const track =
        Number(ac.track);

    const distance =
        distanceKm(
            lat,
            lon,
            airportLat,
            airportLon
        );


    if (
        ac.alt_baro === "ground"
    ) {
        return -9999;
    }


    if (distance > 15) {
        return -9999;
    }


    if (
        altitude !== null &&
        altitude >= 3000
    ) {
        return -9999;
    }


    /*
       AFTER LIFTOFF WE DON'T
       REQUIRE BARO RATE TO
       EXIST IMMEDIATELY.

       IF IT DOES EXIST, A
       STRONG DESCENT IS WRONG.
    */

    if (
        Number.isFinite(verticalRate) &&
        verticalRate < -100
    ) {
        return -9999;
    }


    if (
        Number.isFinite(verticalRate) &&
        verticalRate > 200
    ) {
        score += 150;
    }


    /*
       RUNWAY HEADING
    */

    if (
        Number.isFinite(track)
    ) {

        const match =
            closestRunway(track);


        if (
            match.difference > 45
        ) {
            return -9999;
        }


        if (
            match.difference < 20
        ) {
            score += 130;
        }
        else {
            score += 50;
        }
    }


    /*
       MOVING AWAY FROM AIRPORT
    */

    const previousDistance =
        id
            ? previousDistances.get(id)
            : undefined;


    if (
        previousDistance !== undefined
    ) {

        const movement =
            distance -
            previousDistance;


        if (movement < -0.08) {
            return -9999;
        }


        if (movement > 0.15) {
            score += 200;
        }
        else if (movement > 0.03) {
            score += 100;
        }
    }


    /*
       CLOSE TO AIRPORT =
       LIKELY RECENT TAKEOFF
    */

    if (distance < 3) {
        score += 150;
    }
    else if (distance < 6) {
        score += 100;
    }
    else if (distance < 10) {
        score += 60;
    }


    if (ac.flight) score += 15;
    if (ac.r) score += 10;
    if (ac.t) score += 10;


    return score;
}


/* ==============================
   GRAPHIC
   ============================== */

function updateApproachGraphic(
    runway,
    distance,
    landed
) {

    const plane =
        document.getElementById(
            "plane"
        );

    const runwayGraphic =
        document.getElementById(
            "runway"
        );

    const runwayLabel =
        document.getElementById(
            "runwayLabel"
        );


    if (!runway) {

        plane.style.display =
            "none";

        runwayGraphic
            .classList
            .remove("visible");

        runwayLabel.textContent =
            "";

        return;
    }


    plane.style.display =
        "block";

    runwayLabel.textContent =
        "RWY " +
        runway.runway;


    const leftToRight =
        runway.runway === "06" ||
        runway.runway === "12";


    if (leftToRight) {

        plane.classList.remove(
            "reverse"
        );
    }
    else {

        plane.classList.add(
            "reverse"
        );
    }


    const maxDistance = 15;

    const clamped =
        Math.max(
            0,
            Math.min(
                maxDistance,
                distance
            )
        );

    const progress =
        1 -
        (clamped / maxDistance);


    let x;

    if (leftToRight) {

        x =
            4 +
            progress * 58;
    }
    else {

        x =
            68 -
            progress * 58;
    }


    let y =
        4 +
        progress * 48;


    if (!landed) {

        plane.style.transform =
            leftToRight
                ? "rotate(7deg)"
                : "rotate(-7deg)";
    }


    if (landed) {

        y = 49;

        plane.style.transform =
            "rotate(0deg)";

        runwayGraphic
            .classList
            .add("visible");
    }
    else {

        runwayGraphic
            .classList
            .remove("visible");
    }


    plane.style.left =
        x + "%";

    plane.style.top =
        y + "px";
}


/* ==============================
   MAIN
   ============================== */

async function updateAircraft() {

    const airline =
        document.querySelector(
            ".airline"
        );

    const details =
        document.querySelector(
            ".details"
        );

    const status =
        document.querySelector(
            ".status"
        );


    cleanCompletedAircraft();


    /*
       FINISHED LANDING LOCK
    */

    if (landingLock) {

        if (
            Date.now() <
            landingLock.until
        ) {

            airline.textContent =
                landingLock.callsign;

            details.textContent =
                landingLock.details;

            status.textContent =
                "LANDED  •  PRAGUE";

            updateApproachGraphic(
                landingLock.runway,
                0,
                true
            );

            return;
        }


        completedAircraft.set(
            landingLock.id,
            Date.now() +
            5 * 60 * 1000
        );

        landingLock = null;

        clearDisplay();
    }


    try {

        const response =
            await fetch(
                "https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft"
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const wrapper =
            await response.json();


        const data =
            wrapper.upstreamText
                ? JSON.parse(
                    wrapper.upstreamText
                )
                : wrapper;


        if (
            !data.ac ||
            data.ac.length === 0
        ) {

            clearDisplay();

            return;
        }


        const allAircraft =
            data.ac.filter(ac => {

                return (
                    Number.isFinite(
                        Number(ac.lat)
                    ) &&
                    Number.isFinite(
                        Number(ac.lon)
                    )
                );
            });


        /*
           ======================
           ARRIVALS
           ======================
        */

        const arrivals =
            allAircraft
                .map(ac => ({
                    ac,
                    score:
                        scoreArrival(ac)
                }))
                .filter(item =>
                    item.score >= 100
                )
                .sort(
                    (a, b) =>
                        b.score -
                        a.score
                );


        /*
           SHORT FINAL
           <= 3 KM TO THRESHOLD
        */

        let shortFinalArrival =
            null;


        for (
            const item of arrivals
        ) {

            const ac =
                item.ac;

            const track =
                Number(ac.track);


            if (
                !Number.isFinite(track)
            ) {
                continue;
            }


            const match =
                closestRunway(track);


            if (
                !match.runway ||
                match.difference > 35
            ) {
                continue;
            }


            const thresholdDistance =
                distanceKm(
                    Number(ac.lat),
                    Number(ac.lon),
                    match.runway.lat,
                    match.runway.lon
                );


            if (
                thresholdDistance <= 3
            ) {

                shortFinalArrival =
                    ac;

                break;
            }
        }


        /*
           ======================
           EXISTING DEPARTURE LOCK
           ======================
        */

        let lockedDeparture =
            null;


        if (departureLockId) {

            lockedDeparture =
                allAircraft.find(
                    ac =>
                        aircraftId(ac) ===
                        departureLockId
                ) || null;


            if (lockedDeparture) {

                const altitude =
                    numericAltitude(
                        lockedDeparture
                    );


                /*
                   RELEASE AFTER
                   3,000 FT
                */

                if (
                    altitude !== null &&
                    altitude >= 3000
                ) {

                    departureLockId =
                        null;

                    lockedDeparture =
                        null;
                }
            }
            else {

                departureLockId =
                    null;
            }
        }


        /*
           ======================
           TAKEOFF ROLL
           ======================
        */

        const takeoffRolls =
            allAircraft
                .map(ac => ({
                    ac,
                    score:
                        scoreTakeoffRoll(ac)
                }))
                .filter(item =>
                    item.score >= 200
                )
                .sort(
                    (a, b) =>
                        b.score -
                        a.score
                );


        const takeoffRoll =
            takeoffRolls.length > 0
                ? takeoffRolls[0].ac
                : null;


        /*
           ======================
           AIRBORNE DEPARTURES
           ======================
        */

        const departures =
            allAircraft
                .map(ac => ({
                    ac,
                    score:
                        scoreAirborneDeparture(ac)
                }))
                .filter(item =>
                    item.score >= 100
                )
                .sort(
                    (a, b) =>
                        b.score -
                        a.score
                );


        const newDeparture =
            departures.length > 0
                ? departures[0].ac
                : null;


        /*
           ======================
           BROADCAST PRIORITY

           1 SHORT FINAL
           2 LOCKED DEPARTURE
           3 TAKEOFF ROLL
           4 NEW DEPARTURE
           5 NORMAL ARRIVAL
           6 BLANK
           ======================
        */

        let aircraft = null;
        let mode = null;


        if (shortFinalArrival) {

            aircraft =
                shortFinalArrival;

            mode =
                "ARRIVAL";

            departureLockId =
                null;
        }


        else if (lockedDeparture) {

            aircraft =
                lockedDeparture;

            mode =
                lockedDeparture
                    .alt_baro === "ground"
                    ? "TAKEOFF"
                    : "DEPARTURE";
        }


        else if (takeoffRoll) {

            aircraft =
                takeoffRoll;

            mode =
                "TAKEOFF";

            departureLockId =
                aircraftId(
                    aircraft
                );
        }


        else if (newDeparture) {

            aircraft =
                newDeparture;

            mode =
                "DEPARTURE";

            departureLockId =
                aircraftId(
                    aircraft
                );
        }


        else if (
            arrivals.length > 0
        ) {

            aircraft =
                arrivals[0].ac;

            mode =
                "ARRIVAL";
        }


        /*
           STORE CURRENT DISTANCES
           FOR NEXT UPDATE
        */

        allAircraft.forEach(ac => {

            const id =
                aircraftId(ac);

            if (!id) {
                return;
            }


            previousDistances.set(
                id,
                distanceKm(
                    Number(ac.lat),
                    Number(ac.lon),
                    airportLat,
                    airportLon
                )
            );
        });


        if (!aircraft) {

            clearDisplay();

            return;
        }


        const id =
            aircraftId(aircraft);


        const callsign =
            aircraft.flight &&
            aircraft.flight.trim()

                ? aircraft.flight.trim()

                : "AIRCRAFT";


        const registration =
            aircraft.r || "";


        const type =
            aircraft.t || "";


        const detailText =
            [
                type,
                registration
            ]
            .filter(Boolean)
            .join("  •  ");


        const altitude =
            numericAltitude(
                aircraft
            );


        const track =
            Number(
                aircraft.track
            );


        /*
           ======================
           TAKEOFF ROLL DISPLAY
           ======================
        */

        if (
            mode === "TAKEOFF"
        ) {

            const match =
                Number.isFinite(track)
                    ? closestRunway(
                        track
                      )
                    : {
                        runway: null
                      };


            airline.textContent =
                callsign;


            details.textContent =
                detailText;


            status.textContent =
                "TAKEOFF ROLL" +

                (
                    match.runway
                        ? "  •  RWY " +
                          match.runway.runway
                        : ""
                ) +

                "  •  " +

                Math.round(
                    groundSpeed(
                        aircraft
                    )
                ) +

                " KT";


            /*
               We'll create the fancy
               takeoff graphic later.
            */

            updateApproachGraphic(
                null,
                0,
                false
            );


            return;
        }


        /*
           ======================
           DEPARTURE DISPLAY
           ======================
        */

        if (
            mode === "DEPARTURE"
        ) {

            const match =
                Number.isFinite(track)
                    ? closestRunway(
                        track
                      )
                    : {
                        runway: null
                      };


            let departureStatus =
                "DEPARTED";


            if (
                altitude !== null &&
                altitude >= 1000
            ) {

                departureStatus =
                    "CLIMBING";
            }


            airline.textContent =
                callsign;


            details.textContent =
                detailText;


            status.textContent =
                departureStatus +

                (
                    match.runway
                        ? "  •  RWY " +
                          match.runway.runway
                        : ""
                ) +

                (
                    altitude !== null
                        ? "  •  " +
                          Math.round(
                            altitude
                          ).toLocaleString() +
                          " FT"
                        : ""
                );


            updateApproachGraphic(
                null,
                0,
                false
            );


            return;
        }


        /*
           ======================
           ARRIVAL DISPLAY
           ======================
        */

        if (
            mode === "ARRIVAL"
        ) {

            let selectedRunway =
                null;


            if (
                Number.isFinite(track)
            ) {

                const match =
                    closestRunway(
                        track
                    );


                if (
                    match.difference <= 35
                ) {

                    selectedRunway =
                        match.runway;
                }
            }


            let displayDistance =
                distanceKm(
                    Number(aircraft.lat),
                    Number(aircraft.lon),
                    airportLat,
                    airportLon
                );


            if (selectedRunway) {

                displayDistance =
                    distanceKm(
                        Number(aircraft.lat),
                        Number(aircraft.lon),
                        selectedRunway.lat,
                        selectedRunway.lon
                    );
            }


            /*
               TOUCHDOWN
            */

            if (
                selectedRunway &&
                displayDistance <= 0.8
            ) {

                landingLock = {

                    id,

                    callsign,

                    details:
                        detailText,

                    runway:
                        selectedRunway,

                    until:
                        Date.now() +
                        10000
                };


                airline.textContent =
                    callsign;


                details.textContent =
                    detailText;


                status.textContent =
                    "LANDED  •  PRAGUE";


                updateApproachGraphic(
                    selectedRunway,
                    0,
                    true
                );


                return;
            }


            let arrivalStatus =
                "INBOUND";


            if (
                displayDistance <= 8
            ) {

                arrivalStatus =
                    "APPROACHING";
            }


            if (
                displayDistance <= 4 &&
                (
                    altitude === null ||
                    altitude < 2500
                )
            ) {

                arrivalStatus =
                    "ON FINAL";
            }


            airline.textContent =
                callsign;


            details.textContent =
                detailText;


            status.textContent =
                arrivalStatus +

                (
                    selectedRunway
                        ? "  •  RWY " +
                          selectedRunway.runway
                        : ""
                ) +

                "  •  " +

                displayDistance
                    .toFixed(1) +

                " KM";


            updateApproachGraphic(
                selectedRunway,
                displayDistance,
                false
            );


            return;
        }

    }

    catch (error) {

        clearDisplay();

        console.error(error);
    }
}


/* ==============================
   START
   ============================== */

updateAircraft();

setInterval(
    updateAircraft,
    5000
);

</script>
