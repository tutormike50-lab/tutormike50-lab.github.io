<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.ribbon {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 105px;
    background: rgb(0, 55, 110);
    color: white;
    display: flex;
    align-items: center;
    box-sizing: border-box;
}

.airport {
    width: 25%;
    padding-left: 25px;
    font-size: 22px;
    font-weight: bold;
}

.live {
    color: #ff3333;
    font-size: 16px;
    margin-bottom: 5px;
}

.aircraft {
    width: 75%;
    padding-left: 25px;
    border-left: 2px solid rgba(255,255,255,0.25);
}

.airline {
    font-size: 25px;
    font-weight: bold;
}

.details {
    font-size: 19px;
    margin-top: 6px;
    opacity: 0.9;
}

.status {
    font-size: 16px;
    margin-top: 5px;
    color: #8fd3ff;
}
</style>
</head>

<body>

<div class="ribbon">

    <div class="airport">
        <div class="live">● LIVE</div>
        PRAGUE AIRPORT
        <div>LKPR / PRG</div>
    </div>

    <div class="aircraft">
        <div class="airline">LOADING AIRCRAFT...</div>
        <div class="details">WAITING FOR LIVE DATA</div>
        <div class="status">CONNECTING...</div>
    </div>

</div>

<script>
const airportLat = 50.1008;
const airportLon = 14.2600;

const previousDistances = new Map();

let currentAircraftId = null;

/*
   PRAGUE RUNWAY APPROACH HEADINGS

   RWY 06  ~ 060°
   RWY 24  ~ 240°
   RWY 12  ~ 120°
   RWY 30  ~ 300°
*/

const runwayHeadings = [
    { runway: "06", heading: 60 },
    { runway: "24", heading: 240 },
    { runway: "12", heading: 120 },
    { runway: "30", heading: 300 }
];

function distanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

    return R * 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
    );
}

function bearingTo(
    lat1,
    lon1,
    lat2,
    lon2
) {
    const phi1 = lat1 * Math.PI / 180;
    const phi2 = lat2 * Math.PI / 180;
    const deltaLon =
        (lon2 - lon1) * Math.PI / 180;

    const y =
        Math.sin(deltaLon) *
        Math.cos(phi2);

    const x =
        Math.cos(phi1) *
        Math.sin(phi2) -
        Math.sin(phi1) *
        Math.cos(phi2) *
        Math.cos(deltaLon);

    let bearing =
        Math.atan2(y, x) *
        180 / Math.PI;

    bearing =
        (bearing + 360) % 360;

    return bearing;
}

function headingDifference(a, b) {
    let difference =
        Math.abs(a - b);

    if (difference > 180) {
        difference =
            360 - difference;
    }

    return difference;
}

function aircraftId(ac) {
    return ac.hex || ac.r || ac.flight || null;
}

function numericAltitude(ac) {
    if (
        ac.alt_baro === "ground" ||
        ac.alt_baro === null ||
        ac.alt_baro === undefined
    ) {
        return null;
    }

    const value =
        Number(ac.alt_baro);

    return Number.isFinite(value)
        ? value
        : null;
}

function closestRunway(track) {
    let bestRunway = null;
    let bestDifference = 999;

    runwayHeadings.forEach(item => {
        const difference =
            headingDifference(
                track,
                item.heading
            );

        if (difference < bestDifference) {
            bestDifference = difference;
            bestRunway = item.runway;
        }
    });

    return {
        runway: bestRunway,
        difference: bestDifference
    };
}

function scoreAircraft(ac) {
    let score = 0;

    const id =
        aircraftId(ac);

    const lat =
        Number(ac.lat);

    const lon =
        Number(ac.lon);

    const distance =
        distanceKm(
            lat,
            lon,
            airportLat,
            airportLon
        );

    const altitude =
        numericAltitude(ac);

    const verticalRate =
        Number(ac.baro_rate);

    const track =
        Number(ac.track);

    const previousDistance =
        id
            ? previousDistances.get(id)
            : undefined;

    /*
       HARD DISTANCE LIMIT
    */

    if (distance > 15) {
        return -9999;
    }

    /*
       IS AIRCRAFT POINTING TOWARD PRAGUE?
    */

    if (Number.isFinite(track)) {

        const airportBearing =
            bearingTo(
                lat,
                lon,
                airportLat,
                airportLon
            );

        const towardDifference =
            headingDifference(
                track,
                airportBearing
            );

        if (towardDifference < 20) {
            score += 180;
        }
        else if (towardDifference < 35) {
            score += 120;
        }
        else if (towardDifference < 50) {
            score += 50;
        }
        else {
            score -= 180;
        }

        /*
           DOES TRACK MATCH A PRAGUE RUNWAY?
        */

        const runwayMatch =
            closestRunway(track);

        if (runwayMatch.difference < 15) {
            score += 130;
        }
        else if (runwayMatch.difference < 30) {
            score += 70;
        }
        else if (runwayMatch.difference > 50) {
            score -= 60;
        }
    }

    /*
       MOVEMENT TOWARD / AWAY FROM AIRPORT
    */

    if (previousDistance !== undefined) {

        const change =
            previousDistance - distance;

        if (change > 0.15) {
            score += 180;
        }
        else if (change > 0.03) {
            score += 100;
        }
        else if (change < -0.15) {
            score -= 220;
        }
        else if (change < -0.03) {
            score -= 120;
        }
    }

    /*
       DISTANCE
    */

    if (distance < 3) {
        score += 80;
    }
    else if (distance < 6) {
        score += 60;
    }
    else if (distance < 10) {
        score += 35;
    }
    else {
        score += 10;
    }

    /*
       ALTITUDE
    */

    if (altitude !== null) {

        if (altitude < 1500) {
            score += 70;
        }
        else if (altitude < 3000) {
            score += 50;
        }
        else if (altitude < 5000) {
            score += 20;
        }
        else if (altitude > 7000) {
            score -= 100;
        }
    }

    /*
       DESCENDING / CLIMBING
    */

    if (Number.isFinite(verticalRate)) {

        if (verticalRate < -500) {
            score += 80;
        }
        else if (verticalRate < -100) {
            score += 50;
        }
        else if (verticalRate > 700) {
            score -= 140;
        }
        else if (verticalRate > 250) {
            score -= 80;
        }
    }

    /*
       IDENTIFICATION QUALITY
    */

    if (ac.flight) score += 15;
    if (ac.r) score += 10;
    if (ac.t) score += 10;

    /*
       KEEP CURRENT AIRCRAFT STABLE
    */

    if (
        id &&
        id === currentAircraftId
    ) {
        score += 35;
    }

    return score;
}

async function updateAircraft() {

    const airline =
        document.querySelector(".airline");

    const details =
        document.querySelector(".details");

    const status =
        document.querySelector(".status");

    try {

        const response =
            await fetch(
                "https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft"
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " +
                response.status
            );
        }

        const wrapper =
            await response.json();

        const data =
            wrapper.upstreamText
                ? JSON.parse(
                    wrapper.upstreamText
                )
                : wrapper;

        if (
            !data.ac ||
            data.ac.length === 0
        ) {

            airline.textContent =
                "NO AIRCRAFT NEARBY";

            details.textContent = "";

            status.textContent =
                "WAITING FOR TRAFFIC";

            return;
        }

        const candidates =
            data.ac.filter(ac => {

                const lat =
                    Number(ac.lat);

                const lon =
                    Number(ac.lon);

                if (
                    !Number.isFinite(lat) ||
                    !Number.isFinite(lon)
                ) {
                    return false;
                }

                const distance =
                    distanceKm(
                        lat,
                        lon,
                        airportLat,
                        airportLon
                    );

                return (
                    distance <= 15 &&
                    (ac.flight || ac.r || ac.t)
                );
            });

        if (
            candidates.length === 0
        ) {

            airline.textContent =
                "NO PRAGUE ARRIVAL";

            details.textContent = "";

            status.textContent =
                "WAITING FOR NEXT ARRIVAL";

            currentAircraftId = null;

            return;
        }

        candidates.sort(
            (a, b) =>
                scoreAircraft(b) -
                scoreAircraft(a)
        );

        const aircraft =
            candidates[0];

        const aircraftScore =
            scoreAircraft(aircraft);

        /*
           REQUIRE A REASONABLE APPROACH SCORE
        */

        if (aircraftScore < 100) {

            airline.textContent =
                "NO PRAGUE ARRIVAL";

            details.textContent = "";

            status.textContent =
                "WAITING FOR NEXT ARRIVAL";

            currentAircraftId = null;

            candidates.forEach(ac => {

                const id =
                    aircraftId(ac);

                if (!id) return;

                previousDistances.set(
                    id,
                    distanceKm(
                        Number(ac.lat),
                        Number(ac.lon),
                        airportLat,
                        airportLon
                    )
                );
            });

            return;
        }

        currentAircraftId =
            aircraftId(aircraft);

        candidates.forEach(ac => {

            const id =
                aircraftId(ac);

            if (!id) return;

            previousDistances.set(
                id,
                distanceKm(
                    Number(ac.lat),
                    Number(ac.lon),
                    airportLat,
                    airportLon
                )
            );
        });

        const callsign =
            aircraft.flight &&
            aircraft.flight.trim()

                ? aircraft.flight.trim()

                : "UNKNOWN FLIGHT";

        const registration =
            aircraft.r ||
            "REG UNKNOWN";

        const type =
            aircraft.t ||
            "TYPE UNKNOWN";

        const distance =
            distanceKm(
                Number(aircraft.lat),
                Number(aircraft.lon),
                airportLat,
                airportLon
            );

        const altitude =
            numericAltitude(aircraft);

        const track =
            Number(aircraft.track);

        let runway =
            "";

        if (
            Number.isFinite(track)
        ) {
            const match =
                closestRunway(track);

            if (
                match.difference <= 35
            ) {
                runway =
                    match.runway;
            }
        }

        let arrivalStatus =
            "INBOUND";

        if (distance <= 8) {
            arrivalStatus =
                "APPROACHING";
        }

        if (
            distance <= 4 &&
            (
                altitude === null ||
                altitude < 2500
            )
        ) {
            arrivalStatus =
                "ON FINAL";
        }

        airline.textContent =
            callsign;

        details.textContent =
            type +
            "  •  " +
            registration;

        status.textContent =
            arrivalStatus +
            (
                runway
                    ? " RWY " + runway
                    : ""
            ) +
            "  •  " +
            distance.toFixed(1) +
            " KM";

    }

    catch (error) {

        airline.textContent =
            "AIRCRAFT DATA";

        details.textContent =
            "CONNECTION ERROR";

        status.textContent =
            "RETRYING...";

        console.error(error);
    }
}

updateAircraft();

setInterval(
    updateAircraft,
    5000
);
</script>
</body>
</html>
