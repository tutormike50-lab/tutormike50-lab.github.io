<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:transparent;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

.ribbon{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:105px;

    background:#003b73;
    color:white;

    display:flex;
    align-items:center;

    box-sizing:border-box;
}

.airport{
    width:24%;
    padding-left:24px;
    box-sizing:border-box;

    font-size:21px;
    font-weight:bold;

    border-right:
        2px solid
        rgba(255,255,255,.25);
}

.live{
    color:#ff4b4b;
    font-size:14px;
    margin-bottom:5px;
}

.code{
    margin-top:3px;
    font-size:15px;
    color:#a9d8ff;
    letter-spacing:1px;
}

.aircraft{
    width:51%;
    padding-left:26px;
    box-sizing:border-box;
}

.airline{
    font-size:25px;
    font-weight:bold;
}

.details{
    margin-top:6px;
    font-size:18px;
    color:rgba(255,255,255,.82);
}

.status{
    width:25%;

    font-size:27px;
    font-weight:bold;

    text-align:center;

    color:#9bd6ff;
}

</style>
</head>

<body>

<div class="ribbon">

    <div class="airport">

        <div class="live">
            ● LIVE
        </div>

        PRAGUE AIRPORT

        <div class="code">
            LKPR / PRG
        </div>

    </div>

    <div class="aircraft">

        <div class="airline"></div>

        <div class="details"></div>

    </div>

    <div class="status"></div>

</div>


<script>

const API =
"https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft";


/* =========================
   AIRLINES
========================= */

const airlines={

    TVS:"SMARTWINGS",
    RYR:"RYANAIR",
    UAE:"EMIRATES",
    PGT:"PEGASUS AIRLINES",
    AUA:"AUSTRIAN AIRLINES",
    DLH:"LUFTHANSA",
    KLM:"KLM",
    BAW:"BRITISH AIRWAYS",
    EZY:"EASYJET",
    WZZ:"WIZZ AIR",
    QTR:"QATAR AIRWAYS",
    THY:"TURKISH AIRLINES",
    AFR:"AIR FRANCE",
    SWR:"SWISS",
    LOT:"LOT POLISH AIRLINES",
    SAS:"SAS",
    FIN:"FINNAIR",
    IBE:"IBERIA",
    TAP:"TAP AIR PORTUGAL",
    ITY:"ITA AIRWAYS",
    EIN:"AER LINGUS",
    VLG:"VUELING",
    EWG:"EUROWINGS",
    AEE:"AEGEAN AIRLINES",
    BTI:"AIRBALTIC",
    BEL:"BRUSSELS AIRLINES",
    TRA:"TRANSAVIA",
    EXS:"JET2",
    TUI:"TUI",
    ETD:"ETIHAD AIRWAYS",
    ELY:"EL AL",
    MSR:"EGYPTAIR"

};


/* =========================
   RUNWAYS
========================= */

const runwayEnds=[

    {
        name:"06",
        lat:50.1018361,
        lon:14.2263000
    },

    {
        name:"24",
        lat:50.1159500,
        lon:14.2733667
    },

    {
        name:"12",
        lat:50.1080111,
        lon:14.2453667
    },

    {
        name:"30",
        lat:50.0904667,
        lon:14.2816722
    }

];


const physicalRunways=[

    {
        name:"06/24",
        a:runwayEnds[0],
        b:runwayEnds[1]
    },

    {
        name:"12/30",
        a:runwayEnds[2],
        b:runwayEnds[3]
    }

];


/* =========================
   FILTER HELICOPTERS /
   SMALL PRIVATE AIRCRAFT
========================= */

const helicopterTypes=new Set([

    "A109","A119","A139","A149","A169","A189",
    "AS32","AS50","AS55","AS65",
    "B06","B105","B212","B222","B412","B429",
    "EC20","EC25","EC30","EC35","EC45","EC55",
    "H125","H130","H135","H145","H155","H160",
    "R22","R44","R66",
    "S55","S58","S61","S64","S76","S92"

]);


const smallAircraftPrefixes=[

    "C15","C17","C18","C19","C20","C21",
    "C22","C23","C24","C25",

    "PA18","PA20","PA22","PA24","PA28",
    "PA32","PA34","PA38","PA44",

    "DA20","DA40","DA42",

    "SR20","SR22",

    "DR40","P28","M20",

    "BE23","BE24","BE33","BE35","BE36",

    "DV20"

];


function unwantedAircraft(ac){

    const type=
        (ac.t||"")
        .trim()
        .toUpperCase();


    const category=
        (ac.category||"")
        .trim()
        .toUpperCase();


    if(category==="A7")
        return true;


    if(helicopterTypes.has(type))
        return true;


    for(const prefix of smallAircraftPrefixes){

        if(type.startsWith(prefix))
            return true;
    }


    return false;
}


/* =========================
   MEMORY
========================= */

const history=
    new Map();


const landedBlacklist=
    new Map();


let departureLock=null;

let landedDisplay=null;


/* =========================
   HELPERS
========================= */

function aircraftId(ac){

    return (
        ac.hex ||
        ac.r ||
        (ac.flight||"").trim() ||
        null
    );
}


function onGround(ac){

    return (
        ac.alt_baro==="ground" ||
        ac.alt_geom==="ground"
    );
}


function altitude(ac){

    if(onGround(ac))
        return 0;


    let value=
        Number(ac.alt_baro);


    if(!Number.isFinite(value))
        value=
            Number(ac.alt_geom);


    return Number.isFinite(value)
        ? value
        : null;
}


function verticalRate(ac){

    let value=
        Number(ac.baro_rate);


    if(!Number.isFinite(value))
        value=
            Number(ac.geom_rate);


    return Number.isFinite(value)
        ? value
        : 0;
}


function distanceKm(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371;


    const dLat=
        (lat2-lat1)*
        Math.PI/180;


    const dLon=
        (lon2-lon1)*
        Math.PI/180;


    const a=

        Math.sin(dLat/2)**2

        +

        Math.cos(
            lat1*Math.PI/180
        )

        *

        Math.cos(
            lat2*Math.PI/180
        )

        *

        Math.sin(dLon/2)**2;


    return R*2*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}


/* =========================
   DISTANCE TO COMPLETE
   RUNWAY
========================= */

function distanceToRunway(
    lat,
    lon,
    runway
){

    const ref=
        (
            lat+
            runway.a.lat+
            runway.b.lat
        )/3;


    const ky=
        111.32;


    const kx=
        111.32*
        Math.cos(
            ref*
            Math.PI/180
        );


    const px=lon*kx;
    const py=lat*ky;


    const ax=runway.a.lon*kx;
    const ay=runway.a.lat*ky;


    const bx=runway.b.lon*kx;
    const by=runway.b.lat*ky;


    const vx=bx-ax;
    const vy=by-ay;


    const wx=px-ax;
    const wy=py-ay;


    const lengthSquared=
        vx*vx+
        vy*vy;


    let t=
        (
            wx*vx+
            wy*vy
        )/
        lengthSquared;


    t=
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const cx=
        ax+t*vx;


    const cy=
        ay+t*vy;


    return Math.sqrt(
        (px-cx)**2+
        (py-cy)**2
    );
}


function isOnRunway(ac){

    if(!onGround(ac))
        return false;


    const lat=
        Number(ac.lat);


    const lon=
        Number(ac.lon);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    )
        return false;


    for(const runway of physicalRunways){

        if(
            distanceToRunway(
                lat,
                lon,
                runway
            ) <= 0.18
        )
            return true;
    }


    return false;
}


/* =========================
   DISPLAY
========================= */

function airlineName(callsign){

    if(!callsign)
        return "";


    return airlines[
        callsign
        .trim()
        .toUpperCase()
        .substring(0,3)
    ] || "";
}


function headline(ac){

    const callsign=
        (ac.flight||"")
        .trim()
        ||
        "AIRCRAFT";


    const company=
        airlineName(callsign);


    return company

        ? company+
          "  •  "+
          callsign

        : callsign;
}


function details(ac){

    return [

        ac.t||"",
        ac.r||""

    ]
    .filter(Boolean)
    .join("  •  ");
}


function show(ac,state){

    document
    .querySelector(".airline")
    .textContent=
        headline(ac);


    document
    .querySelector(".details")
    .textContent=
        details(ac);


    document
    .querySelector(".status")
    .textContent=
        state;
}


function clearDisplay(){

    document
    .querySelector(".airline")
    .textContent="";


    document
    .querySelector(".details")
    .textContent="";


    document
    .querySelector(".status")
    .textContent="";
}


/* =========================
   APPROACHING

   ONLY INSIDE 3 KM
========================= */

function detectArrival(ac){

    if(onGround(ac))
        return null;


    if(
        verticalRate(ac)>700
    )
        return null;


    const lat=
        Number(ac.lat);


    const lon=
        Number(ac.lon);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    )
        return null;


    let closest=
        999;


    for(const end of runwayEnds){

        const d=
            distanceKm(
                lat,
                lon,
                end.lat,
                end.lon
            );


        if(d<closest)
            closest=d;
    }


    if(closest>3)
        return null;


    return {

        ac,

        distance:
            closest

    };
}


/* =========================
   CLEANUP
========================= */

function cleanup(){

    const now=
        Date.now();


    for(
        const [id,expiry]
        of landedBlacklist
    ){

        if(now>=expiry)
            landedBlacklist.delete(id);
    }


    for(
        const [id,item]
        of history
    ){

        if(
            now-item.time>
            10*60*1000
        )
            history.delete(id);
    }
}


/* =========================
   SAVE HISTORY
========================= */

function saveHistory(aircraft){

    for(const ac of aircraft){

        const id=
            aircraftId(ac);


        if(!id)
            continue;


        history.set(
            id,
            {
                ground:
                    onGround(ac),

                time:
                    Date.now()
            }
        );
    }
}


/* =========================
   MAIN
========================= */

async function update(){

    cleanup();


    try{

        const response=
            await fetch(
                API+
                "?t="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok)
            throw new Error(
                "HTTP "+
                response.status
            );


        const data=
            await response.json();


        const aircraft=
            (data.ac||[])

            .filter(
                ac =>
                Number.isFinite(
                    Number(ac.lat)
                )
                &&
                Number.isFinite(
                    Number(ac.lon)
                )
            )

            .filter(
                ac =>
                !unwantedAircraft(ac)
            );


        /*
           ==================================
           1. AIR -> GROUND ON RUNWAY
              = LANDED
           ==================================
        */

        for(const ac of aircraft){

            const id=
                aircraftId(ac);


            if(
                !id ||
                !isOnRunway(ac)
            )
                continue;


            const old=
                history.get(id);


            /*
               This is the important rule.

               Previous update airborne,
               current update ground,
               physically on runway:
               it LANDed.
            */

            if(
                old &&
                old.ground===false
            ){

                landedBlacklist.set(
                    id,
                    Date.now()+
                    5*60*1000
                );


                if(
                    departureLock===id
                )
                    departureLock=null;


                landedDisplay={
                    ac,
                    until:
                        Date.now()+
                        10000
                };


                show(
                    ac,
                    "LANDED"
                );


                saveHistory(
                    aircraft
                );


                return;
            }
        }


        /*
           ==================================
           2. GROUND AIRCRAFT ON RUNWAY
              = TAKE OFF

           But only if it was already
           ground on previous update.

           This prevents a newly landed
           aircraft becoming TAKE OFF.
           ==================================
        */

        let takeoffCandidate=null;


        for(const ac of aircraft){

            const id=
                aircraftId(ac);


            if(
                !id ||
                !isOnRunway(ac)
            )
                continue;


            if(
                landedBlacklist.has(id)
            )
                continue;


            const old=
                history.get(id);


            /*
               Must have been ground
               on previous update too.

               Maximum delay is one
               3-second polling cycle.
            */

            if(
                !old ||
                old.ground!==true
            )
                continue;


            takeoffCandidate=
                ac;

            break;
        }


        if(takeoffCandidate){

            departureLock=
                aircraftId(
                    takeoffCandidate
                );


            show(
                takeoffCandidate,
                "TAKE OFF"
            );


            saveHistory(
                aircraft
            );


            return;
        }


        /*
           ==================================
           3. ACTIVE TAKE OFF
              UNTIL 3000 FT
           ==================================
        */

        if(departureLock){

            const ac=
                aircraft.find(
                    item =>
                    aircraftId(item)===
                    departureLock
                );


            if(ac){

                const alt=
                    altitude(ac);


                if(
                    !onGround(ac) &&
                    alt!==null &&
                    alt<3000
                ){

                    show(
                        ac,
                        "TAKE OFF"
                    );


                    saveHistory(
                        aircraft
                    );


                    return;
                }


                if(
                    alt!==null &&
                    alt>=3000
                )
                    departureLock=null;
            }

            else{

                departureLock=null;
            }
        }


        /*
           ==================================
           4. HOLD LANDED FOR 10 SECONDS
           ==================================
        */

        if(landedDisplay){

            if(
                Date.now()<
                landedDisplay.until
            ){

                show(
                    landedDisplay.ac,
                    "LANDED"
                );


                saveHistory(
                    aircraft
                );


                return;
            }


            landedDisplay=null;
        }


        /*
           ==================================
           5. APPROACHING
              ONLY WITHIN 3 KM
           ==================================
        */

        const arrivals=[];


        for(const ac of aircraft){

            const candidate=
                detectArrival(ac);


            if(candidate)
                arrivals.push(
                    candidate
                );
        }


        arrivals.sort(
            (a,b)=>
            a.distance-
            b.distance
        );


        if(arrivals.length){

            show(
                arrivals[0].ac,
                "APPROACHING"
            );


            saveHistory(
                aircraft
            );


            return;
        }


        /*
           NOTHING IMPORTANT
        */

        clearDisplay();

        saveHistory(
            aircraft
        );

    }

    catch(error){

        console.error(error);

        clearDisplay();
    }
}


update();


setInterval(
    update,
    3000
);

</script>

</body>
</html>
