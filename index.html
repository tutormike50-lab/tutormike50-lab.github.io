<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.ribbon {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 105px;
    background: rgb(0, 55, 110);
    color: white;
    display: flex;
    align-items: center;
    box-sizing: border-box;
}

.airport {
    width: 25%;
    padding-left: 25px;
    font-size: 22px;
    font-weight: bold;
}

.live {
    color: #ff3333;
    font-size: 16px;
    margin-bottom: 5px;
}

.aircraft {
    width: 75%;
    padding-left: 25px;
    border-left: 2px solid rgba(255,255,255,0.25);
}

.airline {
    font-size: 25px;
    font-weight: bold;
}

.details {
    font-size: 19px;
    margin-top: 6px;
    opacity: 0.9;
}

.status {
    font-size: 16px;
    margin-top: 5px;
    color: #8fd3ff;
}
</style>
</head>

<body>

<div class="ribbon">

    <div class="airport">
        <div class="live">● LIVE</div>
        PRAGUE AIRPORT
        <div>LKPR / PRG</div>
    </div>

    <div class="aircraft">
        <div class="airline">LOADING AIRCRAFT...</div>
        <div class="details">WAITING FOR LIVE DATA</div>
        <div class="status">CONNECTING...</div>
    </div>

</div>

<script>
async function updateAircraft() {
    const airline = document.querySelector(".airline");
    const details = document.querySelector(".details");
    const status = document.querySelector(".status");

    try {
        const response = await fetch(
            "https://super-sun-3d4f.tutormike50.workers.dev/"
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!data.ac || data.ac.length === 0) {
            airline.textContent = "NO AIRCRAFT NEARBY";
            details.textContent = "";
            status.textContent = "WAITING FOR TRAFFIC";
            return;
        }

        const aircraft = data.ac.find(ac =>
            ac.flight || ac.r || ac.t
        );

        if (!aircraft) {
            airline.textContent = "AIRCRAFT DETECTED";
            details.textContent = "IDENTIFICATION UNAVAILABLE";
            status.textContent = "LIVE ADS-B";
            return;
        }

        const callsign =
            aircraft.flight && aircraft.flight.trim()
                ? aircraft.flight.trim()
                : "UNKNOWN FLIGHT";

        const registration = aircraft.r || "REG UNKNOWN";
        const type = aircraft.t || "TYPE UNKNOWN";

        airline.textContent = callsign;
        details.textContent = type + "  •  " + registration;
        status.textContent = "LIVE AIRCRAFT DATA";

    } catch (error) {
        airline.textContent = "AIRCRAFT DATA";
        details.textContent = "CONNECTION ERROR";
        status.textContent = "RETRYING...";
        console.error(error);
    }
}

updateAircraft();
setInterval(updateAircraft, 10000);
</script>

</body>
</html>
