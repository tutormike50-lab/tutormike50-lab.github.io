<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:transparent;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}


/* =====================================================
   MAIN BROADCAST PANEL
===================================================== */

.ribbon{

    --accent:#3292ff;
    --accentSoft:rgba(50,146,255,.28);
    --accentStrong:#72b9ff;

    position:absolute;
    bottom:0;
    left:0;

    width:100%;
    height:130px;

    color:white;

    display:flex;
    align-items:stretch;

    box-sizing:border-box;

    overflow:hidden;

    border-radius:18px;

    background:
        radial-gradient(
            circle at 70% 50%,
            var(--accentSoft),
            transparent 34%
        ),
        linear-gradient(
            105deg,
            rgba(2,16,31,.98),
            rgba(2,10,22,.98) 55%,
            rgba(1,7,17,.98)
        );

    border:
        1px solid
        rgba(255,255,255,.24);

    box-shadow:
        0 0 24px
        var(--accentSoft),
        inset 0 0 35px
        rgba(255,255,255,.035);

    transition:
        --accent .5s ease;
}


/* =====================================================
   LEFT - AIRPORT
===================================================== */

.airport{

    width:20%;

    padding:
        14px 18px 12px 24px;

    box-sizing:border-box;

    position:relative;

    display:flex;
    flex-direction:column;
    justify-content:center;
}


.airport:after{

    content:"";

    position:absolute;

    right:0;
    top:-20%;

    width:2px;
    height:140%;

    background:
        linear-gradient(
            transparent,
            var(--accent),
            transparent
        );

    box-shadow:
        0 0 16px
        var(--accent);
}


.live{

    display:inline-flex;
    align-items:center;

    width:max-content;

    padding:
        4px 9px;

    margin-bottom:8px;

    border:
        1px solid
        #ff3838;

    border-radius:6px;

    color:#ff6060;

    font-size:14px;
    font-weight:bold;

    letter-spacing:.6px;
}


.live-dot{

    width:8px;
    height:8px;

    margin-right:7px;

    border-radius:50%;

    background:#ff2d2d;

    box-shadow:
        0 0 10px
        #ff2d2d;

    animation:
        livePulse 1.4s
        infinite;
}


@keyframes livePulse{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.35;
    }
}


.airport-name{

    font-size:24px;
    font-weight:800;

    letter-spacing:.4px;
}


.airport-code{

    margin-top:3px;

    color:var(--accentStrong);

    font-size:16px;
    letter-spacing:2px;
}


/* =====================================================
   CENTRE - AIRCRAFT INFORMATION
===================================================== */

.info{

    width:48%;

    padding:
        14px 26px 12px 32px;

    box-sizing:border-box;

    display:flex;
    flex-direction:column;
    justify-content:center;
}


.flight-line{

    display:flex;
    align-items:baseline;

    gap:14px;

    min-width:0;
}


.airline{

    font-size:29px;
    font-weight:900;

    letter-spacing:.5px;

    text-shadow:
        0 2px 12px
        rgba(0,0,0,.75);

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


.details{

    font-size:18px;

    margin-top:8px;

    padding-top:8px;

    border-top:
        1px solid
        rgba(255,255,255,.22);

    color:
        rgba(255,255,255,.85);

    letter-spacing:1px;
}


.status-row{

    display:flex;
    align-items:center;

    margin-top:9px;
}


.state-icon{

    width:44px;
    height:44px;

    margin-right:12px;

    border:
        1px solid
        var(--accent);

    border-radius:9px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 12px
        var(--accentSoft),
        inset 0 0 12px
        var(--accentSoft);
}


.state-icon svg{

    width:30px;
    height:30px;

    fill:none;

    stroke:var(--accentStrong);

    stroke-width:2.4;

    stroke-linecap:round;
    stroke-linejoin:round;
}


.status{

    font-size:34px;
    font-weight:900;

    letter-spacing:1px;

    color:var(--accentStrong);

    text-shadow:
        0 0 8px
        var(--accentSoft),
        0 0 18px
        var(--accentSoft);
}


/* =====================================================
   RIGHT - ANIMATED AIRCRAFT SCENE
===================================================== */

.scene{

    width:32%;

    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            rgba(6,18,35,.8),
            rgba(1,6,14,.98)
        );
}


.scene:before{

    content:"";

    position:absolute;

    left:-25px;
    top:-20%;

    width:50px;
    height:140%;

    transform:
        skewX(-13deg);

    background:
        linear-gradient(
            transparent,
            var(--accent),
            transparent
        );

    opacity:.7;

    box-shadow:
        0 0 18px
        var(--accent);
}


/* sky glow */

.sky-glow{

    position:absolute;

    inset:0;

    background:
        radial-gradient(
            circle at 65% 25%,
            var(--accentSoft),
            transparent 42%
        );

    opacity:.7;
}


/* runway */

.runway{

    position:absolute;

    left:12%;
    right:5%;

    bottom:-4px;

    height:42px;

    clip-path:
        polygon(
            14% 0,
            82% 0,
            100% 100%,
            0 100%
        );

    background:
        linear-gradient(
            180deg,
            #252b32,
            #080b0e
        );

    box-shadow:
        inset 0 2px 0
        rgba(255,255,255,.18);
}


.runway-center{

    position:absolute;

    left:48%;

    bottom:0;

    width:4px;
    height:39px;

    background:
        repeating-linear-gradient(
            to bottom,
            white 0,
            white 7px,
            transparent 7px,
            transparent 14px
        );

    transform:
        perspective(40px)
        rotateX(35deg);

    opacity:.9;
}


.runway-light{

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:var(--accentStrong);

    box-shadow:
        0 0 7px
        var(--accentStrong);
}


.rl1{left:19%;bottom:6px}
.rl2{left:29%;bottom:10px}
.rl3{left:40%;bottom:14px}
.rl4{left:55%;bottom:14px}
.rl5{left:69%;bottom:10px}
.rl6{left:82%;bottom:6px}


/* aircraft */

.aircraft{

    position:absolute;

    width:138px;
    height:66px;

    left:42%;
    top:18px;

    transform-origin:center;

    transition:
        transform .7s ease,
        left .7s ease,
        top .7s ease;
}


.aircraft svg{

    width:100%;
    height:100%;
}


.aircraft-body{

    fill:#f2f5f8;

    filter:
        drop-shadow(
            0 5px 5px
            rgba(0,0,0,.55)
        );
}


.aircraft-dark{

    fill:#cbd5df;
}


.engine{

    fill:#8d9aa8;
}


/* wheels */

.wheel{

    fill:#0b0d10;
}


.smoke{

    position:absolute;

    width:18px;
    height:18px;

    border-radius:50%;

    background:
        rgba(235,240,245,.62);

    filter:blur(3px);

    opacity:0;

    pointer-events:none;
}


/* =====================================================
   STATE COLOURS
===================================================== */

.ribbon.approaching{

    --accent:#228cff;
    --accentSoft:rgba(34,140,255,.30);
    --accentStrong:#67b5ff;
}


.ribbon.landed{

    --accent:#80d318;
    --accentSoft:rgba(128,211,24,.28);
    --accentStrong:#a9f12f;
}


.ribbon.takeoff{

    --accent:#ff9419;
    --accentSoft:rgba(255,148,25,.30);
    --accentStrong:#ffb13b;
}


/* =====================================================
   APPROACHING ANIMATION
===================================================== */

.ribbon.approaching
.aircraft{

    animation:
        approachPlane
        3.6s ease-in-out
        infinite alternate;
}


@keyframes approachPlane{

    from{
        transform:
            translate(
                15px,
                -5px
            )
            rotate(4deg)
            scale(.94);
    }

    to{
        transform:
            translate(
                -10px,
                10px
            )
            rotate(1deg)
            scale(1.02);
    }
}


/* =====================================================
   LANDED
===================================================== */

.ribbon.landed
.aircraft{

    left:35%;
    top:43px;

    transform:
        rotate(0deg)
        scale(1.02);
}


.ribbon.landed
.smoke{

    opacity:1;

    animation:
        tyreSmoke
        1.8s ease-out
        infinite;
}


.smoke.one{

    left:55%;
    bottom:21px;
}


.smoke.two{

    left:62%;
    bottom:19px;

    animation-delay:.3s;
}


@keyframes tyreSmoke{

    0%{
        opacity:.65;

        transform:
            translate(0,0)
            scale(.55);
    }

    100%{
        opacity:0;

        transform:
            translate(
                28px,
                -12px
            )
            scale(1.8);
    }
}


/* =====================================================
   TAKE OFF
===================================================== */

.ribbon.takeoff
.aircraft{

    animation:
        takeoffPlane
        3.2s ease-in-out
        infinite;
}


@keyframes takeoffPlane{

    0%{
        left:25%;
        top:44px;

        transform:
            rotate(0deg)
            scale(.9);
    }

    55%{
        left:42%;
        top:35px;

        transform:
            rotate(-3deg)
            scale(.98);
    }

    100%{
        left:55%;
        top:10px;

        transform:
            rotate(-9deg)
            scale(1.06);
    }
}


/* =====================================================
   IDLE
===================================================== */

.ribbon.idle
.info,
.ribbon.idle
.scene{

    opacity:.18;
}


.ribbon.idle
.scene{

    visibility:hidden;
}

</style>
</head>


<body>

<script>


const API =
"https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft";


/* =====================================================
   AIRLINES
===================================================== */

const airlines={

    TVS:"SMARTWINGS",
    RYR:"RYANAIR",
    UAE:"EMIRATES",
    PGT:"PEGASUS AIRLINES",
    AUA:"AUSTRIAN AIRLINES",
    DLH:"LUFTHANSA",
    KLM:"KLM",
    BAW:"BRITISH AIRWAYS",
    EZY:"EASYJET",
    WZZ:"WIZZ AIR",
    QTR:"QATAR AIRWAYS",
    THY:"TURKISH AIRLINES",
    AFR:"AIR FRANCE",
    SWR:"SWISS",
    LOT:"LOT POLISH AIRLINES",
    SAS:"SAS",
    FIN:"FINNAIR",
    IBE:"IBERIA",
    TAP:"TAP AIR PORTUGAL",
    ITY:"ITA AIRWAYS",
    EIN:"AER LINGUS",
    VLG:"VUELING",
    EWG:"EUROWINGS",
    AEE:"AEGEAN AIRLINES",
    BTI:"AIRBALTIC",
    BEL:"BRUSSELS AIRLINES",
    TRA:"TRANSAVIA",
    EXS:"JET2",
    TUI:"TUI",

    ELY:"EL AL",
    MSR:"EGYPTAIR"

};


/* =====================================================
   RUNWAYS
===================================================== */

const runways=[

    {
        name:"06",
        heading:60,
        threshold:{
            lat:50.1018361,
            lon:14.2263000
        },
        farEnd:{
            lat:50.1159500,

        }
    },

        threshold:{

        },
        farEnd:{
            lat:50.1018361,
            lon:14.2263000
        }
    },

    {
        name:"12",
        heading:122,
        threshold:{
            lat:50.1080111,
            lon:14.2453667
        },
        farEnd:{
            lat:50.0904667,
            lon:14.2816722
        }
    },

    {
        name:"30",
        heading:302,
        threshold:{
            lat:50.0904667,
            lon:14.2816722
        },
        farEnd:{
            lat:50.1080111,
            lon:14.2453667
        }
    }

];


const physicalRunways=[

    {
        name:"06/24",
        a:runways[0].threshold,
        b:runways[0].farEnd
    },

    {
        name:"12/30",
        a:runways[2].threshold,
        b:runways[2].farEnd
    }

];


/* =====================================================
   FILTER
===================================================== */

const helicopterTypes=
new Set([

    "A109","A119","A139","A149",
    "A169","A189",

    "AS32","AS50","AS55","AS65",

    "B06","B105","B212",
    "B222","B412","B429",

    "EC20","EC25","EC30",
    "EC35","EC45","EC55",

    "H125","H130","H135",
    "H145","H155","H160",

    "R22","R44","R66",

    "S55","S58","S61",
    "S64","S76","S92"

]);


const smallAircraftPrefixes=[

    "C15","C17","C18",
    "C19","C20","C21",
    "C22","C23","C24","C25",

    "PA18","PA20","PA22",
    "PA24","PA28","PA32",
    "PA34","PA38","PA44",

    "DA20","DA40","DA42",

    "SR20","SR22",

    "DR40",

    "P28",

    "M20",

    "BE23","BE24","BE33",
    "BE35","BE36",

    "DV20"

];


function unwantedAircraft(ac){

    const type=
        (ac.t||"")
        .trim()
        .toUpperCase();


    const category=
        (ac.category||"")
        .trim()
        .toUpperCase();


    if(category==="A7")
        return true;


    if(
        helicopterTypes.has(
            type
        )
    )
        return true;


    for(
        const prefix
        of smallAircraftPrefixes
    ){

        if(
            type.startsWith(
                prefix
            )
        )
            return true;
    }


    return false;
}


/* =====================================================
   MEMORY
===================================================== */

const history=
    new Map();


const arrivalMemory=
    new Map();


const landedBlacklist=
    new Map();


let departureLock=null;

let landedDisplay=null;


/* =====================================================
   HELPERS
===================================================== */

function aircraftId(ac){

    return (
        ac.hex ||
        ac.r ||
        (ac.flight||"").trim() ||
        null
    );
}


function onGround(ac){

    return (
        ac.alt_baro==="ground" ||
        ac.alt_geom==="ground"
    );
}


function altitude(ac){

    if(onGround(ac))
        return 0;


    let value=
        Number(
            ac.alt_baro
        );


    if(
        !Number.isFinite(
            value
        )
    )
        value=
            Number(
                ac.alt_geom
            );


    return Number.isFinite(
        value
    )
        ? value
        : null;
}


function groundSpeed(ac){

    const value=
        Number(
            ac.gs
        );


    return Number.isFinite(
        value
    )
        ? value
        : 0;
}


function verticalRate(ac){

    let value=
        Number(
            ac.baro_rate
        );


    if(
        !Number.isFinite(
            value
        )
    )
        value=
            Number(
                ac.geom_rate
            );


    return Number.isFinite(
        value
    )
        ? value
        : 0;
}


function headingDifference(
    a,
    b
){

    let d=
        Math.abs(
            a-b
        );


    if(d>180)
        d=
            360-d;


    return d;
}


function distanceKm(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=
        6371;


    const dLat=
        (
            lat2-lat1
        )*
        Math.PI/180;


    const dLon=
        (
            lon2-lon1
        )*
        Math.PI/180;


    const a=

        Math.sin(
            dLat/2
        )**2

        +

        Math.cos(
            lat1*
            Math.PI/180
        )

        *

        Math.cos(
            lat2*
            Math.PI/180
        )

        *

        Math.sin(
            dLon/2
        )**2;


    return R*2*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}


/* =====================================================
   AIRLINE
===================================================== */

function airlineName(
    callsign
){

    if(!callsign)
        return "";


    return airlines[
        callsign
        .trim()
        .toUpperCase()
        .substring(
            0,
            3
        )
    ] || "";
}


function headline(ac){

    const callsign=
        (ac.flight||"")
        .trim()

        ||

        "AIRCRAFT";


    const company=
        airlineName(
            callsign
        );


    return company

        ? company+
          "  •  "+
          callsign

        : callsign;
}


function aircraftDetails(ac){

    return [

        ac.t||"",
        ac.r||""

    ]
    .filter(
        Boolean
    )
    .join(
        "  •  "
    );
}


/* =====================================================
   GRAPHIC STATE
===================================================== */

const iconPaths={

    APPROACHING:
    "M4 28 L14 25 L20 13 L24 13 L23 24 L33 21 L36 23 L25 29 L21 35 L18 35 L19 30 L8 33 Z M7 37 H34",

    LANDED:
    "M4 28 L14 25 L20 18 L24 18 L23 24 L33 22 L36 24 L25 29 L21 33 L18 33 L19 30 L8 33 Z M5 36 H35",

    "TAKE OFF":
    "M4 31 L14 27 L20 15 L24 15 L23 25 L33 21 L36 23 L25 29 L21 35 L18 35 L19 30 L8 34 Z M5 37 L14 37"

};


function setVisualState(
    state
){

    const ribbon=
        document
        .getElementById(
            "ribbon"
        );


    ribbon.className=
        "ribbon";


    if(
        state===
        "APPROACHING"
    ){

        ribbon
        .classList
        .add(
            "approaching"
        );
    }


    else if(
        state===
        "LANDED"
    ){

        ribbon
        .classList
        .add(
            "landed"
        );
    }


    else if(
        state===
        "TAKE OFF"
    ){

        ribbon
        .classList
        .add(
            "takeoff"
        );
    }


    else{

        ribbon
        .classList
        .add(
            "idle"
        );
    }


    document
    .getElementById(
        "statePath"
    )
    .setAttribute(
        "d",
        iconPaths[state] || ""
    );
}


function showState(
    ac,
    state
){

    document
    .querySelector(
        ".airline"
    )
    .textContent=
        headline(ac);


    document
    .querySelector(
        ".details"
    )
    .textContent=
        aircraftDetails(ac);


    document
    .querySelector(
        ".status"
    )
    .textContent=
        state;


    setVisualState(
        state
    );
}


function clearDisplay(){

    document
    .querySelector(
        ".airline"
    )
    .textContent="";


    document
    .querySelector(
        ".details"
    )
    .textContent="";


    document
    .querySelector(
        ".status"
    )
    .textContent="";


    setVisualState(
        null
    );
}


/* =====================================================
   DISTANCE TO RUNWAY
===================================================== */

function distanceToRunway(
    lat,
    lon,
    runway
){

    const ref=

        (
            lat+
            runway.a.lat+
            runway.b.lat
        )
        /3;


    const ky=
        111.32;


    const kx=

        111.32*

        Math.cos(
            ref*
            Math.PI/180
        );


    const px=
        lon*kx;


    const py=
        lat*ky;


    const ax=
        runway.a.lon*kx;


    const ay=
        runway.a.lat*ky;


    const bx=
        runway.b.lon*kx;


    const by=
        runway.b.lat*ky;


    const vx=
        bx-ax;


    const vy=
        by-ay;


    const wx=
        px-ax;


    const wy=
        py-ay;


    const lengthSquared=

        vx*vx+
        vy*vy;


    let t=

        (
            wx*vx+
            wy*vy
        )
        /
        lengthSquared;


    t=

        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const cx=
        ax+t*vx;


    const cy=
        ay+t*vy;


    const dx=
        px-cx;


    const dy=
        py-cy;


    return Math.sqrt(
        dx*dx+
        dy*dy
    );
}


/* =====================================================
   GROUND RUNWAY AIRCRAFT
===================================================== */

function detectGroundRunwayAircraft(
    ac
){

    const ident=
        aircraftId(
            ac
        );


    if(
        !ident ||
        !onGround(ac)
    )
        return null;


    if(
        landedBlacklist
        .has(
            ident
        )
    )
        return null;


    if(
        arrivalMemory
        .has(
            ident
        )
    )
        return null;


    const lat=
        Number(
            ac.lat
        );


    const lon=
        Number(
            ac.lon
        );


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    )
        return null;


    let best=null;


    for(
        const runway
        of physicalRunways
    ){

        const d=
            distanceToRunway(
                lat,
                lon,
                runway
            );


        if(d>0.18)
            continue;


        const score=

            10000

            -

            d*10000

            +

            Math.min(
                groundSpeed(ac)*5,
                800
            );


        if(
            !best ||
            score>
            best.score
        ){

            best={

                ac,

                physicalRunway:
                    runway.name,

                score
            };
        }
    }


    return best;
}


/* =====================================================
   BEST RUNWAY
===================================================== */

function bestRunway(
    track
){

    let best=null;

    let difference=999;


    for(
        const runway
        of runways
    ){

        const d=
            headingDifference(
                track,
                runway.heading
            );


        if(
            d<
            difference
        ){

            difference=d;

            best=runway;
        }
    }


    return {
        runway:best,
        difference
    };
}


/* =====================================================
   ARRIVAL
===================================================== */

function detectArrival(
    ac
){

    if(
        onGround(ac)
    )
        return null;


    const ident=
        aircraftId(ac);


    if(!ident)
        return null;


    if(
        departureLock===
        ident
    )
        return null;


    const lat=
        Number(
            ac.lat
        );


    const lon=
        Number(
            ac.lon
        );


    const track=
        Number(
            ac.track
        );


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        !Number.isFinite(track)
    )
        return null;


    if(
        verticalRate(ac)>
        600
    )
        return null;


    const match=
        bestRunway(
            track
        );


    if(
        !match.runway ||
        match.difference>
        40
    )
        return null;


    const runway=
        match.runway;


    const distance=
        distanceKm(

            lat,
            lon,

            runway
            .threshold
            .lat,

            runway
            .threshold
            .lon

        );


    if(
        distance>
        3
    )
        return null;


    arrivalMemory
    .set(
        ident,
        {

            runway,

            lastSeen:
                Date.now()

        }
    );


    return {

        ac,
        runway,
        distance,

        score:

            10000

            -

            distance*
            1000

            -

            match
            .difference*
            20
    };
}


/* =====================================================
   TOUCHDOWN
===================================================== */

function detectTouchdown(
    aircraft
){

    for(
        const ac
        of aircraft
    ){

        const ident=
            aircraftId(
                ac
            );


        if(
            !ident ||
            !onGround(ac)
        )
            continue;


        const memory=
            arrivalMemory
            .get(
                ident
            );


        if(
            !memory
        )
            continue;


        let onAnyRunway=false;


        for(
            const runway
            of physicalRunways
        ){

            const d=
                distanceToRunway(

                    Number(
                        ac.lat
                    ),

                    Number(
                        ac.lon
                    ),

                    runway
                );


            if(
                d<=
                0.20
            ){

                onAnyRunway=true;

                break;
            }
        }


        if(
            onAnyRunway
        ){

            return {

                ac,

                runway:
                    memory
                    .runway

            };
        }
    }


    return null;
}


/* =====================================================
   AIRBORNE DEPARTURE
===================================================== */

function detectAirborneDeparture(
    ac
){

    if(
        onGround(ac)
    )
        return null;


    const ident=
        aircraftId(
            ac
        );


    if(!ident)
        return null;


    if(

        landedBlacklist
        .has(
            ident
        )

        ||

        arrivalMemory
        .has(
            ident
        )

    )
        return null;


    const alt=
        altitude(
            ac
        );


    if(
        alt===null ||
        alt>=3000
    )
        return null;


    if(
        verticalRate(ac)<
        100
    )
        return null;


    const old=
        history
        .get(
            ident
        );


    let score=
        5000-
        alt;


    if(
        old &&
        old.ground
    )
        score+=
            30000;


    return {
        ac,
        score
    };
}


/* =====================================================
   HISTORY
===================================================== */

function saveHistory(
    aircraft
){

    for(
        const ac
        of aircraft
    ){

        const ident=
            aircraftId(
                ac
            );


        if(
            !ident
        )
            continue;


        history
        .set(
            ident,
            {

                ground:
                    onGround(ac),

                speed:
                    groundSpeed(ac),

                altitude:
                    altitude(ac),

                time:
                    Date.now()

            }
        );
    }
}


/* =====================================================
   CLEANUP
===================================================== */

function cleanup(){

    const now=
        Date.now();


    for(
        const [ident,expiry]
        of landedBlacklist
    ){

        if(
            now>=expiry
        )
            landedBlacklist
            .delete(
                ident
            );
    }


    for(
        const [ident,item]
        of arrivalMemory
    ){

        if(
            now-
            item.lastSeen>
            60000
        )
            arrivalMemory
            .delete(
                ident
            );
    }


    for(
        const [ident,item]
        of history
    ){

        if(
            now-
            item.time>
            600000
        )
            history
            .delete(
                ident
            );
    }
}


/* =====================================================
   MAIN
===================================================== */

async function update(){

    cleanup();


    try{

        const response=
            await fetch(

                API+
                "?t="+
                Date.now(),

                {
                    cache:
                        "no-store"
                }

            );


        if(
            !response.ok
        )
            throw new Error(
                "HTTP "+
                response.status
            );


        const data=
            await response
            .json();


        const aircraft=

            (data.ac||[])

            .filter(
                ac =>

                Number.isFinite(
                    Number(
                        ac.lat
                    )
                )

                &&

                Number.isFinite(
                    Number(
                        ac.lon
                    )
                )
            )

            .filter(
                ac =>

                !unwantedAircraft(
                    ac
                )
            );


        /*
           TOUCHDOWN
        */

        const touchdown=
            detectTouchdown(
                aircraft
            );


        if(
            touchdown
        ){

            const ident=
                aircraftId(
                    touchdown.ac
                );


            landedBlacklist
            .set(
                ident,

                Date.now()+
                5*60*1000
            );


            arrivalMemory
            .delete(
                ident
            );


            if(
                departureLock===
                ident
            )
                departureLock=null;


            landedDisplay={

                ac:
                    touchdown.ac,

                until:
                    Date.now()+
                    10000

            };


            showState(
                touchdown.ac,
                "LANDED"
            );


            saveHistory(
                aircraft
            );


            return;
        }


        /*
           GROUND AIRCRAFT
           ON RUNWAY
        */

        let runwayAircraft=
            null;


        for(
            const ac
            of aircraft
        ){

            const candidate=
                detectGroundRunwayAircraft(
                    ac
                );


            if(
                !candidate
            )
                continue;


            if(

                !runwayAircraft

                ||

                candidate.score>
                runwayAircraft.score

            )
                runwayAircraft=
                    candidate;
        }


        if(
            runwayAircraft
        ){

            const ac=
                runwayAircraft.ac;


            departureLock=
                aircraftId(
                    ac
                );


            showState(
                ac,
                "TAKE OFF"
            );


            saveHistory(
                aircraft
            );


            return;
        }


        /*
           ACTIVE DEPARTURE
        */

        if(
            departureLock
        ){

            const ac=
                aircraft.find(
                    item =>

                    aircraftId(item)===
                    departureLock
                );


            if(
                ac
            ){

                const alt=
                    altitude(
                        ac
                    );


                if(

                    !onGround(ac)

                    &&

                    alt!==null

                    &&

                    alt<3000

                ){

                    showState(
                        ac,
                        "TAKE OFF"
                    );


                    saveHistory(
                        aircraft
                    );


                    return;
                }


                if(
                    alt!==null &&
                    alt>=3000
                )
                    departureLock=null;
            }


            else{

                departureLock=null;
            }
        }


        /*
           LANDED HOLD
        */

        if(
            landedDisplay
        ){

            if(

                Date.now()<
                landedDisplay.until

            ){

                showState(

                    landedDisplay.ac,

                    "LANDED"

                );


                saveHistory(
                    aircraft
                );


                return;
            }


            landedDisplay=null;
        }


        /*
           APPROACHING
        */

        const arrivals=[];


        for(
            const ac
            of aircraft
        ){

            const candidate=
                detectArrival(
                    ac
                );


            if(
                candidate
            )
                arrivals
                .push(
                    candidate
                );
        }


        arrivals
        .sort(
            (a,b)=>
            b.score-
            a.score
        );


        if(
            arrivals.length
        ){

            showState(

                arrivals[0].ac,

                "APPROACHING"

            );


            saveHistory(
                aircraft
            );


            return;
        }


        /*
           DEPARTURE BACKUP
        */

        let airborneDeparture=
            null;


        for(
            const ac
            of aircraft
        ){

            const candidate=
                detectAirborneDeparture(
                    ac
                );


            if(
                !candidate
            )
                continue;


            if(

                !airborneDeparture

                ||

                candidate.score>
                airborneDeparture.score

            )
                airborneDeparture=
                    candidate;
        }


        if(
            airborneDeparture
        ){

            const ac=
                airborneDeparture.ac;


            departureLock=
                aircraftId(
                    ac
                );


            showState(
                ac,
                "TAKE OFF"
            );


            saveHistory(
                aircraft
            );


            return;
        }


        clearDisplay();

        saveHistory(
            aircraft
        );

    }


    catch(error){

        console.error(
            error
        );


        clearDisplay();
    }
}


update();


setInterval(
    update,
    3000
);

</script>
