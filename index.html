<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
html,body{
 margin:0;padding:0;width:100%;height:100%;
 background:transparent;overflow:hidden;
 font-family:Arial,Helvetica,sans-serif;
}
.ribbon{
 position:absolute;bottom:0;left:0;width:100%;height:105px;
 background:rgb(0,55,110);color:white;display:flex;
 align-items:center;box-sizing:border-box;
}
.airport{width:23%;padding-left:25px;box-sizing:border-box;font-size:22px;font-weight:bold}
.live{color:#ff3333;font-size:16px;margin-bottom:5px}
.aircraft-info{width:52%;padding-left:25px;border-left:2px solid rgba(255,255,255,.25);box-sizing:border-box}
.airline{font-size:25px;font-weight:bold}
.details{font-size:19px;margin-top:6px;opacity:.9}
.status{font-size:16px;margin-top:5px;color:#8fd3ff}
.visual{width:25%;padding-right:20px;text-align:center;box-sizing:border-box}
.visual-main{font-size:24px;font-weight:bold}
.visual-sub{font-size:14px;margin-top:7px;opacity:.85}
</style>
</head>

<body>

<div class="ribbon">
 <div class="airport">
  <div class="live">● LIVE</div>
  PRAGUE AIRPORT
  <div>LKPR / PRG</div>
 </div>

 <div class="aircraft-info">
  <div class="airline"></div>
  <div class="details"></div>
  <div class="status"></div>
 </div>

 <div class="visual">
  <div class="visual-main"></div>
  <div class="visual-sub"></div>
 </div>
</div>

<script>

const API =
"https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft";

const AIRPORT = {lat:50.1008,lon:14.2600};

const airlines={
 TVS:"SMARTWINGS",RYR:"RYANAIR",UAE:"EMIRATES",
 PGT:"PEGASUS AIRLINES",AUA:"AUSTRIAN AIRLINES",
 DLH:"LUFTHANSA",KLM:"KLM",BAW:"BRITISH AIRWAYS",
 EZY:"EASYJET",WZZ:"WIZZ AIR",QTR:"QATAR AIRWAYS",
 THY:"TURKISH AIRLINES",AFR:"AIR FRANCE",
 SWR:"SWISS",LOT:"LOT POLISH AIRLINES",
 SAS:"SAS",FIN:"FINNAIR",IBE:"IBERIA",
 TAP:"TAP AIR PORTUGAL",ITY:"ITA AIRWAYS",
 EIN:"AER LINGUS",VLG:"VUELING",EWG:"EUROWINGS",
 AEE:"AEGEAN AIRLINES",BTI:"AIRBALTIC",
 BEL:"BRUSSELS AIRLINES",TRA:"TRANSAVIA",
 EXS:"JET2",TUI:"TUI",ETD:"ETIHAD AIRWAYS",
 ELY:"EL AL",MSR:"EGYPTAIR"
};

/*
 OFFICIAL PRG THRESHOLDS
 Decimal conversion from Czech AIP.
*/

const ends=[
 {name:"06",heading:60,lat:50.1018361,lon:14.2263000},
 {name:"24",heading:240,lat:50.1159500,lon:14.2733667},
 {name:"12",heading:122,lat:50.1080111,lon:14.2453667},
 {name:"30",heading:302,lat:50.0904667,lon:14.2816722}
];

const lines=[
 {
  name:"06/24",
  a:ends[0],b:ends[1],
  directions:[ends[0],ends[1]]
 },
 {
  name:"12/30",
  a:ends[2],b:ends[3],
  directions:[ends[2],ends[3]]
 }
];


/* AIRCRAFT MEMORY */

const history=new Map();

/*
 landingAircraft contains aircraft
 that were genuinely approaching.
 This is important because AIR -> GROUND
 then becomes proof of touchdown.
*/

const landingAircraft=new Map();

/*
 landedBlacklist prevents rollout aircraft
 being mistaken for departures.
*/

const landedBlacklist=new Map();

let departureLock=null;
let landedDisplay=null;


/* BASIC HELPERS */

function id(ac){
 return ac.hex || ac.r || (ac.flight||"").trim() || null;
}

function ground(ac){
 return ac.alt_baro==="ground" || ac.alt_geom==="ground";
}

function altitude(ac){
 if(ground(ac)) return 0;

 let x=Number(ac.alt_baro);
 if(!Number.isFinite(x)) x=Number(ac.alt_geom);

 return Number.isFinite(x)?x:null;
}

function speed(ac){
 const x=Number(ac.gs);
 return Number.isFinite(x)?x:0;
}

function rate(ac){
 let x=Number(ac.baro_rate);
 if(!Number.isFinite(x)) x=Number(ac.geom_rate);
 return Number.isFinite(x)?x:0;
}

function angle(a,b){
 let x=Math.abs(a-b);
 if(x>180)x=360-x;
 return x;
}

function km(lat1,lon1,lat2,lon2){
 const R=6371;
 const p1=lat1*Math.PI/180;
 const p2=lat2*Math.PI/180;
 const dp=(lat2-lat1)*Math.PI/180;
 const dl=(lon2-lon1)*Math.PI/180;

 const a=
  Math.sin(dp/2)**2+
  Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;

 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function airline(callsign){
 if(!callsign)return "";
 return airlines[callsign.trim().toUpperCase().slice(0,3)]||"";
}

function title(ac){
 const cs=(ac.flight||"").trim()||"AIRCRAFT";
 const al=airline(cs);
 return al ? al+"  •  "+cs : cs;
}

function details(ac){
 return [ac.t||"",ac.r||""].filter(Boolean).join("  •  ");
}

function show(ac,status,big="",small=""){
 document.querySelector(".airline").textContent=title(ac);
 document.querySelector(".details").textContent=details(ac);
 document.querySelector(".status").textContent=status;
 document.querySelector(".visual-main").textContent=big;
 document.querySelector(".visual-sub").textContent=small;
}

function clear(){
 document.querySelector(".airline").textContent="";
 document.querySelector(".details").textContent="";
 document.querySelector(".status").textContent="";
 document.querySelector(".visual-main").textContent="";
 document.querySelector(".visual-sub").textContent="";
}


/* DISTANCE TO RUNWAY CENTRELINE */

function runwayDistance(lat,lon,r){

 const ref=(lat+r.a.lat+r.b.lat)/3;
 const ky=111.32;
 const kx=111.32*Math.cos(ref*Math.PI/180);

 const px=lon*kx,py=lat*ky;
 const ax=r.a.lon*kx,ay=r.a.lat*ky;
 const bx=r.b.lon*kx,by=r.b.lat*ky;

 const dx=bx-ax,dy=by-ay;
 const len=dx*dx+dy*dy;

 let t=((px-ax)*dx+(py-ay)*dy)/len;
 t=Math.max(0,Math.min(1,t));

 const cx=ax+t*dx;
 const cy=ay+t*dy;

 return Math.sqrt((px-cx)**2+(py-cy)**2);
}


/* WHICH RUNWAY DIRECTION? */

function runwayHeading(track,line){

 let best=null;
 let diff=999;

 for(const r of line.directions){
  const d=angle(track,r.heading);
  if(d<diff){
   diff=d;
   best=r;
  }
 }

 return {runway:best,diff};
}


/* IDENTIFY AN ARRIVAL */

function arrival(ac){

 if(ground(ac))return null;

 const ident=id(ac);
 if(!ident)return null;

 if(departureLock===ident)return null;

 const lat=Number(ac.lat);
 const lon=Number(ac.lon);
 const track=Number(ac.track);

 if(!Number.isFinite(lat)||
    !Number.isFinite(lon)||
    !Number.isFinite(track))return null;

 const alt=altitude(ac);

 if(alt!==null && alt>7000)return null;
 if(rate(ac)>600)return null;

 let best=null;
 let diff=999;

 for(const r of ends){
  const d=angle(track,r.heading);
  if(d<diff){
   diff=d;
   best=r;
  }
 }

 if(!best || diff>40)return null;

 const distance=km(lat,lon,best.lat,best.lon);

 if(distance>25)return null;

 const old=history.get(ident);

 let approaching=false;

 if(old && Number.isFinite(old.arrivalDistance)){
  approaching=distance<old.arrivalDistance;
 }

 let score=1000-distance*30-diff*5;

 if(approaching)score+=600;
 if(rate(ac)<-150)score+=300;

 /*
  Once an aircraft is a convincing arrival
  within 8 km, remember that identity.
 */

 if(distance<=8){
  landingAircraft.set(ident,{
   runway:best,
   lastSeen:Date.now()
  });
 }

 return {ac,runway:best,distance,score};
}


/* DETECT REAL TOUCHDOWN

 Key rule:

 tracked arrival on previous updates
 +
 now ADS-B says GROUND
 =
 LANDED

 We do NOT care whether the next position
 has jumped 500 m or 2 km down the runway.
*/

function detectTouchdown(aircraft){

 for(const ac of aircraft){

  const ident=id(ac);
  if(!ident || !ground(ac))continue;

  const approach=landingAircraft.get(ident);

  if(!approach)continue;

  const old=history.get(ident);

  /*
   Prefer explicit AIR -> GROUND transition.
   Also allow a remembered close arrival
   because a feed update can be missed.
  */

  if(
   (old && !old.ground) ||
   Date.now()-approach.lastSeen<20000
  ){

   return {
    ac,
    runway:approach.runway
   };
  }
 }

 return null;
}


/* DEPARTURE AIRCRAFT ON RUNWAY */

function runwayDeparture(ac){

 const ident=id(ac);

 if(!ident || !ground(ac))return null;

 /*
  Absolutely never classify a recently
  landed aircraft as a departure.
 */

 if(landedBlacklist.has(ident))return null;

 /*
  An aircraft currently remembered as
  an arrival is also not a departure.
 */

 if(landingAircraft.has(ident))return null;

 const lat=Number(ac.lat);
 const lon=Number(ac.lon);
 const track=Number(ac.track);

 if(!Number.isFinite(lat)||
    !Number.isFinite(lon)||
    !Number.isFinite(track))return null;

 let result=null;

 for(const line of lines){

  const d=runwayDistance(lat,lon,line);

  /*
   Runway width is 45 m.
   We deliberately allow position error,
   but not a large taxiway area.
  */

  if(d>0.10)continue;

  const direction=runwayHeading(track,line);

  if(direction.diff>18)continue;

  /*
   Require some movement or history
   near the runway. This reduces parked/
   erroneous ground targets.
  */

  const gs=speed(ac);

  let score=
   10000-
   d*10000-
   direction.diff*50+
   Math.min(gs*5,800);

  if(!result || score>result.score){
   result={
    ac,
    runway:direction.runway,
    score
   };
  }
 }

 return result;
}


/* NEW AIRBORNE DEPARTURE BACKUP */

function airborneDeparture(ac){

 if(ground(ac))return null;

 const ident=id(ac);

 if(!ident)return null;
 if(landedBlacklist.has(ident))return null;
 if(landingAircraft.has(ident))return null;

 const alt=altitude(ac);

 if(alt===null || alt>=2500)return null;
 if(rate(ac)<150)return null;

 const d=km(
  Number(ac.lat),Number(ac.lon),
  AIRPORT.lat,AIRPORT.lon
 );

 if(d>7)return null;

 const old=history.get(ident);

 let score=1000-alt/5-d*30;

 /*
  GROUND -> AIR is very strong
  departure evidence.
 */

 if(old && old.ground)score+=20000;

 return {ac,score};
}


/* HOUSEKEEPING */

function cleanup(){

 const now=Date.now();

 for(const [ident,expiry] of landedBlacklist){
  if(now>expiry)landedBlacklist.delete(ident);
 }

 for(const [ident,item] of landingAircraft){
  if(now-item.lastSeen>60000)
   landingAircraft.delete(ident);
 }

 for(const [ident,item] of history){
  if(now-item.time>600000)
   history.delete(ident);
 }
}


/* SAVE CURRENT SNAPSHOT */

function save(aircraft){

 for(const ac of aircraft){

  const ident=id(ac);
  if(!ident)continue;

  let arrivalDistance=999;

  const remembered=landingAircraft.get(ident);

  if(remembered && !ground(ac)){
   arrivalDistance=km(
    Number(ac.lat),
    Number(ac.lon),
    remembered.runway.lat,
    remembered.runway.lon
   );
  }

  history.set(ident,{
   ground:ground(ac),
   speed:speed(ac),
   altitude:altitude(ac),
   arrivalDistance,
   time:Date.now()
  });
 }
}


/* MAIN ENGINE */

async function update(){

 cleanup();

 try{

  const response=await fetch(
   API+"?t="+Date.now(),
   {cache:"no-store"}
  );

  if(!response.ok)
   throw new Error("HTTP "+response.status);

  const data=await response.json();

  const aircraft=(data.ac||[]).filter(ac=>
   Number.isFinite(Number(ac.lat)) &&
   Number.isFinite(Number(ac.lon))
  );


  /*
   =====================================
   PRIORITY 1 — REAL TOUCHDOWN
   =====================================
  */

  const touchdown=detectTouchdown(aircraft);

  if(touchdown){

   const ident=id(touchdown.ac);

   landedBlacklist.set(
    ident,
    Date.now()+5*60*1000
   );

   landingAircraft.delete(ident);

   if(departureLock===ident)
    departureLock=null;

   landedDisplay={
    ac:touchdown.ac,
    runway:touchdown.runway,
    until:Date.now()+12000
   };

   show(
    touchdown.ac,
    "LANDED  •  RWY "+touchdown.runway.name,
    "LANDED",
    "PRAGUE"
   );

   save(aircraft);
   return;
  }


  /*
   Hold LANDED display briefly.
   The aircraft remains blacklisted
   after the display clears.
  */

  if(landedDisplay){

   if(Date.now()<landedDisplay.until){

    show(
     landedDisplay.ac,
     "LANDED  •  RWY "+landedDisplay.runway.name,
     "LANDED",
     "PRAGUE"
    );

    save(aircraft);
    return;

   }else{

    landedDisplay=null;
   }
  }


  /*
   =====================================
   PRIORITY 2 — DEPARTURE ON RUNWAY

   This is checked BEFORE ANY ARRIVAL.
   =====================================
  */

  let dep=null;

  for(const ac of aircraft){

   const candidate=runwayDeparture(ac);

   if(candidate &&
      (!dep || candidate.score>dep.score))
    dep=candidate;
  }

  if(dep){

   const ident=id(dep.ac);

   departureLock=ident;

   const gs=speed(dep.ac);

   if(gs>=45){

    show(
     dep.ac,
     "TAKEOFF ROLL  •  RWY "+
     dep.runway.name+
     "  •  "+Math.round(gs)+" KT",
     "TAKEOFF",
     "RWY "+dep.runway.name
    );

   }else{

    show(
     dep.ac,
     "LINED UP  •  RWY "+
     dep.runway.name+
     "  •  READY FOR DEPARTURE",
     "LINED UP",
     "RWY "+dep.runway.name
    );
   }

   save(aircraft);
   return;
  }


  /*
   =====================================
   PRIORITY 3 — LOCKED DEPARTURE
   =====================================
  */

  if(departureLock){

   const ac=aircraft.find(
    x=>id(x)===departureLock
   );

   if(ac){

    const alt=altitude(ac);

    if(!ground(ac) &&
       alt!==null &&
       alt<3000){

     show(
      ac,
      (alt<1000?"DEPARTED":"CLIMBING")+
      "  •  "+
      Math.round(alt).toLocaleString()+
      " FT",
      alt<1000?"DEPARTED":"CLIMBING",
      Math.round(speed(ac))+" KT"
     );

     save(aircraft);
     return;
    }

    if(alt!==null && alt>=3000)
     departureLock=null;

   }else{

    departureLock=null;
   }
  }


  /*
   =====================================
   BUILD ARRIVALS
   =====================================
  */

  const arrivals=[];

  for(const ac of aircraft){

   const a=arrival(ac);

   if(a)arrivals.push(a);
  }

  arrivals.sort((a,b)=>b.score-a.score);


  /*
   =====================================
   PRIORITY 4 — SHORT FINAL
   =====================================
  */

  const shortFinal=
   arrivals.find(a=>a.distance<=3);

  if(shortFinal){

   show(
    shortFinal.ac,
    "ON FINAL  •  RWY "+
    shortFinal.runway.name+
    "  •  "+
    shortFinal.distance.toFixed(1)+
    " KM",
    "LANDING",
    "RWY "+shortFinal.runway.name
   );

   save(aircraft);
   return;
  }


  /*
   =====================================
   PRIORITY 5 — GROUND -> AIR BACKUP
   =====================================
  */

  let newDep=null;

  for(const ac of aircraft){

   const candidate=airborneDeparture(ac);

   if(candidate &&
      (!newDep || candidate.score>newDep.score))
    newDep=candidate;
  }

  if(newDep){

   const ac=newDep.ac;
   const alt=altitude(ac);

   departureLock=id(ac);

   show(
    ac,
    (alt<1000?"DEPARTED":"CLIMBING")+
    "  •  "+
    Math.round(alt).toLocaleString()+
    " FT",
    "DEPARTURE",
    Math.round(speed(ac))+" KT"
   );

   save(aircraft);
   return;
  }


  /*
   =====================================
   PRIORITY 6 — NORMAL ARRIVAL
   =====================================
  */

  if(arrivals.length){

   const a=arrivals[0];

   show(
    a.ac,
    (a.distance<=8?"APPROACHING":"INBOUND")+
    "  •  RWY "+
    a.runway.name+
    "  •  "+
    a.distance.toFixed(1)+
    " KM",
    a.distance<=8?"APPROACHING":"INBOUND",
    "RWY "+a.runway.name
   );

   save(aircraft);
   return;
  }


  clear();
  save(aircraft);

 }catch(e){

  console.error(e);
  clear();
 }
}

update();
setInterval(update,3000);

</script>
</body>
</html>
