<script>
const airportLat = 50.1008;
const airportLon = 14.2600;

const previousDistances = new Map();

let currentAircraftId = null;
let landedUntil = 0;
let landedAircraft = null;

const runways = [
    { runway: "06", heading: 60,  lat: 50.101836, lon: 14.226300 },
    { runway: "24", heading: 240, lat: 50.115950, lon: 14.273367 },
    { runway: "12", heading: 122, lat: 50.108011, lon: 14.245367 },
    { runway: "30", heading: 302, lat: 50.090467, lon: 14.281672 }
];

function distanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

    return R * 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
    );
}

function bearingTo(lat1, lon1, lat2, lon2) {
    const phi1 = lat1 * Math.PI / 180;
    const phi2 = lat2 * Math.PI / 180;
    const deltaLon = (lon2 - lon1) * Math.PI / 180;

    const y =
        Math.sin(deltaLon) *
        Math.cos(phi2);

    const x =
        Math.cos(phi1) *
        Math.sin(phi2) -
        Math.sin(phi1) *
        Math.cos(phi2) *
        Math.cos(deltaLon);

    let bearing =
        Math.atan2(y, x) *
        180 / Math.PI;

    return (bearing + 360) % 360;
}

function headingDifference(a, b) {
    let difference = Math.abs(a - b);

    if (difference > 180) {
        difference = 360 - difference;
    }

    return difference;
}

function aircraftId(ac) {
    return ac.hex || ac.r || ac.flight || null;
}

function numericAltitude(ac) {
    if (
        ac.alt_baro === "ground" ||
        ac.alt_baro === null ||
        ac.alt_baro === undefined
    ) {
        return null;
    }

    const value = Number(ac.alt_baro);

    return Number.isFinite(value)
        ? value
        : null;
}

function closestRunway(track) {
    let best = null;
    let bestDifference = 999;

    runways.forEach(rwy => {
        const difference =
            headingDifference(
                track,
                rwy.heading
            );

        if (difference < bestDifference) {
            bestDifference = difference;
            best = rwy;
        }
    });

    return {
        runway: best,
        difference: bestDifference
    };
}

function clearAircraftDisplay() {
    document.querySelector(".airline").textContent = "";
    document.querySelector(".details").textContent = "";
    document.querySelector(".status").textContent = "";
}

function scoreAircraft(ac) {
    let score = 0;

    const id = aircraftId(ac);
    const lat = Number(ac.lat);
    const lon = Number(ac.lon);

    const distance =
        distanceKm(
            lat,
            lon,
            airportLat,
            airportLon
        );

    const altitude =
        numericAltitude(ac);

    const verticalRate =
        Number(ac.baro_rate);

    const track =
        Number(ac.track);

    /*
       NEVER SELECT AIRCRAFT
       ALREADY ON THE GROUND
    */

    if (ac.alt_baro === "ground") {
        return -9999;
    }

    /*
       MAXIMUM APPROACH RANGE
    */

    if (distance > 25) {
        return -9999;
    }

    /*
       IGNORE CRUISE TRAFFIC
    */

    if (
        altitude !== null &&
        altitude > 12000
    ) {
        return -9999;
    }

    /*
       HARD REJECT CLIMBING AIRCRAFT

       This is the main takeoff filter.
    */

    if (
        Number.isFinite(verticalRate) &&
        verticalRate > 150
    ) {
        return -9999;
    }

    /*
       FARTHER/HIGHER AIRCRAFT MUST
       ALREADY BE DESCENDING
    */

    if (
        altitude !== null &&
        altitude > 7000
    ) {
        if (
            !Number.isFinite(verticalRate) ||
            verticalRate >= -100
        ) {
            return -9999;
        }
    }

    /*
       TRACK MUST MAKE SENSE
       FOR A PRAGUE ARRIVAL
    */

    if (Number.isFinite(track)) {

        const airportBearing =
            bearingTo(
                lat,
                lon,
                airportLat,
                airportLon
            );

        const towardDifference =
            headingDifference(
                track,
                airportBearing
            );

        /*
           If more than 55 degrees away
           from pointing toward Prague,
           reject it completely.
        */

        if (towardDifference > 55) {
            return -9999;
        }

        if (towardDifference < 20) {
            score += 200;
        }
        else if (towardDifference < 35) {
            score += 130;
        }
        else {
            score += 50;
        }

        const runwayMatch =
            closestRunway(track);

        if (runwayMatch.difference > 45) {
            return -9999;
        }

        if (runwayMatch.difference < 15) {
            score += 150;
        }
        else if (runwayMatch.difference < 30) {
            score += 90;
        }
        else {
            score += 30;
        }
    }

    /*
       CHECK WHETHER IT IS ACTUALLY
       GETTING CLOSER BETWEEN UPDATES
    */

    const previousDistance =
        id
            ? previousDistances.get(id)
            : undefined;

    if (previousDistance !== undefined) {

        const movement =
            previousDistance - distance;

        /*
           Moving away = reject.
        */

        if (movement < -0.05) {
            return -9999;
        }

        if (movement > 0.15) {
            score += 200;
        }
        else if (movement > 0.03) {
            score += 120;
        }
    }

    /*
       DISTANCE
    */

    if (distance < 3) {
        score += 90;
    }
    else if (distance < 6) {
        score += 70;
    }
    else if (distance < 10) {
        score += 50;
    }
    else if (distance < 15) {
        score += 30;
    }
    else {
        score += 10;
    }

    /*
       ALTITUDE
    */

    if (altitude !== null) {
        if (altitude < 1500) {
            score += 80;
        }
        else if (altitude < 3000) {
            score += 60;
        }
        else if (altitude < 5000) {
            score += 40;
        }
        else if (altitude < 7000) {
            score += 20;
        }
    }

    /*
       DESCENT
    */

    if (Number.isFinite(verticalRate)) {
        if (verticalRate < -500) {
            score += 90;
        }
        else if (verticalRate < -100) {
            score += 60;
        }
    }

    if (ac.flight) score += 15;
    if (ac.r) score += 10;
    if (ac.t) score += 10;

    /*
       KEEP THE CURRENT INBOUND
       STABLE ON SCREEN
    */

    if (
        id &&
        id === currentAircraftId
    ) {
        score += 40;
    }

    return score;
}

async function updateAircraft() {
    const airline =
        document.querySelector(".airline");

    const details =
        document.querySelector(".details");

    const status =
        document.querySelector(".status");

    /*
       HOLD LANDED MESSAGE FOR 10 SECONDS
    */

    if (
        landedAircraft &&
        Date.now() < landedUntil
    ) {
        airline.textContent =
            landedAircraft.callsign;

        details.textContent =
            landedAircraft.type +
            "  •  " +
            landedAircraft.registration;

        status.textContent =
            "LANDED  •  PRAGUE";

        return;
    }

    /*
       LANDING HOLD FINISHED:
       CLEAR EVERYTHING
    */

    if (
        landedAircraft &&
        Date.now() >= landedUntil
    ) {
        landedAircraft = null;
        currentAircraftId = null;
        clearAircraftDisplay();
    }

    try {
        const response =
            await fetch(
                "https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft"
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " +
                response.status
            );
        }

        const wrapper =
            await response.json();

        const data =
            wrapper.upstreamText
                ? JSON.parse(
                    wrapper.upstreamText
                )
                : wrapper;

        if (
            !data.ac ||
            data.ac.length === 0
        ) {
            clearAircraftDisplay();
            return;
        }

        const candidates =
            data.ac.filter(ac => {
                const lat = Number(ac.lat);
                const lon = Number(ac.lon);

                if (
                    !Number.isFinite(lat) ||
                    !Number.isFinite(lon)
                ) {
                    return false;
                }

                /*
                   Ground aircraft can NEVER
                   become a fresh candidate.
                */

                if (ac.alt_baro === "ground") {
                    return false;
                }

                const distance =
                    distanceKm(
                        lat,
                        lon,
                        airportLat,
                        airportLon
                    );

                return (
                    distance <= 25 &&
                    (ac.flight || ac.r || ac.t)
                );
            });

        if (candidates.length === 0) {
            currentAircraftId = null;
            clearAircraftDisplay();
            return;
        }

        candidates.sort(
            (a, b) =>
                scoreAircraft(b) -
                scoreAircraft(a)
        );

        const aircraft =
            candidates[0];

        const aircraftScore =
            scoreAircraft(aircraft);

        /*
           NOTHING QUALIFIES
           AS A PROPER PRAGUE ARRIVAL
        */

        if (aircraftScore < 100) {

            currentAircraftId = null;

            candidates.forEach(ac => {
                const id =
                    aircraftId(ac);

                if (!id) return;

                previousDistances.set(
                    id,
                    distanceKm(
                        Number(ac.lat),
                        Number(ac.lon),
                        airportLat,
                        airportLon
                    )
                );
            });

            clearAircraftDisplay();
            return;
        }

        currentAircraftId =
            aircraftId(aircraft);

        /*
           SAVE POSITIONS FOR NEXT UPDATE
        */

        candidates.forEach(ac => {
            const id =
                aircraftId(ac);

            if (!id) return;

            previousDistances.set(
                id,
                distanceKm(
                    Number(ac.lat),
                    Number(ac.lon),
                    airportLat,
                    airportLon
                )
            );
        });

        const callsign =
            aircraft.flight &&
            aircraft.flight.trim()
                ? aircraft.flight.trim()
                : "UNKNOWN FLIGHT";

        const registration =
            aircraft.r ||
            "REG UNKNOWN";

        const type =
            aircraft.t ||
            "TYPE UNKNOWN";

        const track =
            Number(aircraft.track);

        const altitude =
            numericAltitude(aircraft);

        let selectedRunway = null;

        if (Number.isFinite(track)) {
            const match =
                closestRunway(track);

            if (match.difference <= 35) {
                selectedRunway =
                    match.runway;
            }
        }

        let displayDistance =
            distanceKm(
                Number(aircraft.lat),
                Number(aircraft.lon),
                airportLat,
                airportLon
            );

        if (selectedRunway) {
            displayDistance =
                distanceKm(
                    Number(aircraft.lat),
                    Number(aircraft.lon),
                    selectedRunway.lat,
                    selectedRunway.lon
                );
        }

        /*
           TOUCHDOWN DETECTION
        */

        const reachedRunway =
            selectedRunway &&
            displayDistance <= 0.6;

        if (reachedRunway) {

            landedAircraft = {
                callsign:
                    callsign,

                registration:
                    registration,

                type:
                    type
            };

            landedUntil =
                Date.now() + 10000;

            airline.textContent =
                callsign;

            details.textContent =
                type +
                "  •  " +
                registration;

            status.textContent =
                "LANDED  •  PRAGUE";

            return;
        }

        let arrivalStatus =
            "INBOUND";

        if (displayDistance <= 8) {
            arrivalStatus =
                "APPROACHING";
        }

        if (
            displayDistance <= 4 &&
            (
                altitude === null ||
                altitude < 2500
            )
        ) {
            arrivalStatus =
                "ON FINAL";
        }

        airline.textContent =
            callsign;

        details.textContent =
            type +
            "  •  " +
            registration;

        status.textContent =
            arrivalStatus +
            (
                selectedRunway
                    ? " RWY " +
                      selectedRunway.runway
                    : ""
            ) +
            "  •  " +
            displayDistance.toFixed(1) +
            " KM";
    }

    catch (error) {
        clearAircraftDisplay();
        console.error(error);
    }
}

updateAircraft();

setInterval(
    updateAircraft,
    5000
);
</script>
