<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:transparent;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

.ribbon{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:105px;
    background:rgb(0,55,110);
    color:white;
    display:flex;
    align-items:center;
    box-sizing:border-box;
}

.airport{
    width:23%;
    padding-left:25px;
    box-sizing:border-box;
    font-size:22px;
    font-weight:bold;
}

.live{
    color:#ff3333;
    font-size:16px;
    margin-bottom:5px;
}

.aircraft-info{
    width:52%;
    padding-left:25px;
    border-left:2px solid rgba(255,255,255,.25);
    box-sizing:border-box;
}

.airline{
    font-size:25px;
    font-weight:bold;
}

.details{
    font-size:19px;
    margin-top:6px;
    opacity:.9;
}

.status{
    font-size:16px;
    margin-top:5px;
    color:#8fd3ff;
}

.visual{
    width:25%;
    padding-right:20px;
    text-align:center;
    box-sizing:border-box;
}

.visual-main{
    font-size:24px;
    font-weight:bold;
}

.visual-sub{
    font-size:14px;
    margin-top:7px;
    opacity:.85;
}
</style>
</head>

<body>

<div class="ribbon">

    <div class="airport">
        <div class="live">● LIVE</div>
        PRAGUE AIRPORT
        <div>LKPR / PRG</div>
    </div>

    <div class="aircraft-info">
        <div class="airline"></div>
        <div class="details"></div>
        <div class="status"></div>
    </div>

    <div class="visual">
        <div class="visual-main"></div>
        <div class="visual-sub"></div>
    </div>

</div>

<script>

const API =
"https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft";

const airportLat = 50.1008;
const airportLon = 14.2600;


/* AIRLINES */

const airlines = {
    TVS:"SMARTWINGS",
    RYR:"RYANAIR",
    UAE:"EMIRATES",
    PGT:"PEGASUS AIRLINES",
    AUA:"AUSTRIAN AIRLINES",
    DLH:"LUFTHANSA",
    KLM:"KLM",
    BAW:"BRITISH AIRWAYS",
    EZY:"EASYJET",
    WZZ:"WIZZ AIR",
    QTR:"QATAR AIRWAYS",
    THY:"TURKISH AIRLINES",
    AFR:"AIR FRANCE",
    SWR:"SWISS",
    LOT:"LOT POLISH AIRLINES",
    SAS:"SAS",
    FIN:"FINNAIR",
    IBE:"IBERIA",
    TAP:"TAP AIR PORTUGAL",
    ITY:"ITA AIRWAYS",
    EIN:"AER LINGUS",
    VLG:"VUELING",
    EWG:"EUROWINGS",
    AEE:"AEGEAN AIRLINES",
    BTI:"AIRBALTIC",
    BEL:"BRUSSELS AIRLINES",
    TRA:"TRANSAVIA",
    EXS:"JET2",
    TUI:"TUI",
    ETD:"ETIHAD AIRWAYS",
    ELY:"EL AL",
    MSR:"EGYPTAIR",
    RAM:"ROYAL AIR MAROC"
};


/*
   PRAGUE RUNWAYS

   We use the complete runway lines,
   not just the threshold points.
*/

const runways = [

    {
        name:"06/24",

        a:{
            lat:50.101836,
            lon:14.226300
        },

        b:{
            lat:50.115950,
            lon:14.273367
        },

        headings:[
            {name:"06",heading:60},
            {name:"24",heading:240}
        ]
    },

    {
        name:"12/30",

        a:{
            lat:50.108011,
            lon:14.245367
        },

        b:{
            lat:50.090467,
            lon:14.281672
        },

        headings:[
            {name:"12",heading:122},
            {name:"30",heading:302}
        ]
    }

];


/* MEMORY */

const history = new Map();

let departureLock = null;
let landingLock = null;


/* HELPERS */

function aircraftId(ac){

    return (
        ac.hex ||
        ac.r ||
        ac.flight ||
        null
    );
}


function isGround(ac){

    return (
        ac.alt_baro === "ground" ||
        ac.alt_geom === "ground"
    );
}


function altitude(ac){

    if(isGround(ac))
        return 0;

    let value =
        Number(ac.alt_baro);

    if(!Number.isFinite(value))
        value =
            Number(ac.alt_geom);

    return Number.isFinite(value)
        ? value
        : null;
}


function speed(ac){

    const value =
        Number(ac.gs);

    return Number.isFinite(value)
        ? value
        : 0;
}


function verticalRate(ac){

    let value =
        Number(ac.baro_rate);

    if(!Number.isFinite(value))
        value =
            Number(ac.geom_rate);

    return Number.isFinite(value)
        ? value
        : 0;
}


function headingDifference(a,b){

    let d =
        Math.abs(a-b);

    if(d>180)
        d=360-d;

    return d;
}


function distanceKm(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371;

    const dLat =
        (lat2-lat1) *
        Math.PI/180;

    const dLon =
        (lon2-lon1) *
        Math.PI/180;

    const a =
        Math.sin(dLat/2)**2 +

        Math.cos(
            lat1*Math.PI/180
        ) *

        Math.cos(
            lat2*Math.PI/180
        ) *

        Math.sin(dLon/2)**2;

    return R*2*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}


/*
   DISTANCE FROM AIRCRAFT
   TO COMPLETE RUNWAY LINE
*/

function distanceToRunway(
    lat,
    lon,
    runway
){

    const refLat =
        (
            lat +
            runway.a.lat +
            runway.b.lat
        ) / 3;

    const kmLat = 111.32;

    const kmLon =
        111.32 *
        Math.cos(
            refLat *
            Math.PI/180
        );

    const px = lon*kmLon;
    const py = lat*kmLat;

    const ax =
        runway.a.lon*kmLon;

    const ay =
        runway.a.lat*kmLat;

    const bx =
        runway.b.lon*kmLon;

    const by =
        runway.b.lat*kmLat;

    const abx = bx-ax;
    const aby = by-ay;

    const apx = px-ax;
    const apy = py-ay;

    const lengthSquared =
        abx*abx +
        aby*aby;

    let t =
        (
            apx*abx +
            apy*aby
        ) /
        lengthSquared;

    t =
        Math.max(
            0,
            Math.min(1,t)
        );

    const closestX =
        ax+t*abx;

    const closestY =
        ay+t*aby;

    const dx =
        px-closestX;

    const dy =
        py-closestY;

    return Math.sqrt(
        dx*dx +
        dy*dy
    );
}


function runwayDirection(
    track,
    runway
){

    let best=null;
    let difference=999;

    for(
        const option
        of runway.headings
    ){

        const d =
            headingDifference(
                track,
                option.heading
            );

        if(d<difference){

            difference=d;
            best=option;
        }
    }

    return {
        runway:best,
        difference
    };
}


function airlineName(callsign){

    if(!callsign)
        return "";

    const clean =
        callsign
        .trim()
        .toUpperCase();

    return (
        airlines[
            clean.substring(0,3)
        ] || ""
    );
}


function headline(ac){

    const callsign =
        ac.flight &&
        ac.flight.trim()

        ? ac.flight.trim()

        : "AIRCRAFT";

    const company =
        airlineName(callsign);

    return company

        ? company +
          "  •  " +
          callsign

        : callsign;
}


function detailText(ac){

    return [
        ac.t || "",
        ac.r || ""
    ]
    .filter(Boolean)
    .join("  •  ");
}


function clearDisplay(){

    document
    .querySelector(".airline")
    .textContent="";

    document
    .querySelector(".details")
    .textContent="";

    document
    .querySelector(".status")
    .textContent="";

    document
    .querySelector(".visual-main")
    .textContent="";

    document
    .querySelector(".visual-sub")
    .textContent="";
}


/*
   RUNWAY DETECTION

   ADS-B Exchange is now actually
   giving us ground aircraft.

   Aircraft must:
   - be on ground
   - be close to runway centreline
   - point approximately along runway
*/

function detectRunwayAircraft(ac){

    if(!isGround(ac))
        return null;

    const lat =
        Number(ac.lat);

    const lon =
        Number(ac.lon);

    const track =
        Number(ac.track);

    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        !Number.isFinite(track)
    )
        return null;

    let best=null;

    for(
        const runway
        of runways
    ){

        const d =
            distanceToRunway(
                lat,
                lon,
                runway
            );

        /*
           120 metres either side
           of runway centreline.
        */

        if(d>0.12)
            continue;

        const direction =
            runwayDirection(
                track,
                runway
            );

        /*
           Aircraft must be aligned
           reasonably closely with
           runway direction.
        */

        if(
            direction.difference>20
        )
            continue;

        let score =
            10000
            -
            d*10000
            -
            direction.difference*50;

        /*
           Faster ground aircraft
           gets preference if more
           than one is on runway.
        */

        score +=
            Math.min(
                speed(ac)*4,
                700
            );

        if(
            !best ||
            score>best.score
        ){

            best={
                ac,
                runway:
                    direction.runway,
                distance:d,
                score
            };
        }
    }

    return best;
}


/*
   ARRIVAL DETECTION
*/

function detectArrival(ac){

    if(isGround(ac))
        return null;

    const lat =
        Number(ac.lat);

    const lon =
        Number(ac.lon);

    const track =
        Number(ac.track);

    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        !Number.isFinite(track)
    )
        return null;

    const alt =
        altitude(ac);

    if(
        alt!==null &&
        alt>7000
    )
        return null;

    const distance =
        distanceKm(
            lat,
            lon,
            airportLat,
            airportLon
        );

    if(distance>25)
        return null;

    /*
       Strong climbers are not arrivals.
    */

    if(
        verticalRate(ac)>500
    )
        return null;

    let bestRunway=null;
    let bestDifference=999;

    for(
        const runway
        of runways
    ){

        const direction =
            runwayDirection(
                track,
                runway
            );

        if(
            direction.difference <
            bestDifference
        ){

            bestDifference =
                direction.difference;

            bestRunway =
                direction.runway;
        }
    }

    if(bestDifference>45)
        return null;

    const id =
        aircraftId(ac);

    const old =
        history.get(id);

    let approaching=false;

    if(old){

        approaching =
            distance <
            old.distance;
    }

    let score =
        1000 -
        distance*20 -
        bestDifference*5;

    if(approaching)
        score+=500;

    if(verticalRate(ac)<-200)
        score+=300;

    return {
        ac,
        runway:bestRunway,
        distance,
        score
    };
}


/*
   NEW DEPARTURE DETECTION

   Backup in case we first see
   aircraft immediately after
   wheels leave runway.
*/

function detectNewDeparture(ac){

    if(isGround(ac))
        return null;

    const id =
        aircraftId(ac);

    if(!id)
        return null;

    const alt =
        altitude(ac);

    if(
        alt===null ||
        alt>2500
    )
        return null;

    const lat =
        Number(ac.lat);

    const lon =
        Number(ac.lon);

    const d =
        distanceKm(
            lat,
            lon,
            airportLat,
            airportLon
        );

    if(d>7)
        return null;

    const rate =
        verticalRate(ac);

    if(rate<200)
        return null;

    let score =
        1000 -
        alt/5 -
        d*30;

    const old =
        history.get(id);

    /*
       This is now powerful:
       ADS-B Exchange may have shown
       this aircraft on ground during
       the previous update.
    */

    if(
        old &&
        old.ground
    )
        score+=10000;

    return {
        ac,
        score
    };
}


/*
   SAVE CURRENT AIRCRAFT STATE
*/

function saveHistory(aircraft){

    for(const ac of aircraft){

        const id =
            aircraftId(ac);

        if(!id)
            continue;

        history.set(
            id,
            {
                ground:
                    isGround(ac),

                speed:
                    speed(ac),

                altitude:
                    altitude(ac),

                distance:
                    distanceKm(
                        Number(ac.lat),
                        Number(ac.lon),
                        airportLat,
                        airportLon
                    ),

                time:
                    Date.now()
            }
        );
    }

    /*
       Remove old records.
    */

    const cutoff =
        Date.now() -
        10*60*1000;

    for(
        const [id,item]
        of history
    ){

        if(item.time<cutoff)
            history.delete(id);
    }
}


/*
   DISPLAY
*/

function displayAircraft(
    ac,
    statusText,
    mainVisual="",
    subVisual=""
){

    document
    .querySelector(".airline")
    .textContent =
        headline(ac);

    document
    .querySelector(".details")
    .textContent =
        detailText(ac);

    document
    .querySelector(".status")
    .textContent =
        statusText;

    document
    .querySelector(".visual-main")
    .textContent =
        mainVisual;

    document
    .querySelector(".visual-sub")
    .textContent =
        subVisual;
}


/*
   MAIN UPDATE
*/

async function update(){

    try{

        const response =
            await fetch(
                API +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok)
            throw new Error(
                "HTTP "+
                response.status
            );

        const data =
            await response.json();

        const aircraft =
            (data.ac || [])
            .filter(
                ac =>
                Number.isFinite(
                    Number(ac.lat)
                )
                &&
                Number.isFinite(
                    Number(ac.lon)
                )
            );


        /*
           ==================================
           PRIORITY 1
           AIRCRAFT PHYSICALLY ON RUNWAY
           ==================================
        */

        let runwayAircraft=null;

        for(const ac of aircraft){

            const candidate =
                detectRunwayAircraft(ac);

            if(!candidate)
                continue;

            if(
                !runwayAircraft ||
                candidate.score >
                runwayAircraft.score
            ){

                runwayAircraft =
                    candidate;
            }
        }


        if(runwayAircraft){

            const ac =
                runwayAircraft.ac;

            const id =
                aircraftId(ac);

            departureLock=id;

            const gs =
                speed(ac);

            /*
               Previous speed lets us
               recognise acceleration.
            */

            const old =
                history.get(id);

            const accelerating =
                old &&
                gs >
                old.speed + 3;


            if(
                gs>=45 ||
                (
                    accelerating &&
                    gs>=30
                )
            ){

                displayAircraft(
                    ac,

                    "TAKEOFF ROLL  •  RWY "+
                    runwayAircraft.runway.name+
                    "  •  "+
                    Math.round(gs)+
                    " KT",

                    "TAKEOFF",

                    "RWY "+
                    runwayAircraft.runway.name
                );

            }

            else{

                displayAircraft(
                    ac,

                    "LINED UP  •  RWY "+
                    runwayAircraft.runway.name+
                    "  •  READY FOR DEPARTURE",

                    "LINED UP",

                    "RWY "+
                    runwayAircraft.runway.name
                );
            }

            saveHistory(aircraft);

            return;
        }


        /*
           ==================================
           BUILD ARRIVAL LIST
           ==================================
        */

        const arrivals=[];

        for(const ac of aircraft){

            if(
                departureLock &&
                aircraftId(ac)===
                departureLock
            )
                continue;

            const candidate =
                detectArrival(ac);

            if(candidate)
                arrivals.push(
                    candidate
                );
        }

        arrivals.sort(
            (a,b)=>
            b.score-a.score
        );


        /*
           ==================================
           PRIORITY 2
           VERY SHORT FINAL
           ==================================
        */

        const shortFinal =
            arrivals.find(
                item =>
                item.distance<=3
            );


        if(shortFinal){

            displayAircraft(
                shortFinal.ac,

                "ON FINAL  •  RWY "+
                shortFinal.runway.name+
                "  •  "+
                shortFinal.distance
                .toFixed(1)+
                " KM",

                "LANDING",

                "RWY "+
                shortFinal.runway.name
            );

            saveHistory(aircraft);

            return;
        }


        /*
           ==================================
           PRIORITY 3
           LOCKED DEPARTURE
           ==================================
        */

        if(departureLock){

            const locked =
                aircraft.find(
                    ac =>
                    aircraftId(ac)===
                    departureLock
                );

            if(locked){

                const alt =
                    altitude(locked);

                if(
                    !isGround(locked) &&
                    alt!==null &&
                    alt<3000
                ){

                    const text =
                        alt<1000
                        ? "DEPARTED"
                        : "CLIMBING";

                    displayAircraft(
                        locked,

                        text+
                        "  •  "+
                        Math.round(alt)
                        .toLocaleString()+
                        " FT",

                        text,

                        Math.round(
                            speed(locked)
                        )+
                        " KT"
                    );

                    saveHistory(aircraft);

                    return;
                }

                if(
                    alt!==null &&
                    alt>=3000
                ){

                    departureLock=null;
                }
            }

            else{

                departureLock=null;
            }
        }


        /*
           ==================================
           PRIORITY 4
           NEW AIRBORNE DEPARTURE
           ==================================
        */

        let newDeparture=null;

        for(const ac of aircraft){

            const candidate =
                detectNewDeparture(ac);

            if(!candidate)
                continue;

            if(
                !newDeparture ||
                candidate.score >
                newDeparture.score
            ){

                newDeparture =
                    candidate;
            }
        }


        if(newDeparture){

            const ac =
                newDeparture.ac;

            departureLock =
                aircraftId(ac);

            const alt =
                altitude(ac);

            displayAircraft(
                ac,

                (
                    alt<1000
                    ? "DEPARTED"
                    : "CLIMBING"
                )+
                "  •  "+
                Math.round(alt)
                .toLocaleString()+
                " FT",

                "DEPARTURE",

                Math.round(
                    speed(ac)
                )+
                " KT"
            );

            saveHistory(aircraft);

            return;
        }


        /*
           ==================================
           PRIORITY 5
           NORMAL ARRIVAL
           ==================================
        */

        if(arrivals.length){

            const chosen =
                arrivals[0];

            let text =
                "INBOUND";

            if(
                chosen.distance<=8
            )
                text =
                    "APPROACHING";

            displayAircraft(
                chosen.ac,

                text+
                "  •  RWY "+
                chosen.runway.name+
                "  •  "+
                chosen.distance
                .toFixed(1)+
                " KM",

                text,

                "RWY "+
                chosen.runway.name
            );

            saveHistory(aircraft);

            return;
        }


        /*
           NOTHING HAPPENING
        */

        clearDisplay();

        saveHistory(aircraft);

    }

    catch(error){

        console.error(error);

        clearDisplay();
    }
}


/*
   ADS-B Exchange can update much
   faster than our previous source.

   3 seconds gives us a much better
   chance of seeing runway activity
   without going crazy with requests.
*/

update();

setInterval(
    update,
    3000
);

</script>

</body>
</html>
