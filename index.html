<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.ribbon {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 105px;
    background: rgb(0, 55, 110);
    color: white;
    display: flex;
    align-items: center;
    box-sizing: border-box;
}

.airport {
    width: 23%;
    padding-left: 25px;
    font-size: 22px;
    font-weight: bold;
    box-sizing: border-box;
}

.live {
    color: #ff3333;
    font-size: 16px;
    margin-bottom: 5px;
}

.aircraft-info {
    width: 52%;
    padding-left: 25px;
    border-left: 2px solid rgba(255,255,255,0.25);
    box-sizing: border-box;
}

.airline {
    font-size: 25px;
    font-weight: bold;
}

.details {
    font-size: 19px;
    margin-top: 6px;
    opacity: 0.9;
}

.status {
    font-size: 16px;
    margin-top: 5px;
    color: #8fd3ff;
}

.approach-box {
    position: relative;
    width: 25%;
    height: 105px;
    overflow: hidden;
}

.plane {
    position: absolute;
    width: 76px;
    height: 36px;
    left: 10%;
    top: 10px;
    transition:
        left 4.5s linear,
        top 4.5s linear,
        transform 0.8s ease;
    transform-origin: center center;
}

.plane svg {
    width: 100%;
    height: 100%;
    display: block;
}

.plane-shape {
    fill: white;
}

.plane.reverse svg {
    transform: scaleX(-1);
}

.runway {
    position: absolute;
    bottom: 17px;
    left: 18%;
    width: 64%;
    height: 5px;
    background: rgba(255,255,255,0.9);
    opacity: 0;
}

.runway.visible {
    opacity: 1;
}

.runway-label {
    position: absolute;
    bottom: 1px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
}
</style>

</head>

<body>

<div class="ribbon">

    <div class="airport">
        <div class="live">● LIVE</div>
        PRAGUE AIRPORT
        <div>LKPR / PRG</div>
    </div>

    <div class="aircraft-info">
        <div class="airline"></div>
        <div class="details"></div>
        <div class="status"></div>
    </div>

    <div class="approach-box">

        <div
            id="plane"
            class="plane"
            style="display:none;"
        >
            <svg
                viewBox="0 0 160 70"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                    class="plane-shape"
                    d="
                    M8 34
                    C20 29 43 27 92 27
                    L124 26
                    L145 17
                    L153 19
                    L138 31
                    C148 32 154 35 156 38
                    C152 41 145 42 135 42
                    L96 42
                    L60 58
                    L49 58
                    L66 42
                    L31 41
                    L18 49
                    L10 49
                    L16 40
                    C11 39 8 37 8 34
                    Z
                    "
                />
            </svg>
        </div>

        <div id="runway" class="runway"></div>
        <div id="runwayLabel" class="runway-label"></div>

    </div>

</div>


<script>

const airportLat = 50.1008;
const airportLon = 14.2600;

const previousDistances = new Map();
const completedAircraft = new Map();

let currentAircraftId = null;
let landingLock = null;
let departureLockId = null;


const runways = [
    {
        runway: "06",
        heading: 60,
        lat: 50.101836,
        lon: 14.226300
    },
    {
        runway: "24",
        heading: 240,
        lat: 50.115950,
        lon: 14.273367
    },
    {
        runway: "12",
        heading: 122,
        lat: 50.108011,
        lon: 14.245367
    },
    {
        runway: "30",
        heading: 302,
        lat: 50.090467,
        lon: 14.281672
    }
];


function distanceKm(lat1, lon1, lat2, lon2) {

    const R = 6371;

    const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

    const dLon =
        (lon2 - lon1) *
        Math.PI / 180;

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    return R * 2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );
}


function bearingTo(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const phi1 =
        lat1 * Math.PI / 180;

    const phi2 =
        lat2 * Math.PI / 180;

    const deltaLon =
        (lon2 - lon1) *
        Math.PI / 180;

    const y =
        Math.sin(deltaLon) *
        Math.cos(phi2);

    const x =
        Math.cos(phi1) *
        Math.sin(phi2) -
        Math.sin(phi1) *
        Math.cos(phi2) *
        Math.cos(deltaLon);

    let bearing =
        Math.atan2(y, x) *
        180 / Math.PI;

    return (bearing + 360) % 360;
}


function headingDifference(a, b) {

    let difference =
        Math.abs(a - b);

    if (difference > 180) {
        difference =
            360 - difference;
    }

    return difference;
}


function aircraftId(ac) {

    return (
        ac.hex ||
        ac.r ||
        ac.flight ||
        null
    );
}


function numericAltitude(ac) {

    if (
        ac.alt_baro === "ground" ||
        ac.alt_baro === null ||
        ac.alt_baro === undefined
    ) {
        return null;
    }

    const value =
        Number(ac.alt_baro);

    return Number.isFinite(value)
        ? value
        : null;
}


function closestRunway(track) {

    let best = null;
    let bestDifference = 999;

    runways.forEach(rwy => {

        const difference =
            headingDifference(
                track,
                rwy.heading
            );

        if (difference < bestDifference) {
            bestDifference = difference;
            best = rwy;
        }
    });

    return {
        runway: best,
        difference: bestDifference
    };
}


function clearDisplay() {

    document.querySelector(
        ".airline"
    ).textContent = "";

    document.querySelector(
        ".details"
    ).textContent = "";

    document.querySelector(
        ".status"
    ).textContent = "";

    updateApproachGraphic(
        null,
        0,
        false
    );
}


function cleanCompletedAircraft() {

    const now = Date.now();

    for (
        const [id, expiry]
        of completedAircraft
    ) {
        if (now >= expiry) {
            completedAircraft.delete(id);
        }
    }
}


/* =========================
   ARRIVAL SCORE
   ========================= */

function scoreArrival(ac) {

    let score = 0;

    const id =
        aircraftId(ac);

    const lat =
        Number(ac.lat);

    const lon =
        Number(ac.lon);

    const altitude =
        numericAltitude(ac);

    const verticalRate =
        Number(ac.baro_rate);

    const track =
        Number(ac.track);

    const distance =
        distanceKm(
            lat,
            lon,
            airportLat,
            airportLon
        );


    if (ac.alt_baro === "ground") {
        return -9999;
    }


    if (
        id &&
        completedAircraft.has(id)
    ) {
        return -9999;
    }


    if (distance > 25) {
        return -9999;
    }


    if (
        altitude !== null &&
        altitude > 7000
    ) {
        return -9999;
    }


    if (
        Number.isFinite(verticalRate) &&
        verticalRate > 200
    ) {
        return -9999;
    }


    if (Number.isFinite(track)) {

        const airportBearing =
            bearingTo(
                lat,
                lon,
                airportLat,
                airportLon
            );

        const towardDifference =
            headingDifference(
                track,
                airportBearing
            );


        if (towardDifference > 55) {
            return -9999;
        }


        if (towardDifference < 20) {
            score += 200;
        }
        else if (towardDifference < 35) {
            score += 130;
        }
        else {
            score += 50;
        }


        const runwayMatch =
            closestRunway(track);


        if (
            runwayMatch.difference < 15
        ) {
            score += 150;
        }
        else if (
            runwayMatch.difference < 30
        ) {
            score += 80;
        }
        else if (
            runwayMatch.difference > 45
        ) {
            return -9999;
        }
    }


    const previousDistance =
        id
            ? previousDistances.get(id)
            : undefined;


    if (
        previousDistance !== undefined
    ) {

        const movement =
            previousDistance -
            distance;


        if (movement < -0.05) {
            return -9999;
        }


        if (movement > 0.15) {
            score += 200;
        }
        else if (movement > 0.03) {
            score += 110;
        }
    }


    if (distance < 3) {
        score += 90;
    }
    else if (distance < 6) {
        score += 70;
    }
    else if (distance < 10) {
        score += 50;
    }
    else if (distance < 15) {
        score += 30;
    }
    else {
        score += 10;
    }


    if (altitude !== null) {

        if (altitude < 1500) {
            score += 80;
        }
        else if (altitude < 3000) {
            score += 60;
        }
        else if (altitude < 5000) {
            score += 35;
        }
    }


    if (
        Number.isFinite(verticalRate)
    ) {

        if (verticalRate < -500) {
            score += 90;
        }
        else if (verticalRate < -100) {
            score += 60;
        }
    }


    if (ac.flight) score += 15;
    if (ac.r) score += 10;
    if (ac.t) score += 10;


    return score;
}


/* =========================
   DEPARTURE SCORE
   ========================= */

function scoreDeparture(ac) {

    let score = 0;

    const id =
        aircraftId(ac);

    const lat =
        Number(ac.lat);

    const lon =
        Number(ac.lon);

    const altitude =
        numericAltitude(ac);

    const verticalRate =
        Number(ac.baro_rate);

    const track =
        Number(ac.track);

    const distance =
        distanceKm(
            lat,
            lon,
            airportLat,
            airportLon
        );


    if (ac.alt_baro === "ground") {
        return -9999;
    }


    if (distance > 15) {
        return -9999;
    }


    if (
        altitude !== null &&
        altitude > 3500
    ) {
        return -9999;
    }


    /*
       MUST BE CLIMBING
    */

    if (
        !Number.isFinite(verticalRate) ||
        verticalRate < 150
    ) {
        return -9999;
    }


    /*
       MUST BE POINTING AWAY
       FROM PRAGUE
    */

    if (Number.isFinite(track)) {

        const awayBearing =
            bearingTo(
                airportLat,
                airportLon,
                lat,
                lon
            );

        const awayDifference =
            headingDifference(
                track,
                awayBearing
            );


        if (awayDifference > 55) {
            return -9999;
        }


        if (awayDifference < 20) {
            score += 200;
        }
        else if (awayDifference < 35) {
            score += 120;
        }
        else {
            score += 50;
        }


        const runwayMatch =
            closestRunway(track);


        if (
            runwayMatch.difference < 20
        ) {
            score += 100;
        }
        else if (
            runwayMatch.difference < 40
        ) {
            score += 40;
        }
    }


    const previousDistance =
        id
            ? previousDistances.get(id)
            : undefined;


    if (
        previousDistance !== undefined
    ) {

        const movement =
            distance -
            previousDistance;


        if (movement < -0.05) {
            return -9999;
        }


        if (movement > 0.15) {
            score += 180;
        }
        else if (movement > 0.03) {
            score += 100;
        }
    }


    if (distance < 3) {
        score += 100;
    }
    else if (distance < 6) {
        score += 70;
    }
    else if (distance < 10) {
        score += 40;
    }
    else {
        score += 10;
    }


    if (verticalRate > 1000) {
        score += 100;
    }
    else if (verticalRate > 500) {
        score += 70;
    }
    else {
        score += 40;
    }


    if (ac.flight) score += 15;
    if (ac.r) score += 10;
    if (ac.t) score += 10;


    return score;
}


/* =========================
   SIMPLE CURRENT GRAPHIC
   ========================= */

function updateApproachGraphic(
    runway,
    distance,
    landed
) {

    const plane =
        document.getElementById("plane");

    const runwayGraphic =
        document.getElementById("runway");

    const runwayLabel =
        document.getElementById("runwayLabel");


    if (!runway) {

        plane.style.display = "none";

        runwayGraphic
            .classList
            .remove("visible");

        runwayLabel.textContent = "";

        return;
    }


    plane.style.display = "block";

    runwayLabel.textContent =
        "RWY " + runway.runway;


    const leftToRight =
        runway.runway === "06" ||
        runway.runway === "12";


    if (leftToRight) {
        plane.classList.remove("reverse");
    }
    else {
        plane.classList.add("reverse");
    }


    const maxDistance = 15;

    const clamped =
        Math.max(
            0,
            Math.min(
                maxDistance,
                distance
            )
        );

    const progress =
        1 -
        (clamped / maxDistance);


    let x;

    if (leftToRight) {
        x =
            4 +
            progress * 58;
    }
    else {
        x =
            68 -
            progress * 58;
    }


    let y =
        4 +
        progress * 48;


    if (!landed) {

        if (leftToRight) {
            plane.style.transform =
                "rotate(7deg)";
        }
        else {
            plane.style.transform =
                "rotate(-7deg)";
        }
    }


    if (landed) {

        y = 49;

        plane.style.transform =
            "rotate(0deg)";

        runwayGraphic
            .classList
            .add("visible");
    }
    else {

        runwayGraphic
            .classList
            .remove("visible");
    }


    plane.style.left =
        x + "%";

    plane.style.top =
        y + "px";
}


/* =========================
   MAIN UPDATE
   ========================= */

async function updateAircraft() {

    const airline =
        document.querySelector(".airline");

    const details =
        document.querySelector(".details");

    const status =
        document.querySelector(".status");


    cleanCompletedAircraft();


    /*
       LANDING LOCK
    */

    if (landingLock) {

        if (
            Date.now() <
            landingLock.until
        ) {

            airline.textContent =
                landingLock.callsign;

            details.textContent =
                landingLock.details;

            status.textContent =
                "LANDED  •  PRAGUE";

            updateApproachGraphic(
                landingLock.runway,
                0,
                true
            );

            return;
        }


        completedAircraft.set(
            landingLock.id,
            Date.now() +
            5 * 60 * 1000
        );

        landingLock = null;
        currentAircraftId = null;

        clearDisplay();
    }


    try {

        const response =
            await fetch(
                "https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft"
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const wrapper =
            await response.json();


        const data =
            wrapper.upstreamText
                ? JSON.parse(
                    wrapper.upstreamText
                )
                : wrapper;


        if (
            !data.ac ||
            data.ac.length === 0
        ) {

            departureLockId = null;

            clearDisplay();

            return;
        }


        const usableAircraft =
            data.ac.filter(ac => {

                const lat =
                    Number(ac.lat);

                const lon =
                    Number(ac.lon);

                return (
                    Number.isFinite(lat) &&
                    Number.isFinite(lon) &&
                    ac.alt_baro !== "ground"
                );
            });


        /*
           SAVE DISTANCE MEMORY
           AFTER WE HAVE SCORED.
        */


        /*
           FIND ARRIVALS
        */

        const arrivals =
            usableAircraft
                .map(ac => ({
                    ac: ac,
                    score:
                        scoreArrival(ac)
                }))
                .filter(item =>
                    item.score >= 100
                )
                .sort(
                    (a, b) =>
                        b.score -
                        a.score
                );


        /*
           FIND ANY ARRIVAL
           ALREADY ON SHORT FINAL
           <= 3 KM TO ITS RUNWAY
        */

        let shortFinalArrival = null;


        for (
            const item of arrivals
        ) {

            const ac =
                item.ac;

            const track =
                Number(ac.track);

            if (
                !Number.isFinite(track)
            ) {
                continue;
            }


            const match =
                closestRunway(track);


            if (
                !match.runway ||
                match.difference > 35
            ) {
                continue;
            }


            const thresholdDistance =
                distanceKm(
                    Number(ac.lat),
                    Number(ac.lon),
                    match.runway.lat,
                    match.runway.lon
                );


            if (
                thresholdDistance <= 3
            ) {

                shortFinalArrival =
                    ac;

                break;
            }
        }


        /*
           =========================
           DEPARTURE LOCK PRIORITY
           =========================

           If we're already following
           a departure, keep it until
           3,000 ft unless an arrival
           gets within 3 km.
        */

        let lockedDeparture = null;


        if (departureLockId) {

            lockedDeparture =
                usableAircraft.find(
                    ac =>
                        aircraftId(ac) ===
                        departureLockId
                ) || null;


            if (lockedDeparture) {

                const depAltitude =
                    numericAltitude(
                        lockedDeparture
                    );


                /*
                   RELEASE AT 3,000 FT
                */

                if (
                    depAltitude !== null &&
                    depAltitude >= 3000
                ) {

                    departureLockId =
                        null;

                    lockedDeparture =
                        null;
                }
            }

            else {

                departureLockId =
                    null;
            }
        }


        /*
           SHORT FINAL ALWAYS WINS
        */

        let aircraft = null;
        let mode = null;


        if (shortFinalArrival) {

            aircraft =
                shortFinalArrival;

            mode =
                "ARRIVAL";

            departureLockId =
                null;
        }


        /*
           OTHERWISE KEEP LOCKED
           DEPARTURE UNTIL 3,000 FT
        */

        else if (lockedDeparture) {

            aircraft =
                lockedDeparture;

            mode =
                "DEPARTURE";
        }


        /*
           NO ACTIVE DEPARTURE?
           THEN ARRIVAL HAS PRIORITY.
        */

        else if (
            arrivals.length > 0
        ) {

            aircraft =
                arrivals[0].ac;

            mode =
                "ARRIVAL";
        }


        /*
           NO ARRIVAL?
           FIND A NEW DEPARTURE.
        */

        if (!aircraft) {

            const departures =
                usableAircraft
                    .map(ac => ({
                        ac: ac,
                        score:
                            scoreDeparture(ac)
                    }))
                    .filter(item =>
                        item.score >= 100
                    )
                    .sort(
                        (a, b) =>
                            b.score -
                            a.score
                    );


            if (
                departures.length > 0
            ) {

                aircraft =
                    departures[0].ac;

                mode =
                    "DEPARTURE";


                /*
                   LOCK THIS DEPARTURE
                */

                departureLockId =
                    aircraftId(
                        aircraft
                    );
            }
        }


        /*
           NOW SAVE POSITIONS
           FOR NEXT UPDATE
        */

        usableAircraft
            .forEach(ac => {

                const id =
                    aircraftId(ac);

                if (!id) return;


                previousDistances.set(
                    id,
                    distanceKm(
                        Number(ac.lat),
                        Number(ac.lon),
                        airportLat,
                        airportLon
                    )
                );
            });


        /*
           NOTHING ACTIVE
        */

        if (!aircraft) {

            currentAircraftId =
                null;

            departureLockId =
                null;

            clearDisplay();

            return;
        }


        const id =
            aircraftId(aircraft);

        currentAircraftId =
            id;


        const callsign =
            aircraft.flight &&
            aircraft.flight.trim()
                ? aircraft.flight.trim()
                : "AIRCRAFT";


        const registration =
            aircraft.r || "";


        const type =
            aircraft.t || "";


        const detailText =
            [
                type,
                registration
            ]
            .filter(Boolean)
            .join("  •  ");


        const altitude =
            numericAltitude(aircraft);


        const track =
            Number(aircraft.track);


        const airportDistance =
            distanceKm(
                Number(aircraft.lat),
                Number(aircraft.lon),
                airportLat,
                airportLon
            );


        /*
           =====================
           ARRIVAL MODE
           =====================
        */

        if (
            mode === "ARRIVAL"
        ) {

            let selectedRunway =
                null;


            if (
                Number.isFinite(track)
            ) {

                const match =
                    closestRunway(track);


                if (
                    match.difference <= 35
                ) {

                    selectedRunway =
                        match.runway;
                }
            }


            let displayDistance =
                airportDistance;


            if (
                selectedRunway
            ) {

                displayDistance =
                    distanceKm(
                        Number(aircraft.lat),
                        Number(aircraft.lon),
                        selectedRunway.lat,
                        selectedRunway.lon
                    );
            }


            /*
               TOUCHDOWN
            */

            const reachedRunway =
                selectedRunway &&
                displayDistance <= 0.8;


            if (reachedRunway) {

                landingLock = {

                    id:
                        id,

                    callsign:
                        callsign,

                    details:
                        detailText,

                    runway:
                        selectedRunway,

                    until:
                        Date.now() +
                        10000
                };


                departureLockId =
                    null;


                airline.textContent =
                    callsign;


                details.textContent =
                    detailText;


                status.textContent =
                    "LANDED  •  PRAGUE";


                updateApproachGraphic(
                    selectedRunway,
                    0,
                    true
                );


                return;
            }


            let arrivalStatus =
                "INBOUND";


            if (
                displayDistance <= 8
            ) {

                arrivalStatus =
                    "APPROACHING";
            }


            if (
                displayDistance <= 4 &&
                (
                    altitude === null ||
                    altitude < 2500
                )
            ) {

                arrivalStatus =
                    "ON FINAL";
            }


            airline.textContent =
                callsign;


            details.textContent =
                detailText;


            status.textContent =
                arrivalStatus +

                (
                    selectedRunway
                        ? " RWY " +
                          selectedRunway.runway
                        : ""
                ) +

                "  •  " +

                displayDistance
                    .toFixed(1) +

                " KM";


            updateApproachGraphic(
                selectedRunway,
                displayDistance,
                false
            );


            return;
        }


        /*
           =====================
           DEPARTURE MODE
           =====================
        */

        if (
            mode === "DEPARTURE"
        ) {

            let departureRunway =
                null;


            if (
                Number.isFinite(track)
            ) {

                const match =
                    closestRunway(track);


                if (
                    match.difference <=
                    40
                ) {

                    departureRunway =
                        match.runway;
                }
            }


            let departureStatus =
                "DEPARTED";


            if (
                altitude !== null &&
                altitude >= 1000
            ) {

                departureStatus =
                    "CLIMBING";
            }


            airline.textContent =
                callsign;


            details.textContent =
                detailText;


            /*
               Departure status now
               shows altitude, because
               3,000 ft is our handover
               point.
            */

            status.textContent =
                departureStatus +

                (
                    departureRunway
                        ? " RWY " +
                          departureRunway.runway
                        : ""
                ) +

                "  •  " +

                (
                    altitude !== null
                        ? Math.round(
                            altitude
                          ).toLocaleString() +
                          " FT"
                        : airportDistance
                            .toFixed(1) +
                          " KM"
                );


            /*
               Hide the temporary graphic
               for departures for now.
            */

            updateApproachGraphic(
                null,
                0,
                false
            );


            return;
        }

    }

    catch (error) {

        clearDisplay();

        console.error(error);
    }
}


/* START */

updateAircraft();

setInterval(
    updateAircraft,
    5000
);

</script>
