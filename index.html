<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
:root{
    --ribbon:116px;
    --rail:31px;
    --yellow:#ffd451;
    --orange:#ff8b52;
}

*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    color:#fff;
    font-family:"Arial Narrow","Roboto Condensed",
                "Helvetica Neue Condensed",Arial,sans-serif;
}

/* =====================================================
   MAIN BROADCAST RIBBON
===================================================== */

.ribbon{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:var(--ribbon);
    z-index:50;

    background:
        linear-gradient(
            90deg,
            #03192e 0%,
            #004f8d 35%,
            #0066a9 55%,
            #003b6b 80%,
            #03192e 100%
        );

    border-top:1px solid rgba(184,226,255,.9);

    box-shadow:
        0 -1px 0 rgba(255,255,255,.14),
        0 3px 12px rgba(0,0,0,.32);
}

.main{
    height:calc(var(--ribbon) - var(--rail));
    display:flex;
    align-items:center;
}

/* =====================================================
   PRG AIRPORT IDENT
===================================================== */

.ident{
    width:26%;
    height:100%;
    display:flex;
    align-items:center;
    padding:0 18px;

    border-right:1px solid rgba(255,255,255,.20);

    background:
        linear-gradient(
            100deg,
            rgba(0,0,0,.24),
            transparent
        );
}

.badge{
    display:flex;
    align-items:center;
    gap:14px;
}

/* CONTROL TOWER */

.tower{
    position:relative;
    width:48px;
    height:66px;

    filter:
        drop-shadow(
            0 4px 5px rgba(0,0,0,.45)
        );
}

.tower:before{
    content:"";

    position:absolute;
    left:20px;
    bottom:0;

    width:12px;
    height:43px;

    background:
        linear-gradient(
            90deg,
            #64717c 0%,
            #f2f6f8 46%,
            #7b8790 100%
        );

    clip-path:
        polygon(
            30% 0,
            70% 0,
            100% 100%,
            0 100%
        );
}

.tower:after{
    content:"";

    position:absolute;
    left:7px;
    top:13px;

    width:36px;
    height:18px;

    background:
        linear-gradient(
            180deg,
            #fff 0%,
            #a6b0b7 100%
        );

    clip-path:
        polygon(
            13% 0,
            87% 0,
            100% 42%,
            82% 100%,
            18% 100%,
            0 42%
        );

    box-shadow:
        inset 0 5px 0 #154568;
}

.beacon{
    position:absolute;
    left:23px;
    top:1px;

    width:3px;
    height:13px;

    background:#d7dde1;
}

.beacon:after{
    content:"";

    position:absolute;
    left:-3px;
    top:-2px;

    width:9px;
    height:9px;

    border-radius:50%;

    background:#ff4747;

    box-shadow:
        0 0 9px #ff4747;

    animation:
        blink 1.65s infinite;
}

@keyframes blink{

    0%,43%,100%{
        opacity:.18;
    }

    48%,60%{
        opacity:1;
    }
}

.identText{
    line-height:.88;
}

.code{
    font-size:46px;
    font-weight:900;

    letter-spacing:4px;

    background:
        linear-gradient(
            180deg,
            #fff 0%,
            #e2e6e9 34%,
            #8b969e 62%,
            #fafafa 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 3px 7px rgba(0,0,0,.55);
}

.airportName{
    margin-top:7px;

    font-size:10px;
    font-weight:900;

    letter-spacing:2.1px;

    color:#d4e3ed;
}

.live{
    margin-top:5px;

    font-size:10px;
    font-weight:900;

    letter-spacing:1.4px;

    color:#ff5e5e;
}

/* =====================================================
   CENTRE
===================================================== */

.center{
    width:49%;
    padding:0 28px;
}

.headline{
    font-size:24px;
    font-weight:900;

    letter-spacing:2.5px;
}

.sub{
    margin-top:6px;

    font-size:12px;
    font-weight:800;

    letter-spacing:1.3px;

    color:#b9d7e9;
}

/* =====================================================
   ADS-B STATUS
===================================================== */

.system{
    width:25%;

    display:flex;
    justify-content:center;
}

.chip{
    min-width:170px;

    text-align:center;

    padding:9px 14px;

    border:
        1px solid
        rgba(168,219,251,.55);

    border-radius:5px;

    background:
        rgba(0,20,39,.34);

    font-size:12px;
    font-weight:900;

    letter-spacing:1.2px;

    color:#c6eaff;
}

/* =====================================================
   INFORMATION RAIL
===================================================== */

.rail{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:var(--rail);

    display:flex;
    align-items:center;

    background:
        rgba(2,15,28,.94);

    border-top:
        1px solid
        rgba(255,255,255,.14);
}

.railTag{
    height:100%;
    min-width:125px;

    padding:0 13px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#071e34;

    border-right:
        1px solid
        rgba(255,255,255,.18);

    font-size:11px;
    font-weight:900;

    letter-spacing:1.2px;

    color:#a9dcff;
}

.railText{
    flex:1;

    padding:0 18px;

    font-size:13px;
    font-weight:800;

    letter-spacing:.5px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.railState{
    color:var(--yellow);

    margin-right:10px;

    font-weight:900;
}

.railState.done{
    color:#dbe4ea;
}

/* =====================================================
   AIRCRAFT ALERT PANEL
===================================================== */

.popup{
    position:absolute;

    left:22px;
    bottom:var(--ribbon);

    width:560px;
    height:164px;

    display:flex;
    align-items:center;

    padding:14px;

    background:
        linear-gradient(
            135deg,
            rgba(3,22,40,.995),
            rgba(0,71,124,.985)

    border:
        1px solid
        rgba(191,224,244,.78);

    border-bottom:
        4px solid
        var(--yellow);

    border-radius:
        14px 14px 0 0;

    box-shadow:
        0 -10px 28px
        rgba(0,0,0,.38);

    z-index:45;

    transform:
        translateY(112%);

    opacity:0;

    transition:
        transform .46s
        cubic-bezier(.22,.8,.25,1),
        opacity .22s ease;

    pointer-events:none;
}

.popup.show{
    transform:translateY(0);
    opacity:1;
}

.popup.departure{
    border-bottom-color:
        var(--orange);
}

/* =====================================================
   AIRLINE TAIL
===================================================== */

.tailCard{
    width:158px;
    height:134px;

    position:relative;

    flex:0 0 auto;

    border-radius:10px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #0c253b,
            #0c4168

.tailCode{

.popupInfo{

}

.state{

.flight{

.details{

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

</style>

/* =====================================================
   AIRCRAFT FILTERING

   Deliberately biased toward commercial traffic.
===================================================== */

const helicopters=
new Set([

    "A109","A119","A139","A149","A169","A189",

    "AS32","AS50","AS55","AS65",

    "B06","B105","B212","B222","B412","B429",

    "EC20","EC25","EC30","EC35","EC45","EC55",

    "H125","H130","H135","H145","H155","H160",

    "R22","R44","R66",

    "S55","S58","S61","S64","S76","S92"

]);


const smallAircraftPrefixes=[

    "C15","C17","C18","C19","C20","C21",
    "C22","C23","C24","C25",

    "PA18","PA20","PA22","PA24","PA28",
    "PA32","PA34","PA38","PA44",

    "DA20","DA40","DA42",

    "SR20","SR22",

    "DR40","P28","M20",

    "BE23","BE24","BE33","BE35","BE36",

    "DV20"

];


const groundCallsignPrefixes=[

    "FOLLOW",
    "POZAR",
    "TXLU",
    "UDRZBA",
    "TWR",
    "GND",
    "EMER"

];


/* Categories deliberately rejected:

   A1 = light aircraft
   A7 = rotorcraft

   B1 = glider
   B2 = lighter-than-air
   B3 = parachutist
   B4 = ultralight
   B6 = UAV
   B7 = space/trans-atmospheric

   C1-C5 = ground vehicles / obstacles

   A2 is deliberately ALLOWED because regional
   commercial aircraft can fall into that category.
*/

const rejectedCategories=
new Set([

    "A1",
    "A7",

    "B1",
    "B2",
    "B3",
    "B4",
    "B6",
    "B7",

    "C1",
    "C2",
    "C3",
    "C4",
    "C5"

]);


function unwantedAircraft(ac){

    const type=
        (ac.t||"")
        .trim()
        .toUpperCase();


    const reg=
        (ac.r||"")
        .trim()
        .toUpperCase();


    const flight=
        (ac.flight||"")
        .trim()
        .toUpperCase();


    const category=
        (ac.category||"")
        .trim()
        .toUpperCase();


    if(
        rejectedCategories.has(
            category
        )
    )
        return true;


    if(
        helicopters.has(type)
    )
        return true;


    if(
        type==="TWR"
        ||
        type==="GND"
        ||
        type==="EMER"
    )
        return true;


    if(
        reg==="TWR"
        ||
        reg==="GND"
        ||
        reg==="EMER"
    )
        return true;


    for(
        const prefix
        of groundCallsignPrefixes
    ){

        if(
            flight.startsWith(prefix)
        )
            return true;
    }


    for(
        const prefix
        of smallAircraftPrefixes
    ){

        if(
            type.startsWith(prefix)
        )
            return true;
    }


    return false;
}

const memory=

/* =====================================================
   BASIC AIRCRAFT DATA
===================================================== */

function aircraftId(ac){

    return (
        ac.hex
        ||
        ac.r
        ||
        (ac.flight||"").trim()
        ||
        null
    );
}


function onGround(ac){

    return (
        ac.alt_baro==="ground"
        ||
        ac.alt_geom==="ground"
    );
}


function altitude(ac){

    if(onGround(ac))
        return 0;


    let value=
        Number(ac.alt_baro);


    if(!Number.isFinite(value)){

        value=
            Number(ac.alt_geom);
    }


    return Number.isFinite(value)
        ?
        value
        :
        null;
}


function groundSpeed(ac){

    const value=
        Number(ac.gs);


    return Number.isFinite(value)
        ?
        value
        :
        0;
}


function verticalRate(ac){

    let value=
        Number(ac.baro_rate);


    if(!Number.isFinite(value)){

        value=
            Number(ac.geom_rate);
    }


    return Number.isFinite(value)
        ?
        value
        :
        0;
}


function positionAge(ac){

    const value=
        Number(ac.seen_pos);


    return Number.isFinite(value)
        ?
        value
        :
        999;
}


function freshPosition(ac){

    return (
        positionAge(ac)<=5
    );
}


/* =====================================================
   DISTANCE
===================================================== */

function distanceKm(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371;


    const dLat=
        (lat2-lat1)
        *
        Math.PI/180;


    const dLon=
        (lon2-lon1)
        *
        Math.PI/180;


    const a=

        Math.sin(dLat/2)**2

        +

        Math.cos(
            lat1*Math.PI/180
        )

        *

        Math.cos(
            lat2*Math.PI/180
        )

        *

        Math.sin(dLon/2)**2;


    return R*2*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}


function airportDistance(ac){

    const lat=
        Number(ac.lat);


    const lon=
        Number(ac.lon);


    if(
        !Number.isFinite(lat)
        ||
        !Number.isFinite(lon)
    )
        return 999;


    return distanceKm(
        lat,
        lon,
        AIRPORT.lat,
        AIRPORT.lon
    );
}


/* =====================================================
   RUNWAY GEOMETRY
===================================================== */

function distanceToRunway(
    lat,
    lon,
    runway
){

    const ref=
        (
            lat+
            runway.a.lat+
            runway.b.lat
        )/3;


    const ky=
        111.32;


    const kx=
        111.32*
        Math.cos(
            ref*
            Math.PI/180
        );


    const px=lon*kx;
    const py=lat*ky;

    const ax=runway.a.lon*kx;
    const ay=runway.a.lat*ky;

    const bx=runway.b.lon*kx;
    const by=runway.b.lat*ky;

    const vx=bx-ax;
    const vy=by-ay;

    const wx=px-ax;
    const wy=py-ay;

    const lengthSquared=
        vx*vx+
        vy*vy;


    let t=
        (
            wx*vx+
            wy*vy
        )
        /
        lengthSquared;


    t=
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const cx=
        ax+t*vx;


    const cy=
        ay+t*vy;


    return Math.sqrt(
        (px-cx)**2+
        (py-cy)**2
    );
}


function runwayDistance(ac){

    const lat=
        Number(ac.lat);


    const lon=
        Number(ac.lon);


    if(
        !Number.isFinite(lat)
        ||
        !Number.isFinite(lon)
    )
        return 999;


    return Math.min(
        ...runways.map(
            runway=>
            distanceToRunway(
                lat,
                lon,
                runway
            )
        )
    );
}


function nearRunway(
    ac,
    limit=.22
){

    return (
        runwayDistance(ac)
        <=
        limit
    );
}


function nearestThreshold(ac){

    const lat=
        Number(ac.lat);


    const lon=
        Number(ac.lon);


    if(
        !Number.isFinite(lat)
        ||
        !Number.isFinite(lon)
    )
        return null;


    let best=null;

    let bestDistance=999;


    for(
        const end
        of runwayEnds
    ){

        const d=
            distanceKm(
                lat,
                lon,
                end.lat,
                end.lon
            );


        if(
            d<
            bestDistance
        ){

            bestDistance=d;

            best=end;
        }
    }


    return {

        runway:best,

        distance:
            bestDistance

    };
}


/* =====================================================
   AIRCRAFT MEMORY
===================================================== */

function getMemory(id){

    if(
        !memory.has(id)
    ){

        memory.set(
            id,
            {
                samples:[],
                arrivalCandidate:false,
                arrivalLastSeen:0,
                wasNearRunwayGround:false,
                lastNearRunwayGround:0,
                lastSeen:Date.now()
            }
        );
    }


    return memory.get(id);
}


function addSample(ac){

    const id=
        aircraftId(ac);


    if(!id)
        return;


    const memoryItem=
        getMemory(id);


    const threshold=
        nearestThreshold(ac);


    const sample={

        time:
            Date.now(),

        ground:
            onGround(ac),

        speed:
            groundSpeed(ac),

        altitude:
            altitude(ac),

        vertical:
            verticalRate(ac),

        positionAge:
            positionAge(ac),

        airportDistance:
            airportDistance(ac),

        thresholdDistance:
            threshold
            ?
            threshold.distance
            :
            999,

        nearRunway:
            nearRunway(ac)

    };


    memoryItem.samples.push(
        sample
    );


    memoryItem.samples=
        memoryItem.samples
        .filter(
            item=>
            item.time
            >=
            Date.now()-180000
        );


    memoryItem.lastSeen=
        Date.now();


    if(
        sample.ground
        &&
        sample.nearRunway
        &&
        sample.positionAge<=8
    ){

        memoryItem
        .wasNearRunwayGround=
            true;


        memoryItem
        .lastNearRunwayGround=
            Date.now();
    }
}


/* =====================================================
   ARRIVAL MEMORY
===================================================== */

function updateArrivalMemory(ac){

    if(onGround(ac))
        return;


    const id=
        aircraftId(ac);


    if(!id)
        return;


    const memoryItem=
        getMemory(id);


    const samples=
        memoryItem.samples;


    if(samples.length<2)
        return;


    const latest=
        samples[
            samples.length-1
        ];


    if(
        latest.vertical>900
        ||
        latest.airportDistance>20
    )
        return;


    if(
        !(
            latest.vertical<200

            ||

            (
                latest.altitude!==null
                &&
                latest.altitude<5000
            )
        )
    )
        return;


    const recent=
        samples
        .filter(
            item=>
            !item.ground
            &&
            item.positionAge<=5
        )
        .slice(-6);


    if(recent.length<2)
        return;


    let closing=0;

    let descending=0;


    for(
        let i=1;
        i<recent.length;
        i++
    ){

        if(
            recent[i]
            .airportDistance
            <
            recent[i-1]
            .airportDistance
            +
            .10
        )
            closing++;


        if(
            recent[i].altitude!==null
            &&
            recent[i-1].altitude!==null
            &&
            recent[i].altitude
            <=
            recent[i-1].altitude+75
        )
            descending++;
    }


    if(
        closing>=1
        &&
        descending>=1
    ){

        memoryItem
        .arrivalCandidate=
            true;


        memoryItem
        .arrivalLastSeen=
            Date.now();
    }


    if(
        memoryItem.arrivalCandidate
        &&
        latest.airportDistance<=8
    ){

        memoryItem
        .arrivalLastSeen=
            Date.now();
    }
}


/* =====================================================
   NEXT ARRIVAL

   Within 12 km
   Below 4500 ft
   Fresh position
   Closing on airport
   Not strongly climbing
===================================================== */

function expectedArrival(ac){

    if(
        onGround(ac)
        ||
        !freshPosition(ac)
    )
        return null;


    const alt=
        altitude(ac);


    const distance=
        airportDistance(ac);


    const id=
        aircraftId(ac);


    if(!id)
        return null;


    const memoryItem=
        getMemory(id);


    const samples=
        memoryItem.samples;


    if(
        alt===null
        ||
        alt>4500
        ||
        distance>12
        ||
        verticalRate(ac)>500
        ||
        samples.length<2
    )
        return null;


    const recent=
        samples.slice(-4);


    let closer=0;


    for(
        let i=1;
        i<recent.length;
        i++
    ){

        if(
            recent[i]
            .airportDistance
            <
            recent[i-1]
            .airportDistance
            +
            .08
        )
            closer++;
    }


    if(closer<1)
        return null;


    return {

        ac,

        distance,

        score:
            distance+
            (alt/4500)*2

    };
}


/* =====================================================
   NEXT DEPARTURE
===================================================== */

function expectedDeparture(ac){

    if(
        !onGround(ac)
        ||
        !freshPosition(ac)
        ||
        !nearRunway(ac,.35)
    )
        return null;


    const speed=
        groundSpeed(ac);


    const id=
        aircraftId(ac);


    if(
        speed<12
        ||
        speed>=40
        ||
        landedBlacklist.has(id)
    )
        return null;


    return {

        ac,

        score:
            -speed

    };
}


/* =====================================================
   TOUCHDOWN
===================================================== */

function detectTouchdown(
    aircraft
){

    for(
        const ac
        of aircraft
    ){

        const id=
            aircraftId(ac);


        if(
            !id
            ||
            !onGround(ac)
        )
            continue;


        const memoryItem=
            getMemory(id);


        if(
            memoryItem.arrivalCandidate
            &&
            positionAge(ac)<=15
            &&
            nearRunway(ac)
        )
            return ac;
    }


    return null;
}


/* =====================================================
   TAKEOFF ROLL
===================================================== */

function departureRoll(ac){

    const id=
        aircraftId(ac);


    if(
        !id
        ||
        !onGround(ac)
        ||
        landedBlacklist.has(id)
        ||
        !freshPosition(ac)
        ||
        !nearRunway(ac)
    )
        return false;


    const groundSamples=
        getMemory(id)
        .samples
        .filter(
            item=>
            item.ground
            &&
            item.positionAge<=5
            &&
            item.nearRunway
        )
        .slice(-8);


    if(
        groundSamples.length<2
    )
        return false;


    const latest=
        groundSamples[
            groundSamples.length-1
        ];


    if(
        latest.speed>=40
    )
        return true;


    const gain=
        latest.speed-
        groundSamples[0].speed;


    let increases=0;


    for(
        let i=1;
        i<groundSamples.length;
        i++
    ){

        if(
            groundSamples[i].speed
            >
            groundSamples[i-1].speed+1
        )
            increases++;
    }


    return (
        latest.speed>=22
        &&
        gain>=8
        &&
        increases>=2
    );
}


/* =====================================================
   AIRBORNE DEPARTURE FALLBACK
===================================================== */

function airborneDeparture(ac){

    if(onGround(ac))
        return false;


    const id=
        aircraftId(ac);


    if(
        !id
        ||
        landedBlacklist.has(id)
    )
        return false;


    const memoryItem=
        getMemory(id);


    const alt=
        altitude(ac);


    const distance=
        airportDistance(ac);


    if(
        alt===null
        ||
        alt>4500
        ||
        distance>8
        ||
        verticalRate(ac)<500
    )
        return false;


    if(
        memoryItem
        .wasNearRunwayGround
        &&
        Date.now()
        -
        memoryItem
        .lastNearRunwayGround
        <
        120000
    )
        return true;


    return (
        memoryItem.samples
        .slice(-12)
        .some(
            sample=>
            sample.ground
            &&
            Date.now()-sample.time
            <
            120000
        )
    );
}


/* =====================================================
   FINAL ARRIVAL
===================================================== */

function finalArrival(ac){

    if(onGround(ac))
        return null;


    const id=
        aircraftId(ac);


    if(!id)
        return null;


    if(
        !getMemory(id)
        .arrivalCandidate
    )
        return null;


    const threshold=
        nearestThreshold(ac);


    if(
        !threshold
        ||
        threshold.distance>3
        ||
        verticalRate(ac)>900
    )
        return null;


    return {

        ac,

        distance:
            threshold.distance

    };
}


/* =====================================================
   AIRLINE DISPLAY
===================================================== */

function airlinePrefix(ac){

    const flight=
        (ac.flight||"")
        .trim()
        .toUpperCase();


    return flight.length>=3
        ?
        flight.slice(0,3)
        :
        "";
}


function airlineName(ac){

    return (
        airlines[
            airlinePrefix(ac)
        ]
        ||
        ""
    );
}


function callsign(ac){

    return (
        (ac.flight||"").trim()
        ||
        ac.r
        ||
        "AIRCRAFT"
    );
}


function aircraftTitle(ac){

    const company=
        airlineName(ac);


    return company
        ?
        company+
        " • "+
        callsign(ac)
        :
        callsign(ac);
}


function aircraftDetail(ac){

    return [

        ac.desc||ac.t||"",

        ac.r||""

    ]
    .filter(Boolean)
    .join(" • ");
}


function liveAircraftDetail(ac){

    const parts=[];


    if(
        ac.desc
        ||
        ac.t
    ){

        parts.push(
            ac.desc||ac.t
        );
    }


    if(ac.r){

        parts.push(
            ac.r
        );
    }


    const alt=
        altitude(ac);


    if(
        alt!==null
        &&
        !onGround(ac)
    ){

        parts.push(
            Math.round(alt)
            +
            " FT"
        );
    }


    if(
        groundSpeed(ac)>0
    ){

        parts.push(
            Math.round(
                groundSpeed(ac)
            )
            +
            " KT"
        );
    }


    return parts.join(
        " • "
    );
}


/* =====================================================
   COLOURED AIRLINE TAIL
===================================================== */

function setTail(ac){

    const prefix=
        airlinePrefix(ac);


    const airlineBrand=
        brand[prefix]
        ||
        {
            c:"#2e6d99",
            s:null
        };


    const fin=
        document
        .getElementById(
            "tailFin"
        );


    const image=
        document
        .getElementById(
            "tailLogo"
        );


    const code=
        document
        .getElementById(
            "tailCode"
        );


    fin.style.background=

        "linear-gradient(145deg,"
        +
        airlineBrand.c
        +
        ",#0a2540)";


    image.style.display=
        "none";


    code.textContent=
        prefix||"AIR";


    code.style.display=
        "block";


    if(
        airlineBrand.s
    ){

        image.onload=
            ()=>{

                image.style.display=
                    "block";

                code.style.display=
                    "none";
            };


        image.onerror=
            ()=>{

                image.style.display=
                    "none";

                code.style.display=
                    "block";
            };


        image.src=

            "https://cdn.simpleicons.org/"
            +
            airlineBrand.s
            +
            "/ffffff";
    }
}


/* =====================================================
   BIG ARRIVAL / DEPARTURE POPUP

   Locked for 16 seconds.
   Arrival may override departure.
===================================================== */

function showPopup(
    ac,
    state
){

    const now=
        Date.now();


    const id=
        aircraftId(ac);


    if(
        now<popupBusyUntil
        &&
        !(
            state==="ARRIVAL"
            &&
            popupDirection==="DEPARTURE"
        )
    )
        return;


    if(
        popupAircraft===id
        &&
        popupDirection===state
        &&
        now<popupBusyUntil
    )
        return;


    popupBusyUntil=
        now+16000;


    popupDirection=
        state;


    popupAircraft=
        id;


    const popup=
        document
        .getElementById(
            "popup"
        );


    popup.className=
        "popup "
        +
        (
            state==="DEPARTURE"
            ?
            "departure"
            :
            ""
        );


    document
    .getElementById(
        "popupState"
    )
    .textContent=
        state;


    document
    .getElementById(
        "popupFlight"
    )
    .textContent=
        aircraftTitle(ac);


    document
    .getElementById(
        "popupDetails"
    )
    .textContent=
        liveAircraftDetail(ac);


    setTail(ac);


    popup.classList.remove(
        "show"
    );


    void popup.offsetWidth;


    popup.classList.add(
        "show"
    );


    clearTimeout(
        popupTimer
    );


    popupTimer=
        setTimeout(
            ()=>{

                popup.classList.remove(
                    "show"
                );


                popupDirection=
                    null;


                popupAircraft=
                    null;

            },
            16000
        );
}


/* =====================================================
   LATEST MOVEMENT
===================================================== */

function movement(
    ac,
    state
){

    lastMovement={

        state,

        ac,

        time:
            Date.now()

    };
}


/* =====================================================
   INFORMATION RAIL
===================================================== */

function railItems(){

    const items=[];


    if(nextArrival){

        items.push({

            tag:
                "NEXT ARRIVAL",

            state:
                "EXPECTED",

            ac:
                nextArrival.ac,

            extra:
                nextArrival
                .distance
                .toFixed(1)
                +
                " KM"

        });
    }


    if(nextDeparture){

        items.push({

            tag:
                "NEXT DEPARTURE",

            state:
                "EXPECTED",

            ac:
                nextDeparture.ac,

            extra:
                Math.round(
                    groundSpeed(
                        nextDeparture.ac
                    )
                )
                +
                " KT"

        });
    }


    if(
        lastMovement
        &&
        Date.now()
        -
        lastMovement.time
        <
        6*60*1000
    ){

        items.push({

            tag:
                "LATEST",

            state:
                lastMovement.state,

            ac:
                lastMovement.ac,

            done:
                true

        });
    }


    if(!items.length){

        items.push({

            tag:
                "PRG LIVE",

            state:
                "MONITORING",

            text:
                "WAITING FOR QUALIFYING COMMERCIAL ARRIVAL OR DEPARTURE"

        });
    }


    return items;
}


function renderRail(){

    const items=
        railItems();


    const item=
        items[
            railIndex
            %
            items.length
        ];


    railIndex++;


    document
    .getElementById(
        "railTag"
    )
    .textContent=
        item.tag;


    const stateClass=
        item.done
        ?
        "railState done"
        :
        "railState";


    if(item.ac){

        const extra=
            item.extra
            ?
            " • "+item.extra
            :
            "";


        document
        .getElementById(
            "railText"
        )
        .innerHTML=

            '<span class="'
            +
            stateClass
            +
            '">'
            +
            item.state
            +
            '</span>'
            +
            aircraftTitle(item.ac)
            +
            " • "
            +
            aircraftDetail(item.ac)
            +
            extra;

    }

    else{

        document
        .getElementById(
            "railText"
        )
        .innerHTML=

            '<span class="railState">'
            +
            item.state
            +
            '</span>'
            +
            item.text;
    }
}


setInterval(
    renderRail,
    5500
);


renderRail();


/* =====================================================
   CLEANUP
===================================================== */

function cleanup(){

    const now=
        Date.now();


    for(
        const [id,expiry]
        of landedBlacklist
    ){

        if(
            now>=expiry
        ){

            landedBlacklist.delete(
                id
            );
        }
    }


    for(
        const [id,memoryItem]
        of memory
    ){

        if(
            memoryItem.arrivalCandidate
            &&
            now-
            memoryItem.arrivalLastSeen
            >
            8*60*1000
        ){

            memoryItem
            .arrivalCandidate=
                false;
        }


        if(
            now-
            memoryItem.lastSeen
            >
            15*60*1000
        ){

            memory.delete(
                id
            );
        }
    }


    if(
        lastMovement
        &&
        now-
        lastMovement.time
        >
        6*60*1000
    ){

        lastMovement=
            null;
    }
}


/* =====================================================
   MAIN LIVE ENGINE
===================================================== */

async function update(){

    cleanup();


    try{

        const response=
            await fetch(

                API+
                "?t="+
                Date.now(),

                {
                    cache:"no-store"
                }

            );


        if(!response.ok){

            throw new Error(
                "HTTP "
                +
                response.status
            );
        }


        const data=
            await response.json();


        /* Show total feed count so we know
           immediately that ADS-B is alive */

        document
        .getElementById(
            "chip"
        )
        .textContent=

            "ADS-B • "
            +
            (data.ac||[]).length
            +
            " AIRCRAFT";


        /* Valid positions + commercial filtering */

        const aircraft=
            (data.ac||[])

            .filter(
                ac=>
                Number.isFinite(
                    Number(ac.lat)
                )
                &&
                Number.isFinite(
                    Number(ac.lon)
                )
            )

            .filter(
                ac=>
                !unwantedAircraft(ac)
            );


        /* Update movement history */

        for(
            const ac
            of aircraft
        ){

            addSample(ac);

            updateArrivalMemory(ac);
        }


        /* =============================================
           NEXT ARRIVAL
        ============================================= */

        const expectedArrivals=[];


        for(
            const ac
            of aircraft
        ){

            const candidate=
                expectedArrival(ac);


            if(candidate){

                expectedArrivals.push(
                    candidate
                );
            }
        }


        expectedArrivals.sort(
            (a,b)=>
            a.score-b.score
        );


        nextArrival=
            expectedArrivals[0]
            ||
            null;


        /* =============================================
           NEXT DEPARTURE
        ============================================= */

        const expectedDepartures=[];


        for(
            const ac
            of aircraft
        ){

            const candidate=
                expectedDeparture(ac);


            if(candidate){

                expectedDepartures.push(
                    candidate
                );
            }
        }


        expectedDepartures.sort(
            (a,b)=>
            a.score-b.score
        );


        nextDeparture=
            expectedDepartures[0]
            ||
            null;


        /* =============================================
           TOUCHDOWN
        ============================================= */

        const touchdown=
            detectTouchdown(
                aircraft
            );


        if(touchdown){

            const id=
                aircraftId(
                    touchdown
                );


            landedBlacklist.set(
                id,
                Date.now()
                +
                5*60*1000
            );


            getMemory(id)
            .arrivalCandidate=
                false;


            if(
                activeDeparture===id
            ){

                activeDeparture=
                    null;
            }


            movement(
                touchdown,
                "ARRIVED"
            );


            return;
        }


        /* =============================================
           FINAL ARRIVAL
        ============================================= */

        const finals=[];


        for(
            const ac
            of aircraft
        ){

            const candidate=
                finalArrival(ac);


            if(candidate){

                finals.push(
                    candidate
                );
            }
        }


        finals.sort(
            (a,b)=>
            a.distance-b.distance
        );


        if(finals.length){

            showPopup(
                finals[0].ac,
                "ARRIVAL"
            );


            if(
                finals[0]
                .distance
                <=
                1.5
            ){

                return;
            }
        }


        /* =============================================
           TAKEOFF ROLL
        ============================================= */

        let bestDeparture=
            null;


        for(
            const ac
            of aircraft
        ){

            if(
                !departureRoll(ac)
            )
                continue;


            const score=
                groundSpeed(ac);


            if(
                !bestDeparture
                ||
                score>
                bestDeparture.score
            ){

                bestDeparture={

                    ac,

                    id:
                        aircraftId(ac),

                    score

                };
            }
        }


        if(bestDeparture){

            activeDeparture=
                bestDeparture.id;


            showPopup(
                bestDeparture.ac,
                "DEPARTURE"
            );


            return;
        }


        /* =============================================
           ACTIVE DEPARTURE

           Keep tracking until 2000 ft.
        ============================================= */

        if(activeDeparture){

            const ac=
                aircraft.find(
                    item=>
                    aircraftId(item)
                    ===
                    activeDeparture
                );


            if(ac){

                const alt=
                    altitude(ac);


                if(
                    !onGround(ac)
                ){

                    movement(
                        ac,
                        "DEPARTED"
                    );


                    showPopup(
                        ac,
                        "DEPARTURE"
                    );


                    if(
                        alt!==null
                        &&
                        alt>=2000
                    ){

                        activeDeparture=
                            null;
                    }

                    else{

                        return;
                    }

                }

                else{

                    return;
                }

            }

            else{

                activeDeparture=
                    null;
            }
        }


        /* =============================================
           AIRBORNE DEPARTURE FALLBACK
        ============================================= */

        let airborne=
            null;


        for(
            const ac
            of aircraft
        ){

            if(
                !airborneDeparture(ac)
            )
                continue;


            const score=

                verticalRate(ac)*2

                -

                (
                    altitude(ac)
                    ||
                    0
                );


            if(
                !airborne
                ||
                score>
                airborne.score
            ){

                airborne={

                    ac,

                    id:
                        aircraftId(ac),

                    score

                };
            }
        }


        if(airborne){

            activeDeparture=
                airborne.id;


            movement(
                airborne.ac,
                "DEPARTED"
            );


            showPopup(
                airborne.ac,
                "DEPARTURE"
            );


            return;
        }

    }

    catch(error){

        console.error(
            error
        );


        document
        .getElementById(
            "chip"
        )
        .textContent=
            "TRACKING ERROR";
    }
}


/* =====================================================
   START
===================================================== */

update();


setInterval(
    update,
    3000
);

</script>
