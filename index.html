<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.ribbon {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 105px;
    background: rgb(0, 55, 110);
    color: white;
    display: flex;
    align-items: center;
    box-sizing: border-box;
}

.airport {
    width: 25%;
    padding-left: 25px;
    font-size: 22px;
    font-weight: bold;
}

.live {
    color: #ff3333;
    font-size: 16px;
    margin-bottom: 5px;
}

.aircraft {
    width: 75%;
    padding-left: 25px;
    border-left: 2px solid rgba(255,255,255,0.25);
}

.airline {
    font-size: 25px;
    font-weight: bold;
}

.details {
    font-size: 19px;
    margin-top: 6px;
    opacity: 0.9;
}

.status {
    font-size: 16px;
    margin-top: 5px;
    color: #8fd3ff;
}
</style>
</head>

<body>

<div class="ribbon">

    <div class="airport">
        <div class="live">● LIVE</div>
        PRAGUE AIRPORT
        <div>LKPR / PRG</div>
    </div>

    <div class="aircraft">
        <div class="airline">LOADING AIRCRAFT...</div>
        <div class="details">WAITING FOR LIVE DATA</div>
        <div class="status">CONNECTING...</div>
    </div>

</div>

<script>
const airportLat = 50.1008;
const airportLon = 14.2600;

const previousDistances = new Map();

let currentAircraftId = null;

function distanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

    return R * 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
    );
}

function aircraftId(ac) {
    return ac.hex || ac.r || ac.flight || null;
}

function numericAltitude(ac) {
    if (
        ac.alt_baro === "ground" ||
        ac.alt_baro === null ||
        ac.alt_baro === undefined
    ) {
        return null;
    }

    const value = Number(ac.alt_baro);

    return Number.isFinite(value)
        ? value
        : null;
}

function scoreAircraft(ac) {
    let score = 0;

    const id = aircraftId(ac);

    const distance = distanceKm(
        Number(ac.lat),
        Number(ac.lon),
        airportLat,
        airportLon
    );

    const altitude = numericAltitude(ac);

    const verticalRate = Number(ac.baro_rate);

    const previousDistance =
        id ? previousDistances.get(id) : undefined;

    /*
       MOVEMENT TOWARD / AWAY FROM AIRPORT
    */

    if (previousDistance !== undefined) {

        const change =
            previousDistance - distance;

        // Clearly getting closer
        if (change > 0.15) {
            score += 160;
        }

        // Slightly getting closer
        else if (change > 0.03) {
            score += 100;
        }

        // Clearly moving away
        else if (change < -0.15) {
            score -= 180;
        }

        // Slightly moving away
        else if (change < -0.03) {
            score -= 100;
        }
    }

    /*
       DISTANCE FROM PRAGUE AIRPORT
    */

    if (distance < 2) {
        score += 70;
    }
    else if (distance < 5) {
        score += 55;
    }
    else if (distance < 10) {
        score += 35;
    }
    else if (distance < 15) {
        score += 15;
    }

    /*
       ALTITUDE
    */

    if (altitude !== null) {

        if (altitude < 1500) {
            score += 60;
        }
        else if (altitude < 3000) {
            score += 45;
        }
        else if (altitude < 5000) {
            score += 25;
        }
        else if (altitude > 9000) {
            score -= 60;
        }
    }

    /*
       DESCENDING / CLIMBING
    */

    if (Number.isFinite(verticalRate)) {

        // Strongly descending
        if (verticalRate < -500) {
            score += 70;
        }

        // Gently descending
        else if (verticalRate < -100) {
            score += 45;
        }

        // Strong climb = probably departure
        else if (verticalRate > 700) {
            score -= 90;
        }

        // Moderate climb
        else if (verticalRate > 250) {
            score -= 50;
        }
    }

    /*
       IDENTIFICATION QUALITY
    */

    if (ac.flight) score += 15;
    if (ac.r) score += 10;
    if (ac.t) score += 10;

    /*
       KEEP CURRENT AIRCRAFT STABLE

       This helps stop the ribbon jumping
       between two similar aircraft.
    */

    if (id && id === currentAircraftId) {
        score += 35;
    }

    return score;
}

async function updateAircraft() {

    const airline =
        document.querySelector(".airline");

    const details =
        document.querySelector(".details");

    const status =
        document.querySelector(".status");

    try {

        const response = await fetch(
            "https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft"
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const wrapper =
            await response.json();

        const data =
            wrapper.upstreamText
                ? JSON.parse(wrapper.upstreamText)
                : wrapper;

        if (!data.ac || data.ac.length === 0) {

            airline.textContent =
                "NO AIRCRAFT NEARBY";

            details.textContent = "";

            status.textContent =
                "WAITING FOR TRAFFIC";

            return;
        }

        const candidates =
            data.ac.filter(ac =>

                Number.isFinite(Number(ac.lat)) &&

                Number.isFinite(Number(ac.lon)) &&

                (ac.flight || ac.r || ac.t)
            );

        if (candidates.length === 0) {

            airline.textContent =
                "AIRCRAFT DETECTED";

            details.textContent =
                "IDENTIFICATION UNAVAILABLE";

            status.textContent =
                "LIVE ADS-B";

            return;
        }

        candidates.sort(
            (a, b) =>
                scoreAircraft(b) -
                scoreAircraft(a)
        );

        const aircraft =
            candidates[0];

        currentAircraftId =
            aircraftId(aircraft);

        /*
           Save current distances AFTER
           selecting the aircraft.
        */

        candidates.forEach(ac => {

            const id =
                aircraftId(ac);

            if (!id) return;

            const distance =
                distanceKm(
                    Number(ac.lat),
                    Number(ac.lon),
                    airportLat,
                    airportLon
                );

            previousDistances.set(
                id,
                distance
            );
        });

        const callsign =
            aircraft.flight &&
            aircraft.flight.trim()

                ? aircraft.flight.trim()

                : "UNKNOWN FLIGHT";

        const registration =
            aircraft.r ||
            "REG UNKNOWN";

        const type =
            aircraft.t ||
            "TYPE UNKNOWN";

        const distance =
            distanceKm(
                Number(aircraft.lat),
                Number(aircraft.lon),
                airportLat,
                airportLon
            );

        airline.textContent =
            callsign;

        details.textContent =
            type +
            "  •  " +
            registration;

        status.textContent =
            "LIVE AIRCRAFT DATA";

    }

    catch (error) {

        airline.textContent =
            "AIRCRAFT DATA";

        details.textContent =
            "CONNECTION ERROR";

        status.textContent =
            "RETRYING...";

        console.error(error);
    }
}

updateAircraft();

setInterval(
    updateAircraft,
    10000
);
</script>
</body>
</html>
