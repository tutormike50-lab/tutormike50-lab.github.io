<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.ribbon {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 105px;
    background: rgba(0, 55, 110, 0.90);
    color: white;
    display: flex;
    align-items: center;
    box-sizing: border-box;
}

.airport {
    width: 25%;
    padding-left: 25px;
    font-size: 22px;
    font-weight: bold;
}

.live {
    color: #ff3333;
    font-size: 16px;
    margin-bottom: 5px;
}

.aircraft {
    width: 75%;
    padding-left: 25px;
    border-left: 2px solid rgba(255,255,255,0.25);
}

.airline {
    font-size: 25px;
    font-weight: bold;
}

.details {
    font-size: 19px;
    margin-top: 6px;
    opacity: 0.9;
}

.status {
    font-size: 16px;
    margin-top: 5px;
    color: #8fd3ff;
}
</style>
</head>

<body>

<div class="ribbon">

    <div class="airport">
        <div class="live">● LIVE</div>
        PRAGUE AIRPORT
        <div>LKPR / PRG</div>
    </div>

    <div class="aircraft">
        <div class="airline">
            RYANAIR — FR1234
        </div>

        <div class="details">
            Boeing 737-800 &nbsp; • &nbsp; EI-XXX
        </div>

        <div class="status">
            INBOUND
        </div>
    </div>

</div>
<script>
...
</script>
<script>
async function testAircraftData() {
    const status = document.querySelector(".status");

    try {
        const response = await fetch(
            "https://api.adsb.lol/v2/point/50.1008/14.2600/10"
        );

        if (!response.ok) {
            throw new Error("API error");
        }

        const data = await response.json();

        if (data.ac && data.ac.length > 0) {
            status.textContent =
                "AIRCRAFT DATA RECEIVED — " +
                data.ac.length +
                " AIRCRAFT NEAR PRAGUE";
        } else {
            status.textContent = "CONNECTED — NO AIRCRAFT FOUND";
        }

    } catch (error) {
        status.textContent = "API CONNECTION FAILED";
    }
}

testAircraftData();
</script>
</body>
</html>
