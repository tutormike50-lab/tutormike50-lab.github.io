<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:transparent;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

.ribbon{
    position:absolute;
    left:0;
    bottom:0;

    width:100%;
    height:110px;

    background:
        linear-gradient(
            90deg,
            #003d78,
            #0062ad,
            #003d78
        );

    border-top:2px solid #45aaff;

box-shadow:
    0 2px 8px rgba(0,0,0,.30);

color:white;

    display:flex;
    align-items:center;

    box-sizing:border-box;
}


/* =========================
   PRG
========================= */

.airport{
    width:13%;
    height:75%;

    display:flex;
    align-items:center;
    justify-content:center;

    box-sizing:border-box;

    border-right:
        1px solid
        rgba(255,255,255,.30);
}

.airport-mark{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.prg-wrap{
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.live{
    font-size:11px;
    font-weight:bold;

    color:#ff5a5a;

    margin-bottom:1px;

    letter-spacing:1px;
}

.prg{
    font-family:
        "Arial Narrow",
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-size:34px;
    font-weight:800;

    letter-spacing:3px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #d6d6d6 35%,
            #8f9aa3 60%,
            #f3f3f3 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 1px 0 rgba(255,255,255,.35),
        0 2px 4px rgba(0,0,0,.55);
}


/* SILVER AIRPORT CONTROL TOWER */

.tower-icon{
    position:relative;

    width:28px;
    height:48px;

    flex-shrink:0;

    filter:
        drop-shadow(
            0 2px 3px
            rgba(0,0,0,.45)
        );
}

.tower-stem{
    position:absolute;

    left:10px;
    bottom:0;

    width:9px;
    height:30px;

    background:
        linear-gradient(
            90deg,
            #727d86,
            #eeeeee,
            #808a92
        );

    clip-path:
        polygon(
            25% 0,
            75% 0,
            100% 100%,
            0 100%
        );
}

.tower-top{
    position:absolute;

    left:3px;
    top:7px;

    width:22px;
    height:13px;

    background:
        linear-gradient(
            180deg,
            #f5f5f5,
            #8b969e
        );

    clip-path:
        polygon(
            10% 0,
            90% 0,
            100% 45%,
            82% 100%,
            18% 100%,
            0 45%
        );
}

.tower-top:before{
    content:"";

    position:absolute;

    left:2px;
    right:2px;
    top:4px;

    height:4px;

    background:#264d69;

    opacity:.75;
}

.tower-light{
    position:absolute;

    left:13px;
    top:0;

    width:2px;
    height:8px;

    background:#c9d0d5;
}

.tower-light:before{
    content:"";

    position:absolute;

    left:-2px;
    top:-2px;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff3b3b;

    box-shadow:
        0 0 6px
        rgba(255,50,50,.8);

    animation:towerBlink 1.7s infinite;
}

@keyframes towerBlink{

    0%,45%,100%{
        opacity:.15;
    }

    50%,60%{
        opacity:1;
    }
}

   LOGO
========================= */

    width:12%;
    height:75%;

    display:flex;
    align-items:center;

            0 2px 4px

.logo-fallback{
    width:58px;

    border-radius:50%;

    background:
        rgba(0,20,50,.35);

    border:
        2px solid
        rgba(255,255,255,.65);

    display:none;
    align-items:center;
    justify-content:center;

    font-size:17px;
    font-weight:900;

    letter-spacing:1px;

}

========================= */

.info{
    width:50%;

    box-sizing:border-box;
}

.airline{
    font-size:25px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.details{

        rgba(255,255,255,.82);

    text-overflow:ellipsis;

========================= */

.status{

    text-align:center;

    font-size:28px;
    font-weight:900;

    letter-spacing:1px;

<script>

const API =
"https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft";


/* =========================================================
   AIRLINES
========================================================= */

const airlines={

    TVS:"SMARTWINGS",
    RYR:"RYANAIR",
    UAE:"EMIRATES",
    PGT:"PEGASUS AIRLINES",
    AUA:"AUSTRIAN AIRLINES",
    DLH:"LUFTHANSA",
    KLM:"KLM",
    BAW:"BRITISH AIRWAYS",
    EZY:"EASYJET",
    WZZ:"WIZZ AIR",
    QTR:"QATAR AIRWAYS",
    THY:"TURKISH AIRLINES",
    AFR:"AIR FRANCE",
    SWR:"SWISS",
    LOT:"LOT POLISH AIRLINES",
    SAS:"SAS",
    FIN:"FINNAIR",
    IBE:"IBERIA",
    TAP:"TAP AIR PORTUGAL",
    ITY:"ITA AIRWAYS",
    EIN:"AER LINGUS",
    VLG:"VUELING",
    EWG:"EUROWINGS",
    AEE:"AEGEAN AIRLINES",
    BTI:"AIRBALTIC",
    BEL:"BRUSSELS AIRLINES",
    TRA:"TRANSAVIA",
    EXS:"JET2",
    TUI:"TUI",
    ETD:"ETIHAD AIRWAYS",
    ELY:"EL AL",
    MSR:"EGYPTAIR",
    CFG:"CONDOR"

};


/* =========================================================
   LOGO MAP

   If a logo cannot load,
   we automatically show
   the airline code instead.
========================================================= */

const logoSlugs={

    RYR:"ryanair",
    UAE:"emirates",
    AUA:"austrianairlines",
    DLH:"lufthansa",
    KLM:"klm",
    BAW:"britishairways",
    EZY:"easyjet",
    WZZ:"wizzair",
    QTR:"qatarairways",
    THY:"turkishairlines",
    AFR:"airfrance",
    SWR:"swiss",
    LOT:"lotpolishairlines",
    SAS:"sas",
    FIN:"finnair",
    IBE:"iberia",
    TAP:"tapairportugal",
    EIN:"aerlingus",
    EWG:"eurowings",
    AEE:"aegeanairlines",
    CFG:"condor"

};


function airlinePrefix(ac){

    const callsign=
        (ac.flight||"")
        .trim()
        .toUpperCase();


    if(callsign.length<3)
        return "";


    return callsign.substring(0,3);
}


function updateLogo(ac){

    const prefix=
        airlinePrefix(ac);


    const img=
        document.getElementById(
            "airlineLogo"
        );


    const fallback=
        document.getElementById(
            "logoFallback"
        );


    img.style.display="none";
    fallback.style.display="none";


    if(!prefix)
        return;


    const slug=
        logoSlugs[prefix];


    if(!slug){

        fallback.textContent=
            prefix;

        fallback.style.display=
            "flex";

        return;
    }


    img.onload=function(){

        fallback.style.display=
            "none";

        img.style.display=
            "block";
    };


    img.onerror=function(){

        img.style.display=
            "none";

        fallback.textContent=
            prefix;

        fallback.style.display=
            "flex";
    };


    img.src=
        "https://cdn.simpleicons.org/"
        +
        slug
        +
        "/ffffff";
}


/* =========================================================
   PRAGUE AIRPORT / RUNWAYS
========================================================= */

const PRG={
    lat:50.1008,
    lon:14.2600
};


const runwayEnds=[

    {
        name:"06",
        heading:60,
        lat:50.1018361,
        lon:14.2263000
    },

    {
        name:"24",
        heading:240,
        lat:50.1159500,
        lon:14.2733667
    },

    {
        name:"12",
        heading:122,
        lat:50.1080111,
        lon:14.2453667
    },

    {
        name:"30",
        heading:302,
        lat:50.0904667,
        lon:14.2816722
    }

];


const physicalRunways=[

    {
        name:"06/24",
        a:runwayEnds[0],
        b:runwayEnds[1]
    },

    {
        name:"12/30",
        a:runwayEnds[2],
        b:runwayEnds[3]
    }

];


/* =========================================================
   FILTER HELICOPTERS / SMALL GA
========================================================= */

const helicopterTypes=new Set([

    "A109","A119","A139","A149","A169","A189",
    "AS32","AS50","AS55","AS65",
    "B06","B105","B212","B222","B412","B429",
    "EC20","EC25","EC30","EC35","EC45","EC55",
    "H125","H130","H135","H145","H155","H160",
    "R22","R44","R66",
    "S55","S58","S61","S64","S76","S92"

]);


const smallAircraftPrefixes=[

    "C15","C17","C18","C19","C20","C21",
    "C22","C23","C24","C25",

    "PA18","PA20","PA22","PA24","PA28","PA32",
    "PA34","PA38","PA44",

    "DA20","DA40","DA42",

    "SR20","SR22",

    "DR40","P28","M20",

    "BE23","BE24","BE33","BE35","BE36",

    "DV20"

];


function unwantedAircraft(ac){

    const type=
        (ac.t||"")
        .trim()
        .toUpperCase();


    const category=
        (ac.category||"")
        .trim()
        .toUpperCase();


    if(category==="A7")
        return true;


    if(helicopterTypes.has(type))
        return true;


    for(const prefix of smallAircraftPrefixes){

        if(type.startsWith(prefix))
            return true;
    }


    return false;
}


/* =========================================================
   MEMORY
========================================================= */

const aircraftMemory=
    new Map();


const landedBlacklist=
    new Map();


let activeDeparture=null;

let landedDisplay=null;


/* =========================================================
   BASIC HELPERS
========================================================= */

function aircraftId(ac){

    return (
        ac.hex ||
        ac.r ||
        (ac.flight||"").trim() ||
        null
    );
}


function onGround(ac){

    return (
        ac.alt_baro==="ground" ||
        ac.alt_geom==="ground"
    );
}


function altitude(ac){

    if(onGround(ac))
        return 0;


    let value=
        Number(ac.alt_baro);


    if(!Number.isFinite(value))
        value=
            Number(ac.alt_geom);


    return Number.isFinite(value)
        ? value
        : null;
}


function groundSpeed(ac){

    const value=
        Number(ac.gs);


    return Number.isFinite(value)
        ? value
        : 0;
}


function verticalRate(ac){

    let value=
        Number(ac.baro_rate);


    if(!Number.isFinite(value))
        value=
            Number(ac.geom_rate);


    return Number.isFinite(value)
        ? value
        : 0;
}


function positionAge(ac){

    const value=
        Number(ac.seen_pos);


    return Number.isFinite(value)
        ? value
        : 999;
}


function freshPosition(ac){

    return positionAge(ac)<=5;
}


function distanceKm(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371;


    const dLat=
        (lat2-lat1)*
        Math.PI/180;


    const dLon=
        (lon2-lon1)*
        Math.PI/180;


    const a=

        Math.sin(dLat/2)**2

        +

        Math.cos(
            lat1*Math.PI/180
        )

        *

        Math.cos(
            lat2*Math.PI/180
        )

        *

        Math.sin(dLon/2)**2;


    return R*2*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}


/* =========================================================
   RUNWAY GEOMETRY
========================================================= */

function distanceToRunway(
    lat,
    lon,
    runway
){

    const ref=
        (
            lat+
            runway.a.lat+
            runway.b.lat
        )/3;


    const ky=111.32;


    const kx=
        111.32*
        Math.cos(
            ref*
            Math.PI/180
        );


    const px=
        lon*kx;

    const py=
        lat*ky;


    const ax=
        runway.a.lon*kx;

    const ay=
        runway.a.lat*ky;


    const bx=
        runway.b.lon*kx;

    const by=
        runway.b.lat*ky;


    const vx=
        bx-ax;

    const vy=
        by-ay;


    const wx=
        px-ax;

    const wy=
        py-ay;


    const lengthSquared=
        vx*vx+
        vy*vy;


    let t=
        (
            wx*vx+
            wy*vy
        )/
        lengthSquared;


    t=
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    const cx=
        ax+t*vx;


    const cy=
        ay+t*vy;


    return Math.sqrt(
        (px-cx)**2+
        (py-cy)**2
    );
}


function nearestRunwayDistance(ac){

    const lat=
        Number(ac.lat);

    const lon=
        Number(ac.lon);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    )
        return 999;


    let best=999;


    for(const runway of physicalRunways){

        const d=
            distanceToRunway(
                lat,
                lon,
                runway
            );


        if(d<best)
            best=d;
    }


    return best;
}


function nearRunway(ac){

    return (
        nearestRunwayDistance(ac)
        <=
        0.22
    );
}


function nearestThreshold(ac){

    const lat=
        Number(ac.lat);

    const lon=
        Number(ac.lon);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    )
        return null;


    let best=null;
    let bestDistance=999;


    for(const end of runwayEnds){

        const d=
            distanceKm(
                lat,
                lon,
                end.lat,
                end.lon
            );


        if(d<bestDistance){

            bestDistance=d;
            best=end;
        }
    }


    return {
        runway:best,
        distance:bestDistance
    };
}


/* =========================================================
   DISPLAY
========================================================= */

function airlineName(callsign){

    if(!callsign)
        return "";


    return airlines[
        callsign
        .trim()
        .toUpperCase()
        .substring(0,3)
    ] || "";
}


function headline(ac){

    const callsign=
        (ac.flight||"")
        .trim()
        ||
        "AIRCRAFT";


    const company=
        airlineName(callsign);


    return company

        ? company+
          "  •  "+
          callsign

        : callsign;
}


function aircraftDetails(ac){

    return [

        ac.t||"",
        ac.r||""

    ]
    .filter(Boolean)
    .join("  •  ");
}


function showState(ac,state){

    document
    .querySelector(".airline")
    .textContent=
        headline(ac);


    document
    .querySelector(".details")
    .textContent=
        aircraftDetails(ac);


    document
    .querySelector(".status")
    .textContent=
        state;


    updateLogo(ac);
}


function clearDisplay(){

    document
    .querySelector(".airline")
    .textContent="";


    document
    .querySelector(".details")
    .textContent="";


    document
    .querySelector(".status")
    .textContent="";


    document
    .getElementById(
        "airlineLogo"
    )
    .style.display=
        "none";


    document
    .getElementById(
        "logoFallback"
    )
    .style.display=
        "none";
}


/* =========================================================
   MEMORY HELPERS
========================================================= */

function getMemory(id){

    if(!aircraftMemory.has(id)){

        aircraftMemory.set(
            id,
            {
                samples:[],

                arrivalCandidate:false,

                arrivalLastSeen:0,

                wasNearRunwayGround:false,

                lastNearRunwayGround:0,

                lastSeen:Date.now()
            }
        );
    }


    return aircraftMemory.get(id);
}


function addSample(ac){

    const id=
        aircraftId(ac);


    if(!id)
        return;


    const memory=
        getMemory(id);


    const lat=
        Number(ac.lat);

    const lon=
        Number(ac.lon);


    const airportDistance=

        Number.isFinite(lat)
        &&
        Number.isFinite(lon)

        ?

        distanceKm(
            lat,
            lon,
            PRG.lat,
            PRG.lon
        )

        :

        999;


    const threshold=
        nearestThreshold(ac);


    const sample={

        time:
            Date.now(),

        ground:
            onGround(ac),

        speed:
            groundSpeed(ac),

        altitude:
            altitude(ac),

        vertical:
            verticalRate(ac),

        positionAge:
            positionAge(ac),

        airportDistance,

        thresholdDistance:
            threshold
            ? threshold.distance
            : 999,

        nearRunway:
            nearRunway(ac)
    };


    memory.samples.push(sample);


    const cutoff=
        Date.now()-
        180000;


    memory.samples=
        memory.samples
        .filter(
            s=>
            s.time>=cutoff
        );


    memory.lastSeen=
        Date.now();


    if(
        sample.ground
        &&
        sample.nearRunway
        &&
        sample.positionAge<=8
    ){

        memory.wasNearRunwayGround=
            true;

        memory.lastNearRunwayGround=
            Date.now();
    }
}


/* =========================================================
   ARRIVAL MEMORY
========================================================= */

function updateArrivalCandidate(ac){

    if(onGround(ac))
        return;


    const id=
        aircraftId(ac);


    if(!id)
        return;


    const memory=
        getMemory(id);


    const samples=
        memory.samples;


    if(samples.length<2)
        return;


    const latest=
        samples[
            samples.length-1
        ];


    if(latest.vertical>900)
        return;


    if(latest.airportDistance>20)
        return;


    const alt=
        latest.altitude;


    const descentEvidence=

        latest.vertical<200

        ||

        (
            alt!==null
            &&
            alt<5000
        );


    if(!descentEvidence)
        return;


    const recent=
        samples
        .filter(
            s=>
            !s.ground
            &&
            s.positionAge<=5
        )
        .slice(-6);


    if(recent.length<2)
        return;


    let closerCount=0;
    let descendingCount=0;


    for(
        let i=1;
        i<recent.length;
        i++
    ){

        if(
            recent[i].airportDistance
            <
            recent[i-1].airportDistance
            +
            0.10
        )
            closerCount++;


        if(
            recent[i].altitude!==null
            &&
            recent[i-1].altitude!==null
            &&
            recent[i].altitude
            <=
            recent[i-1].altitude+75
        )
            descendingCount++;
    }


    if(
        closerCount>=1
        &&
        descendingCount>=1
    ){

        memory.arrivalCandidate=true;

        memory.arrivalLastSeen=
            Date.now();
    }


    if(
        memory.arrivalCandidate
        &&
        latest.airportDistance<=8
    ){

        memory.arrivalLastSeen=
            Date.now();
    }
}


/* =========================================================
   TOUCHDOWN
========================================================= */

function detectTouchdown(aircraft){

    for(const ac of aircraft){

        const id=
            aircraftId(ac);


        if(
            !id
            ||
            !onGround(ac)
        )
            continue;


        const memory=
            getMemory(id);


        if(
            !memory.arrivalCandidate
        )
            continue;


        if(
            positionAge(ac)>15
        )
            continue;


        if(
            !nearRunway(ac)
        )
            continue;


        return ac;
    }


    return null;
}


/* =========================================================
   DEPARTURE ACCELERATION
========================================================= */

function departureAcceleration(ac){

    const id=
        aircraftId(ac);


    if(
        !id
        ||
        !onGround(ac)
    )
        return false;


    if(
        landedBlacklist.has(id)
    )
        return false;


    if(
        !freshPosition(ac)
    )
        return false;


    if(
        !nearRunway(ac)
    )
        return false;


    const memory=
        getMemory(id);


    const freshGround=
        memory.samples

        .filter(
            s=>
            s.ground
            &&
            s.positionAge<=5
            &&
            s.nearRunway
        )

        .slice(-8);


    if(freshGround.length<2)
        return false;


    const latest=
        freshGround[
            freshGround.length-1
        ];


    if(latest.speed>=40)
        return true;


    const first=
        freshGround[0];


    const gain=
        latest.speed-
        first.speed;


    let increases=0;


    for(
        let i=1;
        i<freshGround.length;
        i++
    ){

        if(
            freshGround[i].speed
            >
            freshGround[i-1].speed+1
        )
            increases++;
    }


    if(
        latest.speed>=22
        &&
        gain>=8
        &&
        increases>=2
    )
        return true;


    return false;
}


/* =========================================================
   AIRBORNE DEPARTURE FALLBACK
========================================================= */

function airborneDeparture(ac){

    if(onGround(ac))
        return false;


    const id=
        aircraftId(ac);


    if(!id)
        return false;


    if(
        landedBlacklist.has(id)
    )
        return false;


    const memory=
        getMemory(id);


    const alt=
        altitude(ac);


    const climb=
        verticalRate(ac);


    const lat=
        Number(ac.lat);

    const lon=
        Number(ac.lon);


    if(
        !Number.isFinite(lat)
        ||
        !Number.isFinite(lon)
    )
        return false;


    const d=
        distanceKm(
            lat,
            lon,
            PRG.lat,
            PRG.lon
        );


    if(
        alt===null
        ||
        alt>4500
        ||
        d>8
    )
        return false;


    if(climb<500)
        return false;


    if(
        memory.wasNearRunwayGround
        &&
        Date.now()-
        memory.lastNearRunwayGround
        <
        120000
    )
        return true;


    const recentGround=
        memory.samples
        .slice(-12)
        .some(
            s=>
            s.ground
            &&
            Date.now()-s.time<120000
        );


    if(recentGround)
        return true;


    return false;
}


/* =========================================================
   APPROACHING DISPLAY
========================================================= */

function displayArrivalCandidate(ac){

    if(onGround(ac))
        return null;


    const id=
        aircraftId(ac);


    if(!id)
        return null;


    const memory=
        getMemory(id);


    if(!memory.arrivalCandidate)
        return null;


    const nearest=
        nearestThreshold(ac);


    if(!nearest)
        return null;


    if(nearest.distance>3)
        return null;


    if(
        verticalRate(ac)>900
    )
        return null;


    return {
        ac,
        distance:
            nearest.distance
    };
}


/* =========================================================
   CLEANUP
========================================================= */

function cleanup(){

    const now=
        Date.now();


    for(
        const [id,expiry]
        of landedBlacklist
    ){

        if(now>=expiry)
            landedBlacklist.delete(id);
    }


    for(
        const [id,memory]
        of aircraftMemory
    ){

        if(
            memory.arrivalCandidate
            &&
            now-
            memory.arrivalLastSeen
            >
            8*60*1000
        ){

            memory.arrivalCandidate=false;
        }


        if(
            now-memory.lastSeen
            >
            15*60*1000
        ){

            aircraftMemory.delete(id);
        }
    }
}


/* =========================================================
   MAIN
========================================================= */

async function update(){

    cleanup();


    try{

        const response=
            await fetch(
                API+
                "?t="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok)
            throw new Error(
                "HTTP "+
                response.status
            );


        const data=
            await response.json();


        const aircraft=
            (data.ac||[])

            .filter(
                ac =>
                Number.isFinite(
                    Number(ac.lat)
                )
                &&
                Number.isFinite(
                    Number(ac.lon)
                )
            )

            .filter(
                ac =>
                !unwantedAircraft(ac)
            );


        /*
           UPDATE MEMORY
        */

        for(const ac of aircraft){

            addSample(ac);

            updateArrivalCandidate(ac);
        }


        /*
           =====================================
           1 — TOUCHDOWN
           =====================================
        */

        const touchdown=
            detectTouchdown(
                aircraft
            );


        if(touchdown){

            const id=
                aircraftId(
                    touchdown
                );


            landedBlacklist.set(
                id,
                Date.now()+
                5*60*1000
            );


            const memory=
                getMemory(id);


            memory.arrivalCandidate=
                false;


            if(
                activeDeparture===id
            )
                activeDeparture=null;


            landedDisplay={
                ac:touchdown,
                until:
                    Date.now()+
                    12000
            };


            showState(
                touchdown,
                "LANDED"
            );


            return;
        }


        /*
           =====================================
           2 — TAKEOFF ROLL
           =====================================
        */

        let bestGroundDeparture=null;


        for(const ac of aircraft){

            if(
                !departureAcceleration(ac)
            )
                continue;


            const id=
                aircraftId(ac);


            const memory=
                getMemory(id);


            const latest=
                memory.samples[
                    memory.samples.length-1
                ];


            const score=
                latest.speed;


            if(
                !bestGroundDeparture
                ||
                score>
                bestGroundDeparture.score
            ){

                bestGroundDeparture={
                    ac,
                    id,
                    score
                };
            }
        }


        if(bestGroundDeparture){

            activeDeparture=
                bestGroundDeparture.id;


            showState(
                bestGroundDeparture.ac,
                "TAKE OFF"
            );


            return;
        }


        /*
           =====================================
           3 — ACTIVE DEPARTURE
           CUT OFF AT 3000 FT
           =====================================
        */

        if(activeDeparture){

            const ac=
                aircraft.find(
                    item =>
                    aircraftId(item)
                    ===
                    activeDeparture
                );


            if(ac){

                const alt=
                    altitude(ac);


                if(onGround(ac)){

                    showState(
                        ac,
                        "TAKE OFF"
                    );


                    return;
                }


                if(
                    alt!==null
                    &&
                    alt<2000
                ){

                    showState(
                        ac,
                        "TAKE OFF"
                    );


                    return;
                }


                if(
                    alt!==null
                    &&
                    alt>=2000
                ){

                    activeDeparture=null;
                }
            }


            else{

                const memory=
                    aircraftMemory.get(
                        activeDeparture
                    );


                if(
                    memory
                    &&
                    Date.now()-
                    memory.lastSeen
                    <
                    90000
                ){

                    return;
                }


                activeDeparture=null;
            }
        }


        /*
           =====================================
           4 — AIRBORNE DEPARTURE FALLBACK
           =====================================
        */

        let airborneDep=null;


        for(const ac of aircraft){

            if(
                !airborneDeparture(ac)
            )
                continue;


            const alt=
                altitude(ac);


            const score=
                (
                    verticalRate(ac)
                    *2
                )
                -
                (
                    alt||0
                );


            if(
                !airborneDep
                ||
                score>
                airborneDep.score
            ){

                airborneDep={
                    ac,
                    id:
                        aircraftId(ac),
                    score
                };
            }
        }


        if(airborneDep){

            activeDeparture=
                airborneDep.id;


            showState(
                airborneDep.ac,
                "TAKE OFF"
            );


            return;
        }


        /*
           =====================================
           5 — LANDED HOLD
           =====================================
        */

        if(landedDisplay){

            if(
                Date.now()<
                landedDisplay.until
            ){

                showState(
                    landedDisplay.ac,
                    "LANDED"
                );


                return;
            }


            landedDisplay=null;
        }


        /*
           =====================================
           6 — APPROACHING
           =====================================
        */

        const arrivals=[];


        for(const ac of aircraft){

            const candidate=
                displayArrivalCandidate(ac);


            if(candidate)
                arrivals.push(
                    candidate
                );
        }


        arrivals.sort(
            (a,b)=>
            a.distance-
            b.distance
        );


        if(arrivals.length){

            showState(
                arrivals[0].ac,
                "APPROACHING"
            );


            return;
        }


        /*
           NOTHING IMPORTANT
        */

        clearDisplay();

    }

    catch(error){

        console.error(error);

        clearDisplay();
    }
}


update();


setInterval(
    update,
    3000
);

</script>
