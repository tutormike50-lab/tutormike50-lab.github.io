<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:transparent;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

/* =====================================================
   MAIN BLUE BROADCAST RIBBON
===================================================== */

.ribbon{

    --accent:#67b7ff;
    --glow:rgba(50,155,255,.38);

    position:absolute;
    left:0;
    bottom:0;

    width:100%;
    height:130px;

    display:flex;
    align-items:stretch;

    overflow:hidden;

    color:white;

    box-sizing:border-box;

    border-radius:15px;

    background:
        linear-gradient(
            105deg,
            #003566 0%,
            #004d91 42%,
            #003b73 70%,
            #001d3b 100%
        );

    border:
        1px solid
        rgba(130,205,255,.65);

    box-shadow:
        0 0 22px rgba(0,120,255,.40),
        inset 0 1px 0 rgba(255,255,255,.22),
        inset 0 -12px 28px rgba(0,0,0,.20);
}


/* glossy top edge */

.ribbon:before{

    content:"";

    position:absolute;

    left:0;
    right:0;
    top:0;

    height:40%;

    background:
        linear-gradient(
            rgba(255,255,255,.08),
            transparent
        );

    pointer-events:none;
}


/* moving blue sheen */

.ribbon:after{

    content:"";

    position:absolute;

    top:-30px;
    left:-20%;

    width:15%;
    height:190px;

    transform:skewX(-25deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(120,205,255,.11),
            transparent
        );

    animation:sheen 7s linear infinite;

    pointer-events:none;
}


@keyframes sheen{

    from{
        left:-25%;
    }

    to{
        left:120%;
    }
}


/* =====================================================
   AIRPORT SECTION
===================================================== */

.airport{

    width:20%;

    padding:14px 20px 12px 24px;

    box-sizing:border-box;

    display:flex;
    flex-direction:column;
    justify-content:center;

    position:relative;

    z-index:2;
}


.airport:after{

    content:"";

    position:absolute;

    right:0;
    top:10%;

    width:1px;
    height:80%;

    background:
        linear-gradient(
            transparent,
            #73c8ff,
            transparent
        );

    box-shadow:
        0 0 12px #2ea6ff;
}


.live{

    width:max-content;

    display:flex;
    align-items:center;

    padding:3px 9px;

    margin-bottom:8px;

    border:1px solid #ff5252;

    border-radius:5px;

    color:#ff7070;

    font-size:13px;
    font-weight:bold;

    letter-spacing:1px;

    background:
        rgba(20,0,0,.25);
}


.live-dot{

    width:8px;
    height:8px;

    margin-right:7px;

    border-radius:50%;

    background:#ff3030;

    box-shadow:
        0 0 10px #ff3030;

    animation:livePulse 1.4s infinite;
}


@keyframes livePulse{

    50%{
        opacity:.3;
    }
}


.airport-name{

    font-size:23px;
    font-weight:900;

    letter-spacing:.5px;

    text-shadow:
        0 2px 5px rgba(0,0,0,.55);
}


.airport-code{

    margin-top:4px;

    font-size:16px;

    color:#91d5ff;

    letter-spacing:2px;
}


/* =====================================================
   AIRCRAFT INFORMATION
===================================================== */

.info{

    width:47%;

    padding:14px 24px 10px 30px;

    box-sizing:border-box;

    display:flex;
    flex-direction:column;
    justify-content:center;

    position:relative;

    z-index:2;
}


.airline{

    font-size:28px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    text-shadow:
        0 2px 8px rgba(0,0,0,.6);
}


.details{

    margin-top:6px;

    font-size:17px;

    color:
        rgba(225,242,255,.88);

    letter-spacing:1px;
}


.status-line{

    display:flex;
    align-items:center;

    margin-top:9px;
}


.status-icon{

    width:36px;
    height:36px;

    margin-right:12px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        rgba(0,20,45,.35);

    border:
        1px solid
        var(--accent);

    box-shadow:
        0 0 12px
        var(--glow);
}


.status-icon svg{

    width:24px;
    height:24px;

    stroke:var(--accent);

    stroke-width:2.2;

    fill:none;

    stroke-linecap:round;
    stroke-linejoin:round;
}


.status{

    font-size:32px;
    font-weight:900;

    letter-spacing:1.4px;

    color:var(--accent);

    text-shadow:
        0 0 9px var(--glow);
}


/* =====================================================
   PRAGUE AIRPORT SCENE
===================================================== */

.scene{

    width:33%;

    position:relative;

    overflow:hidden;

    z-index:1;

    background:
        linear-gradient(
            180deg,
            rgba(0,23,49,.15),
            rgba(0,10,26,.55)
        );
}


/* separation line */

.scene:before{

    content:"";

    position:absolute;

    left:0;
    top:5%;

    width:1px;
    height:90%;

    background:
        linear-gradient(
            transparent,
            #54baff,
            transparent
        );

    box-shadow:
        0 0 14px #149dff;

    z-index:10;
}


/* distant glow */

.horizon-glow{

    position:absolute;

    left:0;
    right:0;
    bottom:28px;

    height:45px;

    background:
        radial-gradient(
            ellipse at center,
            rgba(52,168,255,.25),
            transparent 68%
        );
}


/* =====================================================
   PRG CONTROL TOWER
===================================================== */

.tower{

    position:absolute;

    right:19px;
    bottom:28px;

    width:54px;
    height:91px;

    opacity:.70;

    filter:
        drop-shadow(
            0 0 6px
            rgba(70,180,255,.4)
        );

    z-index:1;
}


/* tower shaft */

.tower-shaft{

    position:absolute;

    left:20px;
    bottom:0;

    width:17px;
    height:65px;

    background:
        linear-gradient(
            90deg,
            #071827,
            #173a53,
            #071827
        );

    clip-path:
        polygon(
            25% 0,
            75% 0,
            100% 100%,
            0 100%
        );
}


/* control room */

.tower-room{

    position:absolute;

    left:8px;
    top:14px;

    width:42px;
    height:17px;

    background:
        linear-gradient(
            180deg,
            #54a9d8,
            #0c263a
        );

    clip-path:
        polygon(
            10% 0,
            90% 0,
            100% 65%,
            86% 100%,
            14% 100%,
            0 65%
        );

    border-top:
        1px solid #8dd8ff;
}


/* tower roof */

.tower-roof{

    position:absolute;

    left:5px;
    top:9px;

    width:48px;
    height:6px;

    background:#07131e;

    clip-path:
        polygon(
            8% 100%,
            18% 0,
            82% 0,
            92% 100%
        );
}


/* antenna */

.tower-antenna{

    position:absolute;

    left:29px;
    top:0;

    width:2px;
    height:11px;

    background:#7bd0ff;

    box-shadow:
        0 0 5px #42b8ff;
}


.tower-antenna:before{

    content:"";

    position:absolute;

    left:-2px;
    top:-2px;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff4646;

    box-shadow:
        0 0 7px #ff3333;

    animation:
        beacon 1.8s infinite;
}


@keyframes beacon{

    0%,45%,100%{
        opacity:.15;
    }

    50%,60%{
        opacity:1;
    }
}


/* small terminal silhouette */

.terminal{

    position:absolute;

    right:62px;
    bottom:28px;

    width:120px;
    height:18px;

    background:
        #081a29;

    opacity:.65;

    clip-path:
        polygon(
            0 45%,
            18% 45%,
            20% 15%,
            31% 15%,
            34% 45%,
            52% 45%,
            55% 25%,
            67% 25%,
            70% 45%,
            100% 45%,
            100% 100%,
            0 100%
        );
}


/* =====================================================
   RUNWAY
===================================================== */

.runway{

    position:absolute;

    left:4%;
    right:4%;

    bottom:-3px;

    height:34px;

    background:
        linear-gradient(
            180deg,
            #303b44,
            #080d12
        );

    clip-path:
        polygon(
            15% 0,
            84% 0,
            100% 100%,
            0 100%
        );

    z-index:3;
}


.centre-line{

    position:absolute;

    left:50%;
    bottom:0;

    width:3px;
    height:31px;

    background:
        repeating-linear-gradient(
            to bottom,
            white 0,
            white 5px,
            transparent 5px,
            transparent 11px
        );

    opacity:.85;
}


/* runway lights */

.light{

    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#a8dcff;

    box-shadow:
        0 0 7px #53b9ff;

    z-index:5;

    animation:
        runwayPulse
        1.8s
        infinite alternate;
}


.l1{left:10%;bottom:5px}
.l2{left:20%;bottom:8px}
.l3{left:31%;bottom:11px}
.l4{left:43%;bottom:14px}
.l5{left:56%;bottom:14px}
.l6{left:68%;bottom:11px}
.l7{left:79%;bottom:8px}
.l8{left:89%;bottom:5px}


@keyframes runwayPulse{

    from{
        opacity:.5;
    }

    to{
        opacity:1;
    }
}


/* =====================================================
   CORRECT SIDE-VIEW AIRCRAFT
===================================================== */

.plane{

    position:absolute;

    left:32%;
    top:25px;

    width:150px;
    height:58px;

    z-index:7;

    transform-origin:
        55% 55%;
}


/*
   Nose points RIGHT.

   This is deliberately a clean
   side profile instead of the previous
   top-view aircraft.
*/

.fuselage{

    position:absolute;

    left:12px;
    top:23px;

    width:116px;
    height:15px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #c8d5df
        );

    border-radius:
        70% 95% 80% 55%;

    box-shadow:
        0 4px 7px
        rgba(0,0,0,.35);
}


/* pointed nose */

.fuselage:after{

    content:"";

    position:absolute;

    right:-19px;
    top:2px;

    width:26px;
    height:12px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #c8d5df
        );

    clip-path:
        polygon(
            0 0,
            100% 47%,
            0 100%
        );
}


/* cockpit */

.cockpit{

    position:absolute;

    right:13px;
    top:26px;

    width:10px;
    height:4px;

    background:#163c5b;

    transform:
        skewX(28deg);

    z-index:3;
}


/* tail fin */

.tail{

    position:absolute;

    left:15px;
    top:7px;

    width:24px;
    height:25px;

    background:
        linear-gradient(
            135deg,
            #e7f2fa,
            #a8bdcc
        );

    clip-path:
        polygon(
            5% 100%,
            40% 5%,
            76% 4%,
            100% 100%
        );
}


/* wing */

.wing{

    position:absolute;

    left:59px;
    top:31px;

    width:54px;
    height:16px;

    background:#bacbd7;

    clip-path:
        polygon(
            0 0,
            100% 20%,
            47% 100%,
            30% 100%
        );
}


/* engine */

.engine{

    position:absolute;

    left:74px;
    top:39px;

    width:22px;
    height:9px;

    border-radius:
        50% 55% 55% 50%;

    background:
        linear-gradient(
            #849aaa,
            #455d6d
        );

    box-shadow:
        inset -3px 0 3px
        rgba(0,0,0,.4);
}


/* landing gear */

.gear-front,
.gear-back{

    position:absolute;

    width:2px;
    height:10px;

    background:#7e8d97;

    top:37px;
}


.gear-front{
    right:27px;
}


.gear-back{
    left:64px;
}


.gear-front:after,
.gear-back:after{

    content:"";

    position:absolute;

    left:-2px;
    bottom:-4px;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#080b0d;
}


/* =====================================================
   APPROACHING
===================================================== */

.ribbon.approaching{

    --accent:#79c8ff;
    --glow:rgba(50,170,255,.50);
}


.ribbon.approaching
.plane{

    animation:
        approachingPlane
        3.5s ease-in-out
        infinite alternate;
}


@keyframes approachingPlane{

    from{

        left:24%;
        top:10px;

        transform:
            rotate(2deg)
            scale(.88);
    }

    to{

        left:38%;
        top:34px;

        transform:
            rotate(1deg)
            scale(1);
    }
}


/* =====================================================
   LANDED
===================================================== */

.ribbon.landed{

    --accent:#b5f54a;
    --glow:rgba(137,225,42,.45);
}


.ribbon.landed
.plane{

    left:34%;
    top:50px;

    transform:
        rotate(0deg)
        scale(1);
}


/* smoke */

.smoke{

    position:absolute;

    left:51%;
    bottom:17px;

    width:15px;
    height:10px;

    border-radius:50%;

    background:
        rgba(230,240,245,.55);

    filter:blur(3px);

    opacity:0;

    z-index:6;
}


.ribbon.landed
.smoke{

    animation:
        touchdownSmoke
        1.8s ease-out
        infinite;
}


@keyframes touchdownSmoke{

    0%{

        opacity:.55;

        transform:
            translate(0,0)
            scale(.6);
    }

    100%{

        opacity:0;

        transform:
            translate(
                -25px,
                -8px
            )
            scale(1.7);
    }
}


/* =====================================================
   TAKE OFF
===================================================== */

.ribbon.takeoff{

    --accent:#ffbd52;
    --glow:rgba(255,157,32,.48);
}


.ribbon.takeoff
.plane{

    animation:
        takeoffPlane
        3.2s ease-in-out
        infinite;
}


@keyframes takeoffPlane{

    0%{

        left:18%;
        top:51px;

        transform:
            rotate(0deg)
            scale(.9);
    }

    50%{

        left:40%;
        top:47px;

        transform:
            rotate(-2deg)
            scale(.98);
    }

    100%{

        left:57%;
        top:11px;

        transform:
            rotate(-10deg)
            scale(1.04);
    }
}


/* =====================================================
   IDLE
===================================================== */

.ribbon.idle
.info{

    opacity:.25;
}


.ribbon.idle
.plane{

    display:none;
}


.ribbon.idle
.status-icon{

    display:none;
}

</style>
</head>


<body>


<div
    id="ribbon"
    class="ribbon idle"
>

    <div class="airport">

        <div class="live">

            <span class="live-dot"></span>

            LIVE

        </div>

        <div class="airport-name">
            PRAGUE AIRPORT
        </div>

        <div class="airport-code">
            LKPR / PRG
        </div>

    </div>


    <div class="info">

        <div class="airline"></div>

        <div class="details"></div>

        <div class="status-line">

            <div class="status-icon">

                <svg viewBox="0 0 40 40">

                    <path
                        id="statusPath"
                        d="M5 30 L15 26 L21 15 L25 15 L24 25 L34 21 L37 23 L26 29 L22 35 L19 35 L20 30 L9 34 Z"
                    />

                </svg>

            </div>

            <div class="status"></div>

        </div>

    </div>


    <div class="scene">

        <div class="horizon-glow"></div>


        <div class="terminal"></div>


        <div class="tower">

            <div class="tower-antenna"></div>

            <div class="tower-roof"></div>

            <div class="tower-room"></div>

            <div class="tower-shaft"></div>

        </div>


        <div class="runway">

            <div class="centre-line"></div>

        </div>


        <div class="light l1"></div>
        <div class="light l2"></div>
        <div class="light l3"></div>
        <div class="light l4"></div>
        <div class="light l5"></div>
        <div class="light l6"></div>
        <div class="light l7"></div>
        <div class="light l8"></div>


        <div class="plane">

            <div class="tail"></div>

            <div class="fuselage"></div>

            <div class="cockpit"></div>

            <div class="wing"></div>

            <div class="engine"></div>

            <div class="gear-front"></div>

            <div class="gear-back"></div>

        </div>


        <div class="smoke"></div>

    </div>

</div>


<script>


/* =====================================================
   LIVE API
===================================================== */

const API =
"https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft";


/* =====================================================
   AIRLINES
===================================================== */

const airlines={

 TVS:"SMARTWINGS",
 RYR:"RYANAIR",
 UAE:"EMIRATES",
 PGT:"PEGASUS AIRLINES",
 AUA:"AUSTRIAN AIRLINES",
 DLH:"LUFTHANSA",
 KLM:"KLM",
 BAW:"BRITISH AIRWAYS",
 EZY:"EASYJET",
 WZZ:"WIZZ AIR",
 QTR:"QATAR AIRWAYS",
 THY:"TURKISH AIRLINES",
 AFR:"AIR FRANCE",
 SWR:"SWISS",
 LOT:"LOT POLISH AIRLINES",
 SAS:"SAS",
 FIN:"FINNAIR",
 IBE:"IBERIA",
 TAP:"TAP AIR PORTUGAL",
 ITY:"ITA AIRWAYS",
 EIN:"AER LINGUS",
 VLG:"VUELING",
 EWG:"EUROWINGS",
 AEE:"AEGEAN AIRLINES",
 BTI:"AIRBALTIC",
 BEL:"BRUSSELS AIRLINES",
 TRA:"TRANSAVIA",
 EXS:"JET2",
 TUI:"TUI",
 ETD:"ETIHAD AIRWAYS",
 ELY:"EL AL",
 MSR:"EGYPTAIR"

};


/* =====================================================
   RUNWAYS
===================================================== */

const runways=[

 {
  name:"06",
  heading:60,
  threshold:{lat:50.1018361,lon:14.2263000},
  farEnd:{lat:50.1159500,lon:14.2733667}
 },

 {
  name:"24",
  heading:240,
  threshold:{lat:50.1159500,lon:14.2733667},
  farEnd:{lat:50.1018361,lon:14.2263000}
 },

 {
  name:"12",
  heading:122,
  threshold:{lat:50.1080111,lon:14.2453667},
  farEnd:{lat:50.0904667,lon:14.2816722}
 },

 {
  name:"30",
  heading:302,
  threshold:{lat:50.0904667,lon:14.2816722},
  farEnd:{lat:50.1080111,lon:14.2453667}
 }

];


const physicalRunways=[

 {
  name:"06/24",
  a:runways[0].threshold,
  b:runways[0].farEnd
 },

 {
  name:"12/30",
  a:runways[2].threshold,
  b:runways[2].farEnd
 }

];


/* =====================================================
   FILTER
===================================================== */

const helicopterTypes=new Set([

 "A109","A119","A139","A149","A169","A189",
 "AS32","AS50","AS55","AS65",
 "B06","B105","B212","B222","B412","B429",
 "EC20","EC25","EC30","EC35","EC45","EC55",
 "H125","H130","H135","H145","H155","H160",
 "R22","R44","R66",
 "S55","S58","S61","S64","S76","S92"

]);


const smallAircraftPrefixes=[

 "C15","C17","C18","C19","C20","C21",
 "C22","C23","C24","C25",

 "PA18","PA20","PA22","PA24","PA28","PA32",
 "PA34","PA38","PA44",

 "DA20","DA40","DA42",

 "SR20","SR22",

 "DR40","P28","M20",

 "BE23","BE24","BE33","BE35","BE36",

 "DV20"

];


function unwantedAircraft(ac){

 const type=
 (ac.t||"")
 .trim()
 .toUpperCase();


 const category=
 (ac.category||"")
 .trim()
 .toUpperCase();


 if(category==="A7")
 return true;


 if(helicopterTypes.has(type))
 return true;


 for(const prefix of smallAircraftPrefixes){

  if(type.startsWith(prefix))
  return true;
 }


 return false;
}


/* =====================================================
   MEMORY
===================================================== */

const history=new Map();

const arrivalMemory=new Map();

const landedBlacklist=new Map();

let departureLock=null;

let landedDisplay=null;


/* =====================================================
   HELPERS
===================================================== */

function aircraftId(ac){

 return (
  ac.hex ||
  ac.r ||
  (ac.flight||"").trim() ||
  null
 );
}


function onGround(ac){

 return (
  ac.alt_baro==="ground" ||
  ac.alt_geom==="ground"
 );
}


function altitude(ac){

 if(onGround(ac))
 return 0;


 let value=
 Number(ac.alt_baro);


 if(!Number.isFinite(value))
 value=
 Number(ac.alt_geom);


 return Number.isFinite(value)
 ? value
 : null;
}


function groundSpeed(ac){

 const value=
 Number(ac.gs);

 return Number.isFinite(value)
 ? value
 : 0;
}


function verticalRate(ac){

 let value=
 Number(ac.baro_rate);


 if(!Number.isFinite(value))
 value=
 Number(ac.geom_rate);


 return Number.isFinite(value)
 ? value
 : 0;
}


function headingDifference(a,b){

 let d=
 Math.abs(a-b);


 if(d>180)
 d=360-d;


 return d;
}


function distanceKm(lat1,lon1,lat2,lon2){

 const R=6371;

 const dLat=
 (lat2-lat1)*Math.PI/180;

 const dLon=
 (lon2-lon1)*Math.PI/180;


 const a=

 Math.sin(dLat/2)**2+

 Math.cos(lat1*Math.PI/180)*

 Math.cos(lat2*Math.PI/180)*

 Math.sin(dLon/2)**2;


 return R*2*
 Math.atan2(
  Math.sqrt(a),
  Math.sqrt(1-a)
 );
}


/* =====================================================
   DISPLAY DATA
===================================================== */

function airlineName(callsign){

 if(!callsign)
 return "";


 return airlines[
  callsign

/* =====================================================
   DISTANCE TO RUNWAY
===================================================== */

function distanceToRunway(lat,lon,runway){

 const ref=
 (lat+runway.a.lat+runway.b.lat)/3;


 const ky=111.32;


 const kx=
 111.32*
 Math.cos(ref*Math.PI/180);


 const px=lon*kx;
 const py=lat*ky;


 const ax=runway.a.lon*kx;
 const ay=runway.a.lat*ky;


 const bx=runway.b.lon*kx;
 const by=runway.b.lat*ky;


 const vx=bx-ax;
 const vy=by-ay;


 const wx=px-ax;
 const wy=py-ay;


 const lengthSquared=
 vx*vx+vy*vy;


 let t=
 (wx*vx+wy*vy)/
 lengthSquared;


 t=
 Math.max(
 0,
 Math.min(1,t)
 );


 const cx=
 ax+t*vx;


 const cy=
 ay+t*vy;


 const dx=
 px-cx;


 const dy=
 py-cy;


 return Math.sqrt(
 dx*dx+dy*dy
 );
}

  const d=
  distanceToRunway(
   lat,

  if(d>0.18)
  continue;


  const score=
  10000-
  d*10000+
  Math.min(
   groundSpeed(ac)*5,
   800
  );


  if(
  !best ||
  score>best.score

    ac,
    physicalRunway:runway.name,
    score

  }

}


/* =====================================================

===================================================== */

function bestRunway(track){

   runway.heading

  if(d<difference){

   difference=d;
   best=runway;
  }
 }


 return {
  runway:best,
  difference
 };
}
