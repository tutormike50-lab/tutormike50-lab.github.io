<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PRG Aircraft Photo Test</title>

<style>
body{
    margin:0;
    padding:25px;
    background:#07111f;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

h1{
    margin-bottom:5px;
}

.subtitle{
    color:#9bc7e8;
    margin-bottom:25px;
}

.panel{
    background:#0d1c2d;
    border:1px solid #28506f;
    border-radius:10px;
    padding:18px;
    margin-bottom:20px;
}

.aircraft{
    padding:12px;
    margin:6px 0;
    background:#142b42;
    border-radius:7px;
    cursor:pointer;
}

.aircraft:hover{
    background:#1d4263;
}

#photo{
    max-width:420px;
    max-height:260px;
    border-radius:8px;
    display:none;
    margin-top:15px;
}

#photoStatus{
    margin-top:12px;
    color:#9bc7e8;
}

#credit{
    margin-top:8px;
    font-size:13px;
    color:#aaa;
}

#raw{
    white-space:pre-wrap;
    word-break:break-word;
    background:#03080d;
    color:#8dff9d;
    padding:15px;
    border-radius:7px;
    font-family:Consolas,monospace;
    font-size:13px;
    max-height:350px;
    overflow:auto;
}
</style>
</head>

<body>

<h1>PRG AIRCRAFT PHOTO TEST</h1>

<div class="subtitle">
Click an aircraft. We will try to find a photograph of that exact aircraft.
</div>


<div class="panel">

<h2>Aircraft near PRG</h2>

<div id="aircraftList">
Waiting for ADS-B...
</div>

</div>


<div class="panel">

<h2 id="selected">
No aircraft selected
</h2>

<div id="photoStatus">
Select an aircraft above.
</div>

<a id="photoLink"
   href="#"
   target="_blank"
   rel="noopener">

<img id="photo">

</a>

<div id="credit"></div>

</div>


<div class="panel">

<h2>Photo API response</h2>

<pre id="raw">
Nothing requested yet.
</pre>

</div>


<script>

const AIRCRAFT_API =
"https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft";

const PRG={
    lat:50.1008,
    lon:14.2600
};


function distanceKm(lat1,lon1,lat2,lon2){

    const R=6371;

    const dLat=
        (lat2-lat1)*Math.PI/180;

    const dLon=
        (lon2-lon1)*Math.PI/180;

    const a=
        Math.sin(dLat/2)**2
        +
        Math.cos(lat1*Math.PI/180)
        *
        Math.cos(lat2*Math.PI/180)
        *
        Math.sin(dLon/2)**2;

    return R*2*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}


async function getPhoto(ac){

    const status=
        document.getElementById("photoStatus");

    const photo=
        document.getElementById("photo");

    const credit=
        document.getElementById("credit");

    const raw=
        document.getElementById("raw");

    const link=
        document.getElementById("photoLink");


    photo.style.display="none";
    credit.textContent="";
    link.removeAttribute("href");


    const hex=
        (ac.hex||"")
        .trim()
        .toLowerCase();


    if(!hex){

        status.textContent=
            "This aircraft has no ICAO hex code.";

        return;
    }


    status.textContent=
        "Looking for photo of "+
        (ac.r||hex)+
        "...";


    /*
       Planespotters public photo lookup
       via the adsb.lol compatibility proxy.

       This avoids browser CORS problems
       while testing.
    */

    const url=
        "https://api.adsb.lol/v2/planespotters_net/hex/"
        +
        encodeURIComponent(hex);


    try{

        const response=
            await fetch(url);


        if(!response.ok)
            throw new Error(
                "HTTP "+response.status
            );


        const data=
            await response.json();


        raw.textContent=
            JSON.stringify(
                data,
                null,
                2
            );


        if(
            !data.photos ||
            !data.photos.length
        ){

            status.textContent=
                "No photo found for "+
                (ac.r||hex);

            return;
        }


        const result=
            data.photos[0];


        /*
           Different versions of the
           service may return slightly
           different thumbnail structures,
           so we check the common forms.
        */

        const imageUrl=

            result.thumbnail_large?.src

            ||

            result.thumbnail?.src

            ||

            result.thumbnail_large

            ||

            result.thumbnail

            ||

            null;


        if(!imageUrl){

            status.textContent=
                "Photo record found, but no thumbnail URL.";

            return;
        }


        photo.src=imageUrl;

        photo.style.display="block";


        status.textContent=
            "PHOTO FOUND — "+
            (ac.r||hex);


        const photographer=

            result.photographer

            ||

            result.photographer_name

            ||

            "";


        credit.textContent=

            photographer

            ?

            "Photo: "+
            photographer+
            " / Planespotters.net"

            :

            "Photo: Planespotters.net";


        const original=

            result.link

            ||

            result.url

            ||

            result.photo_url

            ||

            null;


        if(original)
            link.href=original;

    }

    catch(error){

        console.error(error);


        status.textContent=
            "Photo lookup failed: "+
            error.message;


        raw.textContent=
            String(error);
    }
}


async function updateAircraft(){

    try{

        const response=
            await fetch(
                AIRCRAFT_API+
                "?t="+
                Date.now(),
                {cache:"no-store"}
            );


        const data=
            await response.json();


        const aircraft=
            (data.ac||[])

            .filter(ac=>

                Number.isFinite(
                    Number(ac.lat)
                )

                &&

                Number.isFinite(
                    Number(ac.lon)
                )

            );


        aircraft.sort((a,b)=>{

            const da=
                distanceKm(
                    Number(a.lat),
                    Number(a.lon),
                    PRG.lat,
                    PRG.lon
                );

            const db=
                distanceKm(
                    Number(b.lat),
                    Number(b.lon),
                    PRG.lat,
                    PRG.lon
                );

            return da-db;
        });


        const list=
            document.getElementById(
                "aircraftList"
            );


        list.innerHTML="";


        aircraft.forEach(ac=>{

            const d=
                distanceKm(
                    Number(ac.lat),
                    Number(ac.lon),
                    PRG.lat,
                    PRG.lon
                );


            if(d>25)
                return;


            const row=
                document.createElement("div");


            row.className="aircraft";


            const callsign=
                (ac.flight||"")
                .trim()
                ||
                "NO CALLSIGN";


            row.textContent=

                callsign+
                "  |  "+
                (ac.r||"NO REG")+
                "  |  "+
                (ac.desc||ac.t||"")+
                "  |  "+
                d.toFixed(1)+
                " km";


            row.onclick=()=>{

                document
                .getElementById("selected")
                .textContent=

                    callsign+
                    " — "+
                    (ac.r||"")+
                    " — "+
                    (ac.desc||ac.t||"");


                getPhoto(ac);
            };


            list.appendChild(row);

        });

    }

    catch(error){

        document
        .getElementById("aircraftList")
        .textContent=
            "ADS-B error: "+
            error.message;
    }
}


updateAircraft();

setInterval(
    updateAircraft,
    10000
);

</script>

</body>
</html>
