<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PRG ADS-B Test</title>

<style>

body{
    margin:0;
    padding:24px;
    background:#07111f;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

h1{
    margin:0 0 6px;
}

.subtitle{
    color:#9bc7e8;
    margin-bottom:22px;
}

.panel{
    background:#0d1c2d;
    border:1px solid #28506f;
    border-radius:10px;
    padding:18px;
    margin-bottom:18px;
}

button{
    background:#1479c9;
    color:white;
    border:0;
    border-radius:6px;
    padding:10px 16px;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    background:#1995ef;
}

.aircraft-row{
    padding:11px;
    margin:6px 0;
    background:#142b42;
    border-radius:7px;
    cursor:pointer;
}

.aircraft-row:hover{
    background:#1d4263;
}

#photo{
    display:none;
    max-width:430px;
    max-height:280px;
    margin-top:15px;
    border-radius:9px;
}

#photoStatus{
    margin-top:12px;
    color:#9bc7e8;
    font-weight:bold;
}

#credit{
    margin-top:8px;
    color:#c3ccd4;
    font-size:13px;
}

#raw{
    white-space:pre-wrap;
    word-break:break-word;
    background:#03080d;
    color:#8dff9d;
    padding:15px;
    border-radius:7px;
    font-family:Consolas,monospace;
    font-size:13px;
    line-height:1.5;
}

.good{
    color:#73e58e;
}

.bad{
    color:#ff7373;
}

</style>
</head>

<body>

<h1>PRG ADS-B TEST</h1>

<div class="subtitle">
Aircraft feed + exact aircraft photo test
</div>


<div class="panel">

<h2>1 — Connection test</h2>

<p>
This uses an aircraft photo we already know exists.
</p>

<button onclick="testKnownPhoto()">
TEST KNOWN PHOTO
</button>

<div id="testResult"></div>

</div>


<div class="panel">

<h2>2 — Aircraft near PRG</h2>

<div id="aircraftList">
Loading aircraft...
</div>

</div>


<div class="panel">

<h2 id="selected">
No aircraft selected
</h2>

<div id="photoStatus">
Click an aircraft above.
</div>

<a
    id="photoLink"
    target="_blank"
    rel="noopener"
>

<img id="photo">

</a>

<div id="credit"></div>

</div>


<div class="panel">

<h2>API response / error</h2>

<pre id="raw">
Nothing requested yet.
</pre>

</div>


<script>

/* ========================================
   PERMANENT VERCEL ADDRESS
======================================== */

const BASE_API =
"https://mikeaircraft-9hkn.vercel.app";

const AIRCRAFT_API =
BASE_API + "/api/aircraft";

const PHOTO_API =
BASE_API + "/api/photo";


const PRG={
    lat:50.1008,
    lon:14.2600
};


/* ========================================
   DISTANCE
======================================== */

function distanceKm(lat1,lon1,lat2,lon2){

    const R=6371;

    const dLat=
        (lat2-lat1)*
        Math.PI/180;

    const dLon=
        (lon2-lon1)*
        Math.PI/180;

    const a=
        Math.sin(dLat/2)**2
        +
        Math.cos(lat1*Math.PI/180)
        *
        Math.cos(lat2*Math.PI/180)
        *
        Math.sin(dLon/2)**2;

    return R*2*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}


/* ========================================
   KNOWN-GOOD PHOTO TEST
======================================== */

async function testKnownPhoto(){

    const result=
        document.getElementById(
            "testResult"
        );

    const raw=
        document.getElementById(
            "raw"
        );

    result.innerHTML=
        "<p>Testing...</p>";


    try{

        const url=
            PHOTO_API+
            "?hex=400A0B";


        const response=
            await fetch(
                url,
                {
                    cache:"no-store"
                }
            );


        const text=
            await response.text();


        raw.textContent=
            "HTTP STATUS: "+
            response.status+
            "\n\n"+
            text;


        if(!response.ok){

            result.innerHTML=
                '<p class="bad">FAILED — HTTP '+
                response.status+
                '</p>';

            return;
        }


        const data=
            JSON.parse(text);


        if(
            data.status===200
            &&
            data.data
            &&
            data.data.length
        ){

            result.innerHTML=
                '<p class="good">SUCCESS — photo API is working.</p>';

            showPhotoResult(
                data,
                "KNOWN TEST AIRCRAFT"
            );
        }

        else{

            result.innerHTML=
                '<p class="bad">Connection worked, but photo data was not returned.</p>';
        }

    }

    catch(error){

        result.innerHTML=
            '<p class="bad">FAILED TO FETCH</p>';


        raw.textContent=

            "ERROR NAME: "+
            error.name+

            "\nERROR MESSAGE: "+
            error.message+

            "\nPHOTO API: "+
            PHOTO_API;
    }
}


/* ========================================
   SHOW PHOTO
======================================== */

function showPhotoResult(data,label){

    const photo=
        document.getElementById(
            "photo"
        );

    const status=
        document.getElementById(
            "photoStatus"
        );

    const credit=
        document.getElementById(
            "credit"
        );

    const link=
        document.getElementById(
            "photoLink"
        );


    photo.style.display="none";
    photo.removeAttribute("src");

    credit.textContent="";
    link.removeAttribute("href");


    if(
        !data
        ||
        data.status!==200
        ||
        !data.data
        ||
        !data.data.length
    ){

        status.textContent=
            "No photo available for "+
            label;

        return;
    }


    const item=
        data.data[0];


    if(!item.image){

        status.textContent=
            "Photo record exists but no image was returned.";

        return;
    }


    photo.src=
        item.image;

    photo.style.display=
        "block";


    status.textContent=
        "PHOTO FOUND — "+
        label;


    credit.textContent=

        item.photographer

        ?

        "Photo: "+
        item.photographer+
        " / Airport-Data.com"

        :

        "Photo: Airport-Data.com";


    if(item.link)
        link.href=
            item.link;
}


/* ========================================
   LOOK UP REAL AIRCRAFT PHOTO
======================================== */

async function lookupPhoto(ac){

    const raw=
        document.getElementById(
            "raw"
        );

    const status=
        document.getElementById(
            "photoStatus"
        );


    const hex=
        (ac.hex||"")
        .trim()
        .toUpperCase();


    const reg=
        (ac.r||hex);


    if(!hex){

        status.textContent=
            "No hex code available.";

        return;
    }


    status.textContent=
        "Looking for photo of "+
        reg+
        "...";


    try{

        const url=
            PHOTO_API+
            "?hex="+
            encodeURIComponent(hex);


        const response=
            await fetch(
                url,
                {
                    cache:"no-store"
                }
            );


        const text=
            await response.text();


        raw.textContent=

            "REQUEST:\n"+
            url+

            "\n\nHTTP STATUS: "+
            response.status+

            "\n\nRESPONSE:\n"+
            text;


        if(!response.ok){

            status.textContent=
                "No photo available for "+
                reg;

            return;
        }


        const data=
            JSON.parse(text);


        showPhotoResult(
            data,
            reg
        );

    }

    catch(error){

        status.textContent=
            "FAILED TO FETCH";


        raw.textContent=

            "ERROR NAME: "+
            error.name+

            "\nERROR MESSAGE: "+
            error.message+

            "\nPHOTO API: "+
            PHOTO_API+

            "\nAIRCRAFT HEX: "+
            hex;
    }
}


/* ========================================
   LOAD AIRCRAFT
======================================== */

async function loadAircraft(){

    const list=
        document.getElementById(
            "aircraftList"
        );


    try{

        const response=
            await fetch(
                AIRCRAFT_API+
                "?t="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Aircraft API HTTP "+
                response.status
            );
        }


        const data=
            await response.json();


        const aircraft=
            (data.ac||[])
            .filter(ac=>

                Number.isFinite(
                    Number(ac.lat)
                )

                &&

                Number.isFinite(
                    Number(ac.lon)
                )

            );


        aircraft.sort((a,b)=>{

            const da=
                distanceKm(
                    Number(a.lat),
                    Number(a.lon),
                    PRG.lat,
                    PRG.lon
                );


            const db=
                distanceKm(
                    Number(b.lat),
                    Number(b.lon),
                    PRG.lat,
                    PRG.lon
                );


            return da-db;
        });


        list.innerHTML="";


        let count=0;


        for(const ac of aircraft){

            const d=
                distanceKm(
                    Number(ac.lat),
                    Number(ac.lon),
                    PRG.lat,
                    PRG.lon
                );


            if(d>25)
                continue;


            const type=
                (ac.t||"")
                .trim()
                .toUpperCase();


            const reg=
                (ac.r||"")
                .trim()
                .toUpperCase();


            /*
               Remove obvious airport
               towers / vehicles.
            */

            if(
                type==="TWR"
                ||
                type==="GND"
                ||
                type==="EMER"
                ||
                reg==="TWR"
                ||
                reg==="GND"
                ||
                reg==="EMER"
            )
                continue;


            const callsign=
                (ac.flight||"")
                .trim()
                ||
                "NO CALLSIGN";


            const row=
                document.createElement(
                    "div"
                );


            row.className=
                "aircraft-row";


            row.textContent=

                callsign+
                "  |  "+
                (ac.r||"NO REG")+
                "  |  "+
                (ac.desc||ac.t||"UNKNOWN TYPE")+
                "  |  "+
                d.toFixed(1)+
                " km";


            row.onclick=()=>{

                document
                .getElementById(
                    "selected"
                )
                .textContent=

                    callsign+
                    " — "+
                    (ac.r||"")+
                    " — "+
                    (ac.desc||ac.t||"");


                lookupPhoto(ac);
            };


            list.appendChild(
                row
            );


            count++;
        }


        if(count===0){

            list.textContent=
                "No commercial aircraft currently nearby.";
        }

    }

    catch(error){

        list.innerHTML=
            '<span class="bad">'+
            "AIRCRAFT FEED ERROR: "+
            error.message+
            "</span>";
    }
}


/* ========================================
   START
======================================== */

loadAircraft();

setInterval(
    loadAircraft,
    10000
);

</script>

</body>
</html>
