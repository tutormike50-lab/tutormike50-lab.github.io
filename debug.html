<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PRG ADS-B Monitor</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#07111f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

h1{
    margin:0 0 6px;
    font-size:26px;
}

.subtitle{
    color:#8fb8d8;
    margin-bottom:20px;
}

.panel{
    background:#0d1c2d;
    border:1px solid #244866;
    border-radius:10px;
    padding:15px;
    margin-bottom:18px;
}

.aircraft-row{
    padding:10px;
    margin:5px 0;
    background:#13283e;
    border-radius:6px;
    cursor:pointer;
}

.aircraft-row:hover{
    background:#1c3b59;
}

.selected{
    border:2px solid #4db8ff;
}

.title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

#raw{
    background:#03080d;
    color:#8dff9d;
    padding:15px;
    border-radius:7px;
    overflow:auto;
    white-space:pre-wrap;
    word-break:break-word;
    font-family:Consolas,monospace;
    font-size:14px;
    line-height:1.45;
    max-height:550px;
}

#history{
    font-family:Consolas,monospace;
    font-size:13px;
    line-height:1.6;
    max-height:450px;
    overflow:auto;
}

.small{
    color:#8fb8d8;
    font-size:13px;
}
</style>
</head>

<body>

<h1>PRG ADS-B MONITOR</h1>

<div class="subtitle">
Click an aircraft to inspect everything the feed knows about it.
</div>

<div class="panel">

    <div class="title">
        AIRCRAFT NEAR PRG
    </div>

    <div id="aircraft">
        Waiting for ADS-B...
    </div>

</div>


<div class="panel">

    <div class="title">
        SELECTED AIRCRAFT
    </div>

    <div id="selected">
        None
    </div>

</div>


<div class="panel">

    <div class="title">
        RAW ADS-B RECORD
    </div>

    <div class="small">
        This is the complete aircraft object returned by our API.
    </div>

    <br>

    <pre id="raw">Click an aircraft above.</pre>

</div>


<div class="panel">

    <div class="title">
        MOVEMENT HISTORY
    </div>

    <div id="history">
        No aircraft selected.
    </div>

</div>


<script>

const API =
"https://mikeaircraft-9hkn-186rknjwy-mikeplanes.vercel.app/api/aircraft";

const PRG = {
    lat:50.1008,
    lon:14.2600
};

let selectedId=null;
let history=[];


/* =========================
   DISTANCE
========================= */

function distanceKm(lat1,lon1,lat2,lon2){

    const R=6371;

    const dLat=
        (lat2-lat1)*Math.PI/180;

    const dLon=
        (lon2-lon1)*Math.PI/180;

    const a=
        Math.sin(dLat/2)**2
        +
        Math.cos(lat1*Math.PI/180)
        *
        Math.cos(lat2*Math.PI/180)
        *
        Math.sin(dLon/2)**2;

    return R*2*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}


/* =========================
   HELPERS
========================= */

function aircraftId(ac){

    return (
        ac.hex ||
        ac.r ||
        (ac.flight||"").trim()
    );
}


function isGround(ac){

    return (
        ac.alt_baro==="ground" ||
        ac.alt_geom==="ground"
    );
}


function altitude(ac){

    if(isGround(ac))
        return "GROUND";

    if(ac.alt_baro!==undefined)
        return ac.alt_baro;

    if(ac.alt_geom!==undefined)
        return ac.alt_geom;

    return "—";
}


function verticalRate(ac){

    if(ac.baro_rate!==undefined)
        return ac.baro_rate;

    if(ac.geom_rate!==undefined)
        return ac.geom_rate;

    return "—";
}


/* =========================
   SELECT AIRCRAFT
========================= */

function selectAircraft(id){

    selectedId=id;

    history=[];

    document.getElementById(
        "history"
    ).innerHTML=
        "Recording...";

}


/* =========================
   RAW RECORD
========================= */

function showRaw(ac){

    /*
       Sort the field names so it's
       easier for us to inspect.
    */

    const sorted={};

    Object.keys(ac)
        .sort()
        .forEach(key=>{

            sorted[key]=ac[key];

        });


    document.getElementById(
        "raw"
    ).textContent=
        JSON.stringify(
            sorted,
            null,
            2
        );
}


/* =========================
   HISTORY
========================= */

function addHistory(ac){

    const lat=Number(ac.lat);
    const lon=Number(ac.lon);

    let distance="—";

    if(
        Number.isFinite(lat) &&
        Number.isFinite(lon)
    ){

        distance=
            distanceKm(
                lat,
                lon,
                PRG.lat,
                PRG.lon
            ).toFixed(2);
    }


    const time=
        new Date()
        .toLocaleTimeString();


    const state=
        isGround(ac)
        ? "GROUND"
        : "AIR";


    const alt=
        altitude(ac);


    const speed=
        ac.gs!==undefined
        ? ac.gs
        : "—";


    const vr=
        verticalRate(ac);


    const track=
        ac.track!==undefined
        ? ac.track
        : "—";


    const pos=
        ac.seen_pos!==undefined
        ? ac.seen_pos
        : "—";


    const line=
        time+
        " | "+
        state+
        " | ALT "+
        alt+
        (
            alt==="GROUND"
            ? ""
            : " ft"
        )+
        " | SPD "+
        speed+
        "kt"+
        " | V/S "+
        (
            typeof vr==="number" &&
            vr>0
            ? "+"
            : ""
        )+
        vr+
        (
            vr==="—"
            ? ""
            : " ft/min"
        )+
        " | TRK "+
        track+
        "°"+
        " | PRG "+
        distance+
        "km"+
        " | POS "+
        pos+
        "s";


    history.unshift(line);


    /*
       Keep 150 entries.
    */

    if(history.length>150)
        history.length=150;


    document.getElementById(
        "history"
    ).innerHTML=
        history.join("<br><br>");
}


/* =========================
   MAIN UPDATE
========================= */

async function update(){

    try{

        const response=
            await fetch(
                API+
                "?t="+
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        const data=
            await response.json();


        const aircraft=
            (data.ac||[])
            .filter(ac=>

                Number.isFinite(
                    Number(ac.lat)
                )

                &&

                Number.isFinite(
                    Number(ac.lon)
                )

            );


        /*
           Sort nearest PRG first.
        */

        aircraft.sort((a,b)=>{

            const da=
                distanceKm(
                    Number(a.lat),
                    Number(a.lon),
                    PRG.lat,
                    PRG.lon
                );

            const db=
                distanceKm(
                    Number(b.lat),
                    Number(b.lon),
                    PRG.lat,
                    PRG.lon
                );

            return da-db;

        });


        const container=
            document.getElementById(
                "aircraft"
            );


        container.innerHTML="";


        aircraft.forEach(ac=>{

            const id=
                aircraftId(ac);


            if(!id)
                return;


            const d=
                distanceKm(
                    Number(ac.lat),
                    Number(ac.lon),
                    PRG.lat,
                    PRG.lon
                );


            /*
               Keep the debug list
               reasonably local.
            */

            if(d>25)
                return;


            const row=
                document.createElement(
                    "div"
                );


            row.className=
                "aircraft-row";


            if(id===selectedId)
                row.classList.add(
                    "selected"
                );


            const callsign=
                (ac.flight||"")
                .trim()
                ||
                "NO CALLSIGN";


            const registration=
                ac.r||"";


            const type=
                ac.t||"";


            row.textContent=

                callsign+
                "   |   "+
                registration+
                "   |   "+
                type+
                "   |   "+
                d.toFixed(2)+
                " km";


            row.onclick=()=>{

                selectAircraft(id);

                showRaw(ac);

                document
                .getElementById(
                    "selected"
                )
                .textContent=

                    callsign+
                    "  •  "+
                    registration+
                    "  •  "+
                    type;

            };


            container.appendChild(row);

        });


        /*
           Update selected aircraft.
        */

        if(selectedId){

            const selected=
                aircraft.find(
                    ac=>
                    aircraftId(ac)
                    ===
                    selectedId
                );


            if(selected){

                showRaw(selected);

                addHistory(selected);
            }
        }

    }

    catch(error){

        console.error(error);

    }

}


update();

setInterval(
    update,
    3000
);

</script>

</body>
</html>
